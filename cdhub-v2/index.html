<style>
/* The Board: one phone-width column, cards stacked, floating pill at the bottom. */
:root{
  --bg:#e9ece6; --phone:#f6f7f3; --card:#ffffff; --ink:#18201b; --mut:#5d6860; --line:#dde2da;
  --hero:#18201b; --hero-ink:#f6f7f3; --accent:#e39a2d; --accent-ink:#1d1406;
  --good:#2e7d4f; --warn:#b26a00; --bad:#c2402b; --chip:#eef1ea;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d110e; --phone:#141a16; --card:#1c241f; --ink:#e8ede6; --mut:#9aa69d; --line:#2a342d;
  --hero:#26332b; --hero-ink:#f3f6f1; --accent:#f0ad46; --accent-ink:#1d1406;
  --good:#5fc28a; --warn:#e7a43c; --bad:#ec7a63; --chip:#232c26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d110e; --phone:#141a16; --card:#1c241f; --ink:#e8ede6; --mut:#9aa69d; --line:#2a342d;
  --hero:#26332b; --hero-ink:#f3f6f1; --accent:#f0ad46; --accent-ink:#1d1406;
  --good:#5fc28a; --warn:#e7a43c; --bad:#ec7a63; --chip:#232c26; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;margin:0;padding-inline:16px;padding-block:20px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.draft{max-width:430px;margin:0 auto 12px;padding:8px 12px;border:1px dashed var(--accent);border-radius:14px;background:var(--card);color:var(--mut);font-size:12.5px;text-align:center;line-height:1.4}
.draft a{color:var(--ink);font-weight:700}
.top{max-width:430px;margin:0 auto 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.top b{font-family:var(--display);font-size:15px;margin-right:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--phone);border-color:var(--ink)}
.phone{max-width:430px;margin:0 auto;background:var(--phone);border-radius:34px;border:1px solid var(--line);position:relative;min-height:760px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.screen{padding:22px 16px 110px}
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hello h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;margin:0;text-wrap:balance}
.hello p{margin:4px 0 0;color:var(--mut);font-size:13px}
.edit{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.three button{border:0;border-radius:16px;padding:10px;text-align:left;background:var(--card)}
.three .n{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.three .l{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;margin-top:6px}
.ok .l{color:var(--good)} .att .l{color:var(--warn)} .over .l{color:var(--bad)}
.cards{display:grid;gap:10px}
.card{background:var(--card);border-radius:22px;padding:16px;border:1px solid var(--line);position:relative;text-align:left;width:100%}
.card.edit-pad{padding-top:52px}
.card.hero{background:var(--hero);color:var(--hero-ink);border-color:transparent}
.card .k{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:6px}
.card.hero .k{color:var(--accent)}
.card .t{font-family:var(--display);font-weight:700;font-size:19px;margin:6px 0 2px;line-height:1.2}
.card .s{font-size:13px;color:var(--mut)}
.card.hero .s{color:color-mix(in srgb,var(--hero-ink) 70%,transparent)}
.row{display:flex;align-items:center;gap:14px}
.big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.trend{font-size:12px;font-weight:600}
.trend.up{color:var(--good)} .trend.down{color:var(--bad)}
.act{margin-top:12px;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;background:var(--accent);color:var(--accent-ink)}
.card:not(.hero) .act{background:var(--chip);color:var(--ink)}
ul.mini{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
ul.mini li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
ul.mini li span:last-child{color:var(--bad);font-weight:600;white-space:nowrap;font-size:13px}
.ctl{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.ctl button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--phone);color:var(--ink);font-size:15px;line-height:1}
.ctl button:disabled{opacity:.35;cursor:default}
.pill{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;background:var(--ink);padding:6px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.pill button{border:0;background:transparent;color:var(--phone);border-radius:999px;height:44px;min-width:44px;padding:0 12px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.pill button[aria-current="page"]{background:var(--phone);color:var(--ink)}
.pill .plus{background:var(--accent);color:var(--accent-ink);font-size:22px;font-weight:700}
.pill svg{width:20px;height:20px}
h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.tl{display:grid;gap:0}
.tl .it{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.tl .what{font-weight:600}
.tl .where{color:var(--mut);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;margin-top:4px;background:var(--chip)}
.tag.bad{color:var(--bad)} .tag.warn{color:var(--warn)} .tag.good{color:var(--good)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;position:relative;min-height:96px}
.mod .nm{font-weight:700;margin-top:24px}
.mod .ds{font-size:12px;color:var(--mut)}
.star{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:0;background:transparent;font-size:20px;color:var(--mut)}
.star[aria-pressed="true"]{color:var(--accent)}
.mod .ic{font-family:var(--display);font-weight:800;font-size:13px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--chip);color:var(--ink)}
.sheet{position:fixed;z-index:15;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,calc(100% - 32px));background:var(--card);border-radius:26px 26px 0 0;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.sheet .grid button{border:1px solid var(--line);background:var(--phone);border-radius:16px;padding:14px;font-weight:700;text-align:left}
.back{border:0;background:transparent;font-weight:600;color:var(--mut);padding:0;margin-bottom:10px}
.prog{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
.item{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;text-align:left}
.item .bx{width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);flex:none;display:grid;place-items:center;font-weight:800;font-size:14px}
.item[aria-pressed="true"] .bx{background:var(--good);border-color:var(--good);color:#fff}
.item .ev{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap}
.sw{touch-action:pan-y;position:relative;transition:transform .18s}
.sw.dragging{transition:none}
.sw.yes{background:color-mix(in srgb,var(--good) 14%,var(--card))}
.sw.no{background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.yn{display:flex;gap:6px;margin-left:auto;flex:none}
.yn button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--phone);color:var(--ink);font-weight:800}
.yn button[aria-pressed="true"].y{background:var(--good);border-color:var(--good);color:#fff}
.yn button[aria-pressed="true"].n{background:var(--bad);border-color:var(--bad);color:#fff}
.hint{font-size:12px;color:var(--mut);margin:6px 0 0}
.tl .it{align-items:center;padding:10px 8px;border-radius:14px}
.favs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.fav{flex:none;width:72px;text-align:center;font-size:12px;font-weight:600}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 4px;font-family:var(--display);font-weight:800;font-size:18px;background:var(--hero);color:var(--hero-ink)}
.ct{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ct .av{width:42px;height:42px;font-size:14px;margin:0}
.ct .who{min-width:0;flex:1}.ct .who b{display:block}.ct .who span{font-size:12px;color:var(--mut)}
.ct a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--ink);text-decoration:none;font-size:16px;flex:none}
label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--mut)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font:inherit;color:var(--ink)}
.note{max-width:430px;margin:12px auto 0;color:var(--mut);font-size:12.5px;text-align:center}
.empty{padding:16px;border:1px dashed var(--line);border-radius:18px;color:var(--mut);font-size:13px;text-align:center}
.toast{max-width:430px;margin:10px auto 0;padding:8px 12px;border-radius:12px;background:var(--ink);color:var(--phone);font-size:13px;font-weight:600;text-align:center}
@media (prefers-reduced-motion:reduce){.sw,.card,.mod{transition:none}}
@media (prefers-reduced-motion:no-preference){.card,.mod{transition:transform .15s}.card:active{transform:scale(.99)}}
</style>
</head>
