<!DOCTYPE html>
<html lang="en-GB">
<head>

<meta name="build" content="ljr-money-v2-2026-10-28">

<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap">
<script src="../config.js"></script>

<script src="../auth.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="core.js"></script>
<link rel="stylesheet" href="../tokens.css">
<style>
  /* House look (LINKS-COMFORT-BRIEF v3, 28 Oct 2026; reference: Studio PR #104). Colours: ../tokens.css for the LJR7 spine;
     the page is "Warm clear" (default) or "Cool clear", each with a dark version, read from Studio's Look setting ('dash-look')
     but never written here. Lexend 400/600, nothing under 13px, line height 1.5, ONE radius 12px (only status dots are round),
     1px lines; hover = selected = the same 1px edge turns ink (outline, offset -1px), so nothing ever moves or resizes.
     No coloured words, no solid colour fills: colour lives in dots, thin bars, 1px rings and light tints. */
  :root { --radius: 12px;
    --paper: #EEE8DF; --card: #FFFEFB; --ink: #262624; --muted: #57504A; --line: #BFB4A3; --soft: #DED5C7; --ctl: #9C9080;
    --bg: var(--paper); --surface: var(--card); --sel-bd: var(--ink);
    --shadow: 0 1px 3px rgba(60,48,32,.12), 0 2px 10px rgba(60,48,32,.06);
    --frame: #3A3632; --frame-foot: #46413B; --frame-ink: #F6F1E8; --frame-line: #9C9285;
    /* Rings (1px, 3:1 or better on the card) and tints per meaning. Words stay ink. */
    --r-risk: #D93732; --t-risk: var(--ljr-2-tint); --r-warn: #9E5802; --t-warn: var(--ljr-3-tint);
    --r-ok: #217A2D; --t-ok: var(--ljr-5-tint); --r-ops: #766602; --t-ops: var(--ljr-4-tint);
    --c-fin: var(--ljr-3); --c-ok: var(--ljr-5); --c-ops: var(--ljr-4); --c-risk: var(--ljr-2); --c-ideas: var(--ljr-7); --c-sales: var(--ljr-6); --c-mute: var(--ljr-0); }
  :root.look-cool { --paper: #F2F4F6; --card: #FFFFFF; --ink: #2B3035; --muted: #5B646D; --line: #B9C3CC; --soft: #D9E0E6; --ctl: #8E9AA6;
    --frame: #33475B; --frame-foot: #405569; --frame-ink: #FFFFFF; --frame-line: #9FB0C0; --shadow: 0 1px 2px rgba(20,30,40,.12), 0 1px 8px rgba(20,30,40,.08); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #181613; --card: #27231E; --ink: #F3EEE5; --muted: #B3AA9D; --line: #4A4238; --soft: #3A332B; --ctl: #7D7366;
      --frame: #2A2622; --frame-foot: #34302B; --shadow: 0 1px 3px rgba(0,0,0,.4); color-scheme: dark;
      --r-risk: #F28B85; --r-warn: #F2A65A; --r-ok: #8BCF8F; --r-ops: #E9D46A; }
    :root.look-cool:not([data-theme="light"]) { --paper: #16191C; --card: #23282D; --ink: #EEF2F5; --muted: #A9B3BC; --line: #444D57; --soft: #343B42; --ctl: #6F7A85; --frame: #24323F; --frame-foot: #2D3D4C; }
  }
  /* Mode = Dark from Studio's Look menu: tokens.css only darkens with the device, so its dark spine is repeated here. */
  :root[data-theme="dark"] { --ljr-ink: #F3EEE5; --ljr-paper: #232019; --ljr-cream: #191714; --ljr-muted: #B4AB9E;
    --ljr-0: #8E877B; --ljr-0-text: #B4AB9E; --ljr-0-tint: #2F2B25;
    --ljr-2-tint: #3C251E; --ljr-3-tint: #3C2D18; --ljr-4-tint: #3E3820; --ljr-5-tint: #293221; --ljr-6-tint: #213134; --ljr-7-tint: #342A31;
    --paper: #181613; --card: #27231E; --ink: #F3EEE5; --muted: #B3AA9D; --line: #4A4238; --soft: #3A332B; --ctl: #7D7366;
    --frame: #2A2622; --frame-foot: #34302B; --shadow: 0 1px 3px rgba(0,0,0,.4); color-scheme: dark;
    --r-risk: #F28B85; --r-warn: #F2A65A; --r-ok: #8BCF8F; --r-ops: #E9D46A; }
  :root.look-cool[data-theme="dark"] { --paper: #16191C; --card: #23282D; --ink: #EEF2F5; --muted: #A9B3BC; --line: #444D57; --soft: #343B42; --ctl: #6F7A85; --frame: #24323F; --frame-foot: #2D3D4C; }

  * { box-sizing: border-box; }
  h1, h2, h3, h4, b, strong, th, summary { font-weight: 600; } /* two weights only: 400 and 600 */
  html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: 96px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Lexend', system-ui, sans-serif; font-size: 16px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .hidden { display: none !important; }
  .skip { position: absolute; left: -999px; top: 8px; z-index: 50; background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--ink); }
  .skip:focus { left: 8px; }
  .skip-label, .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .wrap { max-width: 1600px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
  @media (max-width: 600px) { .wrap { padding-left: 16px; padding-right: 16px; } }

  /* Frame: dark top bar (never black). */
  header { position: sticky; top: 0; z-index: 5; background: var(--frame); color: var(--frame-ink); }
  .top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding-top: 12px; padding-bottom: 12px; }
  .top h1 { font-size: 20px; margin: 0 auto 0 0; }
  .top h1 a { text-decoration: none; display: inline-flex; align-items: center; gap: 8px; color: var(--frame-ink); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--c-mute)); flex: none; display: inline-block; }
  .top h1 .dot { --c: var(--c-fin); }
  .readstamp { font-size: 13px; font-weight: 600; color: var(--frame-ink); border: 1px solid var(--frame-line); border-radius: var(--radius); height: 24px; padding: 0 8px; display: inline-flex; align-items: center; white-space: nowrap; }
  /* Design rule: every page except home has "Dashboard" at the top right of the header, always shown. */
  .back { order: 99; }

  /* Everything you press: the same clear line (--ctl), 1px, 12px corners, 36px desktop / 44px phone, 14px 600. Never starts out ink. */
  .btn, details > summary { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: var(--radius);
    border: 1px solid var(--ctl); background: var(--surface); color: var(--ink); cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; line-height: 1.2; }
  .btn:disabled { opacity: .6; cursor: default; }
  header .btn { background: transparent; color: var(--frame-ink); border-color: var(--frame-line); }
  @media (hover: hover) {
    .btn:hover, details > summary:hover, a.ent:hover, .subnav a:hover { outline: 1px solid var(--sel-bd); outline-offset: -1px; }
    header .btn:hover { outline-color: var(--frame-ink); }
  }
  details > summary { list-style: none; width: max-content; max-width: 100%; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: "\25BE"; font-size: 13px; color: var(--muted); }
  details[open] > summary::after { content: "\25B4"; }
  details[open] > summary { margin-bottom: 12px; }

  /* Frame: dark bottom tab bar, light tab buttons with no lines; hover/selected = the small colour bar above the label widens. */
  nav.main { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(6, minmax(0, 200px)); justify-content: center; gap: 8px;
    padding: 8px 24px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--frame-foot); max-width: none; margin: 0; }
  nav.main a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; padding: 4px 2px;
    border-radius: var(--radius); background: var(--card); color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 600; text-align: center; }
  nav.main a .bar { width: 18px; height: 4px; border-radius: 2px; background: var(--c); opacity: .6; transition: width .15s ease-out, opacity .15s ease-out; }
  nav.main a[aria-current="page"] .bar { width: 40px; opacity: 1; }
  @media (hover: hover) { nav.main a:hover .bar { width: 40px; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { nav.main a .bar { transition: none; } }
  nav.main a .icon { color: var(--muted); }
  /* Counts in the tab's top-right corner. */
  nav.main .n { position: absolute; top: 8px; right: 12px; }
  @media (max-width: 600px) {
    /* Phone: two rows of three, the count in flow next to the label so no word can run into it. */
    nav.main { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
    nav.main a { min-height: 44px; flex-direction: row; flex-wrap: wrap; align-content: center; gap: 2px 4px; font-size: 14px; }
    nav.main a .bar { flex: 0 0 auto; margin: 0 calc(50% - 9px); }
    nav.main a[aria-current="page"] .bar { width: 26px; margin: 0 calc(50% - 13px); }
    nav.main a .icon { display: none; }
    nav.main .n { position: static; }
    html { scroll-padding-bottom: 120px; }
  }
  @media (max-width: 600px) and (hover: hover) { nav.main a:hover .bar { width: 26px; margin: 0 calc(50% - 13px); } }

  /* Counts: a grey 1px ring pill; "needs you" = the same ring in rose with a light rose tint. Read-only: no hover. */
  /* ONE fixed size so 1 and 2 digits match: 30 x 22, radius 11px; only 3+ digits grow. */
  .cnt, nav.main .n:not(:empty) { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; height: 22px; min-width: 30px; padding: 0 6px; border: 1px solid var(--ctl);
    border-radius: 11px; font-size: 13px; font-weight: 600; line-height: 20px; color: var(--ink); background: transparent; white-space: nowrap; flex: none; }
  .cnt.need, nav.main .n.need:not(:empty) { border-color: var(--r-risk); background: var(--t-risk); }
  nav.main .n:empty { display: none; }

  main { padding-top: 16px; padding-bottom: 120px; }
  @media (max-width: 600px) { main { padding-bottom: 140px; } }
  .here { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
  .here span:empty { display: none; }
  .here h2 { margin: 0; font-size: 26px; line-height: 1.25; }
  #view { display: flex; flex-direction: column; gap: 12px; }

  /* Cards: one white panel, the softer 1px line, 12px padding; 16px under the header line before the first item. */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
  .card.pending { border-style: dashed; box-shadow: none; }
  /* Section colour: one small dot before the card title (dots may be solid; words stay ink). */
  .c-risk { --c: var(--c-risk); } .c-fin { --c: var(--c-fin); } .c-ops { --c: var(--c-ops); } .c-ok { --c: var(--c-ok); }
  .c-sales { --c: var(--c-sales); } .c-ideas { --c: var(--c-ideas); } .c-ink, .c-mute { --c: var(--c-mute); }
  .card h3:not(.sr)::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--c-mute)); flex: none; }
  .card.next { border-color: var(--ink); } /* the one thing to do now: definition from the ink edge only */
  .card h3 { margin: 0; font-size: 17px; line-height: 1.35; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .card h3 .dot { width: 8px; height: 8px; }
  .card h4 { margin: 4px 0 0; font-size: 15px; }
  .cardhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .cardhead .cnt, .cardhead .tag { margin-left: auto; }
  .note, .quiet { margin: 0; color: var(--muted); font-size: 14px; }
  .source { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 8px; }
  .source a { color: var(--muted); }
  .sec-h { margin: 4px 0 0; font-size: 15px; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .actions .note { margin-right: auto; }
  .go { display: flex; flex-wrap: wrap; gap: 8px; }

  /* Flags and small pills: 24px, 13px, a 1px ring that shows the meaning, light tint, ink words. Read-only: no hover. */
  .tag, .chip, .date { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: var(--radius); font-size: 13px; font-weight: 600; line-height: 1;
    color: var(--ink); background: transparent; border: 1px solid var(--ctl); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .chip, .date { font-weight: 400; color: var(--muted); }
  .tag.c-risk { border-color: var(--r-risk); background: var(--t-risk); }
  .tag.c-ops { border-color: var(--r-warn); background: var(--t-warn); }
  .tag.c-ok { border-color: var(--r-ok); background: var(--t-ok); }
  .tag.c-fin, .tag.c-mute, .tag.c-ink, .tag.c-ideas, .tag.c-sales { border-color: var(--ctl); background: transparent; }
  /* Every date wears a plain 1px ring; urgency only changes the ring (and a light tint). */
  .date.late { color: var(--ink); border-color: var(--r-risk); background: var(--t-risk); }
  .date.soon { color: var(--ink); border-color: var(--r-warn); background: var(--t-warn); }
  /* A negative amount: a minus sign and a rose ring marker, never red words. */
  .neg { display: inline-flex; align-items: center; border: 1px solid var(--r-risk); background: var(--t-risk); border-radius: var(--radius); padding: 0 6px; color: var(--ink); }
  /* Friendly empty state with a small green-ring check. */
  .empty { margin: 0; display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 15px; }
  .empty::before { content: "\2713"; flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--r-ok); background: var(--t-ok); color: var(--ink); font-size: 13px; }

  /* Calm rows: a small entity line, the title (2 lines, then …), then ONE flag, a date pill and plain details. */
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items > li { padding: 12px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  ul.items > li:first-child { border-top: none; padding-top: 0; }
  .bline { display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
  .bline .dot { width: 8px; height: 8px; }
  .itext { font-weight: 600; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .itext a { text-decoration: none; }
  .itext a:hover { text-decoration: underline; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--muted); font-size: 14px; min-width: 0; }
  .meta > span { overflow-wrap: anywhere; }
  .lbl { font-size: 14px; color: var(--muted); }

  /* Summary strip: On track / Needs you / Overdue, each a big ringed number. */
  .three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .sum { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 12px; min-width: 0; box-shadow: var(--shadow); }
  .sum .num { font-size: 26px; font-weight: 600; min-width: 48px; height: 48px; padding: 0 8px; display: inline-grid; place-items: center; border-radius: var(--radius); border: 1px solid var(--ctl); line-height: 1; flex: none; }
  .sum.need .num { border-color: var(--r-warn); background: var(--t-warn); }
  .sum.over .num { border-color: var(--r-risk); background: var(--t-risk); }
  .sum.ok .num { border-color: var(--r-ok); background: var(--t-ok); }
  .sum .t { display: flex; flex-direction: column; min-width: 0; font-weight: 600; }
  .sum .t small { font-size: 13px; font-weight: 400; color: var(--muted); }
  .next .ntitle { font-size: 20px; font-weight: 600; margin: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  @media (max-width: 600px) {
    .three { gap: 6px; } .sum { flex-direction: column; align-items: flex-start; gap: 6px; padding: 8px; }
    .sum .num { font-size: 20px; min-width: 36px; height: 36px; } .sum .t { font-size: 14px; }
    .here h2 { font-size: 22px; }
  }

  /* Entities */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  a.ent { text-decoration: none; gap: 6px; border-color: var(--ctl); }
  .ent .who { display: flex; flex-direction: column; gap: 2px; }
  .ent .code { font-size: 17px; font-weight: 600; }
  .big { font-size: 28px; font-weight: 600; line-height: 1.2; }
  .line { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; border-top: 1px solid var(--line); padding-top: 6px; }
  .line span:first-child { min-width: 0; }
  .line b { font-weight: 600; text-align: right; }

  /* Stats on an entity page */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .stat { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; background: transparent; }
  .stat.c-risk { border-color: var(--r-risk); background: var(--t-risk); }
  .stat.c-ok { border-color: var(--r-ok); background: var(--t-ok); }
  .stat .num { font-size: 24px; font-weight: 600; line-height: 1.25; }
  .stat .label { font-size: 14px; color: var(--ink); }
  .stat .sub { font-size: 13px; color: var(--muted); }

  /* Forecast chart: the line and a ringed marker; words stay ink or grey. */
  .chart svg { display: block; width: 100%; height: auto; max-height: 260px; }
  .chart .ln { fill: none; stroke: var(--c-fin); stroke-width: 2; }
  .chart .zero { stroke: var(--r-risk); stroke-width: 1; stroke-dasharray: 5 4; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart text { fill: var(--muted); font-size: 13px; font-family: inherit; }
  .chart text.dry { fill: var(--ink); font-weight: 600; }
  .chart circle.dry { fill: var(--t-risk); stroke: var(--r-risk); stroke-width: 1.5; }
  .chart circle.now { fill: var(--card); stroke: var(--ink); stroke-width: 1.5; }

  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; color: var(--muted); border-top: none; }
  td.r, th.r { text-align: right; white-space: nowrap; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* Month bars: thin, a light tint inside a 1px ring (never solid). */
  .bar.in, .bar.out { display: inline-block; height: 8px; border-radius: 4px; vertical-align: middle; }
  .bar.in { background: var(--t-ok); box-shadow: inset 0 0 0 1px var(--r-ok); }
  .bar.out { background: var(--t-warn); box-shadow: inset 0 0 0 1px var(--r-warn); }

  .subnav { display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .subnav a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--ctl); background: var(--surface); text-decoration: none; font-size: 14px; font-weight: 600; color: var(--ink); }
  .subnav a[aria-current="page"] { outline: 1px solid var(--sel-bd); outline-offset: -1px; }

  .banner { border-radius: var(--radius); padding: 8px 12px; border: 1px solid var(--r-risk); background: var(--t-risk); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .banner.info { border-color: var(--line); background: var(--surface); }
  .banner p { margin: 0; flex: 1 1 200px; }
  .info { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 1px solid var(--ctl); border-radius: 50%; font-size: 13px; font-weight: 600; color: var(--muted); cursor: help; vertical-align: middle; }
  code { font-size: 14px; }
  footer { padding-bottom: 12px; }
  footer p { margin: 0; color: var(--muted); font-size: 14px; }

  @media (max-width: 600px) {
    .btn, details > summary, .subnav a { min-height: 44px; }
    header .btn .bt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } /* icon-only on the phone; the name stays for screen readers */
    header .btn { padding: 0 12px; }
    .big { font-size: 26px; }
    th, td { padding: 6px 4px; font-size: 14px; }
  }

  /* Calm focus: a typing box shows a slightly darker line; keyboard focus is a 2px ink ring (never the browser blue). */

<script>
(function () {
  'use strict';
  var M = window.MoneyCore;
  var CLIENT_ID = window.DASH_CONFIG.clientId;
  var SCOPE = window.DASH_CONFIG.scopes.read;
  var REFRESH_MS = 10 * 60 * 1000;
  var NOW_SHOW = 6, TURN_SHOW = 5, MORE = {};
  function listShown(key, total, step) {
    if (MORE[key] === 'all') return total;
    var n = typeof MORE[key] === 'number' ? MORE[key] : step;
    if (n < step) n = step;
    return Math.min(total, n);
  }
  function showBar(key, total, step) {
    var n = listShown(key, total, step);
    if (n >= total) return '';
    return '<div class="actions" data-show-bar="' + esc(key) + '"><p class="note">Showing ' + n + ' of ' + total + '.</p>' +
      '<button class="btn" type="button" data-action="showmore" data-list="' + esc(key) + '" data-step="' + step + '" data-total="' + total + '"><span>Show more</span></button>' +
      '<button class="btn" type="button" data-action="showall" data-list="' + esc(key) + '"><span>Show all</span></button></div>';
  }

  var accessToken = null, tokenExpiresAt = 0, timer = null;
  var signedIn = false, loading = false, R = null, err = null;
  var $ = function (id) { return document.getElementById(id); };
  var stampFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', hour12: false });
  var whenFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var gbp = M.gbp;
  function d(iso) { return esc(M.fmtDate(iso, R ? R.today : null)); }
  function tag(cls, text) { return '<span class="tag ' + cls + '">' + esc(text) + '</span>'; }
  function chip(text) { return '<span class="chip">' + esc(text) + '</span>'; }
  function entList(s) { return String(s || '').split(';').map(function (e) { return e.trim(); }).filter(Boolean); }
  // Calm rows: the entity on its own small line above the title (dot + name), never run into it.
  function bline(s, extra) { var l = entList(s); if (extra) l.unshift(extra); return l.length ? '<div class="bline"><span class="dot" aria-hidden="true" style="--c:var(--c-fin)"></span>' + esc(l.join(' · ')) + '</div>' : ''; }
  function plain(list) { return list.filter(Boolean).map(function (x) { return '<span>' + esc(x) + '</span>'; }).join(''); }
  // Every date wears a 1px ring; late = rose ring + tint, soon = amber ring + tint. The words stay ink or grey.
  function datePill(text, urg) { return '<span class="date' + (urg ? ' ' + urg : '') + '">' + esc(text) + '</span>'; }
  // Counts: a grey 1px ring; "needs you" counts add a rose ring and tint.
  function cnt(n, need) { return '<span class="cnt' + (need && n ? ' need' : '') + '">' + esc(String(n)) + '</span>'; }
  // Money: tabular figures; a negative keeps its minus sign and wears a rose ring marker, never red words.
  function cash(v, dp) { var t = esc(gbp(v, dp)); return v != null && !isNaN(v) && v < 0 ? '<span class="neg">' + t + '</span>' : t; }
  // Friendly empty state with a small green-ring check.
  function empty(text) { return '<p class="empty">' + esc(text) + '</p>'; }
  function src(name, m) {
    var bits = ['From ' + (m && m.file && m.file.webViewLink ? '<a href="' + esc(m.file.webViewLink) + '" target="_blank" rel="noopener">' + esc(name) + '</a>' : esc(name))];
    if (m && m.asOf) bits.push('data as of ' + d(m.asOf));
    if (m && m.error) bits.push('<b>' + esc(m.error) + '</b>');
    if (R) bits.push('read ' + esc(stampFmt.format(new Date(R.readAt))));
    return '<div class="source">' + bits.map(function (b) { return '<span>' + b + '</span>'; }).join('') + '</div>';
  }
  function meta(k) { return R && R.meta[k] || null; }
  function emoney(code) { return R ? R.money.filter(function (m) { return m.code === code; })[0] : null; }
  function efile(code, k) { return R && R.files[code] && R.files[code][k] || null; }
  function ago(days) { return days === 0 ? 'today' : days === 1 ? '1 day old' : days + ' days old'; }
  function levelCls(l) { return l === 'risk' ? 'c-risk' : l === 'ops' ? 'c-ops' : l === 'ok' ? 'c-ok' : 'c-fin'; }

  // ---- Shared bits ----
  function dryLine(m) {
    if (!m.dryState) return '';
    if (m.dryState === 'stale') return '<div class="line"><span>Runs dry</span><b>' + tag('c-ops', 'Stale') + ' <span class="lbl">said ' + d(m.dry) + '</span></b></div>';
    if (m.dryState === 'dry') return '<div class="line"><span>Runs dry</span><b>' + tag(m.dryDays <= 30 ? 'c-risk' : 'c-ops', d(m.dry)) + '</b></div>';
    if (m.dryState === 'stale-ok') return '<div class="line"><span>Runs dry</span><b>' + tag('c-ops', 'Stale') + ' <span class="lbl">ended ' + d(m.forecastTo) + '</span></b></div>';
    return '<div class="line"><span>Runs dry</span><b>' + tag('c-ok', 'Not before ' + d(m.forecastTo)) + '</b></div>';
  }
  function entCard(m) {
    var bad = entBad(m);
    var h = '<a class="card ent ' + (bad ? 'c-risk' : 'c-fin') + '" href="#/e/' + esc(m.code) + '">';
    h += '<div class="who"><span class="bline"><span class="dot" aria-hidden="true" style="--c:' + (bad ? 'var(--c-risk)' : m.company ? 'var(--c-fin)' : 'var(--c-ideas)') + '"></span>' + esc(m.name !== m.code ? m.name : (m.company ? 'Business' : 'Personal')) + '</span><span class="code">' + esc(m.code) + '</span></div>';
    if (m.bank != null) {
      h += '<div class="big">' + cash(m.bank) + '</div>';
      h += '<div class="lbl">In the bank · ' + d(m.bankAsOf) + ' ' + (m.bankStale ? tag('c-ops', ago(m.bankAge)) : '') + '</div>';
      if (m.unknownAccounts && m.unknownAccounts.length) h += '<div class="lbl">Plus ' + m.unknownAccounts.length + ' account(s) with no balance yet</div>';
    } else {
      h += '<div class="big">–</div><div class="lbl">No bank statement yet</div>';
    }
    if (m.out30 != null) h += '<div class="line"><span>Due out, next 30 days</span><b>' + gbp(m.out30) + '</b></div>';
    h += dryLine(m);
    if (m.xcash && m.xcash.v != null) h += '<div class="line"><span>Xero cash · ' + d(m.xcash.at) + '</span><b>' + gbp(m.xcash.v) + '</b></div>';
    if (m.bills) h += '<div class="line"><span>Unpaid bills in Xero</span><b>' + gbp(m.bills.total) + '</b></div>';
    if (m.liab) {
      if (m.liab.overdue.length) h += '<div class="line"><span>Overdue to ' + esc(m.liab.overdue[0].creditor) + '</span><b>' + tag('c-risk', gbp(m.liab.overdueTotal, 2)) + '</b></div>';
      else if (m.liab.checkTotal >= 5) h += '<div class="line"><span>Paid? Not confirmed</span><b>' + tag('c-ops', gbp(m.liab.checkTotal, 2)) + '</b></div>';
      else h += '<div class="line"><span>Tax and debts</span><b>' + tag('c-ok', 'Nothing overdue') + '</b></div>';
    }
    return h + '</a>';
  }
  function entGroups(list) {
    var withData = list.filter(function (m) { return !m.noData; }), none = list.filter(function (m) { return m.noData; });
    var biz = withData.filter(function (m) { return m.company; }), ppl = withData.filter(function (m) { return !m.company; });
    var h = '';
    if (biz.length) h += '<h3 class="sec-h">Businesses</h3><div class="grid">' + biz.map(entCard).join('') + '</div>';
    if (ppl.length) h += '<h3 class="sec-h">Personal · private to you</h3><div class="grid">' + ppl.map(entCard).join('') + '</div>';
    if (none.length) h += '<p class="quiet">No statements yet: ' + none.map(function (m) { return '<a href="#/e/' + esc(m.code) + '">' + esc(m.code) + '</a>'; }).join(', ') + '.</p>';
    h += '<p class="note">No grand total. Business and personal kept apart.</p>';
    return h;
  }
  function itemLi(i) {
    var t = i.href ? '<a href="' + esc(i.href) + '">' + esc(i.text) + '</a>' : esc(i.text);
    return '<li>' + bline(i.ent) + '<div class="itext">' + t + '</div><div class="meta">' + tag(levelCls(i.level), i.tag) +
      (i.when ? datePill(M.fmtDate(i.when, R.today), i.level === 'risk' ? 'late' : 'soon') : '') + plain([i.who, i.src]) + '</div></li>';
  }
  function dateLi(x) {
    var urg = x.gap ? '' : x.days !== null && x.days < 0 ? 'late' : x.sev === 'risk' ? 'late' : x.sev === 'soon' || (x.days !== null && x.days <= 14) ? 'soon' : '';
    var word = x.gap ? 'Date unknown' : x.days < 0 ? 'Overdue ' + (-x.days) + 'd' : x.days === 0 ? 'Today' : 'In ' + x.days + 'd';
    return '<li>' + bline(x.r.entity) + '<div class="itext">' + esc(x.r.filing) + '</div><div class="meta">' + datePill(x.gap ? word : word + ' · ' + M.fmtDate(x.due, R.today), urg) +
      (x.recurring ? chip('repeats') : '') + plain([x.r.owner, x.r.status, x.r.id]) + '</div></li>';
  }
  function turnLi(x) {
    var r = x.r, urgent = /urgent/i.test(r.priority), high = /high/i.test(r.priority);
    var body = [['Why / evidence', r.evidence], ['What happened', r.incident], ['Believed before', r.previously_believed], ['Starts when', r.trigger_or_event], ['Opened', r.opened_on], ['Closed', r.closed_on]]
      .filter(function (p) { return p[1]; }).map(function (p) { return '<div><span class="lbl">' + esc(p[0]) + ':</span> ' + esc(p[1]) + '</div>'; }).join('');
    // One flag: urgent first, else whether it can start now. Everything else is plain grey words.
    var flag = urgent ? tag('c-risk', 'Urgent') : x.ready === 'ready' ? tag('c-ok', 'Ready') : tag('c-mute', x.ready);
    return '<li id="row-' + esc(r.id) + '">' + bline(r.entity) + '<div class="itext">' + esc(r.subject) + '</div><div class="meta">' + flag +
      plain([urgent ? (x.ready === 'ready' ? 'Ready' : x.ready) : '', high ? 'High priority' : '', r.kind, r.owner, r.state, r.id]) + '</div>' +
      (body ? '<details><summary class="more">Details</summary>' + body + '</details>' : '') + '</li>';
  }
  function listWithMore(items, show, render1, key) {
    var n = listShown(key || 'list', items.length, show);
    return '<ul class="items">' + items.slice(0, n).map(render1).join('') + '</ul>' + showBar(key || 'list', items.length, show);
  }
  function notReady() {
    if (!signedIn) return '<div class="card c-ink now"><h3>Sign in to see your money</h3><p class="note">Read-only. One sign-in for the whole site.</p><div><button class="btn main" type="button" data-action="signin"><svg class="icon"><use href="#i-in"/></svg><span>Sign in with Google</span></button></div></div>';
    if (err) return '<div class="card c-risk pending"><h3>Could not read Drive</h3><p class="note">' + esc(err) + '</p><div><button class="btn" type="button" data-action="refresh">Try again</button></div></div>';
    if (R && R.gate === 'denied') return '<div class="card c-risk"><h3>This page is for Lisa only</h3><p class="note">Signed in as ' + esc(R.email) + '. Sign out and sign in with Lisa\'s account.</p></div>';
    return '<div class="card pending"><h3>Reading…</h3><p class="note">Reading the Money Hub files from Google Drive.</p></div>';
  }

  // ---- Views ----
  function entBad(m) { return !!((m.liab && m.liab.overdue.length) || (m.dryState === 'dry' && m.dryDays <= 30) || (m.bank != null && m.bank < 0)); }
  function isOverdue(i) { return i.level === 'risk' && /^Overdue/.test(i.tag || ''); }
  // Summary strip (On track / Needs you / Overdue) and the one "Next" thing, at the top of Now.
  function summary(items) {
    var over = items.filter(isOverdue).length, need = items.length - over;
    var fine = R.money.filter(function (m) { return !m.noData && !entBad(m); }).length;
    var one = function (cls, n, label, sub) { return '<div class="sum ' + cls + '" data-sum="' + cls + '"><span class="num">' + n + '</span><span class="t">' + label + '<small>' + sub + '</small></span></div>'; };
    return '<div class="three" role="group" aria-label="Summary">' + one('ok', fine, 'On track', fine === 1 ? 'entity with nothing wrong' : 'entities with nothing wrong') +
      one('need', need, 'Needs you', 'urgent or due in 14 days') + one('over', over, 'Overdue', 'past their date') + '</div>';
  }
  function openWord(href) {
    return /^#\/e\//.test(href) ? 'Open ' + href.slice(4) : /^#\/register\//.test(href) ? 'Open the to-do' : /^#\/dates/.test(href) ? 'Open Dates' : /^#\/control/.test(href) ? 'Open Control' : 'Open';
  }
  function nextCard(items) {
    var i = items[0];
    if (!i) return '<section class="card next" data-next><h3 class="sr">Next</h3>' + empty('Nothing needs you right now.') + '</section>';
    return '<section class="card next" data-next><h3 class="sr">Next</h3>' + bline(i.ent, 'Next') + '<p class="ntitle">' + esc(i.text) + '</p>' +
      '<div class="meta">' + tag(levelCls(i.level), i.tag) + (i.when ? datePill(M.fmtDate(i.when, R.today), i.level === 'risk' ? 'late' : 'soon') : '') + '</div>' +
      (i.href ? '<div class="go"><a class="btn" href="' + esc(i.href) + '">' + esc(openWord(i.href)) + '</a></div>' : '') + '</section>';
  }
  function viewNow() {
    var items = M.needsNow(R.data, R.money, R.today);
    var risk = items.filter(function (i) { return i.level === 'risk'; }).length;
    var h = summary(items) + nextCard(items);
    h += '<section class="card now ' + (risk ? 'c-risk' : 'c-ok') + '"><div class="cardhead"><h3>What needs you now</h3>' + cnt(items.length, true) + '</div>';
    h += items.length ? listWithMore(items, NOW_SHOW, itemLi, 'now-needs') : empty('Nothing needs you. Nothing overdue, urgent or due in the next 14 days.');
    h += src('MON-DATES, MON-REGISTER, MON-INTAKE and the ledgers', null) + '</section>';
    h += '<section class="card c-fin"><div class="cardhead"><h3>Money by entity</h3></div>' + entGroups(R.money) + src('BALANCES, OUTGOINGS-NEXT, FORECAST, LIABILITIES and XERO files per entity', null) + '</section>';
    var soon = M.overdueDates(R.data, R.today).concat(M.dueWithin(R.data, R.today, 14));
    h += '<section class="card c-ops"><div class="cardhead"><h3>Dates: overdue and next 14 days</h3>' + cnt(soon.length, soon.some(function (x) { return x.days < 0; })) + '</div>' +
      (soon.length ? listWithMore(soon, 6, dateLi, 'now-dates') : empty('Nothing due in the next 14 days.')) + '<div class="go"><a class="btn" href="#/dates">All dates</a></div>' + src('MON-DATES.csv', meta('dates')) + '</section>';
    var turn = M.yourTurn(R.data), readyN = turn.filter(function (x) { return x.ready === 'ready'; }).length;
    h += '<section class="card c-ops"><div class="cardhead"><h3>Your turn</h3>' + tag(readyN ? 'c-ops' : 'c-mute', readyN + ' ready · ' + turn.length + ' open') + '</div>' +
      (turn.length ? listWithMore(turn, TURN_SHOW, turnLi, 'now-turn') : empty('Nothing waiting on you.')) + '<div class="go"><a class="btn" href="#/todo">All ' + turn.length + ' to-dos</a></div>' + src('MON-REGISTER.csv', meta('register')) + '</section>';
    return h;
  }

  function viewMoney() {
    var h = '<section class="card c-fin"><div class="cardhead"><h3>Every entity</h3></div>' + entGroups(R.money) + '</section>';
    var rs = R.data.reports || [];
    if (rs.length) {
      var wk = rs.map(function (r) { return r.week_of; }).sort().slice(-1)[0];
      var rows = rs.filter(function (r) { return r.week_of === wk; });
      h += '<section class="card c-mute"><div class="cardhead"><h3>Last weekly pack · week of ' + d(wk) + '</h3>' + tag('c-ops', 'Job paused') + '</div><div class="scroll"><table><tr><th>Entity</th><th class="r">Cash</th><th class="r">Month net</th><th>Vs 3-month average</th><th>Runs dry</th></tr>' +
        rows.map(function (r) {
          var pct = function (v) { return v === '' || isNaN(+v) ? '–' : (+v >= 0 ? '+' : '') + Math.round(+v) + '%'; };

  function monthTable(m) {

        '<td><span class="bar in" style="width:' + Math.round(i / max * 100) + '%"></span><br><span class="bar out" style="width:' + Math.round(o / max * 100) + '%"></span></td></tr>';

  function viewEntity(code) {

    if (m.out30 != null) stats.push(['c-fin', gbp(m.out30), 'Due out, next 30 days', 'plan made ' + M.fmtDate(m.planDate, R.today) + (m.out30Partial ? ' · plan ends early' : '')]);
    if (m.dryState) stats.push([m.dryState === 'dry' ? 'c-risk' : m.dryState === 'ok' ? 'c-ok' : 'c-ops', m.dryState === 'dry' ? M.fmtDate(m.dry, R.today) : m.dryState === 'ok' ? 'No' : 'Stale', 'Runs dry', m.dryState === 'stale' ? 'forecast said ' + M.fmtDate(m.dry, R.today) + ', now past' : m.dryState === 'ok' ? 'not before ' + M.fmtDate(m.forecastTo, R.today) : 'forecast from ' + M.fmtDate(m.forecastFrom, R.today)]);
    if (m.month) stats.push([m.month.net < 0 ? 'c-risk' : 'c-ok', gbp(m.month.net), 'Net, ' + m.month.month, 'in ' + gbp(m.month.in) + ' · out ' + gbp(m.month.out)]);
    if (m.avg3) stats.push(['c-mute', gbp(m.avg3.in - m.avg3.out), '3-month average net', m.avg3.months[0] + ' to ' + m.avg3.months[2]]);
    if (m.xcash) stats.push(['c-fin', gbp(m.xcash.v), 'Xero cash', 'as at ' + M.fmtDate(m.xcash.at, R.today)]);
    if (m.owedToYou) stats.push(['c-ok', gbp(m.owedToYou.v), 'Owed to you (Xero)', m.owedToYou.basis || '']);

      '<div class="stats">' + stats.map(function (s) { return '<div class="stat ' + s[0] + '"><div class="num">' + esc(s[1]) + '</div><div class="label">' + esc(s[2]) + '</div><div class="sub">' + esc(s[3]) + '</div></div>'; }).join('') + '</div>' +
      (m.noData ? '<p class="note">No ledger files found for ' + esc(m.code) + ' yet. Drop statements into Drop / ' + esc(m.code) + ' and they will be filed into the ledger.</p>' : '') + '</section>';
    if (m.accounts && m.accounts.length) {

        return '<tr><td>' + esc(a.account) + (a.status === 'nil' ? ' ' + chip('closed / nil') : '') + '</td><td class="r">' + (a.balance !== '' ? gbp(+a.balance, 2) : '?') + '</td><td>' + d(a.as_of) + '</td></tr>';
      }).join('') + '</table></div>' + src('BALANCES.csv · ' + code, bal) + '</section>';

          return '<tr><td>' + d(r.expected_on) + '</td><td>' + esc(r.counterparty) + '</td><td class="r">' + gbp(M.n(r.amount) * (r.direction === 'out' && M.n(r.amount) > 0 ? -1 : 1), 2) + '</td><td>' + esc(r.confidence) + '</td></tr>';
        }).join('') + '</table></div></details>' : '<p class="note">Nothing expected in this window.</p>') +

    var rec = efile(code, 'recurring');
    if (rec && rec.table) {

      var trow = function (r) { return '<tr><td>' + esc(r.counterparty) + '<div class="lbl">' + esc(r.cadence) + ' · ' + esc(r.direction) + (r.status && r.status !== 'learned' ? ' · ' + esc(r.status) : '') + '</div></td><td class="r">' + gbp(M.n(r.amount_expected), 2) + '</td><td>' + d(r.next_expected) + '</td></tr>'; };
      var recN = listShown('rec-' + code, rr.length, 8);
      h += '<section class="card c-fin"><h3>Regular payments</h3><div class="scroll"><table><tr><th>Who</th><th class="r">Usual amount</th><th>Next</th></tr>' + rr.slice(0, recN).map(trow).join('') + '</table></div>' +
        showBar('rec-' + code, rr.length, 8) + src('RECURRING.csv · ' + code, rec) + '</section>';
    }
    if (m.liab) {
      var lf = efile(code, 'liabilities');
      h += '<section class="card ' + (m.liab.overdue.length ? 'c-risk' : 'c-fin') + '"><h3>Tax and debts</h3><ul class="items">' + m.liab.rows.map(function (r) {
        var cls = r.status === 'overdue' ? 'c-risk' : r.status === 'check' ? 'c-ops' : r.status === 'plan' ? 'c-mute' : 'c-fin';
        return '<li>' + bline(r.creditor) + '<div class="itext">' + esc(gbp(M.n(r.amount), 2)) + ' · ' + esc(r.item) + '</div><div class="meta">' + tag(cls, r.status) +
          (M.isISO(r.due) ? datePill('due ' + M.fmtDate(r.due, R.today), r.status === 'overdue' ? 'late' : '') : plain([r.due])) + '</div>' +
          (r.note || r.plan ? '<div class="meta">' + esc([r.plan, r.note].filter(Boolean).join(' · ')) + '</div>' : '') + '</li>';
      }).join('') + '</ul><p class="note">Plan rows repeat, not added up. Not tax advice.</p>' + src('LIABILITIES.csv · ' + code, lf) + '</section>';
    }
    h += xeroCards(code, m);
    var dts = M.datesView(R.data, R.today).filter(function (x) { return !x.done && (x.r.entity || '').split(';').indexOf(code) >= 0; });
    if (dts.length) h += '<section class="card c-ops"><h3>Dates for ' + esc(code) + '</h3>' + listWithMore(dts, 5, dateLi, 'ent-dates-' + code) + src('MON-DATES.csv', meta('dates')) + '</section>';
    var rules = M.ruleDeadlines(R.data, R.today).filter(function (x) { return x.ent === code; });
    if (rules.length) h += ruleCard(rules, code);
    var turn = M.yourTurn(R.data).filter(function (x) { return (x.r.entity || '').split(';').indexOf(code) >= 0; });
    if (turn.length) h += '<section class="card c-ops"><h3>Your to-dos for ' + esc(code) + '</h3>' + listWithMore(turn, 5, turnLi, 'ent-turn-' + code) + src('MON-REGISTER.csv', meta('register')) + '</section>';
    return h;
  }
  function xeroCards(code, m) {
    var h = '', pay = efile(code, 'pay'), recv = efile(code, 'recv'), pnl = efile(code, 'pnl'), inc = efile(code, 'income'), un = efile(code, 'unrec');

    if (pnl && pnl.table) {
      h += '<h4>Profit and loss by year</h4><div class="scroll"><table><tr><th>Year</th><th class="r">Income</th><th class="r">Expenses</th><th class="r">Net profit</th></tr>' + pnl.table.rows.map(function (r) {

      var prow = function (r) { return '<tr><td>' + esc(r.supplier) + '<div class="lbl">' + esc(r.unpaid_bills) + ' bill(s) · oldest ' + d(r.oldest_due) + '</div></td><td class="r">' + gbp(M.n(r.amount_due), 2) + '</td></tr>'; };
      var payN = listShown('pay-' + code, pr.length, 6);
      h += '<h4>Unpaid bills by supplier · ' + gbp(m.bills.total, 2) + ' across ' + m.bills.suppliers + '</h4><div class="scroll"><table>' + pr.slice(0, payN).map(prow).join('') + '</table></div>' +

        inc.table.rows.map(function (r) { return '<tr><td>' + esc(r.account) + '</td>' + cols.map(function (c) { return '<td class="r">' + gbp(M.n(r[c])) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div></details>';
    }

    var srcs = ['pnl', 'pay', 'recv', 'income', 'unrec', 'snapshot', 'banks'].map(function (k) { var f = efile(code, k); return f ? f : null; }).filter(Boolean);
    h += '<div class="source">' + srcs.map(function (f) { return '<span>' + (f.file ? '<a href="' + esc(f.file.webViewLink || '#') + '" target="_blank" rel="noopener">' + esc(f.name) + '</a>' : esc(f.name)) + (f.asOf ? ' · ' + d(f.asOf) : '') + (f.error ? ' · <b>' + esc(f.error) + '</b>' : '') + '</span>'; }).join('') + '</div>';

  }

  // Forecast line chart (F5): projected balance from FORECAST.csv, zero line in Risk, "runs dry" marked.
  // Plain SVG, no library. The numbers are also in the label, and the table stays in the file.
  function forecastChart(m, pts) {
    if (pts.length < 2) return '';
    var W = 640, H = 220, L = 64, Rm = 16, T = 16, B = 34;
    var t0 = Date.parse(pts[0].date), t1 = Date.parse(pts[pts.length - 1].date);
    var vs = pts.map(function (p) { return p.v; }), lo = Math.min(0, Math.min.apply(null, vs)), hi = Math.max(0, Math.max.apply(null, vs));
    if (hi === lo) hi = lo + 1;
    var x = function (iso) { return L + (W - L - Rm) * ((Date.parse(iso) - t0) / Math.max(1, t1 - t0)); };
    var y = function (v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };
    var path = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(p.date).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
    var dry = m.dryState === 'dry' && m.dry ? pts.filter(function (p) { return p.date === m.dry; })[0] : null;
    var minP = pts.reduce(function (a, p) { return p.v < a.v ? p : a; }, pts[0]);
    var label = 'Forecast for ' + m.code + ': ' + gbp(pts[0].v) + ' on ' + M.fmtDate(pts[0].date, R.today) + ', lowest ' + gbp(minP.v) + ' on ' + M.fmtDate(minP.date, R.today) +
      (minP === pts[pts.length - 1] ? ' (the last day shown)' : ', ' + gbp(pts[pts.length - 1].v) + ' on ' + M.fmtDate(pts[pts.length - 1].date, R.today)) + (dry ? '. Goes below zero on ' + M.fmtDate(dry.date, R.today) : '. Stays above zero') + '.';
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '" data-chart="forecast">';
    [hi, lo].forEach(function (v) { s += '<line class="grid" x1="' + L + '" x2="' + (W - Rm) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text x="' + (L - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + esc(gbp(v)) + '</text>'; });
    s += '<line class="zero" x1="' + L + '" x2="' + (W - Rm) + '" y1="' + y(0).toFixed(1) + '" y2="' + y(0).toFixed(1) + '"/><text x="' + (L - 6) + '" y="' + (y(0) + 4).toFixed(1) + '" text-anchor="end">£0</text>';
    s += '<text x="' + L + '" y="' + (H - 10) + '">' + esc(M.fmtDate(pts[0].date, R.today)) + '</text><text x="' + (W - Rm) + '" y="' + (H - 10) + '" text-anchor="end">' + esc(M.fmtDate(pts[pts.length - 1].date, R.today)) + '</text>';
    s += '<path class="ln" d="' + path + '"/><circle class="now" cx="' + x(pts[0].date).toFixed(1) + '" cy="' + y(pts[0].v).toFixed(1) + '" r="4"/>';
    if (dry) s += '<circle class="dry" data-dry="' + esc(dry.date) + '" cx="' + x(dry.date).toFixed(1) + '" cy="' + y(dry.v).toFixed(1) + '" r="6"/><text class="dry" x="' + Math.min(W - Rm - 4, x(dry.date) + 8).toFixed(1) + '" y="' + Math.max(T + 12, y(dry.v) - 8).toFixed(1) + '" text-anchor="' + (x(dry.date) > W - 160 ? 'end' : 'start') + '">Runs dry ' + esc(M.fmtDate(dry.date, R.today)) + '</text>';
    return '<section class="card ' + (dry ? 'c-risk' : 'c-fin') + ' chart"><h3>Forecast balance</h3>' + s + '</svg><p class="note">' + esc(label) + ' Dashed line is £0.</p>' + src('FORECAST.csv · ' + m.code, efile(m.code, 'forecast')) + '</section>';
  }
  // Deadlines worked out from rules (F6). Every row says "check with accountant". Not tax advice.
  function ruleLi(x) {

      datePill((x.days === 0 ? 'Today' : 'In ' + x.days + 'd') + ' · ' + M.fmtDate(x.due, R.today), x.days <= 14 ? 'late' : x.days <= 45 ? 'soon' : '') + chip('check with accountant') + plain(['Rule: ' + x.rule]) + '</div></li>';
  }
  function ruleCard(list, key) {
    var h = '<section class="card c-fin" data-rules="' + esc(key) + '"><div class="cardhead"><h3>Worked out from the rules</h3>' + cnt(list.length) + '</div>';

  function viewDates() {
    var all = M.datesView(R.data, R.today).filter(function (x) { return !x.done; });

      ['Overdue', 'c-risk', all.filter(function (x) { return !x.recurring && x.days !== null && x.days < 0; })],

      ['Next 15 to 45 days', 'c-ops', all.filter(function (x) { return !x.recurring && x.days > 14 && x.days <= 45; })],

    }).join('') + '<p class="note">Repeating dates roll to their next day. Done rows are hidden.</p>' + src('MON-DATES.csv', meta('dates')) + ruleCard(M.ruleDeadlines(R.data, R.today), 'all');
  }

  var TODO_SUBS = [['yours', 'Yours'], ['others', 'Waiting on others'], ['watch', 'Watching'], ['closed', 'Closed']];
  function viewTodo(sub, rowId) {
    var reg = R.data.register || [];
    if (rowId) {
      var r = reg.filter(function (x) { return x.id === rowId; })[0];
      if (r) return '<section class="card c-ops"><ul class="items">' + turnLi({ r: r, ready: M.ready(r, reg) }) + '</ul>' + src('MON-REGISTER.csv', meta('register')) + '</section><a href="#/todo">All to-dos</a>';

    var wrap = function (title, cls, list, show) { return '<section class="card ' + cls + '"><div class="cardhead"><h3>' + esc(title) + '</h3>' + cnt(list.length, title === 'Ready now') + '</div>' + (list.length ? listWithMore(list, show || 10, turnLi, 'todo-' + sub + '-' + title) : empty('Nothing here.')) + '</section>'; };
    var mk = function (rows) { return rows.map(function (r) { return { r: r, ready: M.ready(r, reg) }; }); };
    if (sub === 'yours') {
      var t = M.yourTurn(R.data);
      h += wrap('Ready now', 'c-ops', t.filter(function (x) { return x.ready === 'ready'; }), 8) + wrap('Waiting on something first', 'c-mute', t.filter(function (x) { return x.ready !== 'ready'; }), 5);
    } else if (sub === 'others') {
      h += wrap('Waiting on others', 'c-ok', mk(reg.filter(function (r) { return M.isOpen(r) && !M.isLisa(r) && M.isTask(r); })));
    } else if (sub === 'watch') {
      h += wrap('Conditions and checks being watched', 'c-ideas', mk(reg.filter(function (r) { return M.isOpen(r) && !M.isTask(r); })));
    } else {
      h += wrap('Closed', 'c-ok', mk(reg.filter(function (r) { return !M.isOpen(r); }).reverse()), 10);
    }
    return h + '<p class="note">Answering here: off. Change rows in MON-REGISTER.csv.</p>' + src('MON-REGISTER.csv', meta('register'));
  }

  function viewAccountant() {
    var rows = R.data.accountant || [];
    var open = rows.filter(function (r) { return !r.answer; }), done = rows.filter(function (r) { return r.answer; });
    var li = function (r) { return '<li>' + bline(r.entity) + '<div class="itext">' + esc(r.question) + '</div><div class="meta">' + tag(r.answer ? 'c-ok' : /not yet/i.test(r.status) ? 'c-ops' : 'c-mute', r.answer ? 'Answered' : r.status) + plain([r.id]) + '</div>' +
      '<div class="meta"><span>About: ' + esc(r.about_document) + '</span><span>Asked ' + d(r.asked_on) + '</span></div>' + (r.answer ? '<div>' + esc(r.answer) + '</div>' : '') + '</li>'; };
    return '<section class="card c-ok"><div class="cardhead"><h3>Questions waiting on the accountant</h3>' + cnt(open.length) + '</div>' + (open.length ? '<ul class="items">' + open.map(li).join('') + '</ul>' : empty('Nothing waiting on the accountant.')) + src('QUESTIONS-FOR-ACCOUNTANT.csv', meta('accountant')) + '</section>' +
      (done.length ? '<section class="card c-ok"><h3>Answered</h3><ul class="items">' + done.map(li).join('') + '</ul></section>' : '') +
      '<p class="note">Chasing: manual. Nothing is sent from here.</p>';
  }

  function viewControl() {
    var fc = M.fileChecks(R);
    var bad = fc.filter(function (f) { return f.state === 'fail'; }), warn = fc.filter(function (f) { return f.state === 'warn'; });
    var h = '<section class="card ' + (bad.length ? 'c-risk' : warn.length ? 'c-ops' : 'c-ok') + '"><div class="cardhead"><h3>Files</h3>' +
      tag(bad.length ? 'c-risk' : 'c-ok', (fc.length - bad.length) + ' of ' + fc.length + ' found once') + '</div>' +
      '<p class="note">Found by folder + exact title. Two copies or none = error. Never an old file id.</p>' +
      (bad.length || warn.length ? '' : '<details><summary class="more">Show all ' + fc.length + ' files</summary>') +
      '<div class="scroll"><table><tr><th>Where</th><th>File</th><th>State</th><th>Data as of</th></tr>' + fc.slice().sort(function (a, b) { var o = { fail: 0, warn: 1, wait: 2, ok: 3 }; return o[a.state] - o[b.state]; }).map(function (f) {
        return '<tr><td>' + esc(f.scope) + '</td><td>' + (f.link ? '<a href="' + esc(f.link) + '" target="_blank" rel="noopener">' + esc(f.name) + '</a>' : esc(f.name)) + '</td><td>' +
          tag(f.state === 'fail' ? 'c-risk' : f.state === 'warn' ? 'c-ops' : f.state === 'ok' ? 'c-ok' : 'c-mute', f.state === 'ok' ? 'OK' : f.state === 'warn' ? 'Count off' : f.state === 'fail' ? 'Problem' : 'Not read') + '<div class="lbl">' + esc(f.note) + '</div></td><td>' + d(f.asOf) + '</td></tr>';
      }).join('') + '</table></div>' + (bad.length || warn.length ? '' : '</details>') + '</section>';
    var checks = R.data.checks || [], latest = {};
    checks.forEach(function (c) { if (!latest[c.check_id] || c.run_on > latest[c.check_id].run_on) latest[c.check_id] = c; });
    var ks = Object.keys(latest).sort(function (a, b) { return a.localeCompare(b, 'en-GB', { numeric: true }); }).map(function (k) { return latest[k]; });
    var failing = ks.filter(function (c) { return !/^(PASS|INFO)/i.test(c.result || ''); });
    h += '<section class="card ' + (failing.length ? 'c-risk' : 'c-ok') + '"><div class="cardhead"><h3>Checks</h3>' + tag(failing.length ? 'c-risk' : 'c-ok', failing.length ? failing.length + ' failing' : 'None failing') + '</div>' +
      '<p class="note">Latest run. PASS / INFO = not a failure.</p><ul class="items">' + ks.map(function (c) {
        var ok = /^(PASS|INFO)/i.test(c.result || '');
        return '<li><div class="bline">' + esc(c.check_id) + '</div><div class="itext">' + esc(c.result) + '</div><div class="meta">' + tag(ok ? 'c-ok' : 'c-risk', ok ? (/^INFO/i.test(c.result) ? 'Info' : 'Pass') : 'Fail') + plain([whenOf(c.run_on), c.job]) + '</div></li>';
      }).join('') + '</ul>' + src('CHECK-LOG.csv', meta('checks')) + '</section>';
    var trig = (R.data.triggers || []).filter(function (t) { return t.hub === 'MON'; });
    var k14 = latest.K014, tm = meta('triggers');
    h += '<section class="card c-ops"><div class="cardhead"><h3>Scheduled jobs</h3>' + tag('c-ops', 'Paused') + '</div>' +
      '<p>All scheduled money jobs are paused while you review the hub. ' + (k14 ? 'Last confirmed ' + esc(whenOf(k14.run_on)) + ': ' + esc(k14.result) : '') + '</p>' +
      (trig.length ? '<details><summary class="more">' + trig.length + ' money jobs listed in TRIGGERS.csv</summary><div class="scroll"><table><tr><th>Job</th><th>When</th><th>Task id</th><th>File says</th></tr>' + trig.map(function (t) {
        return '<tr><td><b>' + esc(t.trigger_id) + '</b><div class="lbl">' + esc(String(t.name || '').replace(/^TR-\S+ · /, '')) + '</div></td><td>' + esc(t.cadence_uk) + '</td><td><code>' + esc(t.mechanism_id) + '</code></td><td>' + esc(t.status) + '</td></tr>';
      }).join('') + '</table></div><p class="note">TRIGGERS.csv was last recounted ' + d(tm && tm.asOf) + ' and still says ENABLED for these; the pause check above is newer.</p></details>' : '<p class="note">TRIGGERS.csv not read' + (tm && tm.error ? ': ' + esc(tm.error) : '') + '.</p>') +
      src('TRIGGERS.csv', tm) + '</section>';
    var intake = R.data.intake || [], od = M.intakeOverdue(R.data, R.today).map(function (r) { return r.id; });
    var byE = {}; intake.forEach(function (r) { (byE[r.entity] = byE[r.entity] || []).push(r); });
    h += '<section class="card ' + (od.length ? 'c-ops' : 'c-ok') + '"><div class="cardhead"><h3>Statements to drop</h3>' + tag(od.length ? 'c-ops' : 'c-ok', od.length + ' past due') + '</div>' +
      '<p class="note">Put files in the <a href="https://drive.google.com/drive/folders/' + esc(M.CFG.folders.drop) + '" target="_blank" rel="noopener">Drop folder</a> under the right entity. Uploading from this page is off for now.</p>' +
      Object.keys(byE).map(function (e) {
        return '<h4>' + esc(e) + '</h4><ul class="items">' + byE[e].map(function (r) {
          var late = od.indexOf(r.id) >= 0;
          return '<li><div class="itext">' + esc(r.account) + '</div><div class="meta">' + tag(late ? 'c-ops' : r.status === 'live' ? 'c-ok' : r.last_received ? 'c-ok' : 'c-mute', late ? 'Due ' + M.fmtDate(r.next_due, R.today) : r.status === 'live' ? 'Live' : r.next_due ? 'Next ' + M.fmtDate(r.next_due, R.today) : r.status) + plain([r.cadence, r.last_received ? 'last ' + M.fmtDate(r.last_received, R.today) : 'never received']) + '</div></li>';
        }).join('') + '</ul>';
      }).join('') + src('MON-INTAKE.csv', meta('intake')) + '</section>';
    h += '<section class="card c-mute"><h3>Connections and saving</h3><ul class="items">' +
      '<li><div class="itext">Xero and PayPal</div><div class="meta">' + tag('c-mute', 'Not configured') + '</div><div class="meta">Xero figures come from the export files in Drive. Connecting either needs its keys kept in a secure store, never in this page.</div></li>' +
      '<li><div class="itext">Saving and answers</div><div class="meta">' + tag('c-mute', 'Off') + '</div><div class="meta">This page only reads. Writing rows back needs either an Apps Script web app run as Lisa or the full Drive scope, plus the living-file rewrite rule.</div></li>' +
      '</ul></section>';
    return h;
  }
  function whenOf(s) { var t = new Date(s); return s && !isNaN(t) ? whenFmt.format(t) : String(s || ''); }

  // ---- Router ----
  var TITLES = { now: 'Now', money: 'Money', e: 'Entity', dates: 'Dates', todo: 'To-do', register: 'To-do', accountant: 'Accountant', control: 'Control' };
  function route() {
    var p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    return { view: TITLES[p[0]] ? p[0] : 'now', a: p[1] || null };
  }
  function render() {
    var r = route(), html;
    if (!signedIn || !R || R.gate !== 'ok') html = notReady();
    else if (r.view === 'money') html = viewMoney();
    else if (r.view === 'e') html = viewEntity(r.a);
    else if (r.view === 'dates') html = viewDates();
    else if (r.view === 'todo') html = viewTodo(r.a);
    else if (r.view === 'register') html = viewTodo(null, r.a);
    else if (r.view === 'accountant') html = viewAccountant();
    else if (r.view === 'control') html = viewControl();
    else html = viewNow();
    var v = $('view');
    v.innerHTML = html;
    v.setAttribute('data-view', r.view);
    var title = r.view === 'e' ? (r.a || 'Entity') : TITLES[r.view];
    $('hereTitle').textContent = title;
    document.title = title + ' · Money Hub';
    var nav = r.view === 'e' ? 'money' : r.view === 'register' ? 'todo' : r.view;
    Array.prototype.forEach.call(document.querySelectorAll('nav.main a'), function (a) {
      if (a.getAttribute('data-nav') === nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    tabCounts();
    $('readStamp').textContent = !signedIn ? 'Not signed in' : loading ? 'Reading…' : err ? 'Read failed' : R ? 'Read ' + stampFmt.format(new Date(R.readAt)) : 'Not read';
    $('refreshBtn').classList.toggle('hidden', !signedIn);
    $('signOutBtn').classList.toggle('hidden', !signedIn);
    $('signInBtn').classList.toggle('hidden', signedIn);
  }
  // Counts in the tab corners: what needs you (rose ring) and plain totals (grey ring). Empty = hidden.
  function tabCounts() {
    var ok = signedIn && R && R.gate === 'ok', set = function (id, n, need) { var e = $(id); e.textContent = ok && n ? String(n) : ''; e.classList.toggle('need', !!need); };
    if (!ok) { ['nNow', 'nMoney', 'nDates', 'nTodo', 'nAcct', 'nControl'].forEach(function (id) { set(id, 0); }); return; }
    var over = M.overdueDates(R.data, R.today).length, soon = M.dueWithin(R.data, R.today, 14).length;
    var fc = M.fileChecks(R), bad = fc.filter(function (f) { return f.state === 'fail'; }).length;
    set('nNow', M.needsNow(R.data, R.money, R.today).length, true);
    set('nMoney', 0);
    set('nDates', over + soon, over > 0);
    set('nTodo', M.yourTurn(R.data).filter(function (x) { return x.ready === 'ready'; }).length, true);
    set('nAcct', (R.data.accountant || []).filter(function (q) { return !q.answer; }).length, false);
    set('nControl', bad, true);
  }
  var lastHash = location.hash;
  window.addEventListener('hashchange', function () {
    render();
    if (location.hash !== lastHash) { window.scrollTo(0, 0); lastHash = location.hash; }
    var row = /^#\/register\//.test(location.hash);
    if (!row) $('hereTitle').focus({ preventScroll: true });
  });

  // ---- Data ----
  function load() {
    if (!accessToken || loading) return;
    if (Date.now() > tokenExpiresAt) { expired(); return; }
    loading = true; err = null; render();
    M.loadAll(function () { return accessToken; }).then(function (res) {
      R = res; loading = false;
      if (res.gate !== 'ok') { stopTimer(); }
      render();
    }, function (e) {
      loading = false;
      err = e && DashKit.isBusy(e.status, e.reason) ? DashKit.BUSY_TEXT : e && e.status === 401 ? 'Sign-in expired. Sign in again.' : e && e.status === 403 ? 'Google Drive refused access (' + (e.reason || 'forbidden') + ').' : (e && e.message) || 'Unknown error';
      if (e && e.status === 401) expired();
      render();
    });
  }
  function banner(text, info, withSignIn) {
    var b = $('banner');
    b.className = 'banner' + (info ? ' info' : '');
    b.innerHTML = '<p>' + esc(text) + '</p>' + (withSignIn ? '<button class="btn main" type="button" data-action="signin">Sign in again</button>' : '');
  }
  function clearBanner() { $('banner').className = 'banner hidden'; $('banner').innerHTML = ''; }
  function startTimer() { stopTimer(); timer = setInterval(load, REFRESH_MS); }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
  function expired() {
    stopTimer();
    accessToken = null;
    if (window.DashAuth) DashAuth.markExpired();
    if (!auth.requestSilent()) banner('Sign-in expired. Sign in again.', false, true);
  }
  function onSilentFail(hadExpired) {
    if (accessToken && Date.now() < tokenExpiresAt) return;
    if (hadExpired) banner('Sign-in expired. Sign in again.', false, true);
  }
  function onToken(resp) {
    if (resp.error) { banner('Sign-in did not complete.', false, true); return; }
    if (!google.accounts.oauth2.hasGrantedAllScopes(resp, SCOPE)) { banner('Drive read access was not granted.', false, true); return; }
    accessToken = resp.access_token;
    tokenExpiresAt = DashAuth.expiryFrom(resp.expires_in);
    DashAuth.save(accessToken, tokenExpiresAt, resp.scope || SCOPE);
    signedIn = true; clearBanner(); startTimer(); load();
  }
  // otherTab: another tab already signed out (and revoked), so just forget everything here.
  function signOut(otherTab) {
    stopTimer();
    var t = otherTab === true ? null : accessToken;
    accessToken = null; tokenExpiresAt = 0; signedIn = false; R = null; err = null; MORE = {};
    M.clearCache(); // the memory copy of the Money files goes too
    if (window.DashAuth && otherTab !== true) DashAuth.clear();
    if (t && window.google && google.accounts && google.accounts.oauth2) google.accounts.oauth2.revoke(t, function () {});
    banner(otherTab === true ? 'Signed out in another tab. Nothing kept.' : 'Signed out. Nothing kept.', true, false);
    render();
  }
  // Search (press /): to-dos, dates and accountant questions already read on this page.
  DashKit.search.register(function (q) {
    var hit = DashKit.search.matches(q), out = [];
    if (!R || R.gate !== 'ok') return out;
    (R.data.register || []).filter(function (r) { return hit([r.subject, r.id, r.entity, r.owner].join(' ')); }).slice(0, 12).forEach(function (r) {
      out.push({ group: 'To-dos', slot: 4, title: r.subject, sub: [r.entity, r.owner, r.status].filter(Boolean).join(' · '), href: '#/register/' + encodeURIComponent(r.id) });
    });
    (R.data.dates || []).filter(function (r) { return hit([r.filing, r.entity, r.id].join(' ')); }).slice(0, 12).forEach(function (r) {
      out.push({ group: 'Dates', slot: 4, title: r.filing, sub: [r.entity, r.due_on].filter(Boolean).join(' · '), href: '#/dates' });
    });
    (R.data.accountant || []).filter(function (r) { return hit(Object.keys(r).map(function (k) { return r[k]; }).join(' ')); }).slice(0, 8).forEach(function (r) {
      out.push({ group: 'Accountant questions', slot: 5, title: r.question || r.id, sub: r.id, href: '#/accountant' });
    });
    return out;
  });
  function initGoogle() {
    if (!auth.init()) return false;
    var b = $('signInBtn'); b.disabled = false; b.querySelector('span').textContent = 'Sign in with Google';
    return true;
  }
  var auth = DashAuth.bind({
    clientId: CLIENT_ID,
    scope: SCOPE,
    onToken: onToken,
    onError: function (e) { var ty = e && e.type; banner(ty === 'popup_failed_to_open' ? 'Sign-in window blocked by the browser.' : ty === 'popup_closed' ? 'Sign-in window closed early.' : 'Sign-in did not complete.', false, true); },
    onSilentFail: onSilentFail
  });
  function restoreShared() {
    var saved = DashAuth.valid();
    if (!saved || !DashAuth.hasScope(saved, SCOPE)) return false;
    accessToken = saved.access_token;
    tokenExpiresAt = saved.expires_at;
    signedIn = true;
    return true;
  }
  // Skip link: jump to the content without changing the #/ address.
  document.addEventListener('click', function (e) {
    var k = e.target.closest && e.target.closest('[data-skip]');
    if (!k) return;
    e.preventDefault();
    var m = document.getElementById(k.getAttribute('data-skip'));
    if (m) { m.setAttribute('tabindex', '-1'); m.focus(); }
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t || t.disabled) return;
    var a = t.getAttribute('data-action');
    if (a === 'signin') auth.requestInteractive({ login_hint: M.CFG.owner });
    else if (a === 'signout') signOut();
    else if (a === 'refresh') load();
    else if (a === 'showmore') {
      var key = t.getAttribute('data-list');
      var step = parseInt(t.getAttribute('data-step'), 10) || NOW_SHOW;
      var total = parseInt(t.getAttribute('data-total'), 10) || step;
      var cur = listShown(key, total, step);
      var next = Math.min(total, cur + step);
      MORE[key] = next >= total ? 'all' : next;
      render();
    }
    else if (a === 'showall') { MORE[t.getAttribute('data-list')] = 'all'; render(); }
  });
  var restored = restoreShared();
  render();
  if (restored) { startTimer(); load(); }
  // Another tab signed in, refreshed the token, or signed out.
  DashAuth.onChange(function (saved) {
    if (!saved || !DashAuth.hasScope(saved, SCOPE)) { if (signedIn) signOut(true); return; }
    var wasIn = signedIn && accessToken;
    restoreShared();
    clearBanner();
    if (!wasIn) { startTimer(); load(); } else render();
  });
  var tries = 0;
  (function wait() {
    if (initGoogle()) return;
    if (++tries > 100) { $('signInBtn').querySelector('span').textContent = 'Sign-in unavailable'; banner('Google sign-in did not load.', false, false); return; }
    setTimeout(wait, 100);
  })();
})();
</script>

<script>
/* Calm: every help bullet list (ul.notes) becomes one (i); its words show on hover or tap. */
(function () {
  function calm() {
    document.querySelectorAll('ul.notes:not([data-calm])').forEach(function (ul) {
      var t = Array.prototype.map.call(ul.querySelectorAll('li'), function (li) { return li.textContent.trim(); }).join(' · ');
      var s = document.createElement('span'); s.className = 'info'; s.title = t; s.setAttribute('tabindex', '0'); s.textContent = 'i';
      var h = document.createElement('span'); h.textContent = ' ' + t; h.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap'; s.appendChild(h); // screen readers (and tests) still get the words
      ul.setAttribute('data-calm', '1'); ul.replaceWith(s);
    });
  }
  new MutationObserver(calm).observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener('DOMContentLoaded', calm); calm();
})();
</script>
</body>
