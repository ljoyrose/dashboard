<!DOCTYPE html>
<html lang="en-GB">

<style>
  /* Colours come from ../tokens.css (one shared LJR7 file). These short names only point at it.
     Now 1 Vision (ink) · Money 3 · Dates/To-do 4 Ops · Accountant 5 Connection · Control 0 · problems 2 Risk. */
  :root {
    --bg: var(--ljr-cream); --surface: var(--ljr-paper); --ink: var(--ljr-ink); --muted: var(--ljr-muted); --line: #DED5C8;
    --risk: var(--ljr-2); --fin: var(--ljr-3); --ops: var(--ljr-4); --ok: var(--ljr-5); --sales: var(--ljr-6); --ideas: var(--ljr-7); --s0: var(--ljr-0);
    --risk-text: var(--ljr-2-text);
    --risk-t: var(--ljr-2-tint); --fin-t: var(--ljr-3-tint); --ops-t: var(--ljr-4-tint); --ok-t: var(--ljr-5-tint); --sales-t: var(--ljr-6-tint); --ideas-t: var(--ljr-7-tint); --s0-t: var(--ljr-0-tint);
    --shadow: 0 4px 12px rgba(44, 44, 42, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --line: #3D372F; --shadow: 0 4px 12px rgba(0, 0, 0, 0.32); }
  }
  * { box-sizing: border-box; }
  .skip { position: absolute; left: -999px; top: 8px; z-index: 50; background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; border: 2px solid var(--ink); }
  .skip:focus { left: 8px; }
  .skip-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Lexend', sans-serif; font-size: 17px; line-height: 1.6; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  a:hover { text-decoration-thickness: 2px; }
  .wrap { max-width: calc(66ch + 32px); margin: 0 auto; padding: 0 16px; }
  .wide { max-width: 1040px; }
  .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  header { background: var(--surface); border-bottom: 1px solid var(--line); }
  @media (min-width: 700px) { header { position: sticky; top: 0; z-index: 2; } }
  .top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding-top: 12px; padding-bottom: 8px; }
  .top h1 { font-size: 20px; font-weight: 700; margin: 0; flex: 1 1 auto; }
  .top h1 a { text-decoration: none; }
  /* Design rule: every page except home has "Dashboard" at the top right of the header, always shown. */
  .back { margin-left: auto; order: 99; }
  .readstamp { color: var(--muted); font-size: 14px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border-radius: 12px;
         border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 15px; text-decoration: none; }
  .btn:hover { border-color: var(--muted); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.main { border-color: var(--ink); font-weight: 600; }
  nav.main { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 12px; }
  nav.main a { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; text-decoration: none;
               font-size: 15px; border: 1px solid var(--line); border-left: 4px solid var(--c, var(--s0)); background: var(--surface); min-height: 44px; }
  nav.main a[aria-current="page"] { font-weight: 700; background: var(--t, var(--s0-t)); border-color: var(--ink); border-left-color: var(--c, var(--s0)); }
  @media (max-width: 520px) { nav.main { display: grid; grid-template-columns: 1fr 1fr 1fr; } nav.main a { justify-content: center; padding: 8px 6px; font-size: 14px; } }

  .c-risk { --c: var(--risk); --t: var(--risk-t); }
  .c-fin { --c: var(--fin); --t: var(--fin-t); }
  .c-ops { --c: var(--ops); --t: var(--ops-t); }
  .c-ok { --c: var(--ok); --t: var(--ok-t); }
  .c-sales { --c: var(--sales); --t: var(--sales-t); }
  .c-ideas { --c: var(--ideas); --t: var(--ideas-t); }
  .c-ink { --c: var(--ink); --t: var(--s0-t); }
  .c-mute { --c: var(--s0); --t: var(--s0-t); }

  main { padding-top: 16px; padding-bottom: 32px; }
  .here { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
  .here span { color: var(--muted); font-size: 14px; }
  .here h2 { margin: 0; font-size: 24px; font-weight: 700; }
  #view { display: flex; flex-direction: column; gap: 16px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--s0));
          border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
  .card.now { border: 2px solid var(--ink); border-left: 8px solid var(--c, var(--ink)); }
  .card.pending { border-style: dashed; box-shadow: none; }
  .card h3 { margin: 0; font-size: 19px; font-weight: 700; }
  .card h4 { margin: 0; font-size: 16px; font-weight: 600; }
  .cardhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .note { margin: 0; color: var(--muted); font-size: 15px; }
  ul.notes { margin: 4px 0 8px; padding-left: 20px; color: var(--muted); font-size: 15px; }
  ul.notes li { margin: 2px 0; }
  .source { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 8px; }
  .source a { color: var(--muted); }
  .sec-h { margin: 8px 0 -4px; font-size: 15px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; background: var(--t, var(--s0-t)); color: var(--ink);
         border-radius: 8px; padding: 1px 8px; white-space: nowrap; }
  .tag::before { content: ''; width: 9px; height: 9px; background: var(--c, var(--s0)); flex: none; }
  .tag.c-risk::before { clip-path: polygon(50% 0, 100% 100%, 0 100%); width: 10px; height: 10px; }
  .tag.c-ops::before { border-radius: 2px; }
  .tag.c-ok::before { border-radius: 50%; }
  .tag.c-fin::before { border-radius: 50%; }
  .chip { font-size: 13px; background: var(--s0-t); color: var(--ink); border-radius: 8px; padding: 0 8px; line-height: 1.7; white-space: nowrap; }

  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items > li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
  ul.items > li:first-child { border-top: none; padding-top: 0; }
  .itext { font-weight: 600; overflow-wrap: anywhere; }
  .itext a { text-decoration: none; }
  .itext a:hover { text-decoration: underline; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--muted); font-size: 14px; }
  details > summary { cursor: pointer; font-weight: 600; font-size: 15px; min-height: 32px; }
  details[open] > summary { margin-bottom: 8px; }
  .more { color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .ent { gap: 6px; }
  .ent .who { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .ent .code { font-size: 18px; font-weight: 700; }
  .ent .full { font-size: 13px; color: var(--muted); text-align: right; overflow-wrap: anywhere; }
  .big { font-size: 34px; font-weight: 700; line-height: 1.15; }
  .big.neg { color: var(--risk-text); }
  .lbl { font-size: 14px; color: var(--muted); }
  .line { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; border-top: 1px solid var(--line); padding-top: 6px; }
  .line span:first-child { white-space: nowrap; }
  .line b { font-weight: 600; text-align: right; }
  .chart svg { display: block; width: 100%; height: auto; max-height: 260px; }
  .chart .ln { fill: none; stroke: var(--fin); stroke-width: 2.5; }
  .chart .zero { stroke: var(--risk-text); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart text { fill: var(--muted); font-size: 13px; font-family: inherit; }
  .chart .dry { fill: var(--risk-text); }
  .chart .now { fill: var(--fin); }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--t, var(--s0-t)); border-radius: 12px; padding: 10px 12px; border-left: 4px solid var(--c, var(--s0)); }
  .stat .num { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .stat .label { font-size: 14px; color: var(--muted); }
  .stat .sub { font-size: 13px; color: var(--muted); }
  .quiet { color: var(--muted); font-size: 15px; }

  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; border-top: none; }
  td.r, th.r { text-align: right; white-space: nowrap; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .bar { display: inline-block; height: 10px; border-radius: 3px; vertical-align: middle; }
  .bar.in { background: var(--ok); } .bar.out { background: var(--fin); }

  .subnav { display: flex; flex-wrap: wrap; gap: 8px; }
  .subnav a { padding: 6px 12px; border-radius: 12px; border: 1px solid var(--line); border-left: 4px solid var(--c, var(--s0)); background: var(--surface); text-decoration: none; font-size: 15px; min-height: 40px; display: inline-flex; align-items: center; }
  .subnav a[aria-current="page"] { font-weight: 700; background: var(--t, var(--s0-t)); border-color: var(--ink); border-left-color: var(--c, var(--s0)); }

  .banner { border-radius: 16px; padding: 12px 16px; border: 1px dashed var(--risk); background: var(--risk-t); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .banner.info { border-color: var(--line); background: var(--surface); }
  .banner p { margin: 0; flex: 1 1 200px; }
  .hidden { display: none !important; }
  footer { padding-bottom: 32px; }
  footer p { margin: 0; color: var(--muted); font-size: 14px; }
  @media (max-width: 520px) {
    body { font-size: 16px; }
    .big { font-size: 30px; }
    .card { padding: 12px 14px; }
    th, td { padding: 6px 4px; font-size: 14px; }
  }

  /* ---- Calm layer (Lisa, 20 Oct 2026): one corner, faint lines, no fills on selected, colour only on hover or for attention, nothing moves. ---- */
  :root { --radius: 12px; }
  .btn, .card, .pill, .chip, .tile, .note, input, select, textarea, details, summary, .panel, .keytile { border-radius: var(--radius); }
  nav.main a, .subnav a { border-radius: 999px; }
  nav.main a, nav.main a[aria-current="page"], .subnav a, .subnav a[aria-current="page"] { font-weight: 600; background: transparent; border-width: 1px; border-color: var(--line); }
  nav.main a:hover, nav.main a[aria-current="page"], .subnav a:hover, .subnav a[aria-current="page"], .btn:hover, a.keytile:hover { border-color: var(--muted); background: transparent; }
  .card, .card[class], nav.main a, nav.main a[class] { border-left-color: var(--line); box-shadow: none; }
  .card[class]:hover, nav.main a[class]:hover, nav.main a[class][aria-current="page"] { border-left-color: var(--slot, var(--c, var(--muted))); }
  .card.vision[class], nav.main a.vision[class] { background: var(--surface); }
  a { color: inherit; }
  .btn:active, nav.main a:active { transform: none; }
  .info { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border: 1px solid var(--line); border-radius: 50%; font-size: 12px; font-weight: 700; color: var(--muted); cursor: help; vertical-align: middle; }
  .info:hover { border-color: var(--muted); }

  /* One page width everywhere (Lisa, 20 Oct): the full window up to 1600px, 24px edge; phones 16px. No wasted space. */
  .wrap, .wrap.wide, .wide, .hin { max-width: 1600px; margin-left: auto; margin-right: auto; box-sizing: border-box; padding-left: 24px; padding-right: 24px; }
  @media (max-width: 600px) { .wrap, .wide, .hin { padding-left: 16px; padding-right: 16px; } }

  /* Fewer scrolls: on wide screens file lists use 2-3 columns. */
  @media (min-width: 900px) { ul.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 8px 12px; } ul.files > li { margin: 0; } }
</style>
</head>

<script>
(function () {
  'use strict';
  var M = window.MoneyCore;
  var CLIENT_ID = window.DASH_CONFIG.clientId;
  var SCOPE = window.DASH_CONFIG.scopes.read;
  var REFRESH_MS = 10 * 60 * 1000;
  var NOW_SHOW = 6, TURN_SHOW = 5, MORE = {};
  function listShown(key, total, step) {
    if (MORE[key] === 'all') return total;
    var n = typeof MORE[key] === 'number' ? MORE[key] : step;
    if (n < step) n = step;
    return Math.min(total, n);
  }
  function showBar(key, total, step) {
    var n = listShown(key, total, step);
    if (n >= total) return '';
    return '<div class="actions" data-show-bar="' + esc(key) + '"><p class="note">Showing ' + n + ' of ' + total + '.</p>' +
      '<button class="btn" type="button" data-action="showmore" data-list="' + esc(key) + '" data-step="' + step + '" data-total="' + total + '"><span>Show more</span></button>' +
      '<button class="btn" type="button" data-action="showall" data-list="' + esc(key) + '"><span>Show all</span></button></div>';
  }

  var accessToken = null, tokenExpiresAt = 0, timer = null;
  var signedIn = false, loading = false, R = null, err = null;
  var $ = function (id) { return document.getElementById(id); };
  var stampFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', hour12: false });
  var whenFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var gbp = M.gbp;
  function d(iso) { return esc(M.fmtDate(iso, R ? R.today : null)); }
  function tag(cls, text) { return '<span class="tag ' + cls + '">' + esc(text) + '</span>'; }
  function chip(text) { return '<span class="chip">' + esc(text) + '</span>'; }
  function ents(s) { return String(s || '').split(';').filter(Boolean).map(function (e) { return chip(e.trim()); }).join(''); }
  function src(name, m) {
    var bits = ['From ' + (m && m.file && m.file.webViewLink ? '<a href="' + esc(m.file.webViewLink) + '" target="_blank" rel="noopener">' + esc(name) + '</a>' : esc(name))];
    if (m && m.asOf) bits.push('data as of ' + d(m.asOf));
    if (m && m.error) bits.push('<b>' + esc(m.error) + '</b>');
    if (R) bits.push('read ' + esc(stampFmt.format(new Date(R.readAt))));
    return '<div class="source">' + bits.map(function (b) { return '<span>' + b + '</span>'; }).join('') + '</div>';
  }
  function meta(k) { return R && R.meta[k] || null; }
  function emoney(code) { return R ? R.money.filter(function (m) { return m.code === code; })[0] : null; }
  function efile(code, k) { return R && R.files[code] && R.files[code][k] || null; }
  function ago(days) { return days === 0 ? 'today' : days === 1 ? '1 day old' : days + ' days old'; }
  function levelCls(l) { return l === 'risk' ? 'c-risk' : l === 'ops' ? 'c-ops' : l === 'ok' ? 'c-ok' : 'c-fin'; }

  // ---- Shared bits ----
  function dryLine(m) {
    if (!m.dryState) return '';
    if (m.dryState === 'stale') return '<div class="line"><span>Runs dry</span><b>' + tag('c-ops', 'Stale') + ' <span class="lbl">said ' + d(m.dry) + '</span></b></div>';
    if (m.dryState === 'dry') return '<div class="line"><span>Runs dry</span><b>' + tag(m.dryDays <= 30 ? 'c-risk' : 'c-ops', d(m.dry)) + '</b></div>';
    if (m.dryState === 'stale-ok') return '<div class="line"><span>Runs dry</span><b>' + tag('c-ops', 'Stale') + ' <span class="lbl">ended ' + d(m.forecastTo) + '</span></b></div>';
    return '<div class="line"><span>Runs dry</span><b>' + tag('c-ok', 'Not before ' + d(m.forecastTo)) + '</b></div>';
  }
  function entCard(m) {
    var bad = (m.liab && m.liab.overdue.length) || (m.dryState === 'dry' && m.dryDays <= 30) || (m.bank != null && m.bank < 0);
    var h = '<a class="card ent ' + (bad ? 'c-risk' : 'c-fin') + '" href="#/e/' + esc(m.code) + '" style="text-decoration:none">';
    h += '<div class="who"><span class="code">' + esc(m.code) + '</span><span class="full">' + esc(m.name !== m.code ? m.name : (m.company ? 'Business' : 'Personal')) + '</span></div>';
    if (m.bank != null) {
      h += '<div class="big' + (m.bank < 0 ? ' neg' : '') + '">' + gbp(m.bank) + '</div>';
      h += '<div class="lbl">In the bank · ' + d(m.bankAsOf) + ' ' + (m.bankStale ? tag('c-ops', ago(m.bankAge)) : '') + '</div>';
      if (m.unknownAccounts && m.unknownAccounts.length) h += '<div class="lbl">Plus ' + m.unknownAccounts.length + ' account(s) with no balance yet</div>';
    } else {
      h += '<div class="big" style="color:var(--muted)">–</div><div class="lbl">No bank statement yet</div>';
    }
    if (m.out30 != null) h += '<div class="line"><span>Due out, next 30 days</span><b>' + gbp(m.out30) + '</b></div>';
    h += dryLine(m);
    if (m.xcash && m.xcash.v != null) h += '<div class="line"><span>Xero cash · ' + d(m.xcash.at) + '</span><b>' + gbp(m.xcash.v) + '</b></div>';
    if (m.bills) h += '<div class="line"><span>Unpaid bills in Xero</span><b>' + gbp(m.bills.total) + '</b></div>';
    if (m.liab) {

      '<div class="stats">' + stats.map(function (s) { return '<div class="stat ' + s[0] + '"><div class="num">' + esc(s[1]) + '</div><div class="label">' + esc(s[2]) + '</div><div class="sub">' + esc(s[3]) + '</div></div>'; }).join('') + '</div>' +

  // Forecast line chart (F5): projected balance from FORECAST.csv, zero line in Risk, "runs dry" marked.
  // Plain SVG, no library. The numbers are also in the label, and the table stays in the file.
  function forecastChart(m, pts) {
    if (pts.length < 2) return '';

    e.preventDefault();
    var m = document.getElementById(k.getAttribute('data-skip'));
    if (m) { m.setAttribute('tabindex', '-1'); m.focus(); }
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t || t.disabled) return;
    var a = t.getAttribute('data-action');
    if (a === 'signin') auth.requestInteractive({ login_hint: M.CFG.owner });
    else if (a === 'signout') signOut();
    else if (a === 'refresh') load();
    else if (a === 'showmore') {
      var key = t.getAttribute('data-list');
      var step = parseInt(t.getAttribute('data-step'), 10) || NOW_SHOW;
      var total = parseInt(t.getAttribute('data-total'), 10) || step;
      var cur = listShown(key, total, step);
      var next = Math.min(total, cur + step);
      MORE[key] = next >= total ? 'all' : next;
      render();
    }
    else if (a === 'showall') { MORE[t.getAttribute('data-list')] = 'all'; render(); }
  });
  var restored = restoreShared();
  render();
  if (restored) { startTimer(); load(); }
  // Another tab signed in, refreshed the token, or signed out.
  DashAuth.onChange(function (saved) {
    if (!saved || !DashAuth.hasScope(saved, SCOPE)) { if (signedIn) signOut(true); return; }
    var wasIn = signedIn && accessToken;
    restoreShared();
    clearBanner();
    if (!wasIn) { startTimer(); load(); } else render();
  });
  var tries = 0;
  (function wait() {
    if (initGoogle()) return;
    if (++tries > 100) { $('signInBtn').querySelector('span').textContent = 'Sign-in unavailable'; banner('Google sign-in did not load.', false, false); return; }
    setTimeout(wait, 100);
  })();
})();
</script>

<script>
/* Calm: every help bullet list (ul.notes) becomes one (i); its words show on hover or tap. */
(function () {
  function calm() {
    document.querySelectorAll('ul.notes:not([data-calm])').forEach(function (ul) {
      var t = Array.prototype.map.call(ul.querySelectorAll('li'), function (li) { return li.textContent.trim(); }).join(' · ');
      var s = document.createElement('span'); s.className = 'info'; s.title = t; s.setAttribute('aria-label', t); s.setAttribute('tabindex', '0'); s.textContent = 'i';
      ul.setAttribute('data-calm', '1'); ul.replaceWith(s);
    });
  }
  new MutationObserver(calm).observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener('DOMContentLoaded', calm); calm();
})();
</script>
