<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<title>GA Hub</title>
<!-- GA Hub v1 (26 Oct 2026): Designer Dog Foods orders, GA invoices, products and GA details. PUBLIC repo: no data, no secrets.
     The workbook id comes from ../config.js (DASH_CONFIG.food); everything else is read at run time with Lisa's Google sign-in
     from the RR_FOOD workbook, which the RR_FOOD-ENGINE Apps Script fills. A tap writes ONLY the 4 answer cells (G:J) of one
     Cards row; the engine applies it after 10 minutes. Same shapes and tabs bar as Marketplace. -->
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap">
<script src="../config.js"></script>
<script src="../toolkit.js"></script>
<script src="../auth.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../house.css">
<style>
  /* House look (LINKS-COMFORT-BRIEF v3, 28 Oct 2026). Colours: ../tokens.css only, mixed here; no colour is written on this page.
     Warm clear (default) or Cool clear, each with a dark version. Lexend 400/600, nothing under 13px, line height 1.5.
     Every line is 1px. Hover and selected = the same 1px edge turns ink (outline over it): nothing moves or grows. ONE radius, 12px.
     No solid colour fills and no coloured words: colour lives only in dots, thin bars, 1px rings and light tints. */
  /* Greys, lines, frame, radius, the control line, counts, date pills, tabs and the hover rule come from ../tokens.css through
     ../house.css, the same on every hub; the Look (Warm / Cool clear, Light / Dark / Device) is applied by ../toolkit.js.
     GA Hub's own names: the meaning rings and tints (words stay ink). */
  :root { --rose: var(--house-risk); --rose-tint: var(--house-risk-tint); --amber: var(--house-soon); --amber-tint: var(--house-soon-tint);
    --green: var(--house-ok); --green-tint: var(--house-ok-tint); }
  * { box-sizing: border-box; }
  h1, h2, h3, b, strong { font-weight: 600; }   /* two weights only: 400 and 600 */
  html { scroll-padding-bottom: 110px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Lexend, system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  a.btn, nav.tabs a, a.tile { text-decoration: none; }
  .hidden { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--ljr-0)); flex: none; display: inline-block; }   /* the only round thing */
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

  /* Frame: dark top bar and dark bottom tab bar around a light work area. */
  header { position: sticky; top: 0; z-index: 5; background: var(--frame); color: var(--frame-ink); }
  .top { max-width: 980px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; }
  .top h1 { font-size: 22px; margin: 0 auto 0 0; }
  .top h1 a { color: inherit; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
  .stamp { display: inline-flex; align-items: center; height: 24px; font-size: 13px; font-weight: 600; border: 1px solid var(--frame-line); border-radius: var(--radius); padding: 0 8px; }
  .stamp:empty { display: none; }
  .top .btn { color: var(--frame-ink); background: transparent; border-color: var(--frame-line); }   /* the frame's own clear line (3:1 on the dark bar) */
  @media (hover: hover) { .top .btn:hover { outline-color: var(--frame-ink); background: color-mix(in srgb, var(--frame-ink) 14%, var(--frame)); } }

  /* Things you press, the hover rule (meaning colour = --hmc), focus, the bottom tabs and the counts: ../house.css. Layout only here. */
  .btn.big { width: 100%; justify-content: center; min-height: 44px; }
  .chip { padding: 0 14px; background: var(--surface); display: inline-flex; align-items: center; }
  .more { background: transparent; padding: 0 14px; align-self: flex-start; }
  @media (hover: hover) { a.tile:hover { outline: 1px solid var(--sel-bd); outline-offset: -1px; background: var(--sel-fill); } }
  input:focus { outline: none; }
  a:focus, button:focus { outline: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }   /* keyboard ring: 2px ink, never the browser blue */
  .top :focus-visible { outline-color: var(--frame-ink); }

  /* Bottom tabs (.house-tabs): five across. */
  nav.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding: 8px 8px calc(10px + env(safe-area-inset-bottom, 0px)); }
  @media (min-width: 601px) { nav.tabs { padding-left: 24px; padding-right: 24px; grid-template-columns: repeat(5, minmax(0, 180px)); justify-content: center; } }
  @media (min-width: 601px) { nav.tabs a { min-height: 58px; gap: 3px; padding: 6px 2px; } }
  nav.tabs .n { top: 6px; right: 10px; }
  .cnt.ok { border-color: var(--green); background: var(--green-tint); }

  main.wrap { padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 12px; }
  #view { display: flex; flex-direction: column; gap: 12px; }   /* one 12px step: tiles, cards and lists never touch */
  .growth { display: flex; flex-direction: column; gap: 12px; }   /* Grow orders leads the Home, same 12px step */
  .tile .m { font-size: 13px; color: var(--muted); }
  .banner { border: 1px solid var(--rose); border-radius: var(--radius); padding: 10px 14px; background: var(--rose-tint); color: var(--ink); }
  .banner.info { border-color: var(--ctl); background: var(--surface); }
  .needs { font-size: 26px; font-weight: 600; margin: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .hint { font-size: 14px; color: var(--muted); margin: 0; }

  /* Summary strip: big numbers, a ring + tint only where something needs you. */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 760px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .tile { font: inherit; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; color: var(--ink); min-height: 84px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
  a.tile { border-color: var(--ctl); }   /* a tile you can press rests on the control line */
  .tile .k { font-size: 14px; color: var(--muted); }
  .tile .v { font-size: 24px; font-weight: 600; overflow-wrap: anywhere; align-self: flex-start; line-height: 1.3; }
  .tile .v.red { border: 1px solid var(--rose); background: var(--rose-tint); border-radius: var(--radius); padding: 0 10px; }
  .tile .datep { align-self: flex-start; }
  /* A date pill: its RING shows urgency (rose = late, amber = soon). The words stay ink. */
  .datep { font-weight: 600; } /* the house date pill (../house.css): always ringed; rose late, amber soon */

  /* Cards: a name line (dot + what kind), then the title (2 lines, then …). */
  .card { display: flex; flex-direction: column; gap: 12px; } /* the house card (../house.css): 1px line, 12px inside */
  .card.next { border-color: var(--ink); }   /* Next: the one thing to do now; white with a 1px ink edge */
  .bline { display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 -8px; }
  .bline .dot { width: 8px; height: 8px; }
  .card h2 { font-size: 17px; margin: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .card .what { color: var(--muted); font-size: 15px; margin: 0; }
  .card .what b { color: var(--ink); }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .acts .btn { flex: 1; justify-content: center; }
  .empty { display: flex; gap: 12px; align-items: center; margin: 0; font-size: 15px; }
  .empty::before { content: "\2713"; flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--green); background: var(--green-tint); color: var(--ink); font-size: 13px; font-weight: 600; }
  .empty b { font-size: 16px; }
  .empty .es { display: block; color: var(--muted); font-size: 14px; }

  /* Calm rows: title, one flag, date, one action; 1px lines between rows, 16px under a header line. */
  .row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .card > .row:first-of-type { border-top: 0; padding-top: 4px; }
  .row .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .row .m { font-size: 14px; color: var(--muted); }
  .row .amt { font-weight: 600; text-align: right; white-space: nowrap; font-size: 15px; }
  .row .amt.red, .row .amt.good { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border: 1px solid var(--ctl); border-radius: var(--radius); font-size: 13px; }
  .row .amt.red { border-color: var(--rose); background: var(--rose-tint); }
  .row .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .row .links .btn { font-size: 14px; padding: 0 12px; }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .badge { display: inline-flex; align-items: center; height: 24px; font-size: 13px; font-weight: 400; border: 1px solid var(--ctl); border-radius: var(--radius); padding: 0 8px; background: transparent; white-space: nowrap; color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .badge b { margin-right: 4px; }
  .badge.no { border-color: var(--rose); background: var(--rose-tint); }
  .grp { font-size: 16px; font-weight: 600; margin: 4px 0 0; display: flex; gap: 8px; align-items: center; }
  .grp .cnt { margin-left: auto; }
  .sent { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .frow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }   /* one filter row: Search, then the choices */
  input.txtin { font: inherit; font-size: 16px; padding: 0 12px; min-height: 36px; border-radius: var(--radius); border: 1px solid var(--ctl); background: var(--surface); color: var(--ink); flex: 1 1 240px; min-width: 0; max-width: 420px; }
  input.txtin:focus { border-color: var(--ink); }
  input.txtin::placeholder { color: var(--muted); opacity: 1; }

  /* Phone: 44px targets; the tab count sits in flow next to the icon, the label on its own line. */
  @media (max-width: 544px) {
    .btn, .chip, .more, input.txtin { min-height: 44px; }
    input.txtin { flex: 1 1 160px; max-width: none; }   /* Search and Filter share one calm row */
    .top h1 { font-size: 20px; }
    nav.tabs { gap: 6px; padding-left: 6px; padding-right: 6px; }
  }
  /* Keyboard focus always stays the 2px ink ring, over any hover or selected line. */
  #view :focus-visible, nav.tabs a:focus-visible { outline: 2px solid var(--ink) !important; outline-offset: 2px !important; }
  header :focus-visible { outline: 2px solid var(--frame-ink) !important; outline-offset: 2px !important; }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<header>
  <div class="top"><h1><a href="#/home"><span class="dot" style="--c:var(--ljr-4)" aria-hidden="true"></span>GA Hub</a></h1><span class="stamp" id="stamp">TEST</span>
    <button class="btn hidden" type="button" data-action="refresh" aria-label="Refresh" id="refresh">↻</button>
    <button class="btn" type="button" data-action="signin" id="signin">Sign in</button>
    <a id="backHome" class="btn back" href="../" data-back-home aria-label="Dashboard home">← Dashboard</a></div>

  <div id="banner" class="banner hidden" role="status"></div>

</main>
<nav class="tabs house-tabs hidden" id="tabs" aria-label="GA Hub sections">
  <a href="#/home" data-nav="home" style="--tc:var(--ljr-4)"><span class="bar" aria-hidden="true"></span><svg class="i" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span><span class="n need" id="n-home"></span></a>
  <a href="#/orders" data-nav="orders" style="--tc:var(--ljr-6)"><span class="bar" aria-hidden="true"></span><svg class="i" aria-hidden="true"><use href="#i-box"/></svg><span>Orders</span><span class="n need" id="n-orders"></span></a>
  <a href="#/invoices" data-nav="invoices" style="--tc:var(--ljr-3)"><span class="bar" aria-hidden="true"></span><svg class="i" aria-hidden="true"><use href="#i-bill"/></svg><span>Invoices</span><span class="n"></span></a>
  <a href="#/products" data-nav="products" style="--tc:var(--ljr-5)"><span class="bar" aria-hidden="true"></span><svg class="i" aria-hidden="true"><use href="#i-bag"/></svg><span>Products</span><span class="n"></span></a>
  <a href="#/ga" data-nav="ga" style="--tc:var(--ljr-7)"><span class="bar" aria-hidden="true"></span><svg class="i" aria-hidden="true"><use href="#i-info"/></svg><span>GA</span><span class="n"></span></a>

<script>
(function () {
  'use strict';
  var CFG = window.DASH_CONFIG || {}, F = CFG.food || null;
  var CLIENT_ID = CFG.clientId, READ = (CFG.scopes || {}).read, SHEETS = 'https://www.googleapis.com/auth/spreadsheets';
  var SCOPE = READ + ' ' + SHEETS;
  var CARD_COLS = ['key', 'section', 'category', 'title', 'detail', 'created_at', 'answer', 'note', 'answered_at', 'answered_by', 'applied_at', 'applied_by'];
  var RANGES = ['Cards!A2:L', 'Orders!A1:AK', 'Invoices!A1:P', 'Products!A2:AE', 'Settings!A1:C', 'Statements!A1:E', 'DirectDebits!A1:G', 'Codes!A1:F'];
  var UNDO_MS = 10 * 60000, APPLY_MS = 11 * 60000;
  var SECTIONS = {
    price: { name: 'GA price changed', yes: 'Apply', no: 'Not now', what: 'Apply updates your product list and the suggested shop and subscription prices. Shops are not changed.' },
    profit: { name: 'Low profit', yes: 'Seen', what: 'This order made less than your minimum. Usually a single bag in one box.' },
    pricelist: { name: 'New GA price list', yes: 'Seen', what: 'Saved to Drive. Rises are also caught from the next GA invoice.' },
    check: { name: 'Check', yes: 'Done', what: 'Something the engine could not finish on its own.' },
    send: { name: 'Send to GA?', yes: 'Send', no: 'Not now', what: 'Send sends this order to GA by XML within about 10 minutes. Not now leaves it for you to enter on the Portal.' },
    pack: { name: 'Pack at home', yes: 'Packed', what: 'Fish Treats you send yourself: Parcel2Go for 1-2 units, InPost for 3-4.' },
    alert: { name: 'Engine problem', yes: 'Seen', what: 'The food engine hit a problem. It keeps trying every 15 minutes.' }
  };
  var token = null, me = '', data = { cards: [], orders: [], invoices: [], products: [], settings: {}, statements: [], dds: [], codes: [] }, view = 'home', filter = 'sale', q = '', showAll = false;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function banner(t, info) { var b = $('banner'); b.textContent = t; b.className = 'banner' + (info ? ' info' : ''); }
  function hm(ms) { return new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
  function num(v) { var n = Number(String(v === undefined ? '' : v).replace(/[£,]/g, '')); return isFinite(n) ? n : 0; }
  function fyStartYmd() { var m = num(setting('FY_START_MONTH')) || 4, d = new Date(), y = d.getMonth() + 1 >= m ? d.getFullYear() : d.getFullYear() - 1; return y + '-' + String(m).padStart(2, '0') + '-01'; }
  function money(v) { return v === '' || v === undefined || v === null ? '' : '£' + num(v).toFixed(2); }
  function ukDate(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? m[3] + '/' + m[2] + '/' + m[1] : String(s || ''); }
  function detail(r) { try { return JSON.parse(r.detail || '{}'); } catch (e) { return {}; } }
  // A tab read with its header row: values[0] is the header, the rest become objects keyed by it.
  function table(values, skip) { var v = (values || []).slice(skip || 0), h = (v[0] || []).map(String);
    return v.slice(1).filter(function (r) { return r.some(String); }).map(function (r) { var o = {}; h.forEach(function (c, i) { o[c] = r[i] === undefined ? '' : r[i]; }); return o; }); }
  function setting(k) { return (data.settings[k] || {}).value || ''; }
  // Low-profit line: MIN_PROFIT on the Settings tab; £8 when the cell is blank (Lisa, 30 Oct 2026).
  function minProfit() { return num(setting('MIN_PROFIT')) || 8; }
  // Shop orders paid between `from` and `to` days ago (cancelled ones left out), from placed_at on the Orders tab.
  function ordersBetween(from, to) { var now = Date.now();
    return data.orders.filter(function (o) { var t = Date.parse(o.placed_at); return o.status !== 'Cancelled' && isFinite(t) && t <= now - from * 864e5 && t > now - to * 864e5; }); }

  /* ---------- Google Sheets ---------- */
  function api(url, init) {
    init = init || {}; init.headers = Object.assign({ Authorization: 'Bearer ' + token }, init.headers || {});
    return fetch(url, init).then(function (r) {
      if (r.status === 401) { token = null; render(); throw new Error('Sign-in expired. Sign in again.'); }
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) { throw new Error(why(r.status, (j.error && j.error.message) || '')); });
      return r.json();
    });
  }
  function why(status, msg) {
    if (/insufficient|scope/i.test(msg)) return 'Google did not give this page spreadsheet access. Sign out, sign in again and tick every box Google shows.';
    if (/permission|forbidden|caller does not have/i.test(msg)) return 'this Google account cannot open the RR_FOOD workbook. Sign in as lisa@puppyclassroom.com.';
    if (/Unable to parse range/i.test(msg)) return 'the RR_FOOD workbook is missing a tab. Run "setup" once in the food engine.';
    return 'Google said ' + status + (msg ? ': ' + msg : '');
  }
  function base() { return 'https://sheets.googleapis.com/v4/spreadsheets/' + F.bookId + '/values'; }
  function load() {
    if (!F || !F.bookId) { banner('Not set up yet: the GA Hub settings are not in config.js.', true); return; }
    if (!token) { render(); return; }
    api(base() + ':batchGet?' + RANGES.map(function (r) { return 'ranges=' + encodeURIComponent(r); }).join('&')).then(function (j) {
      var vr = (j.valueRanges || []).map(function (x) { return x.values || []; });
      data.cards = (vr[0] || []).map(function (v, i) { var o = { _row: i + 2 }; CARD_COLS.forEach(function (c, k) { o[c] = v[k] || ''; }); return o; });
      data.orders = table(vr[1]); data.invoices = table(vr[2]); data.products = table(vr[3]);
      data.settings = {}; table(vr[4]).forEach(function (s) { data.settings[s.key] = s; });
      data.statements = table(vr[5]).sort(function (a, b) { return String(b.statement_date).localeCompare(String(a.statement_date)); });
      data.codes = table(vr[7]).filter(function (c) { return String(c.active).toUpperCase() !== 'N'; });
      data.dds = table(vr[6]).sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
      $('banner').className = 'banner hidden'; render();
    }).catch(function (e) { banner('Could not load: ' + e.message); });
    if (!me) api('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)').then(function (j) { me = (j.user && j.user.emailAddress) || ''; }).catch(function () {});
  }
  // Write the 4 answer cells of the card with this key; check the key before and after, put the old values back if it moved.
  function answer(r, value) {
    var url = function (rng) { return base() + '/' + encodeURIComponent(rng); }, at = value === '' ? '' : new Date().toISOString(), who = value === '' ? '' : me;
    var put = function (vals) { return api(url('Cards!G' + r._row + ':J' + r._row) + '?valueInputOption=RAW', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ values: [vals] }) }); };
    return api(url('Cards!A' + r._row + ':L' + r._row)).then(function (j) {
      var cur = (j.values || [[]])[0];
      if (cur[0] !== r.key) throw new Error('the list changed: refresh and tap again');
      var old = [cur[6] || '', cur[7] || '', cur[8] || '', cur[9] || ''];
      return put([value, '', at, who]).then(function () { return api(url('Cards!A' + r._row)); })
        .then(function (k) { if (((k.values || [[]])[0] || [])[0] !== r.key) return put(old).then(function () { throw new Error('the list changed: refresh and tap again'); }); })
        .then(function () { r.answer = value; r.answered_at = at; r.answered_by = who; render(); });
    }).catch(function (e) { banner('Not saved: ' + e.message); });
  }

  /* ---------- views ---------- */
  function waiting() { return data.cards.filter(function (r) { return !r.answer && !r.applied_at; }); }
  var ORDER = ['alert', 'price', 'profit', 'check', 'pricelist'];
  function byUrgency(a, b) { return ORDER.indexOf(a.section) - ORDER.indexOf(b.section) || String(a.created_at).localeCompare(String(b.created_at)); }

      return '<div class="row"><div class="txt"><b>' + esc(o.vat_inv_no || 'Not made yet') + '</b> · order #' + esc(o.order_no) + '<div class="m">' + esc(st.indexOf(':') > 0 ? (VAT_HELD[st.slice(st.indexOf(':') + 1).trim()] || st.slice(st.indexOf(':') + 1).trim()) : ukDate(o.vat_inv_at)) + '</div>' +
        '<div class="badges"><span class="badge' + (c[1] ? ' ' + c[1] : '') + '">' + esc(c[0]) + '</span></div></div>' +
        (o.vat_inv_file_id ? '<a class="btn" href="https://drive.google.com/file/d/' + esc(o.vat_inv_file_id) + '/view" target="_blank" rel="noopener" aria-label="Open ' + esc(o.vat_inv_no) + '">Open</a>' : '') + '</div>'; }).join('') + '</div>' +
      '<p class="hint">' + (waiting ? waiting + ' ticked order' + (waiting > 1 ? 's' : '') + ' waiting (dry run or held). ' : '') + 'Drafts wait in Gmail for you to read and send.</p>';
  }
  var FILTERS = [['sale', 'On sale'], ['eligible', 'Could add'], ['cat', 'Cat'], ['not', 'Not DDF'], ['all', 'All']];
  function inFilter(p) { var s = String(p.ddf_status || '');
    return filter === 'all' || (filter === 'sale' && /^ON SALE/.test(s)) || (filter === 'eligible' && /ELIGIBLE/.test(s)) || (filter === 'cat' && /^CAT/.test(s)) || (filter === 'not' && /^Not DDF|^CHECK/.test(s)); }
  // Picture badges: who it is for, grain, chicken, and the key facts from the GA data sheet.
  function badges(p) {
    var b = [], g = String(p.grain || ''), pct = function (v) { var n = num(v); return n ? Math.round(n <= 1 ? n * 100 : n) + '%' : ''; };
    b.push([(p.species === 'Cat' ? '🐱 ' : '🐶 ') + (p.life_stage || p.species || ''), '']);
    b.push(/^grain free/i.test(g) ? ['🌾🚫 Grain free', ''] : /grain|rice/i.test(g) ? ['🌾 Has grain', 'no'] : ['🌾 Grain: check', 'no']);
    if (p.chicken_in_name === 'Y') b.push(['🐔 Chicken', 'no']);
    if (pct(p.fresh_meat_pct)) b.push(['🥩 ' + pct(p.fresh_meat_pct) + ' meat', '']);
    if (pct(p.protein_pct)) b.push(['💪 ' + pct(p.protein_pct) + ' protein', '']);
    if (p.kibble) b.push(['⚪ ' + p.kibble, '']);
    return '<div class="badges">' + b.map(function (x) { return '<span class="badge' + (x[1] ? ' ' + x[1] : '') + '">' + esc(x[0]) + '</span>'; }).join('') + '</div>';
  }
  function pageProducts() {
    var list = data.products.filter(inFilter).filter(function (p) { return !q || [p.ddf_name, p.recipe, p.tla, p.full_ga_code, p.range].join(' ').toLowerCase().indexOf(q) >= 0; });
    var h = '<p class="needs">Products</p><p class="hint">Every GA recipe and size, by range: GA cost, your price and profit for one bag in one box. A rose ring on a badge shows why one can\'t be DDF.</p>' +
      '<div class="frow"><input class="txtin" type="search" placeholder="Find a recipe, name or code" aria-label="Find a product" data-find value="' + esc(q) + '">' + DashKit.filterButton('pfilters', filter !== FILTERS[0][0] ? 1 : 0) +
      '<div class="chips house-filters" id="pfilters" role="group" aria-label="Which products">' + FILTERS.map(function (f) { return '<button class="chip" type="button" data-filter="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + '</button>'; }).join('') + '</div></div>';
    if (!list.length) return h + '<div class="card">' + empty(q ? 'No products match "' + q + '"' : 'No products here', 'Try All, or a shorter search.') + '</div>';
    var shown = showAll ? list : list.slice(0, 40), min = minProfit(), groups = [], by = {};
    shown.forEach(function (p) { var r = p.range && p.range !== '(price list only)' ? p.range : 'Price list only (not on the Portal)'; if (!by[r]) { by[r] = []; groups.push(r); } by[r].push(p); });
    groups.forEach(function (g) {
      h += '<p class="grp">' + esc(g) + '<span class="sr"> · </span><span class="cnt' + wide(by[g].length) + '">' + by[g].length + '</span></p><div class="card">' + by[g].map(function (p) { var pr = p.profit_ex_vat_1bag_1box;
        return '<div class="row"><div class="txt"><b>' + esc(p.ddf_name || p.recipe) + '</b> · ' + esc(p.pack) + '<div class="m">' + esc([p.ddf_name ? p.recipe : '', p.full_ga_code || p.tla, 'GA ' + money(p.ga_price_ex_vat_portal_oct26 || p.ga_price_ex_vat_list_aug25), p.shopify_price_inc_vat ? 'shop ' + money(p.shopify_price_inc_vat) : '', p.subscription_price_inc_vat ? 'sub ' + money(p.subscription_price_inc_vat) : ''].filter(Boolean).join(' · ')) + '</div>' +
          badges(p) + (/ELIGIBLE|CHECK/.test(p.ddf_status) ? '<div class="m">' + esc(p.ddf_status) + '</div>' : '') +
          (/^https:\/\//.test(p.data_sheet_url) ? '<div class="links"><a class="btn" href="' + esc(p.data_sheet_url) + '" target="_blank" rel="noopener">📄 Data sheet</a></div>' : '') + '</div>' +
          '<div class="amt ' + (pr === '' ? '' : num(pr) < min ? 'red' : 'good') + '">' + (pr === '' ? '' : money(pr)) + '</div></div>'; }).join('') + '</div>'; });
    if (list.length > 40 && !showAll) h += '<button class="more" type="button" data-action="all">Show all ' + list.length + '</button>';
    return h;
  }
  function mailLink(s) { return String(s).replace(/([\w.+-]+@[\w-]+(?:\.[\w-]+)+)/g, function (m) { return '<a href="mailto:' + m + '">' + m + '</a>'; }); }
  function telLink(s) { return String(s).replace(/(\+?\d[\d ]{8,}\d)/g, function (n) { return '<a href="tel:' + n.replace(/\s/g, '') + '">' + n + '</a>'; }); }
  function pageGa() {
    var rows = [['Account code', 'GA_ACCOUNT_CODE', 'copy'], ['Partner portal', 'GA_PORTAL', 'link'], ['Order enquiries', 'GA_PHONE_ORDERS', 'tel'], ['Accounts', 'GA_PHONE_ACCOUNTS', 'tel'],
      ['Partner manager', 'GA_PARTNER_MANAGER', 'tel'], ['Field manager', 'GA_FIELD_MANAGER', 'tel'], ['Payment terms', 'GA_TERMS'], ['Order cut-off', 'GA_CUTOFF'],
      ['Delivery, first box', 'DELIVERY_FIRST_BOX', 'money'], ['Delivery, each extra box', 'DELIVERY_NEXT_BOX', 'money'], ['Highlands, islands, Jersey', 'GA_DELIVERY_ZONE_C'], ['Pallet', 'GA_PALLET'],
      ['XML orders go to', 'GA_ORDER_TO', 'mail'], ['XML contact', 'GA_XML_CONTACT', 'mail'], ['We send XML orders from', 'GA_ORDER_FROM', 'mail'],
      ['Shipping reports come from', 'GA_SHIP_FROM', 'mail'], ['Invoices come from', 'GA_INVOICE_FROM', 'mail'], ['Commercial invoices (Jersey) to', 'COMMERCIAL_INVOICE_TO', 'mail'],
      ['Minimum profit per order', 'MIN_PROFIT', 'money'], ['Subscription discount', 'SUB_DISCOUNT', 'money']];
    var h = '<p class="needs">GA</p><p class="hint">GA Pet Food Partners: makes and ships the food. Change these on the Settings tab of RR_FOOD.</p><div class="card">';
    rows.forEach(function (r) { var v = setting(r[1]); if (!v) return;
      var shown = r[2] === 'link' ? '<a href="' + esc(v) + '" target="_blank" rel="noopener">' + esc(v.replace(/^https?:\/\//, '')) + '</a>' : r[2] === 'tel' ? telLink(mailLink(esc(v))) : r[2] === 'mail' ? mailLink(esc(v)) : r[2] === 'money' ? money(v) : esc(v);
      h += '<div class="row"><div class="txt"><div class="m">' + esc(r[0]) + '</div>' + shown + '</div>' + (r[2] === 'copy' ? '<button class="btn" type="button" data-copy="' + esc(v) + '">Copy</button>' : '') + '</div>'; });
    h += '</div>';
    if (data.codes.length) {
      var kinds = [['brand', 'Brand'], ['channel', 'Code for where it was sold (means nothing to customers)'], ['partner_type', 'Partner type (+ 2 digits, e.g. R01)'], ['partner', 'Partners'], ['suffix', 'Ending (+ a number)']];
      h += '<p class="grp">Order reference on the GA Portal</p><div class="card"><p class="what"><b>Customers see this reference</b>, so only the brand is readable. Type <b>BRAND-CODE-NUMBER</b>, e.g. <b>DDF-KQ-1234</b>. A plain number (5375) is a DDF Shopify order; PC-1001 is a Puppy Classroom Shopify order. Wholesale adds the partner: DDF-TB-R01-0007. A resend adds -R1.</p>' +
        kinds.map(function (k) { var list = data.codes.filter(function (c) { return c.kind === k[0]; }); if (!list.length) return '';
          return '<div class="row"><div class="txt"><div class="m">' + esc(k[1]) + '</div><div class="badges">' + list.map(function (c) { return '<span class="badge"><b>' + esc(c.code) + '</b> ' + esc(c.name) + '</span>'; }).join('') + '</div></div></div>'; }).join('') +
        '<p class="hint">Add a brand, shop or partner on the Codes tab of RR_FOOD. An unknown code on the Portal turns into a red card.</p></div>';
    }
    return h;
  }
  function render() {
    $('signin').textContent = token ? 'Sign out' : 'Sign in'; $('signin').setAttribute('data-action', token ? 'signout' : 'signin');
    $('tabs').classList.toggle('hidden', !token); $('refresh').classList.toggle('hidden', !token);
    document.querySelectorAll('nav.tabs a').forEach(function (a) { if (a.getAttribute('data-nav') === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    var n = waiting().length; $('n-home').textContent = n || ''; $('n-home').classList.toggle('wide', n >= 100);
    var look = data.orders.filter(needsLook).length; $('n-orders').textContent = look || ''; $('n-orders').classList.toggle('wide', look >= 100);   // orders that need a look, on every page
    $('stamp').textContent = F && F.live ? '' : 'TEST';
    var ready = typeof auth !== 'undefined' && auth.ready();
    $('signin').disabled = !token && !ready;
    if (!token) { $('view').innerHTML = '<div class="card"><h2>Sign in to see the GA Hub</h2><button class="btn main big" type="button" data-action="signin"' + (ready ? '' : ' disabled') + '>Sign in</button></div>'; return; }
    $('view').innerHTML = view === 'orders' ? pageOrders() : view === 'invoices' ? pageInvoices() : view === 'products' ? pageProducts() : view === 'ga' ? pageGa() : pageHome();
  }

  /* ---------- taps ---------- */
  function find(key) { return data.cards.filter(function (r) { return r.key === key; })[0]; }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, a'); if (!t) return;
    var a = t.getAttribute('data-action');
    if (a === 'signin') { if (!auth.ready()) return banner('Google sign-in is still loading. Try again in a moment.'); return auth.requestInteractive({ login_hint: 'lisa@puppyclassroom.com' }); }
    if (a === 'signout') { token = null; DashAuth.clear(); data = { cards: [], orders: [], invoices: [], products: [], settings: {}, statements: [], dds: [], codes: [] }; return render(); }
    if (a === 'refresh') return load();
    if (a === 'reorder') { var ro = $('reorder'); if (ro) ro.scrollIntoView({ block: 'start' }); return; }
    if (a === 'all') { showAll = !showAll; return render(); }
    if (t.hasAttribute('data-ofilter')) { ofilter = t.getAttribute('data-ofilter'); showAll = false; return render(); }
    if (t.hasAttribute('data-filter')) { filter = t.getAttribute('data-filter'); showAll = false; return render(); }
    if (t.hasAttribute('data-ans')) { var r = find(t.getAttribute('data-ans')); t.disabled = true; return answer(r, t.getAttribute('data-v')); }
    if (t.hasAttribute('data-undo')) { var u = find(t.getAttribute('data-undo')); if (Date.now() < Date.parse(u.answered_at) + UNDO_MS) answer(u, ''); return; }
    if (t.hasAttribute('data-copy')) { navigator.clipboard.writeText(t.getAttribute('data-copy')).then(function () { t.textContent = 'Copied'; }); return; }
  });
  document.addEventListener('input', function (e) {
    if (!e.target.hasAttribute('data-find')) return;
    q = e.target.value.trim().toLowerCase(); var pos = e.target.selectionStart; render();
    var box = document.querySelector('[data-find]'); if (box) { box.focus(); try { box.setSelectionRange(pos, pos); } catch (x) {} }
  });
  function route() { view = (location.hash.replace(/^#\//, '').split('?')[0]) || 'home'; if (/\?check$/.test(location.hash)) ofilter = 'ga'; if (['home', 'orders', 'invoices', 'products', 'ga'].indexOf(view) < 0) view = 'home'; showAll = false; render(); }
  window.addEventListener('hashchange', route);

  /* ---------- sign-in: same shared DashAuth as every dashboard page ---------- */
  var auth = DashAuth.bind({ clientId: CLIENT_ID, scope: SCOPE,
    onToken: function (resp) {
      if (resp.error) return banner('Sign-in did not complete.');
      if (window.google && google.accounts && !google.accounts.oauth2.hasGrantedAllScopes(resp, SHEETS)) { banner('Google did not give this page spreadsheet access. Tap Sign in again and tick every box Google shows.'); return; }
      token = resp.access_token; DashAuth.save(token, DashAuth.expiryFrom(resp.expires_in), resp.scope || SCOPE); load();
    },
    onError: function () { banner('Sign-in did not complete.'); }, onSilentFail: function () {} });
  var saved = DashAuth.valid(); if (saved && DashAuth.hasScope(saved, SCOPE)) { token = saved.access_token; }
  route(); load(); setInterval(function () { if (token) load(); }, 5 * 60000);
  var tries = 0;
  (function wait() { if (auth.init()) { render(); return; } if (++tries > 100) { banner('Google sign-in did not load.'); return; } setTimeout(wait, 100); })();
})();
