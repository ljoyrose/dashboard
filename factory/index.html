<style>
  :root { --radius: 12px; }
  /* Colours: ../tokens.css only (LJR7 spine). 0 system · 1 vision · 2 risk · 3 money · 4 ops · 5 connect · 6 sales · 7 ideas · 8 bin. */
  :root { --bg: var(--ljr-cream); --surface: var(--ljr-paper); --ink: var(--ljr-ink); --muted: var(--ljr-muted); --line: #DED5C8; }
  @media (prefers-color-scheme: dark) { :root { --line: #3D372F; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Lexend, system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; }
  .top h1 { font-size: 22px; margin: 0 auto 0 0; }
  .top h1 a { color: inherit; text-decoration: none; }
  .stamp { font-size: 11px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 5px; }
  .stamp:empty { display: none; }
  .btn { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 7px 14px; cursor: pointer; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
  .btn.main { border-color: var(--ink); color: var(--ink); }
  .hidden { display: none !important; }
  nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; }
  nav.tabs a { --radius: 999px; flex: none; text-decoration: none; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); display: inline-flex; gap: 6px; align-items: center; }
  /* One state only: hover = selected = a slightly heavier faint line. Same size always, so nothing moves. */
  nav.tabs a, .pill, .btn, .ico, .flagb, .opt, .mark, .plus { transition: none; }
  nav.tabs a:hover, nav.tabs a[aria-current="page"], .pill:hover, .pill.on, .btn:hover, .ico:hover, .ico.on, .flagb:hover, .mark:hover, .plus:hover { border-color: var(--muted); }
  nav.tabs a:active, .pill:active, .btn:active { transform: none; }
  nav.tabs .fbtn { margin-left: auto; }
  nav.tabs .fbtn.hidden + .cal { margin-left: auto; }
  .fbtn { --radius: 999px; font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; padding: 7px 12px; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .fbtn:hover, .fbtn.on { border-color: var(--muted); }
  .fbtn .n:empty { display: none; }
  .ti { font-size: 18px; line-height: 1; }
  /* Grey at rest; an icon's own colour on hover / when open. Logos grey until hover. */
  .ico:hover, .ico.on { color: var(--hc, var(--ink)); }
  .mark svg { filter: grayscale(1); opacity: .55; } .mark:hover svg { filter: none; opacity: 1; }
  .pill .ti { color: var(--muted); } .pill.alert.has:hover .ti { color: var(--ljr-2-text); }
  .hot { color: var(--ljr-2-text); font-weight: 700; }
  .crow .ttl { all: unset; flex: 1; min-width: 0; cursor: pointer; font-weight: 500; }
  .crow .l3 { display: flex; align-items: center; gap: 2px; margin-top: 4px; }
  .crow .l3 .grow { flex: 1; }
  .appcard { padding-top: 10px; }
  .appcard .grp { margin: 0 0 4px; padding-bottom: 6px; }
  .appcard > .crow:first-of-type { border-top: 0; }
  .more { font: inherit; font-size: 13px; font-weight: 600; color: var(--muted); background: none; border: 1px solid transparent; border-radius: var(--radius); padding: 4px 10px; margin-top: 4px; cursor: pointer; }
  .more:hover { border-color: var(--muted); }
  .crow .type { color: var(--muted); width: 28px; display: inline-flex; justify-content: center; }
  .mark { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 1px solid transparent; border-radius: var(--radius); }
  .plus { margin-left: auto; display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 50%; color: var(--ink); text-decoration: none; }
  .acts .btn.yes { color: var(--ljr-5-text); border-color: var(--ljr-5); }
  .acts .btn.no { color: var(--ljr-2-text); border-color: var(--ljr-2); }
  nav.tabs .n { font-size: 12px; font-weight: 700; background: var(--ljr-4); color: #2C2C2A; border-radius: var(--radius); padding: 0 7px; }
  main { padding: 16px 0 48px; display: flex; flex-direction: column; gap: 14px; }
  main.wrap { padding: 16px 16px 48px; }
  .banner { border: 1.5px solid var(--ljr-2); border-radius: var(--radius); padding: 10px 14px; background: var(--ljr-2-tint); color: var(--ljr-2-text); }
  .banner.info { border-color: var(--line); background: var(--surface); color: var(--ink); }
  #view { display: flex; flex-direction: column; gap: 14px; }
  #view > p { margin: 0; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pills.docs { margin-top: 8px; }
  .pill { font-size: 13px; font-weight: 600; border-radius: var(--radius); padding: 3px 10px; border: 1.5px solid var(--line); background: var(--surface); display: inline-flex; gap: 5px; align-items: center; }
  .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .room { border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 96px; }
  /* Room: faint line at rest; its own colour on hover / focus, same width so nothing moves. */
  .room:hover, .room:focus-within { border-color: var(--c); }
  .room h2 { font-size: 15px; margin: 0; display: flex; gap: 8px; align-items: center; }
  .room .stn { font-size: 12px; color: var(--muted); margin-top: -6px; }
  .room h2 .ct { margin-left: auto; font-size: 13px; color: var(--muted); }
  .room h2 .rlink { color: var(--ink); text-decoration: none; display: flex; gap: 8px; align-items: center; }
  .room h2 .rlink:hover { text-decoration: underline; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
  .chip { display: flex; gap: 6px; align-items: center; text-decoration: none; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; font-size: 14px; }
  .chip .st { margin-left: auto; font-size: 12px; color: var(--muted); }
  .chip.stuck { border-color: var(--ljr-2); }
  .card { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .hero { display: flex; gap: 12px; align-items: center; }
  .disc { width: 42px; height: 42px; border-radius: 50%; background: color-mix(in srgb, var(--c) 16%, var(--surface)); border: 1px solid var(--c); color: var(--ink); display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
  .hero h2 { margin: 0; font-size: 20px; }
  .hero p { margin: 0; color: var(--muted); font-size: 14px; }
  .strip { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; margin: 10px 0 2px; }
  /* No solid colour fills: tint + 1px ring (Lisa, 28 Oct 2026). */
  .strip i { height: 10px; border-radius: var(--radius); background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
  .strip i.d { background: var(--ljr-5-tint); box-shadow: inset 0 0 0 1px var(--ljr-5); } .strip i.c { background: var(--ljr-6-tint); box-shadow: inset 0 0 0 1px var(--ljr-6); }
  .stage { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
  /* Steps: a small status ring (done ✓ green tint, current ● blue tint, future empty grey) then "Step N:" in words. */
  .stage .n { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: transparent; border: 1px solid var(--line); color: var(--ink); flex: none; }
  .stage.d .n { background: var(--ljr-5-tint); border-color: var(--ljr-5); }
  .stage.c .n { background: var(--ljr-6-tint); border-color: var(--ljr-6); }
  .step { color: var(--muted); font-weight: 600; white-space: nowrap; }
  .stage.c { font-weight: 600; }
  .stage .r { margin-left: auto; font-size: 13px; color: var(--muted); }
  .lines { list-style: none; margin: 0 0 6px; padding: 0 0 0 34px; }
  .lines li { display: flex; gap: 8px; align-items: center; font-size: 14px; padding: 3px 0; }
  .lines li .who { margin-left: auto; font-size: 12px; color: var(--muted); }
  .codes { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .codes span { font-size: 12px; font-weight: 600; border: 1.5px solid var(--line); border-radius: var(--radius); padding: 1px 7px; }
  .codes span.q { color: var(--muted); }
  .ask { display: flex; gap: 8px; margin-top: 10px; }
  .ask input { flex: 1; font: inherit; font-size: 15px; padding: 8px 12px; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
  .rowask { margin-top: 6px; }
  .by { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 6px; margin-left: 6px; }
  .rowask input { font-size: 14px; padding: 6px 10px; }
  .why.q { color: var(--ljr-3-text); }
  .ask select { font: inherit; font-size: 14px; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
  .row { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
  .row a { color: var(--ink); text-decoration: none; font-weight: 600; }
  .card > .row:first-child { border-top: 0; padding-top: 0; }
  .row .txt { flex: 1; min-width: 0; }
  .row .why { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .row .why a { font-weight: 400; text-decoration: underline; }
  .row .meta { margin-left: auto; font-size: 13px; color: var(--muted); text-align: right; }
  .grp { font-size: 15px; font-weight: 700; margin: 14px 0 2px; display: flex; gap: 8px; align-items: center; }
  .grp:first-child { margin-top: 0; }
  .grp .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .grp .st { font-size: 12px; font-weight: 600; color: var(--muted); }
  .grp a { color: var(--ink); text-decoration: none; }
  .grp .pill { font-size: 11px; padding: 1px 8px; }
  /* Links: normal text colour, underlined. Pills, chips, buttons and tabs look clickable already: no underline. */
  a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  a.pill, a.chip, a.btn, nav.tabs a, .room h2 .rlink { text-decoration: none; color: inherit; }

  .sw { display: inline-block; width: 28px; height: 16px; border-radius: var(--radius); border: 1.5px solid var(--muted); position: relative; vertical-align: middle; }
  .sw i { position: absolute; top: 2px; left: 2px; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); transition: left .15s; }
  .sw.on { border-color: var(--ljr-5); } .sw.on i { left: 14px; background: var(--ljr-5); }
  .crow { padding: 10px 0; border-top: 1px solid var(--line); }
  .card > .crow:first-child, .clines > .crow:first-child { border-top: 0; }
  .crow .l1 { display: flex; gap: 8px; align-items: flex-start; }
  .crow .type { flex: none; width: 22px; text-align: center; }
  .crow .ttl { flex: 1; min-width: 0; font-weight: 500; }
  .crow .ttl .app { font-weight: 800; margin-right: 4px; }
  .crow .why { font-size: 13px; color: var(--muted); margin: 3px 0 0; }
  .crow .l2 { display: flex; gap: 8px; align-items: center; margin: 6px 0 0; }
  .crow .l3 { display: flex; justify-content: flex-end; margin-top: 4px; }
  .crow .icons { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; flex: 1; }
  .crow .acts { display: flex; gap: 6px; }
  .crow .acts .btn { padding: 4px 14px; font-size: 16px; }
  .ico, .flagb, .opt { position: relative; background: none; border: 1px solid transparent; border-radius: var(--radius); width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); }

  .ico .new { position: absolute; top: 1px; right: 1px; width: 7px; height: 7px; border-radius: 50%; background: var(--ljr-2); }
  .flag { width: 18px; height: 18px; display: block; color: var(--muted); }
  .stat { font: inherit; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #fff; background: var(--sc); border: 0; border-radius: var(--radius); padding: 2px 7px; cursor: pointer; }
  .date { position: relative; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .date.over { color: var(--ljr-2-text); font-weight: 700; }
  .date input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .panel { margin: 8px 0 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px; flex-direction: column; }
  .panel p { margin: 0; }
  .tick { font: inherit; text-align: left; background: none; border: 0; cursor: pointer; color: var(--ink); padding: 2px 0; }
  .tick.ok { color: var(--muted); text-decoration: line-through; }
  .fbar { display: flex; justify-content: flex-end; }
  .fbar .n { margin-left: 4px; }
  .fpanel { display: flex; flex-direction: column; gap: 8px; }
  .fpanel .pills { margin: 0; }
  .acts { display: flex; gap: 6px; flex: none; }
  .acts .btn { padding: 5px 12px; }
  .acts .yes { border-color: var(--ljr-5); }
  .acts .no { border-color: var(--ljr-2); }
  .sent { font-size: 13px; color: var(--muted); flex: none; }
  .bar { width: 6px; align-self: stretch; border-radius: var(--radius); background: var(--c); flex: none; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { border: 2px solid var(--c); border-radius: var(--radius); padding: 12px; background: var(--surface); }
  .tile b { display: block; font-size: 28px; line-height: 1.1; }
  .tile span { font-size: 13px; color: var(--muted); }
  .muted { color: var(--muted); font-size: 14px; }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  footer { color: var(--muted); font-size: 13px; padding: 0 16px 24px; }

  /* One page width everywhere (Lisa, 20 Oct): the full window up to 1600px, 24px edge; phones 16px. No wasted space. */
  .wrap, .wrap.wide, .wide, .hin { max-width: 1600px; margin-left: auto; margin-right: auto; box-sizing: border-box; padding-left: 24px; padding-right: 24px; }
  main.wrap { padding-left: 24px; padding-right: 24px; }
  @media (max-width: 600px) { .wrap, .wide, .hin, main.wrap { padding-left: 16px; padding-right: 16px; } }
  header .top, header nav.tabs { max-width: 1600px; margin-left: auto; margin-right: auto; box-sizing: border-box; padding-left: 24px; padding-right: 24px; }
  @media (max-width: 600px) { header .top, header nav.tabs { padding-left: 16px; padding-right: 16px; } }

  /* One card frame (Lisa ✓ 20 Oct): link icons bottom left, dashed = not recorded yet; colour only when something needs you. */
  .links { display: inline-flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
  .lk { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); text-decoration: none; font-size: 16px; }
  .lk:hover { border-color: var(--muted); color: var(--ink); }
  .lk.no { border-style: dashed; opacity: .7; }
  .lk.off { width: auto; padding: 0 10px; gap: 4px; font-size: 13px; color: var(--ljr-2-text); border-color: var(--ljr-2); }
  .appcard.alarm { border-color: var(--ljr-2); }
  .outs { display: grid; grid-template-columns: 18px 1fr; gap: 2px 6px; font-size: 14px; color: var(--muted); margin: 2px 0 4px; }
  .outs i.ti { font-size: 15px; margin-top: 3px; }
  .outs .y { color: var(--ljr-5-text); } .outs .n { color: var(--ljr-2-text); }
  .q1 { font-size: 15px; margin: 2px 0; }
  .age { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 2px; padding: 0 4px; }
  .age.old { color: var(--ljr-2-text); }
  .info { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border: 1px solid var(--line); border-radius: 50%; font-size: 11px; color: var(--muted); cursor: help; margin-left: 4px; vertical-align: 1px; }
  .undo { font-size: 13px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; margin-left: 6px; }
  .undo:hover { border-color: var(--muted); color: var(--ink); }
  .copy { font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
  .copy:hover { border-color: var(--muted); }
  /* Calm focus (Lisa, 20 Oct: no double lines): never a second ring. Focus = the same one line, a shade darker. Plain text links get a thicker underline. */
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--muted); }
  a:focus, button:focus, [tabindex]:focus, summary:focus { outline: none; }
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: none; border-color: var(--ink) !important; }
  #view a:not([class]):focus-visible, summary:focus-visible { text-decoration: underline; text-decoration-thickness: 2px; }
  .lock { color: var(--ljr-3-text); font-size: 16px; display: inline-flex; align-items: center; gap: 4px; }

  /* Forms in the dashboard's own style (Lisa ✓ 20 Oct): chips, (i) on hover, no placeholder words, draft kept. */
  .fq { padding: 10px 0; border-top: 1px solid var(--line); }
  .fq:first-of-type { border-top: 0; }
  .fq .qt { font-size: 15px; margin: 0 0 6px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .fq .code { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  .fq .req { color: var(--ljr-2-text); font-size: 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .ch { font: inherit; font-size: 14px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; }
  .ch:hover, .ch.on { border-color: var(--muted); }
  .ch b { font-weight: 700; margin-right: 4px; }
  .fin { width: 100%; font: inherit; font-size: 15px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: transparent; color: var(--ink); }
  textarea.fin { min-height: 72px; resize: vertical; }
  .ferr { color: var(--ljr-2-text); font-size: 13px; margin-top: 4px; }
  .frow { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 12px; }
  .grpt { font-size: 13px; font-weight: 700; color: var(--muted); margin: 10px 0 6px; display: flex; gap: 6px; align-items: center; }
  .grpt:first-child { margin-top: 0; }
  details.arch > summary { cursor: pointer; list-style: none; }
  .search { width: 100%; max-width: 320px; }
  .addlink { display: flex; gap: 6px; margin-top: 6px; }
  .ico, .ico:hover, .ico.on, .flagb, .flagb:hover, .mark, .mark:hover, .lk:not(.no):not(.off), .lk:not(.no):not(.off):hover { border-color: transparent; }
  .acts .btn.yes, .acts .btn.no, .acts .yes, .acts .no, .btn.yes { border-color: var(--line); }
  .acts .btn.yes:hover, .btn.yes:hover { border-color: var(--ljr-5); } .acts .btn.no:hover { border-color: var(--ljr-2); }
  .flab { font-size: 13px; font-weight: 700; color: var(--muted); min-width: 44px; align-self: center; }
  .fpanel .pills + .pills { margin-top: 8px; }

  /* Year 3 (Lisa ✓ 20 Oct): portfolio table and grouped links. */
  .ptab { width: 100%; border-collapse: collapse; font-size: 14px; }
  .ptab th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px 6px; }
  .ptab td { padding: 6px; border-top: 1px solid var(--line); vertical-align: middle; }

  }
  function ckPill() {

  }
  function docsStrip() {

  }
  function enginePill() {
    // Real problems only: a watch-job that is off (or never ran) because the Factory is OFF is expected, not a fault.

    var now = Date.now(), bad = (S.health || []).filter(function (h) {
      if (!WINDOW_H[h.job]) return h.result === 'FAILED';
      if (off && h.job !== 'syncState' && /^(OFF|INSTALLED)$/i.test(h.result)) return false;
      var last = Date.parse(h.last);

    }).map(function (h) { return (JOB[h.job] || h.job) + ' ' + word(h); });
    if (now - Date.parse(S.generated_at) > 45 * 6e4) bad.unshift('Data old');
    return bad.length ? '<a class="pill alert has" href="#/health" title="' + esc(bad.join(' · ')) + '"><i class="ti ti-alert-triangle"></i> <span class="hot">' + bad.length + '</span></a>' :
      '<a class="pill" href="#/health" title="Engine"><i class="ti ti-check"></i></a>';
  }
  var JOB = { syncState: 'Screen sync', dailyDigest: 'Daily email', staleCheck: 'Stuck check', weeklyBackup: 'Backup', leakProbe: 'Live-app check', onIdeaSubmit: 'Idea Form' };
  function word(h) { var r = String(h.result).toUpperCase(); return r === 'INSTALLED' ? 'Never' : r === 'OFF' ? 'Off' : r === 'OK' ? 'Late' : r.charAt(0) + r.slice(1).toLowerCase(); }
  // Jobs page: what each job is, when it last ran, and whether that is OK. Plain words.
  function vHealth() {
    var now = Date.now(), on = String(S.factory).toUpperCase() === 'ON';
    return '<div class="card"><b>Factory <button class="pill" type="button" data-action="factory" aria-label="Factory on or off"><span class="sw' + (factoryOn() ? ' on' : '') + '"><i></i></span></button> ' + esc(String(S.mode)) + '</b><p class="muted">' +
      (on ? '' : '') + '</p>' +
      (S.health || []).map(function (h) {
        var last = Date.parse(h.last), okNow = h.result === 'OK' && (!WINDOW_H[h.job] || now - last < WINDOW_H[h.job] * 36e5);
        return '<div class="row"><span class="bar" style="--c:var(--ljr-' + (okNow ? 5 : 2) + ')"></span><div class="txt"><b>' + esc(JOB[h.job] || h.job) + '</b><div class="why">' + esc(h.schedule) + (h.note ? ' · ' + esc(String(h.note).slice(0, 80)) : '') + '</div></div><span class="meta">' +
          (okNow ? ic('tick') + 'ok' : ic('warn') + esc(word(h))) + '<br>' + (isNaN(last) ? '' : new Date(last).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) + '</span></div>';
      }).join('') + '<p class="muted">Data read ' + new Date(S.generated_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + '.</p><p><a href="#/rooms">← Rooms</a></p></div>';
  }
  function vApps(title, list) {
    return '<div class="card"><b>' + esc(title) + ' · ' + list.length + '</b><div class="pills" style="margin-top:8px">' + (list.length ? list.map(chipOf).join('') : '<span class="muted">None.</span>') + '</div><p><a href="#/rooms">← Rooms</a></p></div>';
  }
  // Clicks already sent stay marked "sent" for a day, so a row never asks twice before the engine catches up.
  function loadSent() {
    try { var o = JSON.parse(localStorage.getItem('af-sent') || '{}'), now = Date.now(); Object.keys(o).forEach(function (k) { if (now - o[k] > 864e5) delete o[k]; }); return o; } catch (e) { return {}; }
  }
  function loadLocal(k) { try { var o = JSON.parse(localStorage.getItem(k) || '{}'), now = Date.now(); Object.keys(o).forEach(function (x) { if (o[x] && o[x].at && now - o[x].at > 2 * 864e5) delete o[x]; }); return o; } catch (e) { return {}; } }

  // Typing is kept as you go, so a refresh never wipes a half-written answer.

    else if (f === 'appq') { appQ = e.target.value; var pos = e.target.selectionStart; render(); var b = document.querySelector('[data-f="appq"]'); if (b) { b.focus(); b.setSelectionRange(pos, pos); } }
  });
  document.addEventListener('input', function (e) { var d = e.target.getAttribute && e.target.getAttribute('data-draft'); if (d) { drafts[d] = e.target.value; saveLocal('af-drafts', drafts); } });
  function barTab() { var r = hashParts().path[0] || 'rooms'; return BAR_TABS.test(r) ? r : null; }
  function saveSent() { try { localStorage.setItem('af-sent', JSON.stringify(sent)); } catch (e) {} }
  function render() {
    var route = hashParts().path;
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (a) { a.setAttribute('aria-current', a.getAttribute('data-nav') === route[0] || (/^(card|room|health|stuck|all|queue|new|problem)$/.test(route[0]) && a.getAttribute('data-nav') === 'rooms') ? 'page' : 'false'); });
    $('appPick').classList.toggle('hidden', !signedIn || !S); $('appPick').setAttribute('aria-expanded', appMenu ? 'true' : 'false');
    $('appMenu').classList.toggle('hidden', !appMenu || !S); if (appMenu && S) $('appMenu').innerHTML = vAppMenu();

    $('signOutBtn').classList.toggle('hidden', !signedIn);
    $('refreshBtn').classList.toggle('hidden', !signedIn);

    if (err) { v.innerHTML = '<div class="banner">' + esc(err) + '</div>'; return; }

    var waiting = function (tab) { return function (t) { return !sent[t.id] && (fsOf(tab).test || !testT(t)); }; };
    $('nMe').textContent = meItems().filter(waiting('me')).length; $('nDecide').textContent = decisions().filter(waiting('decide')).length; $('nDo').textContent = mine().filter(waiting('do')).length;
    var tb = barTab(); if (tb) toUrl(tb);
    v.innerHTML = route[0] === 'me' ? list('me', meItems(), 4, 'me') : route[0] === 'item' ? vItem(route[1]) : route[0] === 'app' ? vApp(route[1]) :
      route[0] === 'today' ? vToday() : route[0] === 'queue' ? list('queue', queue(route[1]), 5, 'view') : route[0] === 'card' ? vCard(route[1]) : route[0] === 'room' ? vRoom(route[1]) : route[0] === 'health' ? vHealth() : route[0] === 'stuck' ? vApps('Stuck 14+ days', apps().filter(stuck)) : route[0] === 'docs' ? vDocs() : route[0] === 'all' ? vPortfolio() : route[0] === 'new' ? vNew() : route[0] === 'problem' ? vProblem(route[1]) : route[0] === 'decide' ? list('decide', decisions(), 4, 'decide') + decideFoot() :
      route[0] === 'do' ? list('do', mine(), 4, 'do') : vRooms();
  }

  /* Ask box → AF › requests (the engine turns it into a ClickUp task) */
  function sendAsk(form) {
    var text = form.text.value.trim(), to = form.to.value, id = form.getAttribute('data-ask');
    var lists = S.lists || {}, t = [].concat(lists.apps || [], lists.decisions || [], lists.work || [], lists.sends || [], lists.incidents || []).filter(function (x) { return x.id === id; })[0] || {};
    var note = form.nextElementSibling && form.nextElementSibling.classList.contains('asknote') ? form.nextElementSibling : $('askNote');
    var body = { at: new Date().toISOString(), to: to, text: text, taskId: id, taskUrl: t.url, app: t.name, appTag: (t.tags || []).filter(function (g) { return /^app-/.test(g); })[0] || '' };
    if (!text) return;

    var done = false;
    setTimeout(function () { if (!done) note.textContent = 'Not sent yet: allow Google saving, then press Ask again. Your text is kept.'; }, 20000);
    withWrite(function () {
      return putRequest('ask', body)
        .then(function () { done = true; delete drafts[id]; saveLocal('af-drafts', drafts); asked[id] = { text: text, at: Date.now() }; saveLocal('af-asked', asked); openPanel = null; render(); })
        .catch(function (e) { done = true; note.textContent = 'Not sent: ' + e.message + '. Your text is kept; press Ask again.'; });
    });
  }
  function sendAct(btn) {
    var id = btn.getAttribute('data-id'), act = btn.getAttribute('data-act'), n = document.getElementById('note-' + id), note = n ? n.value.trim() : '';
    btn.parentNode.innerHTML = '<span class="sent">sending…</span>';
    withWrite(function () {
      return putRequest('act', { kind: 'act', action: act, taskId: id, note: note, at: new Date().toISOString() })
        .then(function (r) { sent[id] = Date.now(); saveSent(); return r.json().then(function (j) { sentF[id] = { fid: j.id, at: Date.now() }; saveLocal('af-sentf', sentF); }, function () {}); })
        .then(function () { render(); })
        .catch(function (e) { banner('Not sent: ' + e.message); render(); });
    });
  }
  // Every click file says who clicked (email + device): a YES on 20 Oct could not be traced.
  var whoAmI = null;
  function device() { var u = navigator.userAgent; return /iPhone|iPad/.test(u) ? 'iPhone/iPad' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : 'other'; }
  function who() {
    if (whoAmI) return Promise.resolve(whoAmI);

      .then(function (j) { return (whoAmI = ((j.user && j.user.emailAddress) || '?') + ' · ' + device()); })
      .catch(function () { return '? · ' + device(); });
  }
  function putRequest(prefix, body) {
    return who().then(function (by) {
      body.by = by;
      var meta = { name: prefix + '-' + Date.now() + '.json', parents: [F.requests], mimeType: 'application/json' };
      var b = 'af' + Date.now();
      var payload = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) + '\r\n--' + b + '\r\nContent-Type: application/json\r\n\r\n' + JSON.stringify(body) + '\r\n--' + b + '--';
      return drive('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body: payload });
    });
  }
  function withWrite(go) {
    var saved = DashAuth.valid();
    if (saved && DashAuth.hasScope(saved, WRITE)) return go();
    pendingAsk = go; auth.requestWrite(WRITE);
  }
  var pendingAsk = null;

  /* sign-in (same pattern as Money Hub; one sign-in shared by the site) */
  function startTimer() { stopTimer(); timer = setInterval(load, REFRESH_MS); }
  setInterval(function () { if (Object.keys(sentF).length && S) render(); }, 6e4);
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
  function expired() { stopTimer(); accessToken = null; DashAuth.markExpired(); if (!auth.requestSilent()) banner('Sign-in expired. Sign in again.'); }
  function banner(t) { $('banner').className = 'banner'; $('banner').textContent = t; }
  function onToken(resp) {
    if (resp.error) { banner('Sign-in did not complete.'); return; }
    accessToken = resp.access_token; tokenExpiresAt = DashAuth.expiryFrom(resp.expires_in);
    DashAuth.save(accessToken, tokenExpiresAt, resp.scope || SCOPE);
    signedIn = true; $('banner').className = 'banner hidden';
    if (pendingAsk && DashAuth.hasScope(DashAuth.valid(), WRITE)) { var p = pendingAsk; pendingAsk = null; p(); }
    else if (pendingAsk) { pendingAsk = null; banner('Saving was not allowed by Google. Click again and choose Allow.'); }

  }
  function signOut() {
    stopTimer(); var t = accessToken; accessToken = null; signedIn = false; S = null; DashAuth.clear();
    if (t && window.google && google.accounts) google.accounts.oauth2.revoke(t, function () {});
    render();
  }
  var auth = DashAuth.bind({ clientId: CLIENT_ID, scope: SCOPE, onToken: onToken, onError: function () { banner('Sign-in did not complete.'); }, onSilentFail: function (h) { if (h) banner('Sign-in expired. Sign in again.'); } });
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-action]'); if (a && !a.disabled) {
      var k = a.getAttribute('data-action');
      if (k === 'signin') auth.requestInteractive({ login_hint: 'lisa@puppyclassroom.com' }); else if (k === 'signout') signOut(); else if (k === 'refresh') load();
      else if (k === 'cardask') { cardAsk = !cardAsk; render(); var ai = document.querySelector('form.ask[data-ask] input[name=text]'); if (cardAsk && ai) ai.focus(); }
      else if (k === 'more') { var ga = a.getAttribute('data-app'); shownAll[ga] = { on: !(shownAll[ga] && shownAll[ga].on), at: Date.now() }; saveLocal('af-open', shownAll); render(); }
      else if (k === 'dqall') { docsAll = true; render(); }
      else if (k === 'apppick') { appMenu = !appMenu; render(); }
      else if (k === 'ftest') { var t1 = barTab(); if (t1) { fsOf(t1).test = !fsOf(t1).test; saveFs(); render(); } }
      else if (k === 'pfclear') { pfo = {}; savePf(); render(); } else if (k === 'pfall') { pfo.all = true; render(); } else if (k === 'pfarch') { pfo.arch = true; render(); }
      else if (k === 'clearf') { var t2 = barTab(); if (t2) { fs[t2] = fdef(t2); saveFs(); } render(); }
      else if (k === 'sendidea') sendIdea(); else if (k === 'sendprob') sendProblem(a.getAttribute('data-id'));
      else if (k === 'filters') { filtersOpen = !filtersOpen; render(); } else if (k === 'factory') sendFactory(); else if (k === 'today' || k === 'week') { weekView = k === 'week'; render(); }
      return;
    }
    var b = e.target.closest('[data-act]'); if (b) { sendAct(b); return; }
    var fx = e.target.closest('[data-fx]'); if (fx) { var t3 = barTab(); if (!t3) return; var sx = fsOf(t3), fk = fx.getAttribute('data-fx'), fv = fx.getAttribute('data-val');
      if (fk === 'sort') sx.sort = fv; else if (fk === 'app' && !fv) sx.app = []; else { var ai = sx[fk].indexOf(fv); if (ai >= 0) sx[fk].splice(ai, 1); else sx[fk].push(fv); }
      saveFs(); render(); return; }
    var pfb = e.target.closest('[data-pf]'); if (pfb) { var pk3 = pfb.getAttribute('data-pf'), pv = pfb.getAttribute('data-val'); pfo[pk3] = pfo[pk3] === pv ? '' : pv; savePf(); render(); return; }
    var pk2 = e.target.closest('[data-pick]'); if (pk2) { idea.a = idea.a || {}; idea.a[pk2.getAttribute('data-pick')] = pk2.getAttribute('data-val'); delete formErr[pk2.getAttribute('data-pick')]; saveIdea(); render(); return; }
    var pr = e.target.closest('[data-prob]'); if (pr) { prob.k = pr.getAttribute('data-prob'); delete formErr.k; render(); return; }
    var al = e.target.closest('[data-addlink-open]'); if (al) { var aid = al.getAttribute('data-addlink-open'), ak = al.getAttribute('data-key'); addLink = addLink && addLink.id === aid && addLink.key === ak ? null : { id: aid, key: ak }; render(); var inp2 = document.querySelector('form[data-addlink] input'); if (inp2) inp2.focus(); return; }
    var ud = e.target.closest('[data-undo]'); if (ud) { ud.disabled = true; undo(ud.getAttribute('data-undo')); return; }
    var cp = e.target.closest('[data-copy]'); if (cp) { copyPrompt(cp); return; }
    var pn = e.target.closest('[data-panel]'); if (pn) { var pid = pn.getAttribute('data-id'), pk = pn.getAttribute('data-panel');
      openPanel = openPanel && openPanel.id === pid && openPanel.k === pk ? null : { id: pid, k: pk };
      if (pk === 'cm') { seen[pid] = Date.now(); saveLocal('af-seen', seen); }
      render(); if (openPanel && pk === 'reply') { var inp = $('note-' + pid); if (inp) inp.focus(); } return; }
    var st = e.target.closest('[data-set]'); if (st) { sendSet(st.getAttribute('data-id'), st.getAttribute('data-set'), st.getAttribute('data-val')); return; }
    var ck = e.target.closest('[data-check]'); if (ck) { sendCheck(ck.getAttribute('data-id'), ck.getAttribute('data-check'), ck.getAttribute('data-item'), ck.getAttribute('data-ok') !== '1'); return; }
    var s = e.target.closest('[data-stage]'); if (s) { var i = +s.getAttribute('data-stage'); var cur = open[i] === undefined ? (s.classList.contains('c')) : open[i]; open[i] = !cur; render(); }
  });
  document.addEventListener('change', function (e) { var d = e.target.getAttribute && e.target.getAttribute('data-due'); if (d) sendSet(d, 'due', e.target.value || ''); });
  document.addEventListener('submit', function (e) { var lf = e.target.closest('[data-addlink]'); if (lf) { e.preventDefault(); sendLink(lf); return; } var f = e.target.closest('[data-ask]'); if (f) { e.preventDefault(); sendAsk(f); } });
  function onRoute() { fromUrl(); var r = hashParts().path; if (r[0] === 'item' && r[1]) openPanel = { id: r[1], k: 'all' }; }
  window.addEventListener('hashchange', function () { open = {}; openPanel = null; filtersOpen = false; appMenu = false; cardAsk = false; addLink = null; formErr = {}; formNote = ''; docsAll = false; onRoute(); render(); window.scrollTo(0, 0); });
  // "/" puts the cursor in this page's search box. Runs before toolkit.js's own "/" (its search dialog), which still opens where there is no box.
  window.addEventListener('keydown', function (e) {
    if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    var b = document.querySelector('[data-f="fq"]'); if (b) { e.preventDefault(); e.stopPropagation(); b.focus(); }
  }, true);
  onRoute();
  var saved = DashAuth.valid();
  if (saved && DashAuth.hasScope(saved, SCOPE)) { accessToken = saved.access_token; tokenExpiresAt = saved.expires_at; signedIn = true; }
  render(); if (signedIn) { startTimer(); load(); }
  DashAuth.onChange(function (sv) { if (!sv) { if (signedIn) signOut(); return; } accessToken = sv.access_token; if (!signedIn) { signedIn = true; startTimer(); load(); } });
  var tries = 0;
  (function wait() {
    if (auth.init()) { var b = $('signInBtn'); b.disabled = false; b.querySelector('span').textContent = 'Sign in'; return; }
    if (++tries > 100) { banner('Google sign-in did not load.'); return; }
    setTimeout(wait, 100);
  })();
})();
