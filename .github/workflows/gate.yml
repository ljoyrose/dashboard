name: Gate checker tests

# Tests for tools/gate/gate.mjs (the App Factory gate checker). Plain Node, no browser, no packages, no secrets.
# Kept in its own workflow on purpose: the Playwright suite and its required check
# ("Browser tests (pretend Google and Drive)") in tests.yml are untouched.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate checker (node:test)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Gate checker control cases (the tool tests itself first)
        run: node tools/gate/gate.mjs --selftest
      - name: Gate checker tests
        run: node --test tests/gate/gate.test.mjs
