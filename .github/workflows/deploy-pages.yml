name: Publish the site

# Publishes the live website only after "Dashboard tests" has passed on a push to main.
# A red tick does not publish. The files uploaded are the repo root, the same folder
# GitHub Pages serves from the main branch today (dotfiles such as .github are left out).
# GitHub only runs this file from the main branch. Settings > Pages > Source must be
# "GitHub Actions" or this publish cannot run.
# No secrets are used or needed.
on:
  workflow_run:
    workflows: ['Dashboard tests']
    types: [completed]

permissions:
  pages: write
  id-token: write
  contents: read

# One publish at a time. Do not cancel a publish that has already started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the site
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the commit the tests passed on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
