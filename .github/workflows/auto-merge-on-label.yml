name: Auto-merge on merge-ready label

on:
  pull_request:
    types: [labeled]
  merge_group:

jobs:
  auto-merge:
    if: github.event_name == 'pull_request' && github.event.label.name == 'merge-ready'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge (merge commit)
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --auto \
            --merge \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
