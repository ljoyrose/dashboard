name: Dashboard tests

# Runs the browser tests on every push, once a week, and on demand (Actions tab > Dashboard tests > Run workflow).
# Google sign-in and Google Drive are pretend in these tests. No secrets are used or needed.
on:
  push:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC (about 06:17/07:17 UK time)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  tests:
    name: Browser tests (pretend Google and Drive)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install packages (exact versions from package-lock.json)
        run: npm ci

      - name: Remember the test browser between runs
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the test browser (first time, or after a version change)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the browser's system libraries (browser itself came from the cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run tests
        id: run
        run: npx playwright test --project=mocked

      - name: Write the short summary
        if: always()
        run: node tests/support/summary.js test-results/results.json

      - name: Keep the full report (screenshots and recordings of any failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Optional extra: opens the three real web addresses (signed out) to check the live site is up.
  # Weekly and on demand only. Never blocks anything: a red tick here is a hint, not a failure of the code.
  live-smoke:
    name: Live site check (optional, never blocks)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Remember the test browser between runs
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Check the live pages
        run: npx playwright test --project=live-smoke
        env:
          LIVE_SMOKE: '1'
      - name: Write the short summary
        if: always()
        run: node tests/support/summary.js test-results/results.json
