name: Dashboard tests

# Runs the browser tests on every pull request (each new push to it), once a night, and on demand
# (Actions tab > Dashboard tests > Run workflow, on any branch). Minutes trim, 20 Nov 2026:
#  - NOT on a plain push any more. A branch with no pull request runs nothing here, and a push to main does not run the
#    suite twice: "Publish site (after tests)" already runs the same suite on every push to main before it publishes.
#  - A newer push to the same pull request cancels the older run.
#  - The nightly run is skipped when main has had no new commit for 26 hours.
#  - The privacy guard is NOT trimmed: it still runs on every push, because a pushed branch is public at once.
# Once the repo is PRIVATE (Actions minutes are metered), pull requests run only the no-browser checks; the browser
# suite runs nightly and on demand, and in a session before every PR (tools/ci-local/run-all.sh). See docs-only.sh.
# Google sign-in and Google Drive are pretend in these tests. No secrets are used or needed.
# The job called "Browser tests (pretend Google and Drive)" is the one branch protection requires on main.
# Do not rename it without also changing the branch protection rule (see TESTS.md).
on:
  pull_request:
  merge_group: # if a merge queue is ever switched on for main, the required check still reports there
  schedule:
    - cron: '17 3 * * *' # every night 03:17 UTC (about 03:17/04:17 UK time)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  tests:
    name: Browser tests (pretend Google and Drive)
    runs-on: ubuntu-24.04
    # 15 > 20 on 2 Nov 2026: the full suite already ran 14-15 minutes on main (one main run was cut off at 15), and the
    # clickable-info checks (the owner's clickable picks) add about a minute.
    # 20 > 30 on 4 Nov 2026 (the owner, Q5 A): the suite now runs 17-20+ minutes; four JOB 34 fix PRs were cut off at 20 with every test passing.
    # 30 > 35 on 5 Nov 2026: runs take about 18-21 min, so 30 leaves too little headroom.
    # 35 > 60 on 7 Nov 2026: dog-card-redesign adds accordion + med-form tests; suite now exceeds 35 min.
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write # only used to open/close the one "tests are red" issue on scheduled runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to compare the whole branch with main

      # Docs-only branch (only docs/ or *.md, never TESTS.md, .github/ or tests/): skip the browser, still run the
      # no-browser checks (secret scan of every file, CI guards). main, schedules and hand-started runs always run everything.
      - name: Docs-only branch? (the browser is skipped, the file checks still run)
        id: scope
        run: bash tools/ci-local/docs-only.sh
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          NIGHTLY_SKIP_IDLE: 'true' # a nightly run with no new commit on main for 26 hours skips the browser

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install packages (exact versions from package-lock.json)
        run: npm ci

      - name: Remember the test browser between runs
        if: steps.scope.outputs.browser == 'true'
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the test browser (first time, or after a version change)
        if: steps.scope.outputs.browser == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the browser's system libraries (browser itself came from the cache)
        if: steps.scope.outputs.browser == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run tests (desktop suite, then the small phone-sized set)
        if: steps.scope.outputs.browser == 'true'
        id: run
        # The desktop suite includes the route crawl (tests/mocked/route-crawl.spec.js): every top-level page,
        # and every hash route, tab, chip and SOP row, must stay on this origin and paint without hanging.
        run: npx playwright test --project=mocked --project=phone

      - name: Docs-only branch or private-repo push - run the checks that need no browser (secret scan, CI guards)
        if: steps.scope.outputs.browser == 'false'
        run: npx playwright test --project=mocked tests/mocked/repo-hygiene.spec.js tests/mocked/ci-guards.spec.js

      - name: Write the short summary
        if: always()
        run: node tests/support/summary.js test-results/results.json

      - name: Keep the full report (screenshots and recordings of any failure)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      # Failure surface. Scheduled (Monday) or hand-started runs on main only. No Slack, no webhooks, no new secrets:
      # the run's own built-in token opens ONE GitHub Issue (GitHub emails the owner) and closes it when green again.
      - name: Red on a scheduled run? Open or update the one issue
        continue-on-error: true # bookkeeping must never change the result of the tests
        if: ${{ failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        run: 'node tests/support/report-issue.js --state red --label tests-red --title-prefix "cdhub: check failed" --results test-results/results.json'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Green again? Close the issue
        continue-on-error: true
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: node tests/support/report-issue.js --state green --label tests-red
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional extra: opens the three real web addresses (signed out) to check the live site is up.
  # Weekly and on demand only. Never blocks anything: a red tick here is a hint, not a failure of the code.
  live-smoke:
    name: Live site check (optional, never blocks)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Remember the test browser between runs
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Check the live pages
        id: live
        continue-on-error: true
        run: npx playwright test --project=live-smoke --retries=2
        env:
          LIVE_SMOKE: '1'
          LIVE_MATCH_REPO: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
      - name: Write the short summary
        if: always()
        run: node tests/support/summary.js test-results/results.json
      - name: Live site red? Open or update the one live-site issue
        continue-on-error: true
        if: ${{ steps.live.outcome == 'failure' && github.ref == 'refs/heads/main' }}
        run: 'node tests/support/report-issue.js --state red --label live-site-red --title-prefix "cdhub: check failed" --results test-results/results.json'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Live site fine? Close the issue
        continue-on-error: true
        if: ${{ steps.live.outcome == 'success' && github.ref == 'refs/heads/main' }}
        run: node tests/support/report-issue.js --state green --label live-site-red
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
