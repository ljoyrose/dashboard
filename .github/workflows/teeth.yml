name: Teeth check (weekly)

# Proves the tests can still FAIL. Makes about eight deliberate breaks on a temporary copy of the site and
# expects the tests to go red each time. If a break goes unnoticed, this run turns red and opens an issue.
# Separate from the main suite: it can never block a merge. No secrets.
on:
  schedule:
    - cron: '43 6 * * 2' # Tuesdays 06:43 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teeth
  cancel-in-progress: false # it opens and closes issues: let a started run finish

env:
  CI: 'true'

jobs:
  teeth:
    name: Teeth check (can the tests still fail?)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Remember the test browser between runs
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Break things on purpose and check the tests notice
        id: teeth
        run: node tests/teeth/run-teeth.js
      - name: A break went unnoticed? Open or update the one issue
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: node tests/support/report-issue.js --state red --label teeth-red --title-prefix "Teeth check failed" --results none --note "A deliberate break was not caught. See the run summary."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: All caught? Close the issue
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: node tests/support/report-issue.js --state green --label teeth-red
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
