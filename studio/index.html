  /* Greys, lines, frame, radius and the control line: ../tokens.css (house tokens) through ../house.css, so Studio and every hub

     the status colours on the dark frame. */
  :root { --me: var(--ljr-7); --bd: var(--line); --band: var(--card); --chip: transparent;
    --w2: #C32924; --w3: #9E5802; --w4: #766602; --w5: #217A2D; --w6: #0271A4; --w7: #8850B6;
    --frame-ok: #8BCF8F; --frame-bad: #F28B85; --frame-warn: #F2A65A; }

  @media (prefers-color-scheme: light) { :root.words-light:not([data-theme="dark"]) { --w2: #D93732; --w3: #AD6202; --w4: #877402; --w5: #258631; --w6: #027BB5; --w7: #915CBC; } }
  :root.words-light[data-theme="light"] { --w2: #D93732; --w3: #AD6202; --w4: #877402; --w5: #258631; --w6: #027BB5; --w7: #915CBC; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bd: var(--line); --band: var(--card); --chip: transparent;
      --w2: #F28B85; --w3: #F2A65A; --w4: #E9D46A; --w5: #8BCF8F; --w6: #6CC4F2; --w7: #C9A2EA; }
    :root.look-cool:not([data-theme="light"]) { --bd: var(--line); --band: var(--card); --chip: var(--card); }
  }
  :root[data-theme="dark"] { --bd: var(--line); --band: var(--card); --chip: transparent;
    --w2: #F28B85; --w3: #F2A65A; --w4: #E9D46A; --w5: #8BCF8F; --w6: #6CC4F2; --w7: #C9A2EA; }
  :root.look-cool[data-theme="dark"] { --bd: var(--line); --band: var(--card); --chip: var(--card); }
  /* Coloured words are the darker set (Look › Coloured words › Lighter swaps it). */
  :root, :root[data-theme] { --ljr-2-text: var(--w2); --ljr-3-text: var(--w3); --ljr-4-text: var(--w4); --ljr-5-text: var(--w5); --ljr-6-text: var(--w6); --ljr-7-text: var(--w7); }

<script>

 *        Optional per asset: stageSince (ISO, when it entered its stage) for "In this step: N days"; else its last change.
