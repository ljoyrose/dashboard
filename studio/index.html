  :root.words-light[data-theme="light"] { --w2: #D93732; --w3: #AD6202; --w4: #877402; --w5: #258631; --w6: #027BB5; --w7: #915CBC; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Lexend, system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  .hidden { display: none !important; }

  .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }

  .btn.main { border-color: var(--ink); }
  #backHome { min-height: 44px; }
  html.dash-locked #backHome { margin-left: auto; } /* signed out the title is hidden, so the button keeps its top-right place */
  .btn[disabled] { cursor: not-allowed; opacity: .55; }
  /* Five tabs in a bar at the bottom, like Marketplace (thumb reach on the phone); a sub-row of links inside Line, Decide and Kits. */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 6px 8px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
  nav.tabs a { text-decoration: none; font-size: 13px; font-weight: 700; color: var(--ink); min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: var(--radius); border: 1px solid transparent; padding: 4px 2px; text-align: center; position: relative; }
  /* Bottom tabs: no ring or inner line. Hover and selected = the small colour bar above the label grows (same height, so nothing moves). */
  nav.tabs a .bar { width: 18px; height: 4px; border-radius: 2px; background: var(--tc); opacity: .55; transition: width .15s ease-out, opacity .15s ease-out; }
  nav.tabs a[aria-current="page"] .bar { width: 40px; opacity: 1; }
  @media (hover: hover) { nav.tabs a:hover .bar { width: 40px; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { nav.tabs a .bar { transition: none; } }
  @media (min-width: 900px) { nav.tabs { max-width: 900px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-radius: var(--radius) var(--radius) 0 0; } }
  html { scroll-padding-bottom: 96px; }
  .subnav { display: flex; gap: 6px; flex-wrap: wrap; }
  .subnav a { text-decoration: none; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; gap: 6px; align-items: center; color: var(--ink); min-height: 44px; box-sizing: border-box; }
  /* One line rule (like Links and HubSpot): every edge is 1px; hover = selected = that same 1px edge turns ink (an outline laid exactly over it), so it darkens, never thickens or moves. Keyboard focus keeps the 2px ink ring. */
  .subnav a[aria-current="page"], .pill.on, .ch.on, .fbtn.on, .vsw button[aria-pressed="true"], .seg button[aria-pressed="true"] { outline: 1px solid var(--sel-bd); outline-offset: -1px; background: var(--sel-fill); }
  @media (hover: hover) { .pill:hover, .btn:hover, .ch:hover, .lk:hover, .more:hover, .undo:hover, .fbtn:hover, .subnav a:hover, .vsw button:hover, .seg button:hover, .achip:hover, .ico:hover, a.tag:hover, .chk li button:hover, .room:hover, .col-list .crow:hover { outline: 1px solid var(--sel-bd); outline-offset: -1px; } }
  .n:empty { display: none; }
  /* Every standalone count wears the same ring: 1px ink, pill, 700, tabular. "Needs you" counts (Me, Decide, Do tabs) add a rose edge and tint,

  .cnt, nav.tabs .n, .fbtn .n:not(:empty) { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 7px; border: 1px solid var(--ink); border-radius: 999px; font-size: 13px; font-weight: 700; line-height: 1; color: var(--ink); background: transparent; font-variant-numeric: tabular-nums; }
  nav.tabs .n.need { border-color: var(--ljr-2); background: var(--ljr-2-tint); color: var(--ink); }
  .ti { font-size: 18px; line-height: 1; color: var(--muted); }

  #view { display: flex; flex-direction: column; gap: 14px; }

  .pill.warn { border-color: var(--ljr-3); } .pill.bad { border-color: var(--ljr-2); } .pill.ok .ti { color: var(--ljr-5-text); }

  .date { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .appcard { padding-top: 10px; }

  .room .grp { margin: 0; font-size: 15px; }

  .stage .n { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: transparent; border: 1px solid var(--line); color: var(--muted); flex: none; }

  .sbox { flex: 1; min-width: 0; display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); padding: 0 12px; background: var(--surface); }

  img.thumb { display: block; max-width: 100%; max-height: 240px; border-radius: var(--radius); border: 1px solid var(--line); margin-bottom: 8px; }
  .ask .fin { flex: 1; min-width: 0; }

  .row .bar { width: 6px; align-self: stretch; border-radius: var(--radius); background: color-mix(in srgb, var(--c) 18%, transparent); box-shadow: inset 0 0 0 1px var(--c); flex: none; }

  /* Calm focus: one line, a shade darker. */
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--muted); }
  a:focus, button:focus { outline: none; }

  a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-color: var(--ink) !important; }

  html.board-on main.wrap { padding-bottom: 0; }

  .btn, .vsw button, .lk, .ico { border-radius: 999px; }

  .subnav { gap: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }

  @media (max-width: 544px) { .btn, .subnav a { min-height: 44px; } }
  /* Frame (Lisa's choice): dark top bar and dark bottom tab bar, never black. The footer is a step lighter on purpose:

  header { background: var(--frame); color: var(--frame-ink); border-bottom: 0; }
  header .top { padding-top: 12px; padding-bottom: 12px; }
  header .top > h1 a, header .top > .stamp, header .top > .pill, header .top > .btn, header .lookwrap > .btn { color: var(--frame-ink); background: transparent; border-color: var(--frame-line); }
  header .top > .pill .ti, header .top > .btn .ti, header .lookwrap > .btn .ti { color: var(--frame-ink); }
  header .top > .btn.main { border-color: var(--frame-ink); }
  header .top > .pill.ok { border-color: var(--frame-ok); } header .top > .pill.ok .ti { color: var(--frame-ok); }
  header .top > .pill.warn { border-color: var(--frame-warn); } header .top > .pill.bad { border-color: var(--frame-bad); }
  @media (hover: hover) { header .top > .pill:hover, header .top > .btn:hover, header .lookwrap > .btn:hover { outline-color: var(--frame-ink); } } /* the same 1px line, in the frame's ink */
  header .top > a:focus-visible, header .top > button:focus-visible, header .lookwrap > button:focus-visible { outline-color: var(--frame-ink); border-color: var(--frame-ink) !important; }
  nav.tabs { background: var(--frame-foot); border-top: 0; gap: 8px; padding-top: 8px; padding-left: 8px; padding-right: 8px; }
  @media (min-width: 900px) { nav.tabs { border-left: 0; border-right: 0; } }
  /* Phone header: dot + Studio, the status pills and one "More" menu (Refresh, Look, New, Sign out, Dashboard). Desktop unchanged. */
  .morewrap { position: relative; display: none; margin-left: auto; }
  #moreMenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 25; width: 220px; background: var(--card); border: 1px solid var(--bd); border-radius: 16px; box-shadow: var(--shadow), 0 8px 24px rgba(0,0,0,.18); padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  #moreMenu.hidden { display: none; }
  #moreMenu > * { font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 999px; min-height: 44px; padding: 0 14px; display: flex; gap: 8px; align-items: center; text-decoration: none; cursor: pointer; text-align: left; }
  #moreMenu > * .ti { color: var(--ink); }
  @media (hover: hover) { #moreMenu > *:hover { outline: 1px solid var(--sel-bd); outline-offset: -1px; } }
  @media (max-width: 544px) {
    html.signed-in .morewrap:not(.hidden) { display: inline-flex; }
    html.signed-in header .top > #refreshBtn, html.signed-in header .top > #newBtn, html.signed-in header .top > #signOutBtn, html.signed-in header .top > #backHome, html.signed-in .lookwrap > #lookBtn { display: none !important; }
    html.signed-in .lookwrap { position: static; }
    html.signed-in #lookMenu { position: fixed; top: 64px; left: 8px; right: 8px; width: auto; }
    header .top > .btn, header .top > .pill { min-height: 44px; }
  }
  @media (max-width: 760px) {
    .board { scroll-snap-type: x mandatory; }
    .col { flex-basis: calc(100vw - 48px); }
  }
</style>

<script>
/* ============================================================================================
 * STUDIO: Lisa's asset hub (idea → approved → reused). Page shell only; the engine (Apps Script
 * STUDIO-ENGINE) writes studio-state.json and reads the request files this page drops.
 *
 * Reads  config.js › studio.logsFolderId / studio-state.json (by folder + exact name, no-store, every 5 min).
 *        Not there yet → the built-in EXAMPLE state, a banner, and every write switched off.
 * Writes one JSON request file per click into studio.requestsFolderId (Lisa's own sign-in, drive scope):
 *        { kind, at, by, accountId, assetId?, ... }   kinds: approve · redo {note} · bin · gate {verdict} ·
 *        idea {brief + groupId, playbookId, kitId, outcome, frameworkId, voiceId, lookId, formatIds, language, length,
 *        masterId, purpose, sources: [{ kind: link|upload|note, url, fileName, note, rights }]} · set {who | priority} · studio {on} ·
 *        tool {product, thing, unit, capabilities, inputs, outputs, fit, costPerUnit, allowance, period, resetsOn, carriesOver,
 *        accountNotes, audit} · done {assetId, creditsUsed?: {product, units}} · check {brandId, item, ok} ·
 *        source {assetId, source}.   Undo = the request file goes to Drive Trash
 *        before the engine's next run (every 15 min at :03 :18 :33 :48).
 *
 * studio-state.json (written by the engine):
 * {
 *   generated_at: ISO,
 *   studio: { on: bool, mode: 'TEST'|'LIVE', budgetMonth: number (£), spentMonth: number (£) },
 *   health: { lastRun: ISO|null, jobs: [{ job, result: 'OK'|'FAILED'|'OFF', last: ISO, note }] },
 *   accounts: [{ id, name, kind: 'owner'|'client' }]   (client-ready: every record below carries accountId)
 *   products: [{ id, accountId, brandId, name, type: 'physical'|'digital'|'lead-magnet'|'low-ticket'|'book'|'course'|'app'|'service' }],
 *   brands: [{ id, accountId, name, colour: LJR7 slot 0-8, stage: 'Concept'|'Name check'|'Identity'|'Tech set-up'|'Launch'|'Running',
 *              setupChecklist: [{ name, ok: bool }], groupId|null, voiceId|null, lookId|null }],
 *   groups: [{ id, name }]   (WHERE ladder: Group › Business (brand) › Product)
 *   assets: [{ id, accountId, title, brandIds: [id], productId, projectName, type (see TYPES), recipe, size: 'S'|'M'|'L',
 *              stage: 0-8 (0 Idea · 1 Research · 2 Recipe · 3 Spec lock · 4 Inputs · 5 Make · 6 Check · 7 Approve · 8 Operate),
 *              who: 'lisa'|'claude'|'grok'|'engine', fit: 'AUTO'|'HAND', evergreen: bool, dated: bool, eventDate: 'YYYY-MM-DD'|null,
 *              provider, cost (£), rating (0-5), reviewLink, docLink, version, priority: 'urgent'|'high'|'normal'|'low'|null,
 *              updated: ISO, flags: [string],
 *              gate: { question, at: ISO } | null   (a gate waiting on Lisa: GO · HOLD · RESHAPE · REFINE · KILL · RECYCLE),
 *              kitId, groupId, playbookId, outcome: 'attract'|'convert'|'deliver'|'keep'|'reuse'|null, frameworkId, voiceId, lookId,
 *              formatIds: [id], language, length, masterId (variant of), purpose: 'refresh'|'rebrand'|'reformat'|'translate'|'test'|null,
 *              test (A/B group id), result, sourceIds: [id] }],   (ids are null when not set)
 *   ideas:  [same shape as assets, stage 0],
 *   playbooks: [{ id, name, outcome, steps: [{ kind: 'pack'|'kit'|'action', id|null, text }], notes }],   (WHAT ladder: Brick › Kit › Pack › Playbook)
 *   packs:  [{ id, name, kind (e.g. funnel), kitIds: [id], notes }],
 *   kits:   [{ id, name, type, brickIds, needs: [capability], frameworkId, voiceId, lookId, formatIds, notes }],
 *   bricks: [{ id, name, kind, text, link, notes }],
 *   frameworks / voices / looks (STYLE): [{ id, name, steps: [string], when, notes, + source (internal) | brandId | kind }],
 *   formats: [{ id, name, channel, ratio, size, maxLength, safeZone, fileType, notes }],
 *   sources: [{ id, targetId, kind: 'link'|'upload'|'note', url, fileName, note, rights: 'inspiration'|'own'|'licensed'|'client', by, at }],
