<style>
  /* Colours: ../tokens.css only (LJR7 spine). Studio = slot 7. One radius, one border state, nothing under 13px. */
  :root { --radius: 12px; --bg: var(--ljr-cream); --surface: var(--ljr-paper); --ink: var(--ljr-ink); --muted: var(--ljr-muted);
    --line: color-mix(in srgb, var(--ljr-0) 55%, var(--ljr-paper)); --me: var(--ljr-7); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Lexend, system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  .hidden { display: none !important; }
  a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  a.pill, a.btn, a.lk, nav.tabs a, .grp a, a.cnt { text-decoration: none; color: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  header .top, header nav.tabs, main.wrap { max-width: 1600px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
  @media (max-width: 600px) { header .top, header nav.tabs, main.wrap { padding-left: 16px; padding-right: 16px; } }
  .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
  .top h1 { font-size: 22px; margin: 0 auto 0 0; display: flex; gap: 8px; align-items: center; }
  .top h1 a { text-decoration: none; }
  .top h1 .dot { background: var(--me); }
  .stamp { font-size: 13px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 6px; }
  .stamp:empty { display: none; }
  .btn { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 7px 14px; min-height: 36px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .btn.main { border-color: var(--ink); }
  #backHome { min-height: 44px; }
  html.dash-locked #backHome { margin-left: auto; } /* signed out the title is hidden, so the button keeps its top-right place */
  .btn[disabled] { cursor: not-allowed; opacity: .55; }
  nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  nav.tabs a { flex: none; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); display: inline-flex; gap: 6px; align-items: center; }
  nav.tabs a.new { margin-left: auto; }
  /* One state only: hover = selected = a slightly heavier faint line. Same width always, so nothing moves. */
  nav.tabs a:hover, nav.tabs a[aria-current="page"], .pill:hover, .pill.on, .btn:hover, .ch:hover, .ch.on, .lk:hover, .more:hover, .undo:hover { border-color: var(--muted); }
  .n:empty { display: none; }
  .cnt, nav.tabs .n { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 7px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; font-weight: 600; line-height: 1; color: var(--ink); background: transparent; }
  .ti { font-size: 18px; line-height: 1; color: var(--muted); }
  /* Icons grey at rest, their own colour on hover. */
  .ico:hover .ti, .pill:hover .ti, .lk:hover .ti, .btn:hover .ti, .ch:hover .ti, .ch.on .ti { color: var(--hc, var(--ink)); }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  main.wrap { padding-top: 16px; padding-bottom: 48px; display: flex; flex-direction: column; gap: 14px; }
  #view { display: flex; flex-direction: column; gap: 14px; }
  .banner { border: 1.5px solid var(--ljr-2); border-radius: var(--radius); padding: 10px 14px; color: var(--ink); display: flex; gap: 8px; align-items: center; }
  .banner.info { border-color: var(--line); }
  .banner.ex { border-color: var(--me); }
  .banner.ex .ti { color: var(--ljr-7-text); }
  .card { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pill { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); border-radius: 999px; padding: 3px 10px; border: 1.5px solid var(--line); background: var(--surface); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .pill .cnt { min-width: 22px; height: 22px; }
  .pill.warn { border-color: var(--ljr-3); } .pill.bad { border-color: var(--ljr-2); } .pill.ok .ti { color: var(--ljr-5-text); }
  .pill.stg { border-color: var(--c); min-width: 34px; justify-content: center; }
  .pill.stg.on { border-color: var(--ink); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; display: inline-block; }
  .grp { font-size: 16px; font-weight: 700; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grp .st { font-size: 13px; font-weight: 600; color: var(--muted); }
  .grp .cnt { margin-left: auto; }
  .sect { font-size: 14px; font-weight: 700; color: var(--muted); display: flex; gap: 8px; align-items: center; margin: 10px 0 0; }
  .sect:first-child { margin-top: 0; }
  .sect a { color: var(--ink); text-decoration: none; }
  /* Rows (the Factory calm row): type icon · title · flag; icons; actions; stage strip. */
  .crow { padding: 10px 0; border-top: 1px solid var(--line); }
  .grp + .crow, .sect + .crow { border-top: 0; }
  .crow .l1 { display: flex; gap: 8px; align-items: flex-start; }
  .crow .type { flex: none; width: 28px; display: inline-flex; justify-content: center; }
  .crow .ttl { all: unset; flex: 1; min-width: 0; cursor: pointer; font-weight: 500; overflow-wrap: anywhere; }
  .crow .ttl b { font-weight: 700; margin-right: 4px; }
  .crow .ttl:focus-visible { text-decoration: underline; }
  .crow .l2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .crow .icons { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; flex: 1; min-width: 0; }
  .crow .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .q1 { font-size: 15px; margin: 4px 0 0; }
  .crow .l3 { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
  .crow .l3 .grow { flex: 1; }
  .date { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .appcard { padding-top: 10px; }
  .room { border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .room:hover, .room:focus-within { border-color: var(--c); }
  .room .grp { margin: 0; font-size: 15px; }
  .room .stn { font-size: 13px; color: var(--muted); margin-top: -6px; }
  .hero { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
  .disc { width: 42px; height: 42px; border-radius: 50%; background: var(--c); color: var(--ljr-6-on); display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
  .hero h2 { margin: 0; font-size: 20px; }
  .hero p { margin: 0; color: var(--muted); font-size: 14px; }
  .stage { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .stage .n { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: var(--bg); border: 1px solid var(--line); flex: none; }
  .stage.d .n { background: var(--ljr-5); border-color: var(--ljr-5); color: var(--ljr-5-on); }
  .stage.c .n { background: var(--ljr-7-solid); border-color: var(--ljr-7-solid); color: var(--ljr-7-on); }
  .stage.c { font-weight: 600; }
  .ico { position: relative; background: none; border: 1px solid transparent; border-radius: var(--radius); min-width: 32px; height: 32px; padding: 0 4px; display: inline-flex; gap: 3px; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); font: inherit; font-size: 13px; }
  .ico:hover, .ico.on { border-color: var(--line); }
  .tag { font-size: 13px; color: var(--ink); display: inline-flex; gap: 3px; align-items: center; padding: 0 6px; border: 1px solid var(--line); border-radius: 999px; }
  .tag.over { border-color: var(--ljr-2); }
  .lk { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: var(--radius); }
  .lk.no { border-style: dashed; opacity: .7; }
  .acts .btn { padding: 4px 12px; }
  .acts .btn.yes:hover { border-color: var(--ljr-5); } .acts .btn.yes .ti { --hc: var(--ljr-5-text); }
  .acts .btn.no:hover { border-color: var(--ljr-2); } .acts .btn.no .ti { --hc: var(--ljr-2-text); }
  .sent { font-size: 14px; color: var(--muted); }
  .undo { font: inherit; font-size: 14px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; margin-left: 6px; display: inline-flex; gap: 4px; align-items: center; }
  .strip { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; margin: 8px 0 2px; }
  .strip i { height: 8px; border-radius: var(--radius); background: var(--line); }
  .strip i.d { background: var(--ljr-5); } .strip i.c { background: var(--me); }
  .strip.b6 { grid-template-columns: repeat(6, 1fr); }
  .panel { margin: 8px 0 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 14px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .more { font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); background: none; border: 1px solid transparent; border-radius: var(--radius); padding: 4px 10px; margin-top: 4px; cursor: pointer; }
  .info { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border: 1px solid var(--line); border-radius: 50%; font-size: 13px; color: var(--muted); cursor: help; margin-left: 4px; vertical-align: 1px; }
  /* Find bar: Search · Brand · Type always; Stage · Who · Fit · Timing · Flags · Sort · TEST behind Filter. */
  .fbar { display: flex; flex-direction: column; gap: 8px; }
  .srow { display: flex; gap: 8px; align-items: center; }
  .sbox { flex: 1; min-width: 0; display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); padding: 0 12px; background: var(--surface); }
  .sbox:focus-within { border-color: var(--muted); }
  .sbox input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--ink); font: inherit; font-size: 15px; padding: 8px 0; }
  .fbtn { font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .fbtn:hover, .fbtn.on { border-color: var(--muted); }
  .fpanel { display: flex; flex-direction: column; gap: 8px; }
  .flab { font-size: 13px; font-weight: 700; color: var(--muted); min-width: 52px; }
  .sw { display: inline-block; width: 28px; height: 16px; border-radius: var(--radius); border: 1.5px solid var(--muted); position: relative; vertical-align: middle; }
  .sw i { position: absolute; top: 2px; left: 2px; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .sw.on { border-color: var(--ljr-5); } .sw.on i { left: 14px; background: var(--ljr-5); }
  .empty { display: flex; gap: 12px; align-items: center; }
  /* Brands */
  .bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .blab { font-size: 14px; font-weight: 600; margin-top: -4px; }
  .chk { list-style: none; margin: 8px 0 0; padding: 0; font-size: 14px; }
  .chk li { display: flex; gap: 6px; align-items: center; padding: 2px 0; }
  .chk li.ok .ti { color: var(--ljr-5-text); }
  /* Tools: credit meters */
  .meter { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .meter:first-of-type { border-top: 0; }
  .meter .bar { width: 6px; border-radius: var(--radius); background: var(--c); flex: none; }
  .meter .txt { flex: 1; min-width: 0; }
  .meter .track { height: 10px; border-radius: var(--radius); background: var(--line); margin: 6px 0; overflow: hidden; }
  .meter .track i { display: block; height: 100%; background: var(--c); border-radius: var(--radius); }
  .meter .nums { display: flex; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  .meter .why { font-size: 14px; display: flex; gap: 6px; align-items: center; margin-top: 4px; }
  .meter .why .ti { color: var(--c); }
  /* Form */
  .fq { padding: 10px 0; border-top: 1px solid var(--line); }
  .fq:first-of-type { border-top: 0; }
  .fq .qt { font-size: 15px; margin: 0 0 6px; position: relative; padding-right: 22px; }
  .fq .req { position: absolute; right: 0; top: 0; color: var(--ljr-2-text); font-weight: 700; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .ch { font: inherit; font-size: 14px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
  .ch .dot { width: 9px; height: 9px; }
  .fin { width: 100%; font: inherit; font-size: 15px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: transparent; color: var(--ink); }
  textarea.fin { min-height: 72px; resize: vertical; }
  .ferr { font-size: 14px; margin-top: 4px; }
  .ferr::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ljr-2); margin-right: 6px; }
  .frow { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
  .ask { display: flex; gap: 8px; }
  .ask .fin { flex: 1; min-width: 0; }
  .row { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .bar { width: 6px; align-self: stretch; border-radius: var(--radius); background: var(--c); flex: none; }
  .row .txt { flex: 1; min-width: 0; }
  .row .meta { font-size: 14px; color: var(--muted); text-align: right; }
  /* Calm focus: one line, a shade darker. */
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--muted); }
  a:focus, button:focus { outline: none; }
  a:focus-visible, button:focus-visible { outline: none; border-color: var(--ink) !important; }
  footer { color: var(--muted); font-size: 13px; padding: 0 16px 24px; }
</style>

<script>
/* ============================================================================================
 * STUDIO: Lisa's asset hub (idea → approved → reused). Page shell only; the engine (Apps Script
 * STUDIO-ENGINE) writes studio-state.json and reads the request files this page drops.
 *
 * Reads  config.js › studio.logsFolderId / studio-state.json (by folder + exact name, no-store, every 5 min).
 *        Not there yet → the built-in EXAMPLE state, a banner, and every write switched off.
 * Writes one JSON request file per click into studio.requestsFolderId (Lisa's own sign-in, drive scope):
 *        { kind, at, by, accountId, assetId?, ... }   kinds: approve · redo {note} · bin · gate {verdict} ·
 *        idea {brief} · set {who | priority} · studio {on}.   Undo = the request file goes to Drive Trash
 *        before the engine's next run (every 15 min at :03 :18 :33 :48).
 *
 * studio-state.json (written by the engine):
 * {
 *   generated_at: ISO,
 *   studio: { on: bool, mode: 'TEST'|'LIVE', budgetMonth: number (£), spentMonth: number (£) },
 *   health: { lastRun: ISO|null, jobs: [{ job, result: 'OK'|'FAILED'|'OFF', last: ISO, note }] },
 *   accounts: [{ id, name, kind: 'owner'|'client' }]   (client-ready: every record below carries accountId)
 *   products: [{ id, accountId, brandId, name, type: 'physical'|'digital'|'lead-magnet'|'low-ticket'|'book'|'course'|'app'|'service' }],
 *   brands: [{ id, accountId, name, colour: LJR7 slot 0-8, stage: 'Concept'|'Name check'|'Identity'|'Tech set-up'|'Launch'|'Running',
 *              setupChecklist: [{ name, ok: bool }] }],
 *   assets: [{ id, accountId, title, brandIds: [id], productId, projectName, type (see TYPES), recipe, size: 'S'|'M'|'L',
 *              stage: 0-8 (0 Idea · 1 Research · 2 Recipe · 3 Spec lock · 4 Inputs · 5 Make · 6 Check · 7 Approve · 8 Operate),
 *              who: 'lisa'|'claude'|'grok'|'engine', fit: 'AUTO'|'HAND', evergreen: bool, dated: bool, eventDate: 'YYYY-MM-DD'|null,
 *              provider, cost (£), rating (0-5), reviewLink, docLink, version, priority: 'urgent'|'high'|'normal'|'low'|null,
 *              updated: ISO, flags: [string],
 *              gate: { question, at: ISO } | null   (a gate waiting on Lisa: GO · HOLD · RESHAPE · REFINE · KILL · RECYCLE) }],
 *   ideas:  [same shape as assets, stage 0],
 *   tools:  [{ product, thing, unit, allowance, period, resetsOn: 'YYYY-MM-DD', used, left, carriesOver: bool, fit: 'AUTO'|'HAND' }],
 *   failed: [{ assetId, kind }]   (requests the engine could not apply; the page clears their ✓)
 * }
 * Lists: Me = Review (stage 7) + Gates + Hand jobs (fit HAND, who lisa). Ideas = stage 0. Assets = 1-7. Library = 8.
 * Account: an item's accountId, else its first brand's. Account chips show only when there is more than one account.
 * Test items: title starting TEST- or ZZ_DELETE_, or flag 'test': hidden unless the TEST switch is on.
 * ========================================================================================== */
(function () {
  'use strict';
  var CFG = window.DASH_CONFIG, ST = CFG.studio, CLIENT_ID = CFG.clientId, SCOPE = CFG.scopes.read, WRITE = CFG.scopes.write;
  var REFRESH_MS = 5 * 60 * 1000;
  var accessToken = null, signedIn = false, S = null, EX = false, err = null, timer = null;
  var $ = function (id) { return document.getElementById(id); };

    if (a && !a.disabled) {
      var k = a.getAttribute('data-action');

  /* ---------- Sign-in (one sign-in for the whole site, auth.js) ---------- */
