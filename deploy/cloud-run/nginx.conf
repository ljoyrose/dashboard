# Static files only. No proxying, no logins here: Google's Identity-Aware Proxy sits in front and decides who gets in.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Folder addresses redirect with a relative path, so the container's own port never shows in an address.
  absolute_redirect off;

  # The pages change often and have no build step: always ask the server, never show a stale copy.
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    try_files $uri $uri/ =404;
  }
  # Nothing hidden is ever served, even if it were copied in by mistake.
  location ~ /\. {
    return 404;
  }
}
