<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="build" content="ljr-dash-v4-money-tile-2026-10-09">
<title>Lisa Dashboard</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2C2C2A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap">
<script src="config.js"></script>
<script src="toolkit.js"></script>
<script src="auth.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="money/core.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="house.css">
<style>
  /* Colours come from ../tokens.css (one shared LJR7 file). These short names only point at it.
     Map 1 Vision · Read first/Drive 0 · PC-Personal/Drive check 4 Ops · Bin 8 · Changes/Cf 7 · Money 3. Failed reads and delete actions use 2 Risk. */
  :root {
    --s0: var(--ljr-0); --s1: var(--ljr-1); --s1-edge: var(--ljr-1-edge); --s1-stripe: var(--ljr-paper);
    --s2: var(--ljr-2); --s4: var(--ljr-4); --s7: var(--ljr-7); --s8: var(--ljr-8);
    --fail: var(--ljr-2-text); --risk-text: var(--ljr-2-text);
    --s0-tint: var(--ljr-0-tint); --s2-tint: var(--ljr-2-tint); --s4-tint: var(--ljr-4-tint); --s7-tint: var(--ljr-7-tint); --s8-tint: var(--ljr-8-tint); --fail-tint: var(--ljr-2-tint);
    --fin: var(--ljr-3); --ops: var(--ljr-4); --ok: var(--ljr-5); --fin-tint: var(--ljr-3-tint); --ops-tint: var(--ljr-4-tint); --ok-tint: var(--ljr-5-tint);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s1-stripe: var(--ljr-ink); } }
  :root[data-theme="dark"] { --s1-stripe: var(--ljr-ink); }
  * { box-sizing: border-box; }
  .skip { position: absolute; left: -999px; top: 8px; z-index: 50; background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; border: 2px solid var(--ink); }
  .skip:focus { left: 8px; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Lexend', sans-serif; font-size: 16px; line-height: 1.5;
    text-align: left; hyphens: manual; -webkit-hyphens: manual;
    font-variant-numeric: tabular-nums;
  }
  button, input { font: inherit; color: inherit; }
  a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  a:hover { text-decoration-thickness: 2px; }
  .wrap { max-width: calc(66ch + 32px); margin: 0 auto; padding: 0 16px; }
  .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Header: the only fixed element (desktop only). */
  header { background: var(--surface); border-bottom: 1px solid var(--line); }
  @media (min-width: 700px) { header { position: sticky; top: 0; z-index: 2; } }
  .top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding-top: 12px; padding-bottom: 8px; text-align: left; }
  .top h1 { font-size: 18px; font-weight: 600; margin: 0; flex: 1 1 auto; }
  .readstamp { color: var(--muted); font-size: 14px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 12px;
         border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; text-decoration: none; }
  .btn:hover { border-color: var(--muted); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.vision { border: 1px solid var(--s1-edge); background: var(--s1); font-weight: 600; }

  main { padding-top: 16px; padding-bottom: 32px; }
  .here { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; text-align: left; }
  .here span { color: var(--muted); font-size: 14px; }
  .here h2 { margin: 0; font-size: 22px; font-weight: 600; }
  #view { display: flex; flex-direction: column; gap: 16px; transition: opacity 150ms ease; }
  #view.fade { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { #view { transition: none; } }

  /* Cards: solid = established, dashed = not established. */
  .card { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--slot, var(--s0));
          border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
  .card.sec { border-radius: 12px; }
  .card.pending { border-style: dashed; }
  .card.failed { border-style: dashed; border-color: var(--fail); }
  .card.vision { --slot: var(--s1-stripe); border-color: var(--s1-edge); border-left-color: var(--s1-stripe); background: var(--s1); box-shadow: var(--shadow), -1px 0 0 0 var(--s1-edge); }
  .slot0 { --slot: var(--s0); --tint: var(--s0-tint); }
  .slot7 { --slot: var(--s7); --tint: var(--s7-tint); }
  .slot2 { --slot: var(--s2); --tint: var(--s2-tint); }
  .slot4 { --slot: var(--s4); --tint: var(--s4-tint); }
  .slot8 { --slot: var(--s8); --tint: var(--s8-tint); }
  .slotsales { --slot: var(--ljr-6); --tint: var(--ljr-6-tint); }
  .card h3, .card h2.h3 { margin: 0; font-size: 18px; font-weight: 600; text-align: left; }
  .cardhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .note { margin: 0; color: var(--muted); font-size: 14px; text-align: left; }
  .note.fail { color: var(--fail); font-weight: 600; }
  ul.notes { margin: 4px 0 8px; padding-left: 20px; color: var(--muted); font-size: 14px; }
  ul.notes li { margin: 2px 0; }
  .source { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); padding-top: 8px; text-align: left; }
  .source a { color: var(--muted); }

  /* State badge: colour + shape + word. */
  .state { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .shape { width: 12px; height: 12px; flex: none; display: inline-block; }
  .st-ok .shape { border-radius: 50%; background: var(--slot, var(--s0)); }
  .st-empty .shape { border: 2px solid var(--slot, var(--s0)); border-radius: 2px; }
  .st-idle .shape { border: 2px solid var(--muted); border-radius: 50%; }
  .st-loading .shape { border: 2px dashed var(--muted); border-radius: 50%; }
  .st-failed { color: var(--fail); font-weight: 600; }
  .st-failed .shape { background: var(--fail); clip-path: polygon(20% 0, 50% 30%, 80% 0, 100% 20%, 70% 50%, 100% 80%, 80% 100%, 50% 70%, 20% 100%, 0 80%, 30% 50%, 0 20%); }

  /* Figures: thing, then number, then action. */
  .figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .fig { gap: 4px; padding: 12px 16px; }
  .fig .label { font-size: 14px; color: var(--muted); text-align: left; }
  .fig .num { font-size: 32px; font-weight: 600; line-height: 1.2; }
  .fig .meta { font-size: 14px; color: var(--muted); text-align: left; }
  .fig .act { font-size: 14px; font-weight: 600; margin-top: 4px; }

  /* Lists */
  ul.files { list-style: none; margin: 0; padding: 0; }
  ul.files li { padding: 8px 0; border-top: 1px solid var(--line); text-align: left; }
  ul.files li:first-child { border-top: none; padding-top: 0; }
  .fname { font-weight: 600; overflow-wrap: anywhere; hyphens: none; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--muted); font-size: 14px; }
  .chip { font-size: 13px; background: var(--tint, var(--s0-tint)); color: var(--ink); border-radius: 8px; padding: 0 8px; line-height: 1.6; overflow-wrap: anywhere; }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .pager .count { font-size: 14px; color: var(--muted); }
  .pager .gap { width: 1px; }
  .subnav { display: flex; flex-wrap: wrap; gap: 8px; }
  .subnav a { padding: 4px 12px; border-radius: 12px; border: 1px solid var(--line); border-left: 3px solid var(--s7); background: var(--surface); text-decoration: none; font-size: 14px; }
  .subnav a[aria-current="page"] { font-weight: 600; background: var(--s7-tint); border-color: var(--s7); }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat { background: var(--tint, var(--s0-tint)); border-radius: 12px; padding: 8px 12px; text-align: left; }
  .stat .num { font-size: 24px; font-weight: 600; }
  .stat .label { font-size: 14px; color: var(--muted); }

  /* Named next steps */
  .next { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 8px; }
  .next a { text-align: left; text-decoration: none; font-weight: 600; flex-direction: row; align-items: center; gap: 8px; }
  .next a .k { color: var(--muted); font-weight: 400; }

  .banner { border-radius: 16px; padding: 12px 16px; border: 1px dashed var(--fail); background: var(--fail-tint); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; text-align: left; }
  .banner.info { border-color: var(--line); background: var(--surface); }
  .banner p { margin: 0; flex: 1 1 200px; }
  /* Shared-drive picker and Bin */
  .card h4 { margin: 0; font-size: 16px; font-weight: 600; text-align: left; overflow-wrap: anywhere; }
  .picker { display: flex; flex-direction: column; gap: 4px; text-align: left; }
  .picker label { font-size: 14px; color: var(--muted); }
  .picker select { font: inherit; min-height: 40px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line);
                   background: var(--surface); color: var(--ink); width: 100%; max-width: 100%; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--muted); text-align: left; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn.danger { border-color: var(--risk-text); color: var(--risk-text); font-weight: 600; }
  .btn.danger.solid { background: var(--ljr-2-solid); color: var(--ljr-2-on); }
  .btn.ai { border-color: var(--ljr-7-solid); background: var(--ljr-7-solid); color: var(--ljr-7-on); font-weight: 600; }
  /* Folded cards: summary always shows title + count; body opens on click and stays open across redraws. */
  details.fold > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 32px; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary h3, details.fold > summary h4 { display: flex; align-items: center; gap: 8px; }
  details.fold > summary h3::before, details.fold > summary h4::before { content: '\25B8'; color: var(--muted); font-size: 14px; }
  details.fold[open] > summary h3::before, details.fold[open] > summary h4::before { content: '\25BE'; }
  details.fold > .fbody { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; min-width: 0; }
  details.subfold { border-top: 1px solid var(--line); padding-top: 8px; }
  .scrollbox { max-height: 280px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
  .index { display: flex; flex-wrap: wrap; gap: 8px; }
  .index.top { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .index .btn { font-size: 14px; padding: 4px 12px; }
  .index.top .btn { padding: 8px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
  .index.top .btn b { font-weight: 600; }
  .index .n { color: var(--muted); font-size: 13px; }
  input.find { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
  .binsec { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  .binsec:first-of-type { border-top: none; padding-top: 0; }
  .hidden-by-filter { display: none !important; }
  .res { font-size: 14px; text-align: left; margin: 0; }
  .res.ok { color: var(--muted); }
  .res.bad { color: var(--fail); font-weight: 600; }
  .skip { color: var(--fail); font-size: 14px; }
  label.tick { display: flex; align-items: flex-start; gap: 8px; text-align: left; font-weight: 600; }
  label.tick input { width: 18px; height: 18px; margin: 4px 0 0; flex: none; }
  label.tick span { overflow-wrap: anywhere; min-width: 0; }
  /* Money tile: Finances copper for money, Operations for to-dos and dates, Risks for overdue, Connections for on track. */
  .slotfin { --slot: var(--fin); --tint: var(--fin-tint); }
  .mtag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; background: var(--mt, var(--s0-tint)); border-radius: 8px; padding: 0 8px; white-space: nowrap; }
  .mtag::before { content: ''; width: 9px; height: 9px; background: var(--mc, var(--s0)); border-radius: 50%; flex: none; }
  .mtag.risk { --mc: var(--s2); --mt: var(--s2-tint); } .mtag.risk::before { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); width: 10px; height: 10px; }
  .mtag.ops { --mc: var(--ops); --mt: var(--ops-tint); }
  .mtag.ok { --mc: var(--ok); --mt: var(--ok-tint); }
  .mtag.fin { --mc: var(--fin); --mt: var(--fin-tint); }
  .mtag.bin { --mc: var(--s8); --mt: var(--s8-tint); } .mtag.bin::before { border-radius: 0; }
  /* Needs you today: one short list, at most 7 rows, each in its LJR7 colour. */
  .needs ol { list-style: none; margin: 8px 0 0; padding: 0; }
  .needs li { display: flex; gap: 10px; align-items: baseline; padding: 8px 0 8px 10px; border-top: 1px solid var(--line, rgba(0,0,0,.08)); border-left: 3px solid var(--nc, var(--s0)); }
  .needs li:first-child { border-top: 0; }
  .needs li.n-risk { --nc: var(--s2); } .needs li.n-fin { --nc: var(--fin); } .needs li.n-ops { --nc: var(--ops); } .needs li.n-bin { --nc: var(--s8); }
  .needs .nt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .ments { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .ment { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--fin); border-radius: 12px; padding: 8px 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
  .ment.bad { background: var(--s2-tint); border-left-color: var(--s2); }
  .ment .num { font-size: 26px; font-weight: 600; line-height: 1.2; }
  .ment .who { font-weight: 600; }
  .ment .sub { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .mgroup { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0; text-align: left; }
  .hidden { display: none !important; }
  /* Home screen shortcuts. One tap each, tall enough for a thumb. */
  #key-projects h2 { margin: 0; font-size: 20px; font-weight: 600; text-align: left; hyphens: manual; }
  #key-projects .lead { margin: 0; font-size: 16px; text-align: left; color: var(--ink); hyphens: manual; }
  #key-projects .lead a { font-weight: 600; }
  .keytiles { display: grid; grid-template-columns: 1fr; gap: 8px; }
  @media (min-width: 700px) { .keytiles { grid-template-columns: 1fr 1fr; } }
  a.keytile { display: flex; align-items: center; min-height: 48px; padding: 12px 16px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--bg); color: var(--ink); text-decoration: none; font-size: 17px; font-weight: 600;
    line-height: 1.3; text-align: left; hyphens: manual; }
  a.keytile:hover { border-color: var(--ink); }
  a.keytile:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  footer { padding-bottom: 32px; text-align: left; }
  footer p { margin: 0; color: var(--muted); font-size: 14px; }

  /* ---- Calm layer (Lisa, 20 Oct 2026): one corner, faint lines, no fills on selected, colour only on hover or for attention, nothing moves. ---- */
  :root { --radius: 12px; }
  .btn, .card, .pill, .chip, .tile, .note, input, select, textarea, details, summary, .panel, .keytile { border-radius: var(--radius); }
  .subnav a { border-radius: 999px; }
  .subnav a, .subnav a[aria-current="page"] { font-weight: 600; background: transparent; border-width: 1px; border-color: var(--line); }
  .subnav a:hover, .subnav a[aria-current="page"], .btn:hover, a.keytile:hover { border-color: var(--muted); background: transparent; }
  .card, .card[class] { border-left-color: var(--line); box-shadow: none; }
  .card[class]:hover { border-left-color: var(--slot, var(--c, var(--muted))); }
  .card.vision[class] { background: var(--surface); }
  .card.vision[class]:not(:hover) { border-color: var(--line); }
  a { color: inherit; }
  .btn:active, nav.main a:active { transform: none; }
  .info { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border: 1px solid var(--line); border-radius: 50%; font-size: 13px; font-weight: 600; color: var(--muted); cursor: help; vertical-align: middle; }
  .info:hover { border-color: var(--muted); }

  /* One page width everywhere (Lisa, 20 Oct): the full window up to 1600px, 24px edge; phones 16px. No wasted space. */
  .wrap, .wrap.wide, .wide, .hin { max-width: 1600px; margin-left: auto; margin-right: auto; box-sizing: border-box; padding-left: 24px; padding-right: 24px; }
  @media (max-width: 600px) { .wrap, .wide, .hin { padding-left: 16px; padding-right: 16px; } }

  /* Fewer scrolls: on wide screens file lists use 2-3 columns. */
  @media (min-width: 900px) { ul.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 8px 12px; } ul.files > li { margin: 0; } }

/* Calm: one line width all round; colour edge only on hover. */
.card[class], details.card[class], nav.card[class], .needs li[class] { border-left-width: 1px; }
.card[class]:hover, details.card[class]:hover, .needs li[class]:hover { border-left-color: var(--slot, var(--nc, var(--line))); }

  /* Calm focus: no browser colour ring; a typing box shows a slightly darker faint line, keys still see a grey ring. */
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--muted); }
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--muted); outline-offset: 2px; }

  /* Hub V2 (25 Oct 2026, same layout as Marketplace): five sections in a bar at the bottom, in thumb reach on the phone.
     Home (the Map), Drive, Bin, Changes, More. Red number = things that need you. Nothing hides under the bar. */
  html { scroll-padding-bottom: 96px; }
  body { padding-bottom: 96px; }
  nav.main { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px;
             padding: 6px 8px 10px; margin: 0; background: var(--surface); border-top: 1px solid var(--line); }
  nav.main a { position: relative; text-decoration: none; font-size: 13px; font-weight: 600; color: var(--ink); min-height: 54px; display: flex; flex-direction: column;
               align-items: center; justify-content: center; gap: 2px; border-radius: var(--radius); border: 1.5px solid transparent; padding: 4px 2px; text-align: center; background: transparent; }
  nav.main a .icon { width: 20px; height: 20px; }
  nav.main a:hover { border-color: var(--slot, var(--line)); }
  /* Selected tab: one clean border all round plus its LJR7 tint fill (Lisa, 25 Oct: the selected pill had lost its colour). */
  nav.main a[aria-current="page"] { border: 1.5px solid var(--ink); background: var(--tint, var(--s0-tint)); }
  /* "You are here" title: focus moves here on every screen change for screen readers; it must not draw a box. */
  #hereTitle, #hereTitle:focus, #hereTitle:focus-visible { outline: none; border: 0; box-shadow: none; }
  nav.main .n { position: absolute; top: 2px; right: calc(50% - 28px); font-size: 13px; font-weight: 600; line-height: 18px; background: var(--ljr-2-solid); color: var(--ljr-2-on); border-radius: 999px; padding: 0 6px; min-width: 18px; }
  nav.main .n:empty { display: none; }
  /* Home: Needs you: N, three big count tiles that open a tab, then the one most urgent thing. */
  .needsline { font-size: 26px; font-weight: 600; margin: 0; }
  .needsline .zero { color: var(--ljr-5-text); }
  #homeTop { display: flex; flex-direction: column; gap: 12px; }
  .hometiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  a.hometile { min-height: 88px; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 10px 12px; text-decoration: none; color: var(--ink);
               background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); min-width: 0; }
  a.hometile:hover { border-color: var(--slot, var(--muted)); }
  a.hometile .v { font-size: 28px; font-weight: 600; line-height: 1.2; }
  a.hometile .k { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .urgent { display: flex; flex-direction: column; gap: 8px; }
  .urgent .what { margin: 0; font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
  .urgent .btn { min-height: 52px; justify-content: center; font-size: 16px; font-weight: 600; }
  .hint { margin: 0; font-size: 14px; color: var(--muted); }
  /* More: the other sections and hubs, one big button each. */
  .morelist { display: grid; grid-template-columns: 1fr; gap: var(--house-gap); }
  @media (min-width: 700px) { .morelist { grid-template-columns: 1fr 1fr; } }
  a.morelink { display: flex; flex-direction: row; align-items: center; gap: 10px; min-height: 56px; padding: 10px 16px; font-size: 17px; font-weight: 600; text-decoration: none; }
  a.morelink .icon { width: 20px; height: 20px; }
  a.morelink small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }

  /* ==== House look (LINKS-COMFORT-BRIEF v3, 28 Oct 2026; same as Studio). Lexend 400/600, nothing under 13px, line height 1.5.
     1px lines; hover AND selected = the same 1px edge turns ink (outline over it), nothing moves; focus 2px ink. One radius, 12px.
     No coloured words, no solid colour fills: colour lives in dots, thin bars, 1px rings and light tints. Dark frame top and bottom. ==== */
  /* Greys, lines, frame, radius, the control line, counts, date pills, tabs and the hover rule: ../tokens.css through ../house.css.
     Home's own: the Bin tab colour (slot 8 as warm charcoal, never black). */
  :root { --tc8: #3A3632; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tc8: var(--ljr-8); } }
  :root[data-theme="dark"] { --tc8: var(--ljr-8); }
  h1, h2, h3, h4, b, strong, th { font-weight: 600; }
  body { background: var(--bg); color: var(--ink); line-height: 1.5; }
  /* No coloured words: failures and warnings keep ink text and carry a small rose dot or ring instead. */
  .note.fail, .st-failed, .res.bad, .skip, .needsline .zero, .btn.danger { color: var(--ink); }
  /* Bin "why it is held" lines share the class name with the skip link and were pushed off screen with it; now they show. */
  div.skip { position: static; left: auto; top: auto; z-index: auto; background: none; padding: 0; border: 0; border-radius: 0; font-size: 14px; color: var(--ink); }
  .note.fail::before, .res.bad::before, div.skip::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; border: 1px solid var(--ljr-2); background: var(--ljr-2-tint); vertical-align: 1px; }
  /* No solid colour fills: the strong buttons are a light tint on the same clear line. */
  .btn.danger { border-color: var(--ctl); } /* the same clear line as every button; the warning is the bin icon and the words */
  .btn.danger.solid { background: var(--ljr-2-tint); color: var(--ink); border-color: var(--ctl); }
  .btn.ai { background: var(--ljr-7-tint); color: var(--ink); border-color: var(--ctl); }
  .st-empty .shape, .st-idle .shape, .st-loading .shape { border-width: 1px; }
  .st-empty .shape { border-radius: 50%; }
  /* One radius on everything; only status dots are round. */
  .banner, a.skip, .mtag, .chip, .stat, .scrollbox, .ment, a.hometile, a.keytile, .subnav a, .index .btn, .picker select, input.find, nav.main a, .info, .card { border-radius: var(--radius); }
  a.skip { border-width: 1px; }
  .banner { border-style: solid; border-color: var(--ljr-2); }
  .banner.info { border-color: var(--line); }
  /* Cards: 1px line, one 12px step; no colour stripe (colour shows on an icon ring when pointed at). */
  .card, .card[class] { border: 1px solid var(--line); padding: 12px; gap: 12px; box-shadow: var(--shadow); }
  .card.failed[class] { border-color: var(--ljr-2); }
  .card[class]:hover, details.card[class]:hover, nav.card[class]:hover { border-left-color: var(--line); }
  .card.failed[class]:hover { border-left-color: var(--ljr-2); }
  .needs li[class], .needs li[class]:hover { border-left: 0; padding-left: 0; }
  #view { gap: 12px; }
  .here h2 { font-size: 26px; }
  .card h3, .card h2.h3 { font-size: 17px; }
  /* Titles wrap to 2 lines, then … */
  .fname, .urgent .what, .needs .nt a { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  html body .fname a:focus-visible, html body .needs .nt a:focus-visible { outline-offset: -2px !important; }
  /* Two pill sizes. Read (24px): chips, tags, counts. Press (36px desktop, 44px phone): buttons, sub-tabs, inputs. */
  .chip, .mtag { height: 24px; min-height: 24px; display: inline-flex; align-items: center; box-sizing: border-box; font-size: 13px; line-height: 1; padding: 0 8px; }
  /* Read pills (tags, dates): a plain 1px ring in the clear line, muted words. Late = rose ring + tint, soon = amber ring + tint (ink words).
     The small dot before the words keeps the slot colour. Read-only: no hover. */
  .mtag { background: transparent; border: 1px solid var(--ctl); color: var(--muted); font-weight: 600; }
  .mtag.risk { border-color: var(--ljr-2); background: var(--ljr-2-tint); color: var(--ink); }
  .mtag.fin { border-color: var(--ljr-3-text); background: var(--ljr-3-tint); color: var(--ink); }
  /* Count pills: ONE exact box so 1 and 2 digits match in any font: 30 x 22, line 20px, radius 11px.
     Only 3+ digits (and worded pills) get .wide and grow. */
  .cnt, nav.main .n { width: 30px; min-width: 30px; height: 22px; min-height: 22px; line-height: 20px; padding: 0 3px; border-radius: 11px; box-sizing: border-box;
    display: inline-flex; align-items: center; justify-content: center; text-align: center; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; overflow: hidden; }
  .cnt.wide, nav.main .n.wide { width: auto; padding: 0 6px; overflow: visible; }
  .cnt { border: 1px solid var(--ctl); font-weight: 600; color: var(--ink); background: transparent; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cnt.k-risk { border-color: var(--ljr-2); background: var(--ljr-2-tint); }
  .cnt.k-fin { border-color: var(--ljr-3-text); background: var(--ljr-3-tint); }
  .btn, .subnav a, .index .btn, .index.top .btn, .picker select, input.find, .urgent .btn { min-height: 36px; font-size: 14px; font-weight: 600; }
  .btn, .subnav a, .picker select, input.find { border-color: var(--ctl); }
  .subnav a { display: inline-flex; align-items: center; }
  @media (max-width: 600px) { .btn, .subnav a, .index .btn, .index.top .btn, .picker select, input.find, .urgent .btn { min-height: 44px; } }
  /* Hover = selected = the same 1px edge turns ink. An outline laid over the edge: never thicker, never moves. */
  .subnav a[aria-current="page"] { outline: 1px solid var(--ink); outline-offset: -1px; background: transparent; border-color: var(--ctl); }
  @media (hover: hover) {
    .btn:hover, .subnav a:hover, a.keytile:hover, a.hometile:hover, a.card:hover, a.ment:hover { outline: 1px solid var(--ink); outline-offset: -1px; }
    .btn:hover, .subnav a:hover, a.keytile:hover, a.hometile:hover, a.ment:hover { border-color: var(--ctl); }
    a.ment.bad:hover { border-color: var(--ljr-2); }
    a.card[class]:hover { border-color: var(--ctl); }
  }
  /* Everything you can press rests on the same clear line (--ctl); containers keep the softer --line. No button starts out ink. */
  a.hometile, a.keytile { border-width: 1px; border-color: var(--ctl); background: var(--surface); }
  a.card, a.card[class], a.card.vision[class], a.card.vision[class]:not(:hover) { border-color: var(--ctl); }
  .ment, .ment.bad { border: 1px solid var(--ctl); background: var(--surface); }
  .ment.bad { border-color: var(--ljr-2); background: var(--ljr-2-tint); }

  a.morelink > .icon { width: 36px; height: 36px; padding: 7px; box-sizing: border-box; border: 1px solid var(--line); border-radius: var(--radius); }
  @media (hover: hover) { a.morelink:hover > .icon { border-color: var(--slot, var(--ink)); } }
  /* Keyboard focus: 2px ink ring (the one exception to 1px). The screen title keeps no box. */
  html body :focus-visible { outline: 2px solid var(--ink) !important; outline-offset: 2px !important; }
  html body #hereTitle, html body #hereTitle:focus, html body #hereTitle:focus-visible { outline: none !important; }
  /* Home: Needs you line with its urgency split, three tiles, then the Next card. */
  .needsrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .needsline { font-size: 26px; font-weight: 600; }
  .hsplit { display: inline-flex; flex-wrap: wrap; gap: 8px; }
  .hometiles { gap: 12px; }
  a.hometile .v { font-size: 28px; font-weight: 600; }
  .nextcard[class] { border-color: var(--ink); background: var(--card); }
  .nextcard .actions { gap: 12px; }
  .nextcard .hint { flex: 1 1 180px; }
  /* Friendly empty state: a small green-ring check. */
  .okstate { display: flex; flex-direction: row; align-items: center; gap: 12px; }
  .okstate h3 { margin: 0; }
  .okring { flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid var(--ljr-5); background: var(--ljr-5-tint); color: var(--ink); font-size: 15px; font-weight: 600; }
  /* Frame: dark top bar and dark bottom tab bar (never black); the bottom bar one step lighter so both read the same. */
  header { background: var(--frame); color: var(--frame-ink); border-bottom: 0; }
  .top { padding-top: 12px; padding-bottom: 12px; }
  .top h1 { font-size: 20px; color: var(--frame-ink); }
  .readstamp { color: var(--frame-ink); font-size: 14px; }
  header .btn, header .btn.vision { color: var(--frame-ink); background: transparent; border-color: var(--ctl); }
  @media (hover: hover) { header .btn:hover { outline-color: var(--frame-ink); border-color: var(--ctl); } }
  /* Signed out the sign-in gate hides the header box (and its dark frame), so the one Sign in button sits on the page: page colours. */
  html.dash-locked header .btn, html.dash-locked header .btn.vision { color: var(--ink); background: var(--surface); }
  @media (hover: hover) { html.dash-locked header .btn:hover { outline-color: var(--ink); } }
  html.dash-locked body header :focus-visible { outline-color: var(--ink) !important; }
  html body header :focus-visible { outline-color: var(--frame-ink) !important; }
  nav.main { background: var(--frame-foot); border-top: 0; gap: 8px; padding: 8px 8px calc(10px + env(safe-area-inset-bottom, 0px)); }
  @media (min-width: 601px) { nav.main { padding-left: 24px; padding-right: 24px; grid-template-columns: repeat(5, minmax(0, 220px)); justify-content: center; } }
  /* Tabs: light buttons, no rings. Hover and selected = the small colour bar above the label widens (same height, nothing moves). */
  nav.main a, nav.main a:hover, nav.main a[aria-current="page"] { border: 1px solid transparent; outline: none; box-shadow: none; background: var(--card); font-weight: 600; color: var(--ink); }
  nav.main a { --tc: var(--slot, var(--ljr-0)); }
  nav.main a.vision { --tc: var(--ink); } nav.main a.slot8 { --tc: var(--tc8); }
  nav.main a .bar { display: block; width: 18px; height: 4px; border-radius: 2px; background: var(--tc); opacity: .55; transition: width .15s ease-out, opacity .15s ease-out; }
  nav.main a[aria-current="page"] .bar { width: 40px; opacity: 1; }
  @media (hover: hover) { nav.main a:hover .bar { width: 40px; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { nav.main a .bar { transition: none; } }
  html body nav.main a:focus-visible { outline: 2px solid var(--frame-ink) !important; outline-offset: 2px !important; }
  /* Counts: a 1px ring pill in the tab's top-right corner; "needs you" counts add a rose edge and a light rose tint. */
  nav.main .n { position: absolute; top: 8px; right: 18px; left: auto;
    font-weight: 600; color: var(--ink); background: transparent; border: 1px solid var(--ctl); }
  nav.main .n.need { border-color: var(--ljr-2); background: var(--ljr-2-tint); }
  nav.main .n:empty { display: none; }
  @media (max-width: 600px) {
    /* Phone tabs: colour bar, then icon + count on one line (count in flow), then the label on its own line. */
    nav.main a { min-height: 62px; flex-direction: row; flex-wrap: wrap; justify-content: center; align-content: center; gap: 4px; padding: 6px 2px; }
    nav.main a .bar { margin: 0 calc(50% - 9px); }
    nav.main a[aria-current="page"] .bar { width: 26px; margin: 0 calc(50% - 13px); }
    nav.main a > .icon { order: 1; }
    nav.main .n { position: static; order: 2; }
    nav.main a > span:not(.bar):not(.n) { order: 3; flex: 0 0 100%; text-align: center; line-height: 1.2; }
  }
  @media (max-width: 600px) and (hover: hover) { nav.main a:hover .bar { width: 26px; margin: 0 calc(50% - 13px); } }
  html { scroll-padding-bottom: 104px; } body { padding-bottom: 104px; }
  /* House hover rule (Lisa, 28 Oct). Neutral controls: hover = 1px ink line inside + a pale muted tint. Meaning-coloured controls
     (rose delete/late, purple AI, copper money, a section's colour) keep THEIR colour: the same 1px line in that colour + a pale tint
     of it (about 14% into the card colour, dark card in dark mode). Never ink. Selected = the same look. Focus stays the 2px ink ring. */
  .btn.danger { --hc: var(--ljr-2); --hl: var(--ljr-2); }
  .btn.ai { --hc: var(--ljr-7); --hl: var(--ljr-7); }
  a.ment { --hc: var(--ljr-3); --hl: var(--ljr-3); }
  a.ment.bad { --hc: var(--ljr-2); --hl: var(--ljr-2); }
  a.morelink.slotfin { --hc: var(--ljr-3); --hl: var(--ljr-3); }
  a.morelink.slot4 { --hc: var(--ljr-4); --hl: var(--ljr-4-text); }
  a.morelink.slot7, a.hometile.slot7 { --hc: var(--ljr-7); --hl: var(--ljr-7); }
  a.morelink.slotsales { --hc: var(--ljr-6); --hl: var(--ljr-6); }
  .subnav a[aria-current="page"] { background: color-mix(in srgb, var(--muted) 12%, var(--card)); }
  @media (hover: hover) {
    .btn:hover, .subnav a:hover, a.keytile:hover, a.hometile:hover, a.card:hover, a.ment:hover, details.fold > summary:hover, .index .btn:hover {
      outline: 1px solid var(--ink); outline-offset: -1px; background: color-mix(in srgb, var(--muted) 12%, var(--card)); }
    .btn.danger:hover, .btn.ai:hover, a.ment[class]:hover, a.morelink.slotfin:hover, a.morelink.slot4:hover, a.morelink.slot7:hover, a.morelink.slotsales:hover, a.hometile.slot7:hover {
      outline: 1px solid var(--hl); outline-offset: -1px; background: color-mix(in srgb, var(--hc) 14%, var(--card)); }
    header .btn:hover { background: color-mix(in srgb, var(--frame-ink) 12%, var(--frame)); }
    html.dash-locked header .btn:hover { background: color-mix(in srgb, var(--muted) 12%, var(--card)); }
  }
</style>
</head>

<script>

  var EXCLUDED_DRIVES = (CFG.excludedDrives || []).filter(function (id) { return typeof id === 'string'; }).slice();
  var EXCLUDED_NAMES = [];

    if (!d) return;

    if (d.id && EXCLUDED_DRIVES.indexOf(d.id) === -1) EXCLUDED_DRIVES.push(d.id);
    if (d.name) EXCLUDED_NAMES.push(String(d.name).trim().toLowerCase());

  function excludedDrive(id) { return !!id && EXCLUDED_DRIVES.indexOf(id) !== -1; }

  var ARCHIVE_PREFIX = 'RR_'; // archive: never touched, including anywhere in a name
  var LEDGER_FILE_ID = CFG.home.ledgerFileId; // RR_DELETE-LEDGER, file_id column

    var g = google.accounts.oauth2;
    var hasWrite = g.hasGrantedAllScopes(resp, WRITE_SCOPE);
    if (!hasWrite && !g.hasGrantedAllScopes(resp, SCOPE)) { showBanner('Drive access not granted.', false, true); return; }
    var upgrade = askedWrite && signedIn;
    rememberToken(resp, hasWrite);
    if (askedWrite && !hasWrite) showBanner('Bin access not granted. Browsing still works.', false, false); else clearBanner();
    startTimer();
    if (upgrade) { render(); ensureRoute(); } else loadAll();
  }
  function startTimer() {
    stopTimer();
    refreshTimer = setInterval(timedRefresh, REFRESH_MS);
  }
  function hasTicks() { return Object.keys(PICK).some(function (k) { return PICK[k] && Object.keys(PICK[k]).some(function (id) { return PICK[k][id]; }); }); }
  // The 5-minute refresh waits while the tab is hidden, while something is being moved, or while you have ticks.
  function timedRefresh() {
    if (Date.now() > tokenExpiresAt) { handleExpired(); return; }
    if (document.hidden || busy || hasTicks()) { refreshPending = true; return; }
    refreshPending = false;
    loadAll(true);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && refreshPending && refreshTimer) timedRefresh(); });
  function stopTimer() { if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; } }
  function handleExpired() {
    stopTimer();
    accessToken = null;
    if (window.DashAuth) DashAuth.markExpired();
    if (!auth.requestSilent()) showBanner('Sign-in expired. Sign in again.', false, true);
  }
  function onSilentFail(hadExpired) {
    if (accessToken && Date.now() < tokenExpiresAt) return;
    if (hadExpired) showBanner('Sign-in expired. Sign in again.', false, true);
  }
  // otherTab: another tab already signed out (and revoked), so just forget everything here.
  function signOut(otherTab) {
    stopTimer();
    var t = otherTab === true ? null : accessToken;
    accessToken = null; tokenExpiresAt = 0; signedIn = false; writeGranted = false; busy = false;
    if (window.DashAuth && otherTab !== true) DashAuth.clear();
    if (t && window.google && google.accounts && google.accounts.oauth2) google.accounts.oauth2.revoke(t, function () {});
    S = freshState();
    F = {}; R = { sweep: null, check: null }; metaCache = {}; ledgerCache = null; PICK = {}; SHOW = {}; pcpLoadGen++;
    P = pcpFresh('idle', ''); U = usbBlank();
    if (window.MoneyCore) window.MoneyCore.clearCache();
    showBanner(otherTab === true ? 'Signed out in another tab. Nothing kept.' : 'Signed out. Nothing kept.', true, false);
    render();
  }
  function initGoogle() {
    if (!auth.init()) return false;
    var b = $('signInBtn'); b.disabled = false; b.querySelector('span').textContent = 'Sign in with Google';
    return true;
  }
  var auth = DashAuth.bind({
    clientId: CLIENT_ID,
    scope: SCOPE,
    onToken: onToken,
    onError: function (e) {
      var type = e && e.type ? e.type : '';
      showBanner(type === 'popup_failed_to_open' ? 'Sign-in window blocked by browser.' : type === 'popup_closed' ? 'Sign-in window closed early.' : 'Sign-in did not complete.', false, true);
    },
    onSilentFail: onSilentFail
  });
  function restoreShared() {
    var saved = DashAuth.valid();
    if (!saved || !DashAuth.hasScope(saved, SCOPE)) return false;
    accessToken = saved.access_token;
    tokenExpiresAt = saved.expires_at;
    signedIn = true;
    writeGranted = DashAuth.hasScope(saved, WRITE_SCOPE);
    return true;
  }

  // Skip link: jump to the content without changing the #/ address.
  document.addEventListener('click', function (e) {
    var k = e.target.closest && e.target.closest('[data-skip]');
    if (!k) return;
    e.preventDefault();
    var m = document.getElementById(k.getAttribute('data-skip'));
    if (m) { m.setAttribute('tabindex', '-1'); m.focus(); }
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t || t.disabled) return;
    var a = t.getAttribute('data-action');
    if (a === 'signin') requestToken();
    else if (a === 'signout') signOut();
    else if (a === 'refresh') loadAll(false);
    else if (a === 'grantwrite') requestWrite();
    else if (a === 'selectall') { selectAll(t.getAttribute('data-group')); render(); }
    else if (a === 'clearpick') { clearPick(t.getAttribute('data-group')); render(); }
    else if (a === 'showmore') {
      var listKey = t.getAttribute('data-list');
      var step = parseInt(t.getAttribute('data-step'), 10) || BIN_SHOW;
      var total = parseInt(t.getAttribute('data-total'), 10) || step;
      var cur = listShown(listKey, total, step);
      var next = Math.min(total, cur + step);
      SHOW[listKey] = next >= total ? 'all' : next;
      render();
    }
    else if (a === 'showall') { SHOW[t.getAttribute('data-list')] = 'all'; render(); }
    else if (a === 'sweep') sweep();
    else if (a === 'checkzz') openGuard('zzdelete');
    else if (a === 'checkai') openGuard('refer');
    else if (a === 'foldjump') {
      var key = t.getAttribute('data-key');
      FOLD[key] = true;
      if (key.indexOf('bin-') === 0) FOLD.bins = true;
      render();
      var el = document.querySelector('[data-fold="' + key + '"]');
      if (el) { el.scrollIntoView({ block: 'start' }); var sm = el.querySelector('summary'); if (sm) sm.focus(); }
    }
    else if (a === 'pcpscan') pcpScan();
    else if (a === 'pcpresume') pcpScan('continue');
    else if (a === 'pcpmark') pcpMark();
    else if (a === 'pcpbin') pcpBin();
    else if (a === 'usbscan') usbScan();
    else if (a === 'usbcontinue') usbContinue();
    else if (a === 'usbstop') { U.stop = true; }
    else if (a === 'usbmark') usbMark();
    else if (a === 'usbcsv') usbCsv(t.getAttribute('data-which'));
  });
  document.addEventListener('toggle', function (e) {
    var d = e.target;
    if (d && d.matches && d.matches('details[data-fold]')) FOLD[d.getAttribute('data-fold')] = d.open;
  }, true);
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'binFilter') { BF = e.target.value; applyBinFilter(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.matches && t.matches('input[data-pick-group]')) {
      if (t.disabled) return;
      var group = t.getAttribute('data-pick-group'), id = t.getAttribute('data-pick-id');
      if (!PICK[group]) PICK[group] = {};
      if (t.checked) PICK[group][id] = true; else delete PICK[group][id];
      render();
      return;
    }
    if (t && t.id === 'drivePicker') location.hash = t.value ? '#/drive/' + t.value : '#/drive';
  });
  // A screen change moves keyboard focus to the screen title (no scroll), so screen readers say where you are.
  // Tapping the link to the screen you are already on reads it again and goes back to its top (never a dead click).
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (a && a.getAttribute('href') === location.hash && !e.defaultPrevented) { e.preventDefault(); render(); window.scrollTo(0, 0); }
  });
  window.addEventListener('hashchange', function () {
    render(); ensureRoute();
    if (signedIn && !$('hereBox').classList.contains('hidden')) $('hereTitle').focus({ preventScroll: true });
  });
  var restored = restoreShared();
  render();
  // Another tab signed in, refreshed the token, or signed out.
  DashAuth.onChange(function (saved) {
    if (!saved || !DashAuth.hasScope(saved, SCOPE)) { if (signedIn) signOut(true); return; }
    var wasIn = signedIn && accessToken;
    restoreShared();
    clearBanner();
    if (!wasIn) { startTimer(); loadAll(); }
  });
  // ---- Search (press /): Drive file names in each shared drive, plus Money to-dos and dates already read ----
  function driveQuote(q) { return String(q).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
  KIT.search.register(function (q) {
    var list = signedIn ? (drives() || []).slice(0, 12) : [];
    return mapLimit(list, 4, function (d) {
      return driveList(inDrive(d.id, { q: "name contains '" + driveQuote(q) + "' and trashed = false", pageSize: '8', fields: 'files(id,name,mimeType,webViewLink)' })).then(function (r) {
        return (r.files || []).map(function (f) { return { group: 'Drive · ' + d.name, slot: 0, title: f.name, sub: typeWord(f.mimeType), href: f.webViewLink || folderUrl(f.id) }; });
      });
    }).then(function (lists) { return [].concat.apply([], lists); });
  });
  KIT.search.register(function (q) {
    var d = S.money.data, hit = KIT.search.matches(q), out = [];
    if (!d || d.gate !== 'ok') return out;
    (d.data.register || []).filter(function (r) { return hit([r.subject, r.id, r.entity, r.owner].join(' ')); }).slice(0, 10).forEach(function (r) {
      out.push({ group: 'Money to-dos', slot: 3, title: r.subject, sub: [r.entity, r.owner, r.status].filter(Boolean).join(' · '), href: 'money/#/register/' + encodeURIComponent(r.id) });
    });
    (d.data.dates || []).filter(function (r) { return hit([r.filing, r.entity, r.id].join(' ')); }).slice(0, 10).forEach(function (r) {
      out.push({ group: 'Money dates', slot: 3, title: r.filing, sub: [r.entity, r.due_on].filter(Boolean).join(' · '), href: 'money/#/dates' });
    });
    return out;
  });

  if (restored) { startTimer(); loadAll(); }

  var tries = 0;
  (function waitForGoogle() {
    if (initGoogle()) return;
    if (++tries > 100) {
      $('signInBtn').querySelector('span').textContent = 'Sign-in unavailable';
      showBanner('Google sign-in did not load.', false, false);
      return;
    }
    setTimeout(waitForGoogle, 100);
  })();
})();
</script>
<script>
/* Calm: every help bullet list (ul.notes) becomes one (i); its words show on hover or tap. */
(function () {
  function calm() {
    document.querySelectorAll('ul.notes:not([data-calm])').forEach(function (ul) {
      var t = Array.prototype.map.call(ul.querySelectorAll('li'), function (li) { return li.textContent.trim(); }).join(' · ');
      var s = document.createElement('span'); s.className = 'info'; s.title = t; s.setAttribute('tabindex', '0'); s.textContent = 'i';
      var h = document.createElement('span'); h.textContent = ' ' + t; h.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap'; s.appendChild(h); // screen readers (and tests) still get the words
      ul.setAttribute('data-calm', '1'); ul.replaceWith(s);
    });
  }
  new MutationObserver(calm).observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener('DOMContentLoaded', calm); calm();
})();
</script>
