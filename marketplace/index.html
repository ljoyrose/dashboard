<!-- Marketplace V2 (25 Oct 2026): tabs Home / Do now / Decide / Reply / Insights, person chips, packing mode, label sheet. PUBLIC repo: no data, no secrets. Ids come from ../config.js (DASH_CONFIG.marketplace);
     everything else is read at run time with Lisa's Google sign-in from the "Marketplace" tab of RR_OPEN-WORK, which the
     RR_MKT-ENGINE Apps Script fills. A tap writes ONLY the 4 answer cells (G:J) of one row; the engine applies it after 10 minutes. -->

<style>
  /* Colours: ../tokens.css only (LJR7 spine), same shapes as factory/ and cdhub/. No colour is written here. */
  :root { --radius: 12px; --bg: var(--ljr-cream); --surface: var(--ljr-paper); --ink: var(--ljr-ink); --muted: var(--ljr-muted);
          --line: color-mix(in srgb, var(--ljr-0) 55%, var(--ljr-paper)); }
  * { box-sizing: border-box; }
  html { scroll-padding-bottom: 96px; }   /* a button scrolled into view never hides under the tab bar */
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Lexend, system-ui, sans-serif; font-size: 17px; line-height: 1.5; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }   /* same width as Factory and the main dashboard */
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .top { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; align-items: center; padding: 10px 16px; }
  .top h1 { font-size: 22px; margin: 0 auto 0 0; }
  .top h1 a { color: inherit; text-decoration: none; }
  .stamp { font-size: 11px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 5px; }
  .btn { font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 8px 14px; cursor: pointer; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; min-height: 44px; }
  /* Lisa 27 Oct: outline at rest; filled on hover/press so a tap clearly lands (black; Yes green, No red); "Saving…" while it writes. */
  .btn:hover, .btn:active { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .btn.yes:hover, .btn.yes:active { background: var(--ljr-5-text); border-color: var(--ljr-5-text); color: var(--surface); }
  .btn.no:hover, .btn.no:active { background: var(--ljr-2-text); border-color: var(--ljr-2-text); color: var(--surface); }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid var(--ljr-6); outline-offset: 2px; }
  .m.post { font-weight: 700; } .m.post.seller { color: var(--ljr-2-text); } .m.post.buyer { color: var(--ljr-5-text); }
  .btn.saving, .btn.saving:hover { background: var(--muted); border-color: var(--muted); color: var(--surface); cursor: progress; }
  .btn:disabled:not(.saving) { opacity: .5; cursor: default; }
  .btn.main { border-color: var(--ink); }
  .btn.big { width: 100%; justify-content: center; font-size: 19px; min-height: 60px; }
  .btn.yes { color: var(--ljr-5-text); border-color: var(--ljr-5); }
  .btn.no { color: var(--ljr-2-text); border-color: var(--ljr-2); }
  .hidden { display: none !important; }
  /* V2: five tabs in a bar at the bottom (thumb reach on the phone), person chips under the title. */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 6px 8px 10px; background: var(--surface); border-top: 1px solid var(--line); }
  nav.tabs a { text-decoration: none; font-size: 13px; font-weight: 700; color: var(--ink); min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: var(--radius); border: 1.5px solid transparent; padding: 4px 2px; text-align: center; }
  nav.tabs a:hover { border-color: var(--line); }
  nav.tabs a[aria-current="page"] { border-color: var(--ink); background: var(--bg); }
  nav.tabs .n { font-size: 12px; font-weight: 700; background: var(--ljr-2-solid); color: var(--ljr-2-on); border-radius: 999px; padding: 0 7px; min-width: 20px; }
  nav.tabs .n:empty { visibility: hidden; }
  .chips.people { padding: 0 16px 10px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  main, main.wrap { padding: 16px 16px 110px; display: flex; flex-direction: column; gap: 14px; }   /* .wrap alone would drop the room for the tab bar */
  .tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tile.big { min-height: 88px; display: flex; flex-direction: column; justify-content: center; text-decoration: none; }
  .tile.big .v { font-size: 28px; }
  .hint { font-size: 14px; color: var(--muted); margin: 0; }
  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .fact { background: var(--bg); border-radius: var(--radius); padding: 8px 10px; }
  .fact .k { display: block; font-size: 12px; color: var(--muted); } .fact .v { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
  .parcel { font-size: 34px; font-weight: 700; }
  .dropcode { border: 2px dashed var(--line); border-radius: var(--radius); padding: 12px; text-align: center; }
  .dropcode .code { display: block; font-size: 22px; font-weight: 700; letter-spacing: 2px; overflow-wrap: anywhere; }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 520px; }
  .pair figure { margin: 0; display: flex; flex-direction: column; gap: 4px; }
  .pair img, .pair .nopic { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: var(--radius); border: 1px solid var(--line); background: var(--bg); display: block; }
  .pair .nopic { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }
  .pair figcaption { font-size: 13px; color: var(--muted); font-weight: 600; }
  .verdict { margin: 0; font-weight: 700; font-size: 15px; }
  .verdict.go { color: var(--ljr-5-text); } .verdict.wait { color: var(--ljr-2-text); }
  .opbox { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  label.qty { font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  details summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
  details .txtin { margin: 6px 0; }
  .ava { --ava: var(--ljr-ava-other); float: right; margin: 0 0 6px 10px; width: 36px; height: 36px; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; background: var(--ava); color: var(--ljr-ava-on); font-size: 13px; font-weight: 800; letter-spacing: .02em; border: 2px solid var(--surface); box-shadow: 0 0 0 1.5px var(--ava); }
  .ava img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; display: block; }
  .buyfrom { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; font-weight: 600; } .buyfrom .k { color: var(--muted); font-weight: 600; }
  details.madeof { display: block; } details.madeof[open] > *:not(summary) { margin-top: 10px; } details.madeof label.qty { margin-top: 12px; }
  .packbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; }
  .banner { border: 1.5px solid var(--ljr-2); border-radius: var(--radius); padding: 10px 14px; background: var(--ljr-2-tint); color: var(--ljr-2-text); }
  .banner.info { border-color: var(--line); background: var(--surface); color: var(--ink); }
  .needs { font-size: 26px; font-weight: 700; margin: 0; }
  .needs .zero { color: var(--ljr-5-text); }
  .card { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
  /* Lisa 27 Oct: "no gaps between, very cramped": cards, groups and buttons get room to breathe. */
  #view { display: flex; flex-direction: column; gap: 32px; }   /* Lisa 27 Oct: 16px still read as cramped on the phone */
  #view > .grp { margin-top: 12px; margin-bottom: -18px; }   /* a heading sits close to its own cards, far from the last group */
  .card .acts { margin-top: 4px; }
  /* Courier band on post cards (Lisa 26 Oct): brand colour + name + where to take it. Name always in text, never colour alone. */
  .cband { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: -16px -18px 2px; padding: 12px 18px; border-radius: var(--radius) var(--radius) 0 0; font-weight: 800; font-size: 17px; letter-spacing: .02em; }
  .cband .pid { font-size: 22px; } .cband .to { font-weight: 600; font-size: 15px; }
  .cb-inpost { background: var(--ljr-cb-inpost); color: var(--ljr-cb-inpost-on); } .cb-evri { background: var(--ljr-cb-evri); color: var(--ljr-cb-on); } .cb-rm { background: var(--ljr-cb-rm); color: var(--ljr-cb-on); }
  .cb-dpd { background: var(--ljr-cb-dpd); color: var(--ljr-cb-on); } .cb-yodel { background: var(--ljr-cb-yodel); color: var(--ljr-cb-on); } .cb-pf { background: var(--ljr-cb-pf); color: var(--ljr-cb-on); } .cb-none { background: var(--ljr-cb-none); color: var(--ljr-cb-on); }
  .card.acc2 { border-left: 4px solid var(--ljr-2); } .card.acc5 { border-left: 4px solid var(--ljr-5); } .card.acc4 { border-left: 4px solid var(--ljr-4); }
  .card h2 { font-size: 19px; margin: 0; }
  .card .what { color: var(--muted); font-size: 15px; margin: 0; }
  .item { display: flex; gap: 12px; align-items: center; }
  .item img { width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); flex: none; background: var(--bg); }
  .item .t { flex: 1; min-width: 0; font-weight: 600; }
  .item .m { font-size: 14px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .acts { display: flex; gap: 10px; flex-wrap: wrap; }
  .acts .btn { flex: 1; justify-content: center; }
  .grp { font-size: 15px; font-weight: 700; margin: 6px 0 0; color: var(--muted); }
  .row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  /* engine v11 cards: the money lines (▶ headline bold, ⚠ warnings red), the list of questions, a card inside a card */
  ul.money, ul.asks { margin: 0; padding-left: 18px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
  ul.money { list-style: none; padding-left: 0; } ul.money li.head { font-weight: 700; }
  .card.inner { padding: 4px 12px; }
  .card > .row:first-of-type { border-top: 0; }
  .row .txt { flex: 1; min-width: 0; }
  .row .why { font-size: 14px; color: var(--muted); }
  .steps { margin: 8px 0 0; padding-left: 22px; font-size: 15px; }
  .steps li { margin: 4px 0; }
  .red { color: var(--ljr-2-text); font-weight: 700; }
  .sent { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .more { font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); background: none; border: 1px solid transparent; border-radius: var(--radius); padding: 6px 10px; cursor: pointer; align-self: flex-start; }
  .more:hover { border-color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tile { font: inherit; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; color: var(--ink); }
  .tile:hover { border-color: var(--muted); }
  .tile .k { font-size: 13px; color: var(--muted); } .tile .v { font-size: 20px; font-weight: 700; }
  .tile .up { color: var(--ljr-5-text); } .tile .down { color: var(--ljr-2-text); } .tile .flat { color: var(--muted); }
  input.num, input.txtin { font: inherit; font-size: 18px; padding: 8px 10px; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
  input.num { width: 72px; text-align: center; }
  input.txtin { width: 100%; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font: inherit; font-size: 15px; font-weight: 600; border-radius: 999px; padding: 6px 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 40px; }
  .chip.on { border-color: var(--ink); }
  .qr { position: fixed; inset: 0; background: var(--ljr-paper); color: var(--ljr-ink); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
  .qr .code { font-size: 44px; font-weight: 700; letter-spacing: 3px; word-break: break-all; }
  .qr img { max-width: 90vw; max-height: 60vh; }
  a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  a.btn, nav.tabs a, a.tile { text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="top"><h1><a href="#/me">Marketplace</a></h1><span class="stamp" id="stamp">TEST</span>
    <button class="btn hidden" type="button" data-action="refresh" aria-label="Refresh" id="refresh"><i class="ti ti-refresh"></i></button>
    <button class="btn" type="button" data-action="signin" id="signin">Sign in</button>
    <a id="backHome" class="btn" href="../" data-back-home aria-label="Dashboard home">← Dashboard</a></div>
  <div class="chips people hidden" id="people" role="group" aria-label="Whose items"></div>
</header>
<main class="wrap">
  <div id="banner" class="banner hidden" role="status"></div>
  <div id="view"></div>
</main>
<nav class="tabs hidden" id="tabs" aria-label="Marketplace sections">
  <a href="#/me" data-nav="me"><span>Home</span><span class="n"></span></a>
  <a href="#/do" data-nav="do"><span>Do now</span><span class="n" id="n-do"></span></a>
  <a href="#/decide" data-nav="decide"><span>Decide</span><span class="n" id="n-decide"></span></a>
  <a href="#/reply" data-nav="reply"><span>Reply</span><span class="n" id="n-reply"></span></a>
  <a href="#/insights" data-nav="insights"><span>Insights</span><span class="n"></span></a>
</nav>
<div id="qr" class="qr hidden" role="dialog" aria-label="Drop-off code"></div>
<script>
(function () {
  'use strict';
  var CFG = window.DASH_CONFIG || {}, M = CFG.marketplace || null;
  var CLIENT_ID = CFG.clientId, READ = (CFG.scopes || {}).read, SHEETS = 'https://www.googleapis.com/auth/spreadsheets';
  var SCOPE = READ + ' ' + SHEETS;
  var COLS = ['key', 'section', 'category', 'title', 'detail', 'created_at', 'answer', 'note', 'answered_at', 'answered_by', 'applied_at', 'applied_by'];
  var CATS = ['Clothes', 'Blades & grooming', 'Health & supplements', 'Treats', 'Crates & beds', 'Towels & textiles', 'Collars & accessories', 'Electronics & media', 'Other'];
  var UNDO_MS = 10 * 60000, APPLY_MS = 11 * 60000;
  var SECTIONS = {
    remove: { name: 'Remove from other sites', urgent: true, verb: 'Done', what: 'It sold. Take it off the site named on the card.' },
    message: { name: 'Messages', urgent: true, verb: 'Done', what: 'A buyer wrote. Open your messages, answer there, then tap Done.' },
    post: { name: 'Post', urgent: true, verb: 'Posted', what: 'Find it, pack it, post it.' },
    go: { name: 'Go', verb: 'Go', no: 'Not this one', what: 'List this item.' },
    vinted: { name: 'Post to Vinted', verb: 'Done', what: 'Drag the photos into Vinted, paste the text, then tap Done.' },
    restock: { name: 'Restock', quiet: true, what: 'Low on stock. Buy on Temu when it suits you.' },
    temu: { name: 'Temu claims', quiet: true, what: 'Price dropped. Claim in Temu if you like.' },
    stock: { name: 'Stock', quiet: true, what: 'What you have, what is on order, and when to buy.' },
    check: { name: 'Check your list', verb: 'Yes', no: 'No', what: 'Keeps your list right. Changes only your list, never eBay or Vinted.' },
    // Engine v11: suppliers, new products, receipts, brands, VAT, jobs the AI could not do. None of them changes eBay or Vinted.
    newprod: { name: 'New product?', what: 'Worth stocking? Profit is shown both VAT ways. Yes puts it on the order list.' },
    receipt: { name: 'Add to stock?', what: 'A receipt was read. Yes adds the matched lines to stock and updates their cost.' },
    supplier: { name: 'Suppliers', what: 'Price lists, terms and offers from your suppliers.' },
    learn: { name: 'Brands to source', what: 'Brands that sell with no trade price on file.' },
    job: { name: 'Do by hand', what: 'No AI could read this one. Do it by hand, then tap Done.' },
    vat: { name: 'VAT', what: 'Sales against the VAT registration threshold.' },
    offer: { name: 'Send offer', what: 'Buyers are watching these on eBay. Send them a discount?' },
    suppliers: { name: 'Supplier details', quiet: true, what: 'Contacts, terms and the order list per supplier.' }
  };
  var ORDER = ['remove', 'message', 'post', 'go', 'vinted', 'check', 'receipt', 'newprod', 'offer', 'supplier', 'learn', 'job', 'vat', 'restock', 'temu'];
  // V2 tabs: each groups engine sections. Old links (#/remove, #/check, #/numbers ...) still open and light up their tab.
  var TABS = { do: ['remove', 'post', 'vinted', 'job'], decide: ['go', 'check', 'offer', 'receipt', 'newprod', 'supplier', 'learn', 'vat'], reply: ['message'], insights: ['restock', 'temu'] };
  var TAB_OF = { numbers: 'insights', round: 'insights', stock: 'insights', suppliers: 'insights' }; Object.keys(TABS).forEach(function (t) { TABS[t].forEach(function (s) { TAB_OF[s] = t; }); });
  var PEOPLE = ['All', 'Lisa', 'CY', 'G', 'H', 'CN'];   // a card with no owner is Lisa's
  var token = null, me = '', rows = [], view = 'me', open = {}, round = {}, showAll = false, pack = null, sheet = false, stockFilter = 'all';
  var who = 'All', site = 'All';
  try { who = localStorage.getItem('mkt.who') || 'All'; if (PEOPLE.indexOf(who) < 0) who = 'All'; } catch (e) {}
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function banner(t, info) { var b = $('banner'); b.textContent = t; b.className = 'banner' + (info ? ' info' : ''); }
  function hm(ms) { return new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
  function detail(r) { try { return JSON.parse(r.detail || '{}'); } catch (e) { return {}; } }
  // A card's photo: an eBay/Etsy/Vinted picture address (those hosts only), or the Drive id of a photo in the item's folder.
  var PHOTO_HOSTS = /^https:\/\/(i\.ebayimg\.com|i\.etsystatic\.com|images\d*\.vinted\.net)\//;
  function photoSrc(id, w) {
    if (!id) return '';
    if (PHOTO_HOSTS.test(id)) return w > 300 ? id.replace(/\/s-l\d+\./, w >= 1000 ? '/s-l1600.' : '/s-l500.') : id;
    return /^[\w-]{20,}$/.test(id) ? 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + w : '';
  }
  function thumb(id) { var src = photoSrc(id, 200); return src ? '<img alt="" loading="lazy" referrerpolicy="no-referrer" src="' + esc(src) + '">' : ''; }
  // "Same item?" cards (key LINK|<other>|<eBay>): both photos side by side, big; tap one to open it full size.
  // The second photo comes from RR_LISTINGS.csv (image_url), read once with Lisa's sign-in; nothing is written to it.
  // Who a card belongs to: a round photo per person (a Drive image named AVATAR_<name>, e.g. AVATAR_Lisa.jpg, read with Lisa's
  // sign-in, never stored in this public site), else the person's initials in their own colour. The photo is cropped to a
  // circle on screen (centred, a little above the middle where faces usually are), so any photo size works.
  var AVA_COL = { lisa: 1, cy: 1, g: 1, h: 1, cn: 1 }, avatars = null;   // colours: --ljr-ava-<name> in tokens.css
  function loadAvatars() {
    if (avatars !== null) return; avatars = {};
    var q = "name contains 'AVATAR_' and mimeType contains 'image/' and trashed = false";
    fetch('https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) + '&fields=files(id,name)&pageSize=50&supportsAllDrives=true&includeItemsFromAllDrives=true', { headers: { Authorization: 'Bearer ' + token } })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { (j.files || []).forEach(function (f) { var who = (f.name.match(/^AVATAR_([A-Za-z]+)/) || [])[1]; if (!who) return;
        fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(f.id) + '?alt=media&supportsAllDrives=true', { headers: { Authorization: 'Bearer ' + token } })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); }).then(function (b) { avatars[who.toLowerCase()] = URL.createObjectURL(b); render(); }).catch(function () {}); }); })
      .catch(function () {});   // no photo is fine: initials show instead
  }
  function avatar(owner) {
    var who = String(owner || 'Lisa'), pic = avatars && avatars[who.toLowerCase()], col = 'var(--ljr-ava-' + (AVA_COL[who.toLowerCase()] ? who.toLowerCase() : 'other') + ')';
    return '<span class="ava" title="' + esc(who) + '" aria-label="' + esc(who) + '\'s" style="--ava:' + col + '">' + (pic ? '<img alt="" src="' + esc(pic) + '">' : esc(/^[A-Z]{1,3}$/.test(who) ? who : who.charAt(0).toUpperCase())) + '</span>';
  }

  // No reason, no save (CD Hub round rule). Each item row gets "ok" or "<count> <reason>".
  function finishRound() {
    var todo = rows.filter(function (r) { return r.section === 'round' && !r.answer && round[r.key]; }), missing = [];
    todo.forEach(function (r) { var v = round[r.key], d = detail(r); if (v.n !== '' && v.n !== undefined && Number(v.n) !== Number(d.expected) && !v.reason) missing.push(r.title); });
    if (missing.length) return banner('Pick a reason for: ' + missing.join(', '));
    todo.reduce(function (p, r) { var v = round[r.key]; return p.then(function () { return answer(r, v.ok || v.n === '' || v.n === undefined ? 'ok' : String(Number(v.n)) + ' ' + v.reason, ''); }); }, Promise.resolve())
      .then(function () { banner('Round saved. The engine applies it after 10 minutes.', true); });
  }
  function route() { view = (location.hash.replace(/^#\//, '').split('?')[0]) || 'me'; showAll = false; pack = null; sheet = false; render(); }
  window.addEventListener('hashchange', route);

  /* ---------- sign-in: same shared DashAuth as every dashboard page ---------- */
  var auth = DashAuth.bind({ clientId: CLIENT_ID, scope: SCOPE,
    onToken: function (resp) {
      if (resp.error) return banner('Sign-in did not complete.');
      if (window.google && google.accounts && !google.accounts.oauth2.hasGrantedAllScopes(resp, SHEETS)) { banner('Google did not give this page spreadsheet access. Tap Sign in again and tick every box Google shows.'); return; }
      token = resp.access_token; DashAuth.save(token, DashAuth.expiryFrom(resp.expires_in), resp.scope || SCOPE); load();
    },
    onError: function () { banner('Sign-in did not complete.'); }, onSilentFail: function () {} });
  var saved = DashAuth.valid(); if (saved && DashAuth.hasScope(saved, SCOPE)) { token = saved.access_token; }
  route(); load(); setInterval(function () { if (token) load(); }, 5 * 60000);
  // Google's sign-in script loads after this one: start the shared sign-in as soon as it is there (same as Factory).
  var tries = 0;
  (function wait() { if (auth.init()) { render(); return; } if (++tries > 100) { banner('Google sign-in did not load.'); return; } setTimeout(wait, 100); })();
})();
</script>
