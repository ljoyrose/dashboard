<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="build" content="ljr-marketplace-2026-10-29-no-emails">
<title>Marketplace</title>
<!-- Marketplace V2 (25 Oct 2026): tabs Home / Do now / Decide / Reply / Insights, person chips, packing mode, label sheet. PUBLIC repo: no data, no secrets. Ids come from ../config.js (DASH_CONFIG.marketplace);
     everything else is read at run time with Lisa's Google sign-in from the "Marketplace" tab of RR_OPEN-WORK, which the
     RR_MKT-ENGINE Apps Script fills. A tap writes ONLY the 4 answer cells (G:J) of one row; the engine applies it after 10 minutes. -->
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap">
<script src="../config.js"></script>
<script src="../toolkit.js"></script>
<script src="../auth.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../house.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  /* Greys, lines, frame, radius, the control line, counts, date pills, tabs and the hover rule: ../tokens.css through ../house.css,
     the same on every hub; the Look (Warm / Cool clear, Light / Dark / Device) is applied by ../toolkit.js.
     Marketplace's own names: the photo shade and the meaning rings (words stay ink). */
  :root { --shade: color-mix(in srgb, var(--ljr-ink) 12%, transparent); --need: var(--house-risk); --soon: var(--house-soon); --ok: var(--house-ok); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --shade: color-mix(in srgb, var(--ljr-cream) 60%, transparent); } }
  :root[data-theme="dark"] { --shade: color-mix(in srgb, var(--ljr-cream) 60%, transparent); }
  * { box-sizing: border-box; }
  h1, h2, h3, b, strong, th, summary { font-weight: 600; }   /* two weights only: 400 and 600 */
  html { scroll-padding-bottom: 96px; }   /* a button scrolled into view never hides under the tab bar */
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Lexend, system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  .hidden { display: none !important; }
  a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  a.btn, nav.tabs a, a.tile { text-decoration: none; }
  .ti { line-height: 1; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }   /* same width as Factory and the main dashboard */

  /* Frame: dark top bar (never black). Buttons on it are outlined in the frame's own light colour. */
  header { position: sticky; top: 0; z-index: 5; background: var(--frame); color: var(--frame-ink); }
  header .top { max-width: 980px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
  .top h1 .dot { background: var(--ljr-6); }
  .stamp { font-size: 13px; font-weight: 600; border: 1px solid var(--frame-line); border-radius: var(--radius); padding: 0 8px; height: 24px; display: inline-flex; align-items: center; color: var(--frame-ink); font-variant-numeric: tabular-nums; }
  .stamp:empty { display: none; }
  .readat { font-variant-numeric: tabular-nums; }
  /* Signed out the dark bar is hidden by the sign-in gate, so its buttons switch to page colours (still readable). */
  html.dash-locked header .btn { color: var(--ink); border-color: var(--ctl); }

  /* Buttons, chips, the hover rule (a meaning colour, --hmc, keeps its own colour), focus, the bottom tabs and the counts:
     ../house.css. Every pressable rests on the same clear line; Yes / No differ by their words, place and hover colour. */
  .btn.big { width: 100%; justify-content: center; }
  .btn.saving, .btn.saving:hover { border-style: dashed; border-color: var(--muted); color: var(--muted); cursor: progress; }
  .btn:disabled:not(.saving) { opacity: .55; cursor: default; }
  .chip { padding: 0 14px; background: var(--surface); display: inline-flex; align-items: center; gap: 6px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips.people { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  /* .mkwho: whose items, the people chips (and the phone's one Filter button) at the top of the page, out of the top bar. */
  .mkwho:has(> #people.hidden) { display: none; }
  .chip[aria-pressed="true"], .chip.on { outline: 1px solid var(--ink); outline-offset: -1px; background-color: var(--hov); }
  @media (hover: hover) {
    a.tile:hover, button.tile:hover, details > summary:hover, .pair figure > a:hover { outline: 1px solid var(--ink); outline-offset: -1px; background-color: var(--hov); }
    html.dash-locked header .btn:hover { outline-color: var(--ink); background-color: var(--hov); }
  }
  /* Keyboard focus: a 2px ink ring (the one exception to 1px). */
  a:focus, button:focus, summary:focus { outline: none; }
  :focus-visible, a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  header :focus-visible:not(.house-menu *), header a:focus-visible:not(.house-menu *), header button:focus-visible:not(.house-menu *) { outline-color: var(--frame-ink); }
  input:focus { outline: none; border-color: var(--ink); }

  /* Bottom tabs (.house-tabs): five across. */
  nav.tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 8px 8px calc(10px + env(safe-area-inset-bottom, 0px)); }
  @media (min-width: 601px) { nav.tabs { padding-left: 24px; padding-right: 24px; grid-template-columns: repeat(6, minmax(0, 180px)); justify-content: center; } }
  nav.tabs a { --tc: var(--ljr-0); }
  @media (min-width: 601px) { nav.tabs a { min-height: 56px; } }
  nav.tabs a > .ti { font-size: 18px; color: var(--ink); }
  nav.tabs .n { top: 6px; }
  @media (max-width: 544px) { nav.tabs { gap: 4px; padding-left: 6px; padding-right: 6px; } }

  /* Work area. Spacing in 12px steps; 16px under a header line before the first item. */
  main, main.wrap { padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 12px; }   /* .wrap alone would drop the room for the tab bar */
  #view { display: flex; flex-direction: column; gap: 12px; }   /* one 12px step between cards (Lisa chose 12px, 28 Oct) */
  #view > .grp, #view > .ghead { margin-top: 12px; margin-bottom: 4px; }   /* 16px under a header line before its first card (12px gap + 4px) */
  .needs { font-size: 26px; font-weight: 600; margin: 0; line-height: 1.3; }   /* the page greeting */
  .needs .zero { font-variant-numeric: tabular-nums; }
  .hint { font-size: 14px; color: var(--muted); margin: 0; }
  .grp { font-size: 16px; font-weight: 600; margin: 0; }
  .ghead { display: flex; gap: 8px; align-items: center; }
  .ghead .cnt { margin-left: auto; }
  .banner { border: 1px solid var(--need); border-radius: var(--radius); padding: 10px 14px; background: var(--ljr-2-tint); color: var(--ink); }
  .banner.info { border-color: var(--line); background: var(--surface); }
  .card { position: relative; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 3px var(--shade); } /* the house card (../house.css): 12px inside */
  /* A card's colour is a thin bar on its left edge, never a thick border or a fill. Rose = needs you now, green = right. */
  .card.acc2::before, .card.acc5::before { content: ""; position: absolute; left: -1px; top: 14px; bottom: 14px; width: var(--house-bar); border-radius: var(--radius); background: var(--ljr-2); } /* the 3px left colour bar */
  .card.acc5::before { background: var(--ljr-5); }
  .card.empty::before { content: none; }
  /* The "Next" card on Home: the one thing to do now, white with a 1px ink edge. */
  .card.next { border-color: var(--ink); }
  .nextlab { margin: 0 0 -8px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .nextlab .ti { font-size: 16px; color: var(--ink); }
  .card h2 { font-size: 17px; margin: 0; line-height: 1.35; }
  .card .what { color: var(--muted); font-size: 15px; margin: 0; }
  .card .acts { margin-top: 4px; }
  .card.inner { padding: 0; border: 0; box-shadow: none; gap: 0; background: transparent; }   /* no box inside a box: rows split by 1px lines */
  .card > .row:first-of-type, .card.inner > .row:first-child { border-top: 0; }
  /* Friendly empty states: a small green-ring check and plain words. */
  .card.empty { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 12px; }
  .card.empty > div { flex: 1; min-width: 0; }
  .okring { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--ok); background: var(--ljr-5-tint); display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: var(--ink); }
  .card.empty h2 { font-size: 17px; }
  .card.empty .what { margin-top: 2px; }

  /* Item block: 44×44 photo (or a line icon of the item type) left of the text; name line, then the title (2 lines, then …). */
  .item { display: flex; gap: 12px; align-items: flex-start; }
  .item > img, .item > .ph, .row > img, .row > .ph { width: 44px; height: 44px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); flex: none; background: var(--bg); }
  .ph { display: inline-flex; align-items: center; justify-content: center; }
  .ph .ti { font-size: 22px; color: var(--muted); }
  .item .t { flex: 1; min-width: 0; font-weight: 400; }
  .bline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 2px; min-width: 0; }
  .sdot { --c: var(--ljr-0); width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; display: inline-block; }
  .ttl { font-size: 16px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .item .m { font-size: 14px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .m.post { font-weight: 600; color: var(--ink); display: flex; gap: 6px; align-items: center; }
  .m.post .ti { font-size: 16px; color: var(--muted); }
  /* Who a card belongs to: initials (or their photo) in a small ring of that person's colour, on the name line. */
  .ava { --ava: var(--ljr-ava-other); width: 24px; height: 24px; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; flex: none;
    border: 1px solid color-mix(in srgb, var(--ava) 70%, var(--ink)); background: color-mix(in srgb, var(--ava) 14%, var(--surface)); color: var(--ink); font-size: 13px; font-weight: 600; line-height: 1; }
  .ava img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; display: block; }
  /* Date pill: its RING shows urgency (rose = late, amber = today or tomorrow). The words stay ink. */
  .date { gap: 6px; font-weight: 600; } /* the house date pill (../house.css): always ringed; rose late, amber soon */
  /* Flags in words: ink text with a small coloured dot in front, never coloured words. */
  .red, .verdict.wait, .verdict.go, ul.money li.red { color: var(--ink); font-weight: 600; }
  .red::before, .verdict::before, ul.money li.red::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ljr-2); margin-right: 6px; vertical-align: 1px; }
  .verdict.wait::before { background: var(--ljr-3); } .verdict.go::before { background: var(--ljr-5); }
  .verdict { margin: 0; font-size: 15px; }

  .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .acts .btn { flex: 1; justify-content: center; }
  .row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .row .txt { flex: 1; min-width: 0; }
  .row .why { font-size: 14px; color: var(--muted); }
  .steps { margin: 0; padding-left: 22px; font-size: 15px; }
  .steps li { margin: 4px 0; }
  .steps.words { list-style: none; padding-left: 0; }
  .steps.words li { display: flex; gap: 8px; align-items: baseline; }
  .steps.words .sn { flex: none; font-weight: 600; }
  .sent { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .more { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--ctl); border-radius: var(--radius); padding: 0 12px; min-height: 36px; cursor: pointer; align-self: flex-start; }
  @media (max-width: 544px) { .more { min-height: 44px; } }

  /* Summary strip: big numbers in tabular figures, each tile a 1px edge; a "needs you" number wears the rose ring. */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tile { font: inherit; text-align: left; background: var(--surface); border: 1px solid var(--ctl); border-radius: var(--radius); padding: 12px; cursor: pointer; color: var(--ink); min-width: 0; }
  .tile.big { min-height: 88px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .tile .k { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; } .tile .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .tile.big .v { font-size: 28px; line-height: 1.2; }
  .needs3 .v { align-self: flex-start; min-width: 44px; padding: 0 10px; border: 1px solid var(--ctl); border-radius: var(--radius); text-align: center; }
  .needs3 .v.need { border-color: var(--need); background: var(--ljr-2-tint); }
  .tile .up, .tile .down, .tile .flat { color: var(--muted); font-size: 15px; }
  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .fact { padding: 8px 12px; border-left: 1px solid var(--line); min-width: 0; }
  .fact:nth-child(3n + 1) { border-left: 0; padding-left: 0; }
  .fact .k { display: block; font-size: 13px; color: var(--muted); } .fact .v { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  ul.money, ul.asks { margin: 0; padding-left: 18px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; font-variant-numeric: tabular-nums; }
  ul.money { list-style: none; padding-left: 0; } ul.money li.head { font-weight: 600; }

  /* Post cards. Courier line: brand dot + name (always in words) + where to take it; the parcel number in a ring pill. */
  .cband { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 0 0 -4px; padding: 0 0 12px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 16px; }
  .cband .cdot { width: 12px; height: 12px; border-radius: 50%; background: var(--cb); box-shadow: 0 0 0 1px var(--ctl); flex: none; }
  .cband .pid { font-size: 17px; height: 28px; padding: 0 10px; border: 1px solid var(--ink); border-radius: var(--radius); display: inline-flex; align-items: center; font-variant-numeric: tabular-nums; }
  .cband .to { font-weight: 400; font-size: 15px; color: var(--muted); }
  .cb-inpost { --cb: var(--ljr-cb-inpost); } .cb-evri { --cb: var(--ljr-cb-evri); } .cb-rm { --cb: var(--ljr-cb-rm); } .cb-dpd { --cb: var(--ljr-cb-dpd); }
  .cb-yodel { --cb: var(--ljr-cb-yodel); } .cb-pf { --cb: var(--ljr-cb-pf); } .cb-none { --cb: var(--ljr-cb-none); }
  .parcel { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row .parcel { font-size: 17px; min-width: 44px; }
  .dropcode { border: 1px dashed var(--ctl); border-radius: var(--radius); padding: 12px; text-align: center; }
  .dropcode .code { display: block; font-size: 22px; font-weight: 600; letter-spacing: 2px; overflow-wrap: anywhere; }
  .packbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; }
  .pidin { width: 9em; }
  /* Home: "To post" list, calm rows (photo, title, date pill), one button under it. Not a card, so Home keeps one Next card. */
  .plist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 16px 12px; display: flex; flex-direction: column; box-shadow: 0 1px 3px var(--shade); }
  .prow { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); color: var(--ink); }
  .prow:first-child { border-top: 0; }
  .prow .pt { flex: 1; min-width: 0; display: flex; gap: 4px 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .prow .ttl { min-width: 0; font-size: 15px; }
  .prow > img, .prow > .ph { width: 44px; height: 44px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); flex: none; background: var(--bg); }
  .plist .acts { margin-top: 4px; }

  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 520px; }
  .pair figure > a { display: block; border-radius: var(--radius); }
  .pair figure { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .pair img, .pair .nopic { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: var(--radius); border: 1px solid var(--line); background: var(--bg); display: block; }
  .pair .nopic { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }
  .pair figcaption { font-size: 13px; color: var(--muted); font-weight: 600; overflow-wrap: anywhere; }
  .opbox { display: inline-flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  label.qty { font-weight: 600; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  details summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; border-radius: var(--radius); }
  details .txtin { margin: 8px 0; }
  .buyfrom { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-weight: 600; } .buyfrom .k { color: var(--muted); font-weight: 600; }
  details.npgroup > summary { min-height: 56px; } details.npgroup[open] > *:not(summary) { margin-top: 12px; } details.npgroup .row .num { width: 72px; } details.npgroup input[type=checkbox] { width: 28px; height: 28px; }   /* v11.10 New stock */
  details.madeof { display: block; } details.madeof[open] > *:not(summary) { margin-top: 12px; } details.madeof label.qty { margin-top: 12px; }
  input.num, input.txtin { font: inherit; font-size: 16px; min-height: 36px; padding: 4px 10px; border-radius: var(--radius); border: 1px solid var(--ctl); background: var(--surface); color: var(--ink); }
  @media (max-width: 544px) { input.num, input.txtin { min-height: 44px; } }
  input.num { width: 72px; text-align: center; font-variant-numeric: tabular-nums; }
  input.num.pidin { width: 9em; }
  input.txtin { width: 100%; }
  input::placeholder { color: var(--muted); opacity: 1; }
  .qr { position: fixed; inset: 0; background: var(--ljr-paper); color: var(--ljr-ink); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
  .qr .code { font-size: 44px; font-weight: 600; letter-spacing: 3px; word-break: break-all; }
  .qr img { max-width: 90vw; max-height: 60vh; }
</style>
</head>
<body>
<header class="house-head">
  <div class="top house-row">
    <a id="backHome" class="btn back house-ib" href="../" data-back-home aria-label="Dashboard" title="Dashboard"><svg aria-hidden="true"><use href="#hi-home"/></svg></a>
    <h1><a href="#/me"><span class="dot" aria-hidden="true"></span>Marketplace</a></h1>
    <span class="house-sp" aria-hidden="true"></span>
    <span class="stamp" id="stamp">TEST</span><span class="readat house-read" id="readAt" data-house-read title="When the list was last read. It reads again every 5 minutes."></span>
    <button class="btn house-ib hidden" type="button" data-action="refresh" aria-label="Refresh" title="Refresh" id="refresh"><svg aria-hidden="true"><use href="#hi-refresh"/></svg></button>
    <span class="lookwrap" data-house-look></span>
    <button class="btn" type="button" data-action="signin" id="signin">Sign in</button>
  </div>
</header>
<main class="wrap">
  <div class="mkwho house-frow">
    <button class="btn house-fbtn" type="button" data-house-filter="people sitef stockf" aria-controls="people" aria-expanded="false">Filter<span class="cnt" id="whoN"></span></button>
    <div class="chips people house-filters hidden" id="people" role="group" aria-label="Whose items"></div>
  </div>
  <div id="banner" class="banner hidden" role="status"></div>
  <div id="view"></div>
</main>
<nav class="tabs house-tabs hidden" id="tabs" aria-label="Marketplace sections">
  <a href="#/me" data-nav="me" style="--tc:var(--ljr-7)"><span class="bar" aria-hidden="true"></span><i class="ti ti-home" aria-hidden="true"></i><span>Home</span><span class="n"></span></a>
  <a href="#/do" data-nav="do" style="--tc:var(--ljr-4)"><span class="bar" aria-hidden="true"></span><i class="ti ti-package" aria-hidden="true"></i><span>Do now</span><span class="n need" id="n-do"></span></a>
  <a href="#/decide" data-nav="decide" style="--tc:var(--ljr-6)"><span class="bar" aria-hidden="true"></span><i class="ti ti-traffic-lights" aria-hidden="true"></i><span>Decide</span><span class="n need" id="n-decide"></span></a>
  <a href="#/newstock" data-nav="newstock" style="--tc:var(--ljr-2)"><span class="bar" aria-hidden="true"></span><i class="ti ti-truck-delivery" aria-hidden="true"></i><span>New stock</span><span class="n need" id="n-newstock"></span></a>
  <a href="#/reply" data-nav="reply" style="--tc:var(--ljr-5)"><span class="bar" aria-hidden="true"></span><i class="ti ti-message" aria-hidden="true"></i><span>Reply</span><span class="n need" id="n-reply"></span></a>
  <a href="#/insights" data-nav="insights" style="--tc:var(--ljr-3)"><span class="bar" aria-hidden="true"></span><i class="ti ti-chart-bar" aria-hidden="true"></i><span>Insights</span><span class="n"></span></a>
</nav>
<div id="qr" class="qr hidden" role="dialog" aria-label="Drop-off code"></div>
<script>
(function () {

    if (open.tile) h += '<div class="card">' + (d.byCategory || []).map(function (c) { return '<div class="row"><div class="txt">' + esc(c.category) + '</div><div>' + esc(open.tile === 'sold' ? c.sold : '£' + (c.profit_p / 100).toFixed(2)) + '</div></div>'; }).join('') + '</div>';
    if (d.vat) h += '<p class="what">' + esc(d.vat) + '</p>';
    if (d.health) h += '<p class="what">' + esc(d.health) + '</p>';
    return h + growthBlock() + switchCard();
  }
  function render() {
    DashKit.signButton($('signin'), !!token);
    $('tabs').classList.toggle('hidden', !token); $('refresh').classList.toggle('hidden', !token);   // menu only after sign-in
    var on = TAB_OF[view] || view;
    document.querySelectorAll('nav.tabs a').forEach(function (a) { if (a.getAttribute('data-nav') === on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    ['do', 'decide', 'newstock', 'reply'].forEach(function (t) { var n = tabCount(t); $('n-' + t).textContent = n || ''; $('n-' + t).classList.toggle('wide', n > 99); $('n-' + t).parentNode.setAttribute('aria-label', $('n-' + t).previousSibling.textContent + (n ? ', ' + n + ' waiting' : '')); });
    $('people').classList.toggle('hidden', !token || !rows.some(function (r) { return detail(r).owner && detail(r).owner !== 'Lisa'; }));
    $('whoN').textContent = ((who !== 'All') + (site !== 'All') + (stockFilter !== 'all')) || '';   // the phone's one Filter button counts the filters that are on
    $('people').innerHTML = PEOPLE.map(function (p) { return '<button class="chip" type="button" data-who="' + p + '" aria-pressed="' + (who === p) + '">' + p + '</button>'; }).join('');
    $('stamp').textContent = M && M.live ? '' : 'TEST';
    var ready = typeof auth !== 'undefined' && auth.ready();
    $('signin').disabled = !token && !ready;
    if (!token) $('readAt').textContent = '';
    if (!token) { $('view').innerHTML = '<div class="card"><h2>Sign in to see what needs you</h2><button class="btn main big" type="button" data-action="signin"' + (ready ? '' : ' disabled') + '>Sign in</button></div>'; return; }
    $('view').innerHTML = pack && view === 'do' ? pagePack() : sheet && view === 'do' ? pageSheet() : view === 'me' ? pageMe() : view === 'round' ? pageRound() : view === 'numbers' ? pageNumbers()
      : view === 'insights' ? pageInsights() : view === 'stock' ? pageStock() : view === 'temu' ? pageTemu() : view === 'suppliers' ? pageSuppliers() : view === 'newstock' ? pageNewStock() : TABS[view] ? pageTab(view) : SECTIONS[view] ? pageList(view) : pageMe();
  }

  /* ---------- taps ---------- */
  function find(key) { return rows.filter(function (r) { return r.key === key; })[0]; }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, a'); if (!t) return;
    var a = t.getAttribute('data-action');
    if (a === 'signin') { if (!auth.ready()) return banner('Google sign-in is still loading. Try again in a moment.'); return auth.requestInteractive(); }
    if (a === 'signout') { token = null; DashAuth.clear(); rows = []; pics = null; avatars = null; return render(); }
    if (a === 'refresh') return load();
    if (a === 'all') { showAll = !showAll; return render(); }
    if (t.hasAttribute('data-who')) { who = t.getAttribute('data-who'); try { localStorage.setItem('mkt.who', who); } catch (x) {} return render(); }
    if (t.hasAttribute('data-site')) { site = t.getAttribute('data-site'); return render(); }
    if (a === 'pack') { pack = { i: 0 }; sheet = false; return render(); }
    if (a === 'nextpack') { pack.i += 1; if (pack.i >= posts().length) pack.i = 0; return render(); }
    if (a === 'stoppack') { pack = null; if (/\?pack\b/.test(location.hash)) { location.hash = '#/do'; return; } return render(); }
    if (a === 'sheet') { sheet = true; pack = null; return render(); }
    if (a === 'closesheet') { sheet = false; return render(); }
    if (t.hasAttribute('data-diff')) { pairDiff[t.getAttribute('data-diff')] = true; return render(); }               // v11.10 Fix 2
    if (t.hasAttribute('data-diffback')) { delete pairDiff[t.getAttribute('data-diffback')]; return render(); }
    if (t.hasAttribute('data-costsup')) { costPick[t.getAttribute('data-costsup')] = t.getAttribute('data-v') || null; return render(); }   // v11.10 Fix 3
    if (t.hasAttribute('data-costnewok')) { var ck = t.getAttribute('data-costnewok'), ci = document.querySelector('[data-costnew="' + ck + '"]'), cv2 = ci ? ci.value.replace(/[|=]/g, ' ').trim() : '';
      if (!cv2) return banner('Type the supplier\'s name first.'); costPick[ck] = cv2; return render(); }
    if (t.hasAttribute('data-nporder')) return npOrder(t.getAttribute('data-nporder'), t);                                  // v11.10 Fix 4
    if (t.hasAttribute('data-npterms')) { var tr = find(t.getAttribute('data-npterms')), ti = document.querySelector('[data-nptermsin="' + tr.key + '"]'), tv = ti ? ti.value.trim() : '';
      if (!/\d/.test(tv)) return banner('Type it like: free over 150, min 100'); t.disabled = true; return answer(tr, 'Terms', tv); }
    if (t.hasAttribute('data-ans')) {
      var r = find(t.getAttribute('data-ans')), v = t.getAttribute('data-v'), note = '';
      if (r.section === 'vinted') { var inp = document.querySelector('[data-link="' + r.key + '"]'); note = inp ? inp.value.trim() : ''; }
      var nb = document.querySelector('[data-note="' + r.key + '"]');                      // v11 cards: a note box (terms, quantity)
      if (nb && nb.value.trim()) note = nb.value.trim();
      if (v === 'Set' && !note) return banner('Type what to change first, for example: min 100, free over 300, delivery 15');
      if (r.section === 'cost' && v === 'Save') { var cn = note.replace(/^[£$€]\s*/, ''); if (!/^\d+(\.\d{1,2})?$/.test(cn)) return banner('Type what you paid for one, for example 4.50. Or tap Own item if it was yours.');
        var cd = detail(r), cs = costPick[r.key] !== undefined ? costPick[r.key] : (cd.last_supplier || ''), clean = function (x) { return String(x || '').replace(/[|=]/g, ' ').trim(); };   // v11.10: supplier, code, link, currency
        var cc = document.querySelector('[data-costcode="' + r.key + '"]'), cl = document.querySelector('[data-costlink="' + r.key + '"]'), cu = document.querySelector('[data-costcur="' + r.key + '"]'), lk = cl ? cl.value.trim() : '';
        if (lk && !/^https?:\/\/\S+$/i.test(lk)) return banner('The link must start https://');
        note = cn + (cs && cs !== '+new' ? '|sup=' + clean(cs) + (cc && cc.value.trim() ? '|code=' + clean(cc.value) : '') + (lk ? '|link=' + lk.replace(/\|/g, '%7C') : '') + '|cur=' + (cu ? cu.value : 'GBP') + ((cd.suppliers || []).indexOf(cs) < 0 ? '|new=1' : '') : ''); }
      if (r.section === 'offer') {                                                           // % box (data-note) + min profit box (data-min)
        var pc = note, mb = document.querySelector('[data-min="' + r.key + '"]'), mn = mb ? mb.value.trim() : '';
        if (pc && !(Number(pc) >= 5 && Number(pc) <= 90)) return banner('Type a % between 5 and 90, or leave it blank for ' + detail(r).pct + '%.');
        if (mn && !/^(£?\s*\d+(\.\d{1,2})?|\d+(\.\d+)?\s*%)$/.test(mn)) return banner('Min profit: type pounds like £20, or a % of the price like 25%.');
        note = (pc ? 'pct=' + pc : '') + (mn ? (pc ? ';' : '') + 'min=' + mn.replace(/\s+/g, '') : '');
      }
      if (v === 'Posted' && detail(r).parcel_id) {                                           // no mix-ups: the number on the parcel must match
        var pb = document.querySelector('[data-pid="' + r.key + '"]'), pv = pb ? pb.value.trim().toUpperCase() : '';
        if (pv !== String(detail(r).parcel_id).toUpperCase()) return banner('Type the parcel number written on the parcel (' + detail(r).parcel_id + ') before tapping Posted. If it does not match, stop: it may be the wrong parcel.');
      }
      var qb = document.querySelector('[data-qty="' + r.key + '"]');
      if (v === 'Different') { var da = document.querySelector('[data-diffa="' + r.key + '"]'), db = document.querySelector('[data-diffb="' + r.key + '"]'), na = da ? da.value.trim() : '', nb3 = db ? db.value.trim() : '';
        if ((na && !/^\d+$/.test(na)) || (nb3 && !/^\d+$/.test(nb3))) return banner('Type a number in each box, or leave it blank.'); note = [na ? 'this=' + na : '', nb3 ? 'ebay=' + nb3 : ''].filter(Boolean).join(' '); }
      if (qb && (v === 'Yes' || v === 'Same') && qb.value.trim()) { var qn = parseInt(qb.value, 10); if (!(qn >= 0)) return banner('Type a number for how many you have, or leave it blank.'); note = 'qty ' + qn; }
      t.disabled = true; t.classList.add('saving'); t.textContent = 'Saving…'; return answer(r, v, note);
    }
    if (t.hasAttribute('data-op')) { var ok = find(t.getAttribute('data-opkey')), ib = document.querySelector('[data-opin="' + ok.key + '"]'), on = ib ? parseInt(ib.value, 10) : NaN;
      if (!(on >= 0)) return banner('Type how many first, then tap ' + t.getAttribute('data-op') + '.'); t.disabled = true; return answer(ok, t.getAttribute('data-op') + ' ' + on, ''); }
    if (t.hasAttribute('data-set')) { var sr = find(t.getAttribute('data-set')), si = document.querySelector('[data-setin="' + sr.key + '"]'), sv = si ? si.value.trim() : '';
      if (!sv) return banner('Type what to change, for example: min 2, reorder 6, buy at 1.20'); t.disabled = true; return answer(sr, 'Set', sv); }
    if (t.hasAttribute('data-sup')) { var su = find(t.getAttribute('data-sup')), sb = document.querySelector('[data-supin="' + su.key + '"]'), sl = sb ? sb.value.trim() : '';
      if (!/^https?:\/\/\S+$/i.test(sl)) return banner('Paste the full product link, starting https://'); t.disabled = true; return answer(su, 'Set', 'link ' + sl); }
    if (t.hasAttribute('data-partadd')) { var pa = find(t.getAttribute('data-partadd')), ps = document.querySelector('[data-partpick="' + pa.key + '"]'), pv2 = ps ? ps.value : '';
      pv2 = pv2.trim().split(/\s+/)[0]; if (!pv2 || !codeTitle[pv2]) return banner('Type or pick a code from the list (for example SKU-0141).'); t.disabled = true; return answer(pa, 'Set', 'made of ' + t.getAttribute('data-base') + ' + ' + pv2); }
    if (t.hasAttribute('data-partnew')) { var pn = find(t.getAttribute('data-partnew')), nb2 = document.querySelector('[data-newpart="' + pn.key + '"]'), nq = document.querySelector('[data-newqty="' + pn.key + '"]');
      var nm = nb2 ? nb2.value.trim().replace(/[,;]/g, ' ') : '', qn2 = nq && nq.value.trim() !== '' ? parseInt(nq.value, 10) : null;
      if (!nm) return banner('Type the new part\'s name, for example: green watch case'); if (qn2 !== null && !(qn2 >= 0)) return banner('How many: type a number, or leave it blank.');
      t.disabled = true; return answer(pn, 'Set', 'new part: ' + nm + (qn2 !== null ? ', ' + qn2 : '')); }
    if (t.hasAttribute('data-partclear')) { t.disabled = true; return answer(find(t.getAttribute('data-partclear')), 'Set', 'made of none'); }
    if (t.hasAttribute('data-sfilter')) { stockFilter = t.getAttribute('data-sfilter'); return render(); }
    if (t.hasAttribute('data-copycode')) { navigator.clipboard.writeText(t.getAttribute('data-copycode')).then(function () { t.textContent = 'Copied'; }); return; }
    if (t.hasAttribute('data-arrive')) { var ar = find(t.getAttribute('data-arrive')), box = document.querySelector('[data-arrived="' + ar.key + '"]'), n = box ? parseInt(box.value, 10) : NaN;
      if (!(n >= 0)) return banner('Type how many arrived, then tap Arrived.'); t.disabled = true; return answer(ar, 'Arrived ' + n, ''); }
    if (t.hasAttribute('data-undo')) { var u = find(t.getAttribute('data-undo')); if (Date.now() < Date.parse(u.answered_at) + UNDO_MS) answer(u, '', ''); return; }
    if (t.hasAttribute('data-copy')) { var c = find(t.getAttribute('data-copy')); navigator.clipboard.writeText(detail(c).text || '').then(function () { t.textContent = 'Copied'; }); return; }
    if (t.hasAttribute('data-qr')) { var q = detail(find(t.getAttribute('data-qr'))); $('qr').innerHTML = (q.qr_image ? '<img alt="QR code" src="' + esc(q.qr_image) + '">' : '') + '<div class="code">' + esc(q.qr) + '</div><button class="btn big" type="button" data-action="closeqr">Close</button>'; $('qr').className = 'qr'; return; }
    if (a === 'closeqr') { $('qr').className = 'qr hidden'; return; }
    if (t.hasAttribute('data-tile')) { open.tile = open.tile === t.getAttribute('data-tile') ? null : t.getAttribute('data-tile'); return render(); }
    if (t.hasAttribute('data-tick')) { var k = t.getAttribute('data-tick'); round[k] = { ok: true, n: '' }; return render(); }
    if (t.hasAttribute('data-reason')) { var kk = t.getAttribute('data-reason'); round[kk] = Object.assign(round[kk] || {}, { reason: t.getAttribute('data-v') }); return render(); }
    if (t.hasAttribute('data-shelf')) { round.i = (round.i || 0) + Number(t.getAttribute('data-shelf')); showAll = false; return render(); }
    if (a === 'finish') return finishRound();
  });
  document.addEventListener('input', function (e) {
    if (e.target.hasAttribute('data-npq')) { var qk = e.target.getAttribute('data-npq'); npState[qk] = Object.assign(npState[qk] || {}, { q: e.target.value }); return npSums(e.target.getAttribute('data-npsup')); }   // v11.10 Fix 4
    if (e.target.hasAttribute('data-find')) { var q = e.target.value.trim().toLowerCase(); document.querySelectorAll('.stockrow').forEach(function (c) { c.classList.toggle('hidden', !!q && c.getAttribute('data-text').indexOf(q) < 0); }); return; } var k = e.target.getAttribute('data-count'); if (k) { round[k] = Object.assign(round[k] || {}, { n: e.target.value, ok: false }); } });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-npinc')) { var ik = e.target.getAttribute('data-npinc'); npState[ik] = Object.assign(npState[ik] || {}, { off: !e.target.checked }); return npSums(e.target.getAttribute('data-npsup')); }
    if (view === 'round') render(); });
  // No reason, no save (CD Hub round rule). Each item row gets "ok" or "<count> <reason>".
  function finishRound() {
    var todo = rows.filter(function (r) { return r.section === 'round' && !r.answer && round[r.key]; }), missing = [];
    todo.forEach(function (r) { var v = round[r.key], d = detail(r); if (v.n !== '' && v.n !== undefined && Number(v.n) !== Number(d.expected) && !v.reason) missing.push(r.title); });
    if (missing.length) return banner('Pick a reason for: ' + missing.join(', '));
    todo.reduce(function (p, r) { var v = round[r.key]; return p.then(function () { return answer(r, v.ok || v.n === '' || v.n === undefined ? 'ok' : String(Number(v.n)) + ' ' + v.reason, ''); }); }, Promise.resolve())
      .then(function () { banner('Round saved. The engine applies it after 10 minutes.', true); });
  }
  function route() { view = (location.hash.replace(/^#\//, '').split('?')[0]) || 'me'; showAll = false; pack = view === 'do' && /\?pack\b/.test(location.hash) ? { i: 0 } : null; sheet = false; render(); }
  window.addEventListener('hashchange', route);

  /* ---------- sign-in: same shared DashAuth as every dashboard page ---------- */
  var auth = DashAuth.bind({ clientId: CLIENT_ID, scope: SCOPE,
    onToken: function (resp) {
      if (resp.error) return banner('Sign-in did not complete.');
      if (window.google && google.accounts && !google.accounts.oauth2.hasGrantedAllScopes(resp, SHEETS)) { banner('Google did not give this page spreadsheet access. Tap Sign in again and tick every box Google shows.'); return; }
      token = resp.access_token; DashAuth.save(token, DashAuth.expiryFrom(resp.expires_in), resp.scope || SCOPE); load();
    },
    onError: function () { banner('Sign-in did not complete.'); }, onSilentFail: function () {} });
  var saved = DashAuth.valid(); if (saved && DashAuth.hasScope(saved, SCOPE)) { token = saved.access_token; }
  route(); load(); setInterval(function () { if (token) load(); }, 5 * 60000);
  // Google's sign-in script loads after this one: start the shared sign-in as soon as it is there (same as Factory).
  var tries = 0;
  (function wait() { if (auth.init()) { render(); return; } if (++tries > 100) { banner('Google sign-in did not load.'); return; } setTimeout(wait, 100); })();
})();
</script>
