<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--fs-body)/1.5 var(--house-font);-webkit-text-size-adjust:100%}
a{color:inherit;text-underline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}
.wrap{padding-left:var(--house-gutter);padding-right:var(--house-gutter);padding-bottom:140px}
.hin{max-width:none;margin:0 auto;padding-left:var(--house-gutter);padding-right:var(--house-gutter)}
.ti{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.skip{position:absolute;left:-999px;top:8px;z-index:50;background:var(--card);color:var(--ink);padding:8px 14px;border-radius:var(--radius);border:1px solid var(--ink)}
.skip:focus{left:8px}
header.top{background:var(--frame);color:var(--frame-ink);position:sticky;top:0;z-index:20}
h1,h2,h3,b,strong{font-weight:600}
.btn{font-family:inherit;font-size:var(--fs-small);font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--press);border-radius:var(--radius);min-height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none;line-height:1.2}
header .btn{color:var(--frame-ink);background:transparent;border-color:var(--frame-line)}
@media(hover:hover){header .btn:hover{background:var(--frame-hov);}}
@media(max-width:544px){.btn{min-height:44px}header.top{position:static}#view-d .rscroll{display:none}.wrap{padding-bottom:170px}}   /* a phone shows the room cards only (quality review 12 Nov) */
.boot{padding:40px 0;text-align:center;color:var(--ink);font-size:var(--fs-body)}
.bootline{margin:14px 0 0;color:var(--ink);font-weight:400}
.bootmark{display:inline-flex;color:var(--ink)}
.bootspin{width:48px;height:48px;display:block}
.botring{fill:none;stroke:var(--ljr-5);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:34 98;transform-box:fill-box;transform-origin:center;animation:bootspin 1.1s linear infinite}
.boothouse{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@keyframes bootspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.botring{animation:none;stroke-dasharray:none}}
.live{font-size:var(--fs-small);font-weight:600;border:1px solid var(--frame-line);border-radius:var(--radius);padding:0 8px;height:24px;display:inline-flex;align-items:center;white-space:nowrap;color:var(--frame-ink)}
.live.ok{border-color:var(--ljr-5)}
.live.bad{border-color:var(--ljr-3)}
.sec h3{font-size:var(--fs-head);margin:0 0 8px}
.sec+.sec{margin-top:20px;padding-top:12px;border-top:1px solid var(--line)}
.rdate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.rdate label{font-size:var(--fs-small);color:var(--muted)}
.rdate input{border:1px solid var(--press);border-radius:var(--radius);padding:4px 10px;font:inherit;font-size:var(--fs-small);background:var(--card);color:var(--ink);min-height:36px}
.rtiles{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.rtile{flex:1 1 168px;max-width:280px;min-height:44px;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:transparent;color:var(--ink)}
.rtile .rn{font-size:var(--fs-small);font-weight:600}
.rtile .rs{font-size:var(--fs-small);line-height:1.35}
.rscroll{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.rtable{width:100%;border-collapse:collapse;font-size:var(--fs-small)}
.rtable th,.rtable td{text-align:left;padding:2px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;line-height:1.3;font-weight:400;white-space:nowrap}
.rtable th{font-weight:600;color:var(--ink)}
.rtable td.nm{font-weight:600;white-space:normal}
.rtable tr:last-child td{border-bottom:0}
.dgrid{display:flex;flex-wrap:wrap;gap:8px 16px}
.dgrid .dr{border:0;padding:0;min-width:7.5em;justify-content:flex-start;gap:6px}

/* Year / view controls */
h2.ph{font-size:var(--fs-head);margin:24px 0 2px}
.sub{color:var(--muted);font-size:var(--fs-body);margin:0 0 16px}
.yr-row{display:flex;gap:6px;margin:0 0 12px;align-items:center;flex-wrap:wrap}
.yr-btn{min-height:40px;font-size:var(--fs-small);font-weight:600;padding:0 12px}
.yr-btn.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tab-row{display:flex;flex-wrap:wrap;gap:2px;background:var(--soft);padding:3px;border-radius:calc(var(--radius) + 3px);width:auto;max-width:100%;margin:0 0 16px}
.tab{min-height:40px;padding:6px 16px;border:none;background:transparent;border-radius:var(--radius);cursor:pointer;font:600 var(--fs-small)/1 var(--house-font);color:var(--muted)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
@media(hover:hover){.tab:not(.on):hover{color:var(--ink)}}
.view{display:none}.view.on{display:block}

/* Legend */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.leg{display:flex;align-items:center;gap:5px;font-size:var(--fs-small);color:var(--muted)}
.leg-sq{width:11px;height:11px;border-radius:2px;flex:none}

/* Heat-map calendar */
/* Months at least 320px wide, so every day is a 40px+ tap target (one month per row on a phone). */
.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:10px;margin-bottom:20px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)}
.mn{font-size:var(--fs-small);font-weight:600;color:var(--muted);margin-bottom:6px}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dh{font-size:10px;color:var(--muted);text-align:center;padding-bottom:2px;user-select:none}
.d{width:100%;aspect-ratio:1;border-radius:var(--radius);border:none;font-size:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.d:not(.empty):not(.future):not(.nd){cursor:pointer}
@media(hover:hover){.d:not(.empty):not(.future):not(.nd):hover{transform:scale(1.35);z-index:2;position:relative}}
.d.empty{background:transparent;box-shadow:none}
.d.future{background:var(--paper);border:1px solid var(--line);box-shadow:none;opacity:.35}
.d.unknown,.sd.unknown{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
/* In limit: solid green (the owner 17 Nov 2026: the pale tint with a frame looked "weird"; back to the solid green she had). Outside limit: solid orange. Missed: the same orange as a frame on a light cell, never a brown fill. */
.d.allok{background:var(--ljr-5);box-shadow:none}.d.warn{background:var(--ljr-3);box-shadow:none}.d.miss{background:var(--card);box-shadow:inset 0 0 0 2px var(--ljr-3)}.d.nolimit{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.d.ocool{background:var(--ljr-6-tint);box-shadow:none}.d.omild{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}.d.owarm{background:var(--ljr-4-tint);box-shadow:none}
.d.today:not(.empty){outline:2px solid var(--ink);outline-offset:-2px}
/* indoor corner dot */
.d{position:relative}
.d-dot{position:absolute;top:1px;right:1px;width:5px;height:5px;border-radius:50%;pointer-events:none}
/* 21 Nov 2026: house colour rules (never red; no warning colour on the outside calendar): the indoor dot is ink. A ring = cannot be read, solid = outside the limit. */
.d-dot.idot-warn{background:var(--ink)}.d-dot.idot-flag{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
/* compliance mode cells */
/* 22 Nov 2026 (OV12): house colour rules on the outside calendar - never red, no warning colour. Ink ring = cannot be read, solid ink = outside the limit. */
.d.comp-flag{background:var(--card);box-shadow:inset 0 0 0 2px var(--ink)}.d.comp-warn{background:var(--ink)}.d.comp-ok{background:var(--ljr-5);opacity:.85}.d.comp-nd{background:var(--soft)}
.sd.comp-flag{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}.sd.comp-warn{background:var(--ink)}.sd.comp-ok{background:var(--ljr-5);opacity:.85}.sd.comp-nd{background:var(--soft)}
/* view mode toggle */
.vt-wrap{display:flex;gap:2px;background:var(--soft);border-radius:calc(var(--radius) + 2px);padding:2px;width:max-content;margin-bottom:12px}
.vt-btn{padding:4px 12px;min-height:40px;border:none;background:transparent;border-radius:var(--radius);font:600 var(--fs-small)/1.4 var(--house-font);color:var(--muted);cursor:pointer}
.vt-btn.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
/* compact indoor table in drill panel */
.itable{width:100%;border-collapse:collapse;font-size:var(--fs-small);margin-top:4px}
.itable th{padding:4px 6px;text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.itable td{padding:5px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
.itable tr:last-child td{border-bottom:none}
/* Over the maximum = cooling action, not outside (the owner 17 Nov 2026): a light warm tint, never the solid orange of a breach */
.d.warmd{background:var(--ljr-4-tint);box-shadow:inset 0 0 0 2px var(--ljr-5)}.sd.warmd{background:var(--ljr-4-tint);box-shadow:inset 0 0 0 2px var(--ljr-5)}
.cool-act{color:var(--muted)}

/* Strip view */
.strip{display:flex;flex-direction:column;gap:3px;margin-bottom:20px}
.srow{display:flex;align-items:center;gap:6px}
.slbl{font-size:10px;color:var(--muted);width:24px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.sdays{display:flex;gap:1px;flex:1;overflow-x:auto;padding-bottom:1px}
.sd{height:14px;min-width:3px;flex:1;border-radius:var(--radius);cursor:default;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.sd:not(.future):not(.nd){cursor:pointer}
@media(hover:hover){.sd:not(.future):not(.nd):hover{transform:scaleY(1.5);z-index:2}}
.sd.allok{background:var(--ljr-5);box-shadow:none}.sd.warn{background:var(--ljr-3);box-shadow:none}.sd.miss{background:var(--card);box-shadow:inset 0 0 0 2px var(--ljr-3)}.sd.nolimit{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.sd.ocool{background:var(--ljr-6-tint);box-shadow:none}.sd.omild{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}.sd.owarm{background:var(--ljr-4-tint);box-shadow:none}
.sd.future{background:var(--paper);border:1px solid var(--line);box-shadow:none;opacity:.3;cursor:default}
.smlbls{display:flex;gap:1px;padding-left:30px;margin-bottom:3px}
.sml{flex:1;font-size:9px;color:var(--muted);text-align:center}

/* Month card list */
.mlist{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
button.mitem{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
@media(hover:hover){button.mitem:hover{background:var(--soft)}}
.mitem{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.mitem-head{display:flex;justify-content:space-between;align-items:baseline}
.mitem-name{font-size:var(--fs-body);font-weight:600}
.mitem-stats{display:flex;gap:12px;font-size:var(--fs-small);color:var(--muted);margin-top:3px;flex-wrap:wrap}
.spill{display:flex;align-items:center;gap:4px}
.sdot{width:8px;height:8px;border-radius:50%;flex:none}
.comp-bar{height:3px;background:var(--soft);border-radius:2px;margin-top:8px;overflow:hidden}
.comp-fill{height:100%;border-radius:2px;background:var(--ljr-5)}
.chev{font-size:14px;color:var(--muted)}

/* Drill panel */
#drill{display:none;position:fixed;top:12px;right:12px;width:min(320px,calc(100vw - 24px));height:calc(100% - 24px);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);z-index:100;padding:16px;overflow-y:auto;box-shadow:var(--shadow)}
#drill.open{display:block}
.dclose{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);font-size:18px;cursor:pointer;color:var(--muted);float:right;line-height:1;padding:0;min-width:44px;min-height:44px}
.dtitle{font-size:var(--fs-head);font-weight:600;margin:0 0 12px;clear:right}
.dsub{font-size:var(--fs-small);color:var(--muted);margin:0 0 14px}
.dblock{border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;margin:0 0 12px;background:var(--card)}
.dblock:last-child{margin-bottom:0}
.dr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:var(--fs-small)}
.dr:last-child{border-bottom:none}
.dsec{font-size:var(--fs-small);font-weight:600;color:var(--muted);margin:0 0 6px;letter-spacing:.04em}
/* Solid orange text (.warn) = outside the limit. A framed chip (.miss) = a needed reading was missed. No red, no brown fill. */
.warn{color:var(--ljr-3-text);font-weight:600}
span.miss{display:inline-block;border:1px solid var(--ljr-3);border-radius:var(--radius);padding:0 6px;background:var(--card);color:var(--ljr-3-text);font-weight:600}
.tick{color:var(--ljr-5-text)}
.due{color:var(--muted)}
.rl{padding:8px 10px;margin:0 0 8px;border:1px solid var(--line);border-radius:var(--radius);font-size:var(--fs-small);font-variant-numeric:tabular-nums;background:var(--card)}
.rl:last-child{margin-bottom:0}
.rl b{font-weight:600}
.rl .note{display:block;margin-top:2px}
.oline{font-size:var(--fs-small);font-variant-numeric:tabular-nums;margin:0}
.rep-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 14px}
.rep-ctl label{font-size:var(--fs-small);color:var(--muted)}
.rep-ctl select{min-height:40px;max-width:100%;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--ink);font:inherit;padding:0 8px}
.rep-ctl .btn{min-height:40px}
.rep-say{flex-basis:100%;margin:0;font-size:var(--fs-small);color:var(--muted)}
.rep-say:empty{display:none}
.rep-h{font-size:var(--fs-head);margin:0 0 4px}
.rep-why,.rep-sum{font-size:var(--fs-small);color:var(--muted);margin:0 0 8px}
.rep-all{color:var(--ink);font-weight:600}
.rep-room{margin:14px 0 18px}
.rep-room h3{margin:0 0 4px}
.rep-tab{width:100%;border-collapse:collapse;font-size:var(--fs-small);font-variant-numeric:tabular-nums}
.rep-tab th,.rep-tab td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.rep-tab th{color:var(--muted);font-weight:600;white-space:nowrap}
.rep-tab .rep-d{white-space:nowrap}
.rep-bad td{color:var(--ljr-3-text);font-weight:600}
@media print{
  @page{size:A4;margin:12mm}
  body.print-report>*:not(.wrap){display:none!important}
  body.print-report #main>*:not(#view-r){display:none!important}
  body.print-report #view-r{display:block!important}
  body.print-report .rep-ctl,body.print-report .house-fold{display:none!important}
  body.print-report .wrap,body.print-report #main{padding:0!important;margin:0!important;max-width:none!important}
  body.print-report .rscroll{overflow:visible!important}
  body.print-report .rep-tab{font-size:9pt}
  body.print-report .rep-room{break-inside:auto}
  body.print-report .rep-room+.rep-room{break-before:page}
  body.print-report .rep-tab tr{break-inside:avoid}
  body.print-report .rep-bad td{color:var(--ljr-3-text);font-weight:700}
}
</style>
</head>

<script>
/* ---- config ---- */
var SHEET_ID=window.DASH_CONFIG.cdhub.readingsSheetId;
var EXPORT_URL='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&sheet=readings';
var DRIVE_EXPORT='https://www.googleapis.com/drive/v3/files/'+SHEET_ID+'/export?mimeType=text%2Fcsv';
var CLIENT_ID=window.DASH_CONFIG.clientId;
var SCOPE=window.DASH_CONFIG.scopes.read;
var TOKEN=null,TOKEN_EXP=0;
var DAYS={};  /* ISO date -> row */
var FOLDER_ID=window.DASH_CONFIG.cdhub.folderId;
var DRIVE_API=window.DASH_CONFIG.urls.files;
var AREA_HDR_BAD='';  /* set when the area_reading sheet's heading row is not on row 1 (sorted or filtered) */
var AREA_DAYS={};  /* ISO date -> areaId -> {am:{min,max},pm:{min,max}} */
var AREA_NAMES={};  /* areaId -> display name/code */

function parseCSV(text){
  text=String(text||'').replace(/\r/g,'');
  var rows=[],row=[],f='',q=false,c,i;
  for(i=0;i<text.length;i++){c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'){row.push(f.trimEnd());rows.push(row);row=[];f='';}
    else f+=c;}
  if(f||row.length){row.push(f.trimEnd());rows.push(row);}
  rows=rows.filter(function(r){return r.some(function(v){return v.trim();});});
  if(!rows.length)return[];
  var hdr=rows[0].map(function(h){return h.trim();});
  return rows.slice(1).map(function(r){var o={};hdr.forEach(function(h,i){o[h]=(r[i]||'').trim();});return o;});
}

}
/* First non-trashed match (the query already sets trashed=false). Returns the file, including mimeType. */
function findDriveFile(name){
  var q="'"+FOLDER_ID+"' in parents and name='"+name+"' and trashed=false";
  var url=DRIVE_API+'?q='+encodeURIComponent(q)+'&fields=files(id,name,mimeType)&supportsAllDrives=true&includeItemsFromAllDrives=true';
  return gjson(url).then(function(r){var f=r.files||[];return f.length?f[0]:null;});
}
/* A Google Sheet of that title is exported as CSV. A real CSV file is read as media. Same errors as gget. */
function readDriveFile(f){
  var id=encodeURIComponent(f.id);
  if(f.mimeType==='application/vnd.google-apps.spreadsheet')
    return gget(DRIVE_API+'/'+id+'/export?mimeType='+encodeURIComponent('text/csv')+'&supportsAllDrives=true');
  return gget(DRIVE_API+'/'+id+'?alt=media&supportsAllDrives=true');
}
/* Limits come from BLD-temperature_band rows, never typed here (the owner 12 Nov 2026: every limit is a dated row).
   A reading is judged by the rows in force on its own day (the shared rule, staff/lib/capacity.js; two in force: the
   later from_date wins), for its room: a row for this room beats a row for every room, and when rows have ages the
   youngest dog in the room that day picks the row (as the staff round and the hub do). The youngest dog comes from
   BLD-occupancy (the dog's row in force that day) and BLD-subject.dob; a room linked into this one (BLD-area_link)
   counts its dogs too. No dog with a date of birth: the open-ended (adult) row. No row = 'unknown'.
   BAND = today's adult row, for the key. */
var BANDS=[], BAND=null, SUBJ_DOB={}, OCC_BY_DOG={};
function num(v){ if(v===''||v==null) return null; var n=parseFloat(v); return isNaN(n)?null:n; }
/* ISO first; otherwise a D/M/Y date (Drive / sheet export). Used so a past day still matches its readings and limits. */
function isoDay(v){
  var s=String(v==null?'':v).trim(), m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(!m) return '';
  var y=m[3].length===2?'20'+m[3]:m[3], mo=('0'+m[2]).slice(-2), d=('0'+m[1]).slice(-2);
  return y+'-'+mo+'-'+d;
}
function readingWhen(at){
  var s=String(at||'').trim(), day=isoDay(s), tm=s.match(/[T ](\d{1,2}):/), hr=tm?parseInt(tm[1],10):NaN;
  return {day:day, slot:(isNaN(hr)||hr<12)?'am':'pm'};
}
function daysBetween(a,b){ var x=Date.parse(a+'T00:00:00Z'), y=Date.parse(b+'T00:00:00Z'); return isNaN(x)||isNaN(y)?null:Math.round((y-x)/86400000); }
/* the room a dog was in on a day: its occupancy row with the latest moved_in on or before the day (rows are never
   edited; a move adds a row), unless that row's moved_out is before the day */
function roomOfDog(sid,day){
  var O=window.BLDOccupancy, row=O&&O.rowOn?O.rowOn(OCC_BY_DOG[sid]||[],sid,day):null;
  return row&&row.area_id?row.area_id:'';
}
var YOUNG_CACHE={};
function youngestIn(aid,day){
  var key=aid+'|'+day; if(key in YOUNG_CACHE) return YOUNG_CACHE[key];
  return (YOUNG_CACHE[key]=youngestCalc(aid,day));
}
function youngestCalc(aid,day){
  var rooms={}; rooms[aid]=1;
  (LINKS||[]).forEach(function(l){ if(l.to_area_id===aid&&BLDCapacity.inForce([l],day).length) rooms[l.from_area_id]=1; });
  var young=null;
  Object.keys(SUBJ_DOB).forEach(function(sid){
    var dob=SUBJ_DOB[sid]; if(!dob||dob>day) return;
    if(!rooms[roomOfDog(sid,day)]) return;
    var a=daysBetween(dob,day); if(a!==null&&(young===null||a<young)) young=a;
  });
  return young;
}
/* The limit rows that apply to a room on a day (shared by bandOn and adultBandOn). */
function bandRows(day,aid){
  day=isoDay(day)||String(day||'').slice(0,10);
  var on=BLDCapacity.inForce(BANDS,day);
  /* A limit whose from_date is later than this day (typed in after the reading) still colours it, unless a row already in force covers the same room and age. A puppy row in force must not leave July adult days with no band: those cells stay a pale empty colour. */
  BANDS.forEach(function(b){
    if(on.indexOf(b)>=0) return;
    var f=isoDay(b.from_date), t=isoDay(b.to_date);
    if(!f||f<=day) return;
    if(t&&day>t) return;
    var covered=on.some(function(o){ return String(o.area_id||'')===String(b.area_id||'')&&o.age_from===b.age_from&&o.age_to===b.age_to; });
    if(!covered) on.push(b);
  });
  var own=aid?on.filter(function(b){ return b.area_id===aid; }):[];
  return own.length?own:on.filter(function(b){ return !b.area_id; });
}
function bandOn(day,aid){
  day=isoDay(day)||String(day||'').slice(0,10);
  var rows=bandRows(day,aid);
  if(!rows.length) return null;
  var aged=rows.some(function(b){ return b.age_from!==null||b.age_to!==null; });
  var young=aged&&aid?youngestIn(aid,day):null;
  var fits=rows.filter(function(b){
    if(!aged||(b.age_from===null&&b.age_to===null)) return true;
    if(young===null) return b.age_to===null;   /* no dogs or no dates of birth: the open-ended (adult) row */
    return young>=(b.age_from||0)&&(b.age_to===null||young<=b.age_to);
  });
  fits.sort(function(a,b){ return (b.age_from||0)-(a.age_from||0)||String(b.from_date).localeCompare(String(a.from_date)); });
  return fits[0]||null;
}
/* The open-ended (adult) row in force for a room on a day: the room itself is always judged on it (Temps A, 17 Nov 2026). */
function adultBandOn(day,aid){
  day=isoDay(day)||String(day||'').slice(0,10);
  var rows=bandRows(day,aid).filter(function(b){ return b.age_to===null; });
  rows.sort(function(a,b){ return String(b.from_date).localeCompare(String(a.from_date)); });
  return rows[0]||null;
}
/* A saved value must be a plain number (OV11 15 Nov 2026): "25,3" or other text in the sheet is never read as 25; a reading
   with one side blank or not a number is "Check: not a number", counted with the problems, so text never hides from the counts. */
function tempNum(v){ v=String(v==null?'':v).trim(); if(!v) return null; return /^-?\d+(\.\d+)?$/.test(v)?parseFloat(v):undefined; }
function tempUnreadable(min,max){ var a=tempNum(min), b=tempNum(max); if(a===null&&b===null) return false; return a===undefined||b===undefined||a===null||b===null; }
function tempSwapped(min,max){ var lo=tempNum(min), hi=tempNum(max); return typeof lo==='number'&&typeof hi==='number'&&hi<lo; }
function tempCls(min,max,day,aid,spot){
  var lo=parseFloat(min),hi=parseFloat(max), B=bandOn(day||TODAY_STR,aid);
  if(isNaN(lo)&&isNaN(hi)&&!tempUnreadable(min,max))return'';
  if(tempUnreadable(min,max))return'unread';
  if(tempSwapped(min,max))return'swap';   /* max lower than min: typed the wrong way round, checked before hot/cold */
  if(!B)return'unknown';
  /* Temps A (the owner 17 Nov 2026), staff/lib/temp-judge.js: the room on the adult row (over its max = cooling action, not
     outside); puppies under four weeks: the bed spot on their own row; no bed spot = "not recorded", not outside. */
  var k=window.BLDTempJudge?BLDTempJudge.judge({min:min,max:max,spot:spot},B,adultBandOn(day||TODAY_STR,aid),B.age_to!==null):((!isNaN(lo)&&lo<B.min)?'cold':(!isNaN(hi)&&hi>B.max)?'warm':'ok');
  return k;
}
async function loadBand(){
  BANDS=[]; BAND=null;
  try{
    var f=await findDriveFile('BLD-temperature_band.csv');
    if(!f)return;
    parseCSV(await readDriveFile(f)).forEach(function(r){
      var lo=num(r.min_temp),hi=num(r.max_temp);
      if(lo!==null&&hi!==null)BANDS.push({min:lo,max:hi,age_from:num(r.age_from_days),age_to:num(r.age_to_days),area_id:r.area_id||'',
        from_date:isoDay(r.from_date),to_date:isoDay(r.to_date)});
    });
    BAND=bandOn(TODAY_STR);
  }catch(e){console.warn('Temperature limits load failed:',e);}
}

  (await optionalCsv('BLD-occupancy.csv')).forEach(function(r){ if(r.subject_id) (OCC_BY_DOG[r.subject_id]||(OCC_BY_DOG[r.subject_id]=[])).push(r); });   /* include leave rows so rowOn can end a stay */
}

async function loadAreaData(){
  AREA_STATUS={};
  await loadBand();
  try{
    REQ=await optionalCsv('BLD-requirement.csv');
    THERMOS=await optionalCsv('BLD-thermometer.csv');
    LINKS=await optionalCsv('BLD-area_link.csv');
    await loadDogs();   /* the youngest dog picks an age row (puppies under 4 weeks are judged by their own row) */
    var rf=await findDriveFile('BLD-area_reading.csv');
    if(rf){
      var txt=await readDriveFile(rf);
      var rows=parseCSV(txt);
      AREA_HDR_BAD=(rows.length&&(!('area_id' in rows[0])||!('min_c' in rows[0])||!('max_c' in rows[0])))?'row 1 is not the heading row'
        :rows.some(function(r){ return r.id==='id'||r.area_id==='area_id'; })?'a heading row is also lower down':'';
      rows=rows.filter(function(r){ return r.id!=='id'&&r.area_id!=='area_id'; });
      /* the owner 18 Nov 2026: a room marked empty (BLD-requirement room.empty, dated) shows Room empty with its temperatures hidden;
         the readings stay in the records. Before and after the link copies, so a copy never carries them into another room. */
      var hideE=function(x){ var O=window.BLDOccupancy; return O&&O.hideEmpty?O.hideEmpty(x,REQ,function(r){ return readingWhen(r.period_start||r.taken_at).day; }):x; };
      rows=hideE(rows);
      if(window.BLDAreaLink) rows=window.BLDAreaLink.expand(rows,LINKS);   /* copies marked linked_from; originals unchanged */
      rows=hideE(rows);
      AREA_DAYS={};
      rows.slice().sort(function(a,b){return String(a.taken_at||'')<String(b.taken_at||'')?-1:1;}).forEach(function(r){
        var at=String(r.period_start||r.taken_at||''), when=readingWhen(at); if(!r.area_id||!when.day)return;   /* period_start: a reading typed later belongs to its own slot */
        var date=when.day,slot=when.slot;
        if(!AREA_DAYS[date])AREA_DAYS[date]={};
        var u=unitFor(r.area_id,r.thermometer_id);
        if(!AREA_DAYS[date][u])AREA_DAYS[date][u]={};
        var v={min:r.min_c,max:r.max_c,spot:r.spot_c,note:r.mitigation_note||'',empty:String(r.room_empty||'').toLowerCase()==='yes',from:r.linked_from?[r.linked_from]:[],by:String(r.taken_by||'').trim(),at:String(r.taken_at||'').trim()};   /* by/at: who and when it was entered, for the print's late list */
        var was=AREA_DAYS[date][u][slot];
        /* A merged room: two old rooms' readings in one slot. Never averaged: the lowest MIN and highest MAX, so a breach stays visible. */
        /* A reading taken in the room itself wins over linked copies (same rule as Compliance, SOPS 12 Nov). */
        if(was&&!was.from.length&&v.from.length) return;

          var w=window.BLDAreaLink.widest(was,v);
          v={min:w.min===null?'':String(w.min),max:w.max===null?'':String(w.max),note:[was.note,v.note].filter(Boolean).join(' · '),empty:was.empty&&v.empty,from:was.from.concat(v.from.filter(function(f){ return was.from.indexOf(f)<0; })),by:was.by,at:was.at};
        }

    Object.keys(AREA_DAYS).forEach(function(d){ Object.keys(AREA_DAYS[d]).forEach(function(aid){
      var s=SPAN[aid]||(SPAN[aid]={first:d,last:d}); if(d<s.first)s.first=d; if(d>s.last)s.last=d; }); });
    var af=await findDriveFile('BLD-area.csv');
    if(af){
      var atxt=await readDriveFile(af);
      parseCSV(atxt).forEach(function(a){
        if(!a.id)return;
        AREA_NAMES[a.id]=a.code||a.name||a.id;
        var g=parseFloat(a.group_sort);AREA_SORT[a.id]=isNaN(g)?Infinity:g;
      });
    }
  }catch(e){console.warn('Area data load failed:',e);}
  AREA_STATUS={};
}

/* ---- calendar logic ---- */

function ds(y,m,d){return y+'-'+(m<9?'0':'')+(m+1)+'-'+(d<10?'0':'')+d;}

function dayClass(isoDate){
  if(isoDate>TODAY_STR)return'future';
  var r=DAYS[isoDate];
  if(!r)return'nd';
  var t=parseFloat(r.max_temp);
  if(isNaN(t))return'nd';
  var B=bandOn(isoDate);
  if(!B)return'omild';
  if(t<B.min)return'ocool';
  if(t>B.max)return'owarm';

/* ---- views ---- */
var YEAR=+TODAY_STR.slice(0,4);
/* Round order comes from BLD-area rows: group_sort, then code. When a room is in use and a thermometer is needed
   comes only from BLD-requirement rows through the shared lib (staff/lib/needs.js, thermometer.js, occupancy.js;
   the owner 11 Nov 2026, "A standard"). A room whose room.in_use rows have all ended is retired: left out of the round

    for(var mi=0;mi<12;mi++){
      for(var d=1;d<=md[mi];d++){
        if((new Date(y,mi,d).getDay()+6)%7===di){
          var date=ds(y,mi,d), cls=classOf(date), word=stateWord(cls);
          var clk=(cls!=='future'&&cls!=='nd')?' onclick="openDrill(\''+date+'\')"':'';
          var ist2=date<=TODAY_STR?areaStatus(date):'';
          var scls=(kind==='out'&&VIEW_MODE==='compliance'&&date<=TODAY_STR)?(ist2?'comp-'+ist2:'comp-nd'):cls;
          h+='<div class="sd '+scls+(kind==='out'?' dout':'')+'" title="'+d+' '+MONTHS[mi]+' '+kind+' — '+word+'"'+clk+'></div>';
        }
      }
    }
    h+='</div></div>';
  });
  return h+'</div>';
}
function buildHeatMap(y){
  return '<section class="sec"><h3>Indoors</h3>'+monthCal(y, indoorDayClass, 'indoors')+'</section>'
    +'<section class="sec"><h3>Outside</h3>'+monthCal(y, dayClass, 'out')+'</section>';
}
function buildStrip(y){
  return '<section class="sec"><h3>Indoors</h3>'+stripBody(y, indoorDayClass, 'indoors')+'</section>'
    +'<section class="sec"><h3>Outside</h3>'+stripBody(y, dayClass, 'out')+'</section>';
}
function buildMonthCards(y){
  var mdn=mdays(y);
  /* Newest first; a month that has not started is not shown; a card opens that month on the heat map (quality review 12 Nov). */
  var cards=[];
  MONTHS.forEach(function(mn,mi){
    if(ds(y,mi,1)>TODAY_STR) return;
    var t={in:0,out:0,nolimit:0,miss:0,read:0,swap:0,warm:0,nospot:0}, hi=null, lo=null;
    for(var d=1;d<=mdn[mi];d++){
      var date=ds(y,mi,d);
      if(date>TODAY_STR) continue;
      dayRooms(date).forEach(function(x){ [x.am,x.pm].forEach(function(s){
        if(s.k in t) t[s.k]++;
        if(!isRead(s.k)) return;
        t.read++;
        var mx=parseFloat(s.hi), mn2=parseFloat(s.lo);
        if(!isNaN(mx)&&(hi==null||mx>hi.v)) hi={v:mx,name:x.name};
        if(!isNaN(mn2)&&(lo==null||mn2<lo.v)) lo={v:mn2,name:x.name};
      }); });
    }
    var h='<button type="button" class="mitem" data-month="'+(mi+1)+'" data-read="'+t.read+'" data-out="'+t.out+'" data-miss="'+t.miss+'" data-swap="'+t.swap+'" onclick="openMonth('+(mi+1)+')"><span class="mitem-head"><span class="mitem-name">'+mn+' '+y+'</span>'
      +(t.in+t.out+t.swap+t.warm+t.nospot?'<span class="mitem-pct">'+Math.round(100*(t.in+t.warm+t.nospot)/(t.in+t.warm+t.nospot+t.out+t.miss+t.swap))+'% in limit</span>':'')+'</span><span class="mitem-stats">';
    if(!t.read&&!t.miss) h+='<span>No readings</span>';
    else{
      h+='<span>'+(t.in+t.warm+t.nospot)+' in limit</span>';
      h+='<span'+(t.out?' class="warn"':'')+'>'+t.out+' outside</span>';
      if(t.warm) h+='<span data-warm>'+t.warm+' warm (cooling action)</span>';
      if(t.swap) h+='<span class="warn">'+t.swap+' max lower than min</span>';
      h+='<span'+(t.miss?' class="warn"':'')+'>'+t.miss+' missed</span>';
      if(hi) h+='<span>High '+dpIndoor(hi.v)+' '+esc(hi.name)+'</span>';
      if(lo) h+='<span>Low '+dpIndoor(lo.v)+' '+esc(lo.name)+'</span>';
    }
    cards.unshift(h+'</span></button>');
  });
  return '<div class="mlist">'+cards.join('')+'</div>';
}
function buildRound(dateStr){
  var rooms=dayRooms(dateStr);
  var dateInput='<div class="rdate"><label for="rdate">Date</label><input id="rdate" type="date" value="'+esc(dateStr)+'" onchange="setRoundDate(this.value)"></div>';
  var tiles='<div class="rtiles">'+rooms.map(function(x){
    return '<div class="rtile"><div class="rn">'+esc(x.name)+'</div><div class="rs">'+slotHtml('AM',x.am)+'</div><div class="rs">'+slotHtml('PM',x.pm)+'</div></div>';
  }).join('')+'</div>';
  var cell=function(s,v){ return '<td'+(s.k==='out'||s.k==='eout'||s.k==='swap'?' class="warn"':'')+'>'+esc(v||'—')+'</td>'; };
  var rows=rooms.map(function(x){ return '<tr><td class="nm">'+esc(x.name)+'</td>'+cell(x.am,x.am.lo)+cell(x.am,x.am.hi)+cell(x.pm,x.pm.lo)+cell(x.pm,x.pm.hi)+'</tr>'; }).join('');
  var table=rooms.length
    ?'<div class="rscroll" tabindex="0" role="region" aria-label="Indoor temperatures in degrees C"><table class="rtable"><thead><tr><th>Room</th><th>AM min</th><th>AM max</th><th>PM min</th><th>PM max</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    :'<p class="sub">No readings for this date.</p>';
  var out=outsideLine(dateStr);
  return dateInput
    +'<section class="sec"><h3>Indoors °C</h3>'+(rooms.length?tiles:'')+table+'</section>'
    +'<section class="sec"><h3>Outside</h3><p class="oline">'+esc(out||'No outside reading')+'</p></section>';
}
function openMonth(m){
  var tab=document.querySelectorAll('.tab')[1]; if(tab) setView('a',tab);
  var mc=document.querySelector('#view-a .mc[data-m="'+m+'"]'); if(mc&&mc.scrollIntoView) mc.scrollIntoView({block:'start'});
}
function setRoundDate(dateStr){
  ROUND_DATE=dateStr;
  var v=el('view-d');
  if(v) v.innerHTML=buildRound(dateStr);
  closeDrill();
}

var CUR_VIEW='d';
function setView(id,btn){
  CUR_VIEW=id;
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('on'); });
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('on'); });
  el('view-'+id).classList.add('on');
  btn.classList.add('on');
  closeDrill();
}
/* Year buttons: this year back to the first year with a reading (the owner 20 Nov 2026: past years must load), and always
   at least this year and the two before (as the page always offered). */
function firstYear(){ var now=+TODAY_STR.slice(0,4), f=FIRST_DAY?+FIRST_DAY.slice(0,4):now; return Math.min(f,now-2); }
function yearButtons(){
  var now=+TODAY_STR.slice(0,4), first=firstYear(), h='';
  for(var y=now;y>=first;y--) h+='<button class="btn yr-btn'+(y===YEAR?' on':'')+'" data-yr="'+y+'" onclick="setYear('+y+')">'+y+'</button>';
  return h;
}
/* The same day in another year, never after today (29 Feb becomes 28 Feb). */
function sameDayIn(y,iso){
  var m=+iso.slice(5,7)-1, d=Math.min(+iso.slice(8,10),mdays(y)[m]), out=ds(y,m,d);
  return out>TODAY_STR?TODAY_STR:out;
}
function setYear(y){
  YEAR=y;
  document.querySelectorAll('.yr-btn').forEach(function(b){ b.classList.toggle('on',+b.dataset.yr===y); });
  el('view-a').innerHTML=buildHeatMap(y);
  el('view-b').innerHTML=buildStrip(y);
  el('view-c').innerHTML=buildMonthCards(y);
  /* the owner 20 Nov 2026: pressing 2025 still showed today on The round. The round moves to the same day in that year. */
  if(ROUND_DATE&&+ROUND_DATE.slice(0,4)!==y){ ROUND_DATE=sameDayIn(y,ROUND_DATE); var v=el('view-d'); if(v) v.innerHTML=buildRound(ROUND_DATE); }
  /* and the report to the same month in that year */
  if(REP.y!==null&&REP.y!==y){ var mm=ds(y,REP.m,1)>TODAY_STR?+TODAY_STR.slice(5,7)-1:REP.m; REP.y=y; REP.m=mm; var r=el('view-r'); if(r) r.innerHTML=buildReport(); }
  closeDrill();
}
function legend(){
  var sq=function(st){ return '<div class="leg-sq" style="'+st+'"></div>'; };
  if(VIEW_MODE==='compliance'){
    return'<div class="legend">'
      +'<div class="leg">'+sq('background:var(--card);box-shadow:inset 0 0 0 2px var(--ink)')+'Cannot be read</div>'
      +'<div class="leg">'+sq('background:var(--ink)')+'Outside limit</div>'
      +'<div class="leg">'+sq('background:var(--ljr-5)')+'In limit</div>'
      +'<div class="leg">'+sq('background:var(--soft)')+'No readings</div>'
      +'</div>';
  }
  return '<div class="legend">'
    +'<div class="leg">'+sq('background:var(--ljr-5)')+'In limit</div>'
    +'<div class="leg">'+sq('background:var(--ljr-3)')+'Outside limit</div>'
    +'<div class="leg">'+sq('background:var(--card);box-shadow:inset 0 0 0 2px var(--ljr-3)')+'Missed</div>'
    +'<div class="leg">'+sq('background:var(--card);box-shadow:inset 0 0 0 1px var(--line)')+'No readings</div>'
    +'<div class="leg">Outside: '+sq('background:var(--ljr-6-tint)')+(BAND?'below '+BAND.min:'cool')+' '+sq('background:var(--ljr-4-tint)')+(BAND?'above '+BAND.max:'warm')+'</div>'
    +'</div>';
}
function renderPage(){
  ROUND_DATE=ROUND_DATE||TODAY_STR;
  var hasAreas=Object.keys(AREA_DAYS).length>0;
  el('main').innerHTML=
    (AREA_HDR_BAD?'<p class="warn" role="alert" data-hdrbad>Room temperatures sheet out of order: '+esc(AREA_HDR_BAD)+'. Put the heading row back on row 1; use a filter view, never sort the sheet.</p>':'')
    +(hasAreas?'<div class="vt-wrap">'
      +'<button class="vt-btn on" data-vm="outdoor" onclick="setViewMode(\'outdoor\')">Outdoor temps</button>'
      +'<button class="vt-btn" data-vm="compliance" onclick="setViewMode(\'compliance\')">Compliance</button>'
      +'</div>':'')
    +'<div id="legend-wrap">'+legend()+'</div>'
    +'<div class="yr-row">'
    +yearButtons()
    +'<a class="btn" style="min-height:40px" href="./history-archive.html">Archive</a>'
    +'</div>'
    +'<div class="tab-row">'
    +'<button class="tab on" onclick="setView(\'d\',this)">The round</button>'
    +'<button class="tab" onclick="setView(\'a\',this)">Heat map</button>'
    +'<button class="tab" onclick="setView(\'b\',this)">Year strip</button>'
    +'<button class="tab" onclick="setView(\'c\',this)">Month cards</button>'
    +'<button class="tab" id="tabReport" onclick="setView(\'r\',this)">Report</button>'
    +'<a class="btn" href="./index.html#/round">Back to the round</a>'
    +'<button class="btn" type="button" data-rp-open onclick="TempsReport.open()">Print / PDF</button>'
    +'</div>'
    +'<div id="view-d" class="view on">'+buildRound(ROUND_DATE)+'</div>'
    +'<div id="view-a" class="view">'+buildHeatMap(YEAR)+'</div>'
    +'<div id="view-b" class="view">'+buildStrip(YEAR)+'</div>'
    +'<div id="view-c" class="view">'+buildMonthCards(YEAR)+'</div>'
    +'<div id="view-r" class="view">'+buildReport()+'</div>';
  /* #report (CD Hub's Temps report links, and the staff Temps address) opens the report straight away */
  if(/^#report\b/.test(location.hash||'')){ var t=el('tabReport'); if(t) setView('r',t); }
}
</script>
<script src="temps-report.js"></script>
</body></html>
