<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--fs-body)/1.5 var(--house-font);-webkit-text-size-adjust:100%}
a{color:inherit;text-underline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{padding-left:var(--house-gutter);padding-right:var(--house-gutter);padding-bottom:60px}
.hin{max-width:none;margin:0 auto;padding-left:var(--house-gutter);padding-right:var(--house-gutter)}
.ti{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.skip{position:absolute;left:-999px;top:8px;z-index:50;background:var(--card);color:var(--ink);padding:8px 14px;border-radius:var(--radius);border:1px solid var(--ink)}
.skip:focus{left:8px}
header.top{background:var(--frame);color:var(--frame-ink);position:sticky;top:0;z-index:20}
h1,h2,h3,b,strong{font-weight:600}
.btn{font-family:inherit;font-size:var(--fs-small);font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--press);border-radius:var(--radius);min-height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none;line-height:1.2}
header .btn{color:var(--frame-ink);background:transparent;border-color:var(--frame-line)}
@media(hover:hover){header .btn:hover{outline:1px solid var(--frame-ink);outline-offset:-1px}}
@media(max-width:544px){.btn{min-height:44px}header.top{position:static}}
.boot{padding:40px 0;text-align:center;color:var(--ink);font-size:var(--fs-body)}
.bootline{margin:14px 0 0;color:var(--ink);font-weight:400}
.bootmark{display:inline-flex;color:var(--ink)}
.bootspin{width:48px;height:48px;display:block}
.botring{fill:none;stroke:var(--ljr-5);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:34 98;transform-box:fill-box;transform-origin:center;animation:bootspin 1.1s linear infinite}
.boothouse{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@keyframes bootspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.botring{animation:none;stroke-dasharray:none}}
.live{font-size:var(--fs-small);font-weight:600;border:1px solid var(--frame-line);border-radius:var(--radius);padding:0 8px;height:24px;display:inline-flex;align-items:center;white-space:nowrap;color:var(--frame-ink)}
.live.ok{border-color:var(--ljr-5)}
.live.bad{border-color:var(--ljr-3)}
.sec h3{font-size:var(--fs-head);margin:0 0 8px}
.sec+.sec{margin-top:20px;padding-top:12px;border-top:1px solid var(--line)}
.rdate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.rdate label{font-size:var(--fs-small);color:var(--muted)}
.rdate input{border:1px solid var(--press);border-radius:var(--radius);padding:4px 10px;font:inherit;font-size:var(--fs-small);background:var(--card);color:var(--ink);min-height:36px}
.rtiles{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.rtile{flex:1 1 168px;max-width:280px;min-height:44px;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:transparent;color:var(--ink)}
.rtile .rn{font-size:var(--fs-small);font-weight:600}
.rtile .rs{font-size:var(--fs-small);line-height:1.35}
.rscroll{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.rtable{width:100%;border-collapse:collapse;font-size:var(--fs-small)}
.rtable th,.rtable td{text-align:left;padding:2px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;line-height:1.3;font-weight:400;white-space:nowrap}
.rtable th{font-weight:600;color:var(--ink)}
.rtable td.nm{font-weight:600;white-space:normal}
.rtable tr:last-child td{border-bottom:0}
.dgrid{display:flex;flex-wrap:wrap;gap:8px 16px}
.dgrid .dr{border:0;padding:0;min-width:7.5em;justify-content:flex-start;gap:6px}

/* Year / view controls */
h2.ph{font-size:var(--fs-head);margin:24px 0 2px}
.sub{color:var(--muted);font-size:var(--fs-body);margin:0 0 16px}
.yr-row{display:flex;gap:6px;margin:0 0 12px;align-items:center;flex-wrap:wrap}
.yr-btn{min-height:40px;font-size:var(--fs-small);font-weight:600;padding:0 12px}
.yr-btn.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tab-row{display:flex;flex-wrap:wrap;gap:2px;background:var(--soft);padding:3px;border-radius:calc(var(--radius) + 3px);width:auto;max-width:100%;margin:0 0 16px}
.tab{min-height:40px;padding:6px 16px;border:none;background:transparent;border-radius:var(--radius);cursor:pointer;font:600 var(--fs-small)/1 var(--house-font);color:var(--muted)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
@media(hover:hover){.tab:not(.on):hover{color:var(--ink)}}
.view{display:none}.view.on{display:block}

/* Legend */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.leg{display:flex;align-items:center;gap:5px;font-size:var(--fs-small);color:var(--muted)}
.leg-sq{width:11px;height:11px;border-radius:2px;flex:none}

/* Heat-map calendar */
/* Months at least 320px wide, so every day is a 40px+ tap target (one month per row on a phone). */
.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:10px;margin-bottom:20px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)}
.mn{font-size:var(--fs-small);font-weight:600;color:var(--muted);margin-bottom:6px}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dh{font-size:10px;color:var(--muted);text-align:center;padding-bottom:2px;user-select:none}
.d{width:100%;aspect-ratio:1;border-radius:3px;border:none;font-size:0;background:var(--soft);cursor:default}
.d:not(.empty):not(.future):not(.nd){cursor:pointer}
@media(hover:hover){.d:not(.empty):not(.future):not(.nd):hover{transform:scale(1.35);z-index:2;position:relative}}
.d.empty{background:transparent}
.d.future{background:var(--paper);border:1px solid var(--line);opacity:.35}
.d.unknown,.sd.unknown{background:var(--soft);border:1px dashed var(--line)}
.d.allok{background:var(--ljr-5-tint)}.d.warn{background:var(--ljr-3)}.d.nolimit{background:var(--soft);border:1px dashed var(--line)}
.d.ocool{background:var(--ljr-6-tint)}.d.omild{background:var(--card);border:1px solid var(--line)}.d.owarm{background:var(--ljr-4-tint)}
.d.today:not(.empty){outline:2px solid var(--ink);outline-offset:-2px}

/* Strip view */
.strip{display:flex;flex-direction:column;gap:3px;margin-bottom:20px}
.srow{display:flex;align-items:center;gap:6px}
.slbl{font-size:10px;color:var(--muted);width:24px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.sdays{display:flex;gap:1px;flex:1;overflow-x:auto;padding-bottom:1px}
.sd{height:14px;min-width:3px;flex:1;border-radius:2px;cursor:default;background:var(--soft)}
.sd:not(.future):not(.nd){cursor:pointer}
@media(hover:hover){.sd:not(.future):not(.nd):hover{transform:scaleY(1.5);z-index:2}}
.sd.allok{background:var(--ljr-5-tint)}.sd.warn{background:var(--ljr-3)}.sd.nolimit{background:var(--soft)}
.sd.ocool{background:var(--ljr-6-tint)}.sd.omild{background:var(--card);border:1px solid var(--line)}.sd.owarm{background:var(--ljr-4-tint)}
.sd.future{background:var(--paper);border:1px solid var(--line);opacity:.3;cursor:default}
.smlbls{display:flex;gap:1px;padding-left:30px;margin-bottom:3px}
.sml{flex:1;font-size:9px;color:var(--muted);text-align:center}

/* Month card list */
.mlist{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.mitem{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.mitem-head{display:flex;justify-content:space-between;align-items:baseline}
.mitem-name{font-size:var(--fs-body);font-weight:600}
.mitem-stats{display:flex;gap:12px;font-size:var(--fs-small);color:var(--muted);margin-top:3px;flex-wrap:wrap}
.spill{display:flex;align-items:center;gap:4px}
.sdot{width:8px;height:8px;border-radius:50%;flex:none}
.comp-bar{height:3px;background:var(--soft);border-radius:2px;margin-top:8px;overflow:hidden}
.comp-fill{height:100%;border-radius:2px;background:var(--ljr-5)}
.chev{font-size:14px;color:var(--muted)}

/* Drill panel */
#drill{display:none;position:fixed;top:0;right:0;width:min(320px,100vw);height:100%;background:var(--card);border-left:1px solid var(--line);z-index:100;padding:16px;overflow-y:auto;box-shadow:var(--shadow)}
#drill.open{display:block}
.dclose{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);float:right;line-height:1;padding:0;min-width:44px;min-height:44px}
.dtitle{font-size:var(--fs-head);font-weight:600;margin:0 0 2px;clear:right}
.dsub{font-size:var(--fs-small);color:var(--muted);margin:0 0 14px}
.dr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:var(--fs-small)}
.dr:last-child{border-bottom:none}
.dsec{font-size:var(--fs-small);font-weight:600;color:var(--muted);margin:14px 0 2px;letter-spacing:.04em}
/* Calm by rule (Lisa 11 Nov): no red anywhere; orange (.warn) only for a reading outside its limit or a missed needed one. */
.warn{color:var(--ljr-3-text);font-weight:600}
.tick{color:var(--ljr-5-text)}
.due{color:var(--muted)}
.rl{padding:7px 0;border-bottom:1px solid var(--line);font-size:var(--fs-small);font-variant-numeric:tabular-nums}
.rl:last-child{border-bottom:none}
.rl b{font-weight:600}
.rl .note{display:block;margin-top:2px}
.oline{font-size:var(--fs-small);font-variant-numeric:tabular-nums;margin:0}
</style>

<script>
/* ---- config ---- */
var SHEET_ID=window.DASH_CONFIG.cdhub.readingsSheetId;
var EXPORT_URL='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&sheet=readings';
var DRIVE_EXPORT='https://www.googleapis.com/drive/v3/files/'+SHEET_ID+'/export?mimeType=text%2Fcsv';
var CLIENT_ID=window.DASH_CONFIG.clientId;
var SCOPE=window.DASH_CONFIG.scopes.read;
var TOKEN=null,TOKEN_EXP=0;
var DAYS={};  /* ISO date -> row */
var FOLDER_ID=window.DASH_CONFIG.cdhub.folderId;
var DRIVE_API=window.DASH_CONFIG.urls.files;
var AREA_DAYS={};  /* ISO date -> areaId -> {am:{min,max},pm:{min,max}} */
var AREA_NAMES={};  /* areaId -> display name/code */
var AREA_SORT={};   /* areaId -> group_sort from BLD-area (the round order is rows, never coded here) */
var ROUND_DATE=null;
var SPAN={};        /* areaId -> {first,last} reading day: a room is only needed inside its own span (no coded dates) */

/* ---- helpers ---- */
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var TODAY_STR=(function(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate();})();

function el(id){return document.getElementById(id);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pill(msg,cls){var p=el('livepill');if(p){p.textContent=msg;p.className='live'+(cls?' '+cls:'');}}

function parseCSV(text){
  text=String(text||'').replace(/\r/g,'');
  var rows=[],row=[],f='',q=false,c,i;
  for(i=0;i<text.length;i++){c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'){row.push(f.trimEnd());rows.push(row);row=[];f='';}
    else f+=c;}
  if(f||row.length){row.push(f.trimEnd());rows.push(row);}
  rows=rows.filter(function(r){return r.some(function(v){return v.trim();});});
  if(!rows.length)return[];
  var hdr=rows[0].map(function(h){return h.trim();});
  return rows.slice(1).map(function(r){var o={};hdr.forEach(function(h,i){o[h]=(r[i]||'').trim();});return o;});
}

function gget(url){
  return fetch(url,{headers:{'Authorization':'Bearer '+TOKEN}})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();});
}
function gjson(url){
  return fetch(url,{headers:{'Authorization':'Bearer '+TOKEN}})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
}
/* First non-trashed match (the query already sets trashed=false). Returns the file, including mimeType. */
function findDriveFile(name){
  var q="'"+FOLDER_ID+"' in parents and name='"+name+"' and trashed=false";
  var url=DRIVE_API+'?q='+encodeURIComponent(q)+'&fields=files(id,name,mimeType)&supportsAllDrives=true&includeItemsFromAllDrives=true';
  return gjson(url).then(function(r){var f=r.files||[];return f.length?f[0]:null;});
}
/* A Google Sheet of that title is exported as CSV. A real CSV file is read as media. Same errors as gget. */
function readDriveFile(f){
  var id=encodeURIComponent(f.id);
  if(f.mimeType==='application/vnd.google-apps.spreadsheet')
    return gget(DRIVE_API+'/'+id+'/export?mimeType='+encodeURIComponent('text/csv')+'&supportsAllDrives=true');
  return gget(DRIVE_API+'/'+id+'?alt=media&supportsAllDrives=true');
}
/* Limits come from the open-ended (adult) row of BLD-temperature_band. No readable row = 'unknown'. */
var BAND=null;
function tempCls(min,max){
  var lo=parseFloat(min),hi=parseFloat(max);
  if(isNaN(lo)&&isNaN(hi))return'';
  if(!BAND)return'unknown';
  if(!isNaN(lo)&&lo<BAND.min)return'cold';
  if(!isNaN(hi)&&hi>BAND.max)return'hot';
  return'ok';
}
async function loadBand(){
  BAND=null;
  try{
    var f=await findDriveFile('BLD-temperature_band.csv');
    if(!f)return;
    parseCSV(await readDriveFile(f)).forEach(function(r){
      var lo=parseFloat(r.min_temp),hi=parseFloat(r.max_temp);
      if(!r.age_to_days&&!isNaN(lo)&&!isNaN(hi))BAND={min:lo,max:hi};
    });
  }catch(e){console.warn('Temperature limits load failed:',e);}
}
async function loadAreaData(){
  await loadBand();
  try{
    var rf=await findDriveFile('BLD-area_reading.csv');
    if(rf){
      var txt=await readDriveFile(rf);
      var rows=parseCSV(txt);
      AREA_DAYS={};
      rows.slice().sort(function(a,b){return String(a.taken_at||'')<String(b.taken_at||'')?-1:1;}).forEach(function(r){
        var at=String(r.period_start||r.taken_at||'');if(!r.area_id||at.length<10)return;   /* period_start: a reading typed later belongs to its own slot */
        var date=at.slice(0,10),hr=parseInt(at.slice(11,13),10),slot=(isNaN(hr)||hr<12)?'am':'pm';
        if(!AREA_DAYS[date])AREA_DAYS[date]={};
        if(!AREA_DAYS[date][r.area_id])AREA_DAYS[date][r.area_id]={};
        AREA_DAYS[date][r.area_id][slot]={min:r.min_c,max:r.max_c,note:r.mitigation_note||''};
      });
    }
    SPAN={};
    Object.keys(AREA_DAYS).forEach(function(d){ Object.keys(AREA_DAYS[d]).forEach(function(aid){
      var s=SPAN[aid]||(SPAN[aid]={first:d,last:d}); if(d<s.first)s.first=d; if(d>s.last)s.last=d; }); });
    var af=await findDriveFile('BLD-area.csv');
    if(af){
      var atxt=await readDriveFile(af);
      parseCSV(atxt).forEach(function(a){if(!a.id)return;AREA_NAMES[a.id]=a.code||a.name||a.id;var g=parseFloat(a.group_sort);AREA_SORT[a.id]=isNaN(g)?Infinity:g;});
    }
  }catch(e){console.warn('Area data load failed:',e);}
}

async function loadData(){
  pill('Live');
  try{
    var txt=await gget(EXPORT_URL);
    var rows=parseCSV(txt);
    DAYS={};
    rows.forEach(function(r){if(r.on_date)DAYS[r.on_date]=r;});
    await loadAreaData();
    pill('Up to date','ok');
    el('cdSignout').classList.remove('hidden');
    renderPage();
  }catch(e){
    /* try Drive API export (first sheet) as fallback */
    try{
      var txt2=await gget(DRIVE_EXPORT);
      var rows2=parseCSV(txt2);
      DAYS={};
      rows2.forEach(function(r){if(r.on_date)DAYS[r.on_date]=r;});
      await loadAreaData();
      pill('Up to date','ok');
      el('cdSignout').classList.remove('hidden');
      renderPage();
    }catch(e2){
      pill('Couldn\u2019t load','bad');
      el('main').innerHTML='<div class="boot"><p class="bootline">Couldn\u2019t load temperatures. Try again.</p>'
        +'<button class="btn" style="margin-top:12px" onclick="loadData()">Try again</button></div>';
    }
  }
}

/* ---- auth ---- */
function onToken(resp){
  if(resp.error){pill('sign in needed');showSignIn();return;}
  if(!google.accounts.oauth2.hasGrantedAllScopes(resp,SCOPE)){pill('access denied','bad');showSignIn();return;}
  TOKEN=resp.access_token;TOKEN_EXP=DashAuth.expiryFrom(resp.expires_in);
  DashAuth.save(TOKEN,TOKEN_EXP,resp.scope||SCOPE);
  loadData();
}
function onError(){pill('sign-in failed','bad');showSignIn();}
function onSilentFail(){}
var auth=DashAuth.bind({clientId:CLIENT_ID,scope:SCOPE,onToken:onToken,onError:onError,onSilentFail:onSilentFail});
function signIn(){auth.requestInteractive();}
function signOut(){
  var t=TOKEN;TOKEN=null;TOKEN_EXP=0;DashAuth.clear();
  if(t&&window.google&&google.accounts&&google.accounts.oauth2)google.accounts.oauth2.revoke(t,function(){});
  DAYS={};pill('signed out');el('cdSignout').classList.add('hidden');showSignIn();
}
function showSignIn(){
  el('main').innerHTML='<div class="boot"><p class="bootline">Sign in to see temperatures.</p>'
    +'<button class="btn" style="margin-top:12px" onclick="signIn()" id="signinbtn"'+(auth.ready()?'':' disabled')+'>Sign in with Google</button></div>';
}

/* restore shared token */
(function(){
  var saved=DashAuth&&DashAuth.valid&&DashAuth.valid();
  if(saved&&DashAuth.hasScope(saved,SCOPE)){
    TOKEN=saved.access_token;TOKEN_EXP=saved.expires_at;
    loadData();return;
  }
  /* wait for Google then show sign-in */
  var n=0;
  (function wait(){
    if(auth.init()){if(!auth.ready())showSignIn();return;}
    if(n++<80)setTimeout(wait,100);else showSignIn();
  })();
})();

if(window.DashAuth&&DashAuth.onChange)DashAuth.onChange(function(saved){
  if(!saved||!DashAuth.hasScope(saved,SCOPE)){if(TOKEN){TOKEN=null;TOKEN_EXP=0;DAYS={};showSignIn();}return;}
  var had=TOKEN;TOKEN=saved.access_token;TOKEN_EXP=saved.expires_at;
  if(!had)loadData();
});

/* ---- calendar logic ---- */
function mdays(y){var leap=(y%4===0&&(y%100!==0||y%400===0));return[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];}
function ds(y,m,d){return y+'-'+(m<9?'0':'')+(m+1)+'-'+(d<10?'0':'')+d;}

function dayClass(isoDate){
  if(isoDate>TODAY_STR)return'future';
  var r=DAYS[isoDate];
  if(!r)return'nd';
  var t=parseFloat(r.max_temp);
  if(isNaN(t))return'nd';
  if(!BAND)return'omild';
  if(t<BAND.min)return'ocool';
  if(t>BAND.max)return'owarm';
  return'omild';
}

function ddmmyy(iso){ iso=String(iso||''); return iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(2,4); }
function openDrill(isoDate){
  el('d-title').textContent=ddmmyy(isoDate);
  el('d-out').textContent=outsideLine(isoDate)||'No outside reading';
  var lines=dayRooms(isoDate).map(function(x){ return roomLine(x,true); });
  el('d-areas-inner').innerHTML=lines.join('');
  el('d-areas').style.display=lines.length?'':'none';
  el('drill').classList.add('open');
}
function closeDrill(){el('drill').classList.remove('open');}

/* ---- views ---- */
var YEAR=2026;
/* Round order comes from BLD-area rows: group_sort, then code. ZZ_ rooms are retired: left out of the round,
   but a past day that has a reading for one still shows it, last, so no record is hidden. */
function areaName(aid){ return String(AREA_NAMES[aid]||String(aid||'').replace(/^area-/,'').replace(/-/g,' ')); }
function isRetired(aid){ return /^ZZ_/i.test(String(AREA_NAMES[aid]||'')); }
function areasInWalk(extra){
  var ids={};
  Object.keys(AREA_NAMES).forEach(function(id){ if(!isRetired(id)) ids[id]=1; });
  (extra||[]).forEach(function(id){ if(id) ids[id]=1; });
  function key(id){ return [isRetired(id)?1:0, id in AREA_SORT?AREA_SORT[id]:Infinity]; }
  return Object.keys(ids).sort(function(a,b){
    var ka=key(a), kb=key(b);
    if(ka[0]!==kb[0]) return ka[0]-kb[0];
    if(ka[1]!==kb[1]) return ka[1]<kb[1]?-1:1;
    return areaName(a).localeCompare(areaName(b),'en',{numeric:true});
  });
}
function dpIndoor(v){
  if(v==null||String(v).trim()==='') return '';
  var n=parseFloat(v); if(isNaN(n)) return '';
  return (Math.round(n*10)/10).toFixed(1);
}
function dpOutdoor(v){ return dpIndoor(v).replace(/\.0$/,''); }
/* ---- the one set of rules every view uses (spec: tests/mocked/history-calm.spec.js) ---- */
/* A room is needed on a day only inside its own span of readings (first reading day to last; a room still in use
   runs to today). Retired (ZZ_) rooms end at their last reading. So an old or renamed room never shows as missed. */
function neededOn(aid,day){
  var sp=SPAN[aid]; if(!sp) return false;
  var last=isRetired(aid)?sp.last:TODAY_STR;
  return day>=sp.first&&day<=last;
}
function hasVal(v){ return v!=null&&String(v).trim()!==''; }
/* One slot: in / out / nolimit / miss / due / none */
function slotState(t,aid,day,slot){
  if(t&&(hasVal(t.min)||hasVal(t.max))){
    var cls=tempCls(t.min,t.max);
    return {k:cls==='ok'?'in':cls==='unknown'?'nolimit':'out', lo:dpIndoor(t.min), hi:dpIndoor(t.max), note:t.note||''};
  }
  if(!neededOn(aid,day)) return {k:'none'};
  if(day===TODAY_STR&&(slot==='pm'||new Date().getHours()<12)) return {k:'due'};
  if(day>TODAY_STR) return {k:'due'};
  return {k:'miss'};
}
/* The rooms shown for a day: needed that day or with a reading, in round order. */
function dayRooms(day){
  var ar=AREA_DAYS[day]||{};
  return areasInWalk(Object.keys(ar).concat(Object.keys(SPAN))).filter(function(aid){ return ar[aid]||neededOn(aid,day); }).map(function(aid){
    var r=ar[aid]||{};
    return {aid:aid, name:areaName(aid), am:slotState(r.am,aid,day,'am'), pm:slotState(r.pm,aid,day,'pm')};
  });
}
function daySummary(day){
  var n={in:0,out:0,nolimit:0,miss:0,due:0,read:0};
  dayRooms(day).forEach(function(x){ [x.am,x.pm].forEach(function(s){ if(s.k in n) n[s.k]++; if(s.k==='in'||s.k==='out'||s.k==='nolimit') n.read++; }); });
  return n;
}
function indoorDayClass(day){
  if(day>TODAY_STR) return 'future';
  var n=daySummary(day);
  if(n.out||n.miss) return 'warn';
  if(!n.read) return 'nd';
  if(n.nolimit) return 'nolimit';
  return 'allok';
}
function slotHtml(label,s){
  if(s.k==='none') return '';
  if(s.k==='miss') return '<span class="warn">'+label+' missed</span>';
  if(s.k==='due') return '<span class="due">'+label+' due</span>';
  var txt=label+' '+(s.lo||'–')+'–'+(s.hi||'–');
  if(s.k==='out') return '<span class="warn">'+esc(txt)+'</span>';
  return esc(txt)+(s.k==='in'?' <span class="tick" aria-label="inside limit">✓</span>':'');
}
/* "H1 · AM 18.1–21.0 ✓ · PM 17.2–19.5 ✓"; outside the limit, "What was done" follows on the day panel. */
function roomLine(x,withNotes){
  var parts=[slotHtml('AM',x.am),slotHtml('PM',x.pm)].filter(Boolean);
  var notes='';
  if(withNotes) [['AM',x.am],['PM',x.pm]].forEach(function(p){ if(p[1].k==='out') notes+='<span class="note warn">'+p[0]+' what was done: '+esc(p[1].note||'not recorded')+'</span>'; });
  return '<div class="rl"><b>'+esc(x.name)+'</b> · '+parts.join(' · ')+notes+'</div>';
}
function outsideLine(day){
  var r=DAYS[day]; if(!r) return '';
  var hi=dpOutdoor(r.max_temp), lo=dpOutdoor(r.min_temp), rain=dpOutdoor(r.rain_value);
  return (hi||'–')+' / '+(lo||'–')+' °C'+(rain!==''?', rain '+rain+' mm':'');
}
function stateWord(cls){
  return {future:'Later',nd:'No readings',nolimit:'No limit set',warn:'Check',allok:'In limit',ocool:'Cool',omild:'Mild',owarm:'Warm'}[cls]||cls;
}
function monthCal(y, classOf, kind){
  var md=mdays(y);
  var h='<div class="month-grid" data-cal="'+kind+'">';
  MONTHS.forEach(function(mn,mi){
    h+='<div class="mc"><div class="mn">'+mn+'</div><div class="dg">';
    h+='<div class="dh">M</div><div class="dh">T</div><div class="dh">W</div><div class="dh">T</div><div class="dh">F</div><div class="dh">S</div><div class="dh">S</div>';
    var firstDow=(new Date(y,mi,1).getDay()+6)%7;
    for(var i=0;i<firstDow;i++) h+='<span class="d empty"></span>';
    for(var d=1;d<=md[mi];d++){
      var date=ds(y,mi,d), cls=classOf(date), today=date===TODAY_STR, word=stateWord(cls);
      var clk=(cls!=='future'&&cls!=='nd')?' onclick="openDrill(\''+date+'\')"':'';
      var extra=kind==='out'?' dout':'';
      h+='<button type="button" class="d '+cls+(today?' today':'')+extra+'" title="'+d+' '+mn+' '+y+' '+kind+' — '+word+'" aria-label="'+d+' '+mn+' '+y+' '+word+'"'+clk+'></button>';
    }
    h+='</div></div>';
  });
  return h+'</div>';
}
function stripBody(y, classOf, kind){
  var md=mdays(y);
  var DOWS=['Mo','Tu','We','Th','Fr','Sa','Su'];
  var h='<div class="smlbls">';
  MONTHS.forEach(function(m){ h+='<div class="sml">'+m[0]+'</div>'; });
  h+='</div><div class="strip" data-cal="'+kind+'">';
  DOWS.forEach(function(dow,di){
    h+='<div class="srow"><div class="slbl">'+dow+'</div><div class="sdays">';
    for(var mi=0;mi<12;mi++){
      for(var d=1;d<=md[mi];d++){
        if((new Date(y,mi,d).getDay()+6)%7===di){
          var date=ds(y,mi,d), cls=classOf(date), word=stateWord(cls);
          var clk=(cls!=='future'&&cls!=='nd')?' onclick="openDrill(\''+date+'\')"':'';
          h+='<div class="sd '+cls+(kind==='out'?' dout':'')+'" title="'+d+' '+MONTHS[mi]+' '+kind+' — '+word+'"'+clk+'></div>';
        }
      }
    }
    h+='</div></div>';
  });
  return h+'</div>';
}
function buildHeatMap(y){
  return '<section class="sec"><h3>Indoors</h3>'+monthCal(y, indoorDayClass, 'indoors')+'</section>'
    +'<section class="sec"><h3>Outside</h3>'+monthCal(y, dayClass, 'out')+'</section>';
}
function buildStrip(y){
  return '<section class="sec"><h3>Indoors</h3>'+stripBody(y, indoorDayClass, 'indoors')+'</section>'
    +'<section class="sec"><h3>Outside</h3>'+stripBody(y, dayClass, 'out')+'</section>';
}
function buildMonthCards(y){
  var mdn=mdays(y);
  var h='<div class="mlist">';
  MONTHS.forEach(function(mn,mi){
    var t={in:0,out:0,nolimit:0,miss:0,read:0}, hi=null, lo=null;
    for(var d=1;d<=mdn[mi];d++){
      var date=ds(y,mi,d);
      if(date>TODAY_STR) continue;
      dayRooms(date).forEach(function(x){ [x.am,x.pm].forEach(function(s){
        if(s.k in t) t[s.k]++;
        if(s.k!=='in'&&s.k!=='out'&&s.k!=='nolimit') return;
        t.read++;
        var mx=parseFloat(s.hi), mn2=parseFloat(s.lo);
        if(!isNaN(mx)&&(hi==null||mx>hi.v)) hi={v:mx,name:x.name};
        if(!isNaN(mn2)&&(lo==null||mn2<lo.v)) lo={v:mn2,name:x.name};
      }); });
    }
    h+='<div class="mitem" data-month="'+(mi+1)+'" data-read="'+t.read+'" data-out="'+t.out+'" data-miss="'+t.miss+'"><div class="mitem-head"><span class="mitem-name">'+mn+' '+y+'</span></div><div class="mitem-stats">';
    if(!t.read&&!t.miss) h+='<span>No readings</span>';
    else{
      h+='<span>'+t.read+' read</span>';
      if(hi) h+='<span>High '+dpIndoor(hi.v)+' '+esc(hi.name)+'</span>';
      if(lo) h+='<span>Low '+dpIndoor(lo.v)+' '+esc(lo.name)+'</span>';
      if(t.out) h+='<span class="warn">'+t.out+' outside limit</span>';
      if(t.miss) h+='<span class="warn">'+t.miss+' missed</span>';
    }
    h+='</div></div>';
  });
  return h+'</div>';
}
function buildRound(dateStr){
  var rooms=dayRooms(dateStr);
  var dateInput='<div class="rdate"><label for="rdate">Date</label><input id="rdate" type="date" value="'+esc(dateStr)+'" onchange="setRoundDate(this.value)"></div>';
  var tiles='<div class="rtiles">'+rooms.map(function(x){
    return '<div class="rtile"><div class="rn">'+esc(x.name)+'</div><div class="rs">'+slotHtml('AM',x.am)+'</div><div class="rs">'+slotHtml('PM',x.pm)+'</div></div>';
  }).join('')+'</div>';
  var cell=function(s,v){ return '<td'+(s.k==='out'?' class="warn"':'')+'>'+esc(v||'—')+'</td>'; };
  var rows=rooms.map(function(x){ return '<tr><td class="nm">'+esc(x.name)+'</td>'+cell(x.am,x.am.lo)+cell(x.am,x.am.hi)+cell(x.pm,x.pm.lo)+cell(x.pm,x.pm.hi)+'</tr>'; }).join('');
  var table=rooms.length
    ?'<div class="rscroll" tabindex="0" role="region" aria-label="Indoor temperatures in degrees C"><table class="rtable"><thead><tr><th>Room</th><th>AM min</th><th>AM max</th><th>PM min</th><th>PM max</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    :'<p class="sub">No readings for this date.</p>';
  var out=outsideLine(dateStr);
  return dateInput
    +'<section class="sec"><h3>Indoors °C</h3>'+(rooms.length?tiles:'')+table+'</section>'
    +'<section class="sec"><h3>Outside</h3><p class="oline">'+esc(out||'No outside reading')+'</p></section>';
}
function setRoundDate(dateStr){
  ROUND_DATE=dateStr;
  var v=el('view-d');
  if(v) v.innerHTML=buildRound(dateStr);
  closeDrill();
}

var CUR_VIEW='d';
function setView(id,btn){
  CUR_VIEW=id;
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('on'); });
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('on'); });
  el('view-'+id).classList.add('on');
  btn.classList.add('on');
  closeDrill();
}
function setYear(y){
  YEAR=y;
  document.querySelectorAll('.yr-btn').forEach(function(b){ b.classList.toggle('on',+b.dataset.yr===y); });
  el('view-a').innerHTML=buildHeatMap(y);
  el('view-b').innerHTML=buildStrip(y);
  el('view-c').innerHTML=buildMonthCards(y);
  closeDrill();
}
function legend(){
  var sq=function(st){ return '<div class="leg-sq" style="'+st+'"></div>'; };
  return '<div class="legend">'
    +'<div class="leg">'+sq('background:var(--ljr-5-tint);border:1px solid var(--line)')+'In limit</div>'
    +'<div class="leg">'+sq('background:var(--ljr-3)')+'Outside limit or missed</div>'
    +'<div class="leg">'+sq('background:var(--soft);border:1px solid var(--line)')+'No readings</div>'
    +'<div class="leg">Outside: '+sq('background:var(--ljr-6-tint)')+(BAND?'below '+BAND.min:'cool')+' '+sq('background:var(--ljr-4-tint)')+(BAND?'above '+BAND.max:'warm')+'</div>'
    +'</div>';
}
function renderPage(){
  ROUND_DATE=ROUND_DATE||TODAY_STR;
  el('main').innerHTML=
    legend()
    +'<div class="yr-row">'
    +'<button class="btn yr-btn on" data-yr="2026" onclick="setYear(2026)">2026</button>'
    +'<button class="btn yr-btn" data-yr="2025" onclick="setYear(2025)">2025</button>'
    +'<button class="btn yr-btn" data-yr="2024" onclick="setYear(2024)">2024</button>'
    +'<a class="btn" style="min-height:40px" href="./history-archive.html">Archive</a>'
    +'</div>'
    +'<div class="tab-row">'
    +'<button class="tab on" onclick="setView(\'d\',this)">The round</button>'
    +'<button class="tab" onclick="setView(\'a\',this)">Heat map</button>'
    +'<button class="tab" onclick="setView(\'b\',this)">Year strip</button>'
    +'<button class="tab" onclick="setView(\'c\',this)">Month cards</button>'
    +'</div>'
    +'<div id="view-d" class="view on">'+buildRound(ROUND_DATE)+'</div>'
    +'<div id="view-a" class="view">'+buildHeatMap(YEAR)+'</div>'
    +'<div id="view-b" class="view">'+buildStrip(YEAR)+'</div>'
    +'<div id="view-c" class="view">'+buildMonthCards(YEAR)+'</div>';
}
</script>
</body></html>
