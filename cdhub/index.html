<style>
/* ==== House look (Master design rules, LINKS-COMFORT-BRIEF v3, 28 Oct 2026; same as Studio).
   Lexend 400/600, nothing under 13px, line height 1.5, no uppercase. 1px lines. Hover AND selected = the same 1px edge
   turns ink (outline over it), nothing moves; keyboard focus 1px ink inside. ONE radius, 12px (circles only for status dots and
   who rings). No coloured words, no solid colour fills: colour lives in dots, thin bars, 1px rings and light tints.
   Dark frame top and bottom. Greys follow Warm clear (default) or Cool clear, read from Studio's Look ('dash-look', read only).
   Screens are built on generic Bloodline foundation concepts (record, round, check, rule, place, person, document);
   animal-only parts are marked "kit: animal". ==== */
/* Greys, lines, frame, radius, the control line, counts, date pills, tabs and the hover rule: ../tokens.css through ../house.css,
   the same on every hub. CD Hub's own names below: the LJR7 slots, the kit (sex) colours and the old short names. */


:root{--sel-fill:var(--hov);

 --p0:var(--ljr-0);--p2:var(--ljr-2);--p3:var(--ljr-3);--p4:var(--ljr-4);--p5:var(--ljr-5);--p6:var(--ljr-6);--p7:var(--ljr-7);--p8:var(--ljr-8);
 --male:#2E86B0;--male-n:#9CC6DA;--female:#C85C87;--female-n:#EBB6CB;--unk:var(--ljr-0);

 --fg:var(--ink);--ln:var(--line);--sub:var(--muted);}
:root.sel-soft{--sel-fill:var(--hov);}
html.text-lg body{zoom:1.12}html.text-xl body{zoom:1.25}html.space-roomy body{line-height:1.75}
*{box-sizing:border-box}
h1,h2,h3,h4,b,strong,th{font-weight:600}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--fs-body)/1.5 var(--house-font);-webkit-text-size-adjust:100%;hyphens:manual}
a{color:inherit;text-underline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}
.wrap,.hin{max-width:none;margin:0 auto;padding-left:var(--house-gutter);padding-right:var(--house-gutter)}
.wrap{padding-bottom:140px}
.ti{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}


header.top{background:var(--frame);color:var(--frame-ink);position:sticky;top:0;z-index:20}
header h1 .dot{background:var(--ljr-5)}
.live{font-size:var(--fs-small);font-weight:600;border:1px solid var(--frame-line);border-radius:var(--radius);padding:0 8px;height:24px;display:inline-flex;align-items:center;white-space:nowrap;color:var(--frame-ink)}
.live.ok{border-color:var(--ljr-5)}.live.bad{border-color:var(--ljr-2)}
header .btn{color:var(--frame-ink);background:transparent;border-color:var(--frame-line)}
@media (hover:hover){header .btn:hover{background:var(--frame-hov);}}
header .btn:focus-visible{outline: 1px solid var(--frame-ink);outline-offset: -1px}
.backhome{text-decoration:none}

html.dash-locked header .backhome{color:var(--ink);border-color:var(--press)}


@media (max-width:544px){ .wrap{padding-bottom:170px} }


h2{font-size:var(--fs-head);margin:24px 0 4px;line-height:1.3}
h3{font-size:var(--fs-head);margin:24px 0 12px;display:flex;align-items:center;gap:8px}

.note{font-size:var(--fs-small);color:var(--muted);margin:8px 0 12px}
code{font-family:inherit;font-size:var(--fs-small);font-variant-numeric:tabular-nums;background:transparent;padding:0}


.card{margin:0 0 12px;box-shadow:var(--shadow)}

.card.acc2>:is(h4,.hx4):first-child::before,.card.acc5>:is(h4,.hx4):first-child::before{content:"";width:10px;height:10px;border-radius:50%;flex:none;border:1px solid var(--ljr-2);background:var(--ljr-2-tint)}
.card.acc5>:is(h4,.hx4):first-child::before{border-color:var(--ljr-5);background:var(--ljr-5-tint)}

.btn,.cb,.ci,.tl,.next button,.sfb,.achip,#main button:not(.tile):not(.ttl):not(.rdel),.filt select,.fpanel select,.filt input,.sbox,.sortsel,.tmp input,#rdate{
 font-family:inherit;font-size:var(--fs-small);font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--press);border-radius:var(--radius);
 min-height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none;box-sizing:border-box;line-height:1.2}
.filt input,.sbox input,.tmp input,#rdate{font-weight:400;cursor:text}
.filt select,.fpanel select,.sortsel{padding:0 10px}
.btn[disabled],#main button[disabled]{cursor:not-allowed;opacity:.6}
@media (hover:hover){.filt select:hover, .fpanel select:hover {background:var(--hov);}
.btn:hover, .cb:hover, .ci:hover, .tl:hover, .next button:hover, .sfb:hover, .achip:hover, #main button:not(.tile):not(.ttl):hover, .sortsel:hover, .mrow.go:hover {background:var(--hov);}}
.tile.tl:hover,.ci:hover{border-color:var(--press)}

@media (hover:hover){.btn.yes:hover{background:var(--hov);}.btn.no:hover{background:var(--hov);}}
.dc .nl .st{border:0;padding:0;height:auto;font-size:var(--fs-small)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
:focus-visible{outline: 1px solid var(--ink)!important;outline-offset: -1px}
/* Typing boxes: one 1px line inside the rounded box; focus recolours that line. Never a second square ring. */
:is(input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),select,textarea):is(:focus,:focus-visible){outline:none!important;border-color:var(--ink)}
.sbox input:is(:focus,:focus-visible){outline:none!important}
.sbox:focus-within{border-color:var(--ink)}

.dpill{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1px solid var(--press);border-radius:var(--radius);font-size:var(--fs-small);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}

 'BLD-jurisdiction.csv','BLD-authority.csv','BLD-unit.csv','BLD-locale.csv','BLD-species.csv',
 'BLD-outcome.csv','BLD-declaration.csv','BLD-frequency.csv','BLD-checklist_template.csv','BLD-checklist_template_item.csv',
 'BLD-checklist_instance.csv','BLD-deviation.csv','BLD-verification.csv','BLD-finding.csv','BLD-governed_by.csv','BLD-sop.csv','BLD-sop_version.csv','BLD-role.csv','BLD-vaccination.csv','BLD-breeding_rule.csv','BLD-requirement.csv','BLD-thermometer.csv','BLD-area_link.csv','BLD-status_label.csv','BLD-inspection.csv','BLD-credential.csv','BLD-credential_version.csv',
 'BLD-person.csv','BLD-household.csv','BLD-household_member.csv','BLD-subject_owner.csv','BLD-sale.csv','BLD-match_candidate.csv'];

if(typeof BBHubView!=='undefined') BBHubView.FILES.forEach(function(f){WANT.push(f);OPTIONAL_FILES[f]=1;});
if(typeof CDEnquiries!=='undefined') CDEnquiries.FILES.forEach(function(f){ if(WANT.indexOf(f)<0) WANT.push(f); OPTIONAL_FILES[f]=1; });
function jobsV(){ return {types:T['BLD-check_type.csv']||[],logs:T['BLD-check_log.csv']||[],dogs:(CD.dogs||[]).filter(function(d){return d.area_id&&!d.off;}),areas:CD.areas||[],today:todayISO(),esc:esc,dmy:dmy,fold:compOpen,sopHref:sopHref}; }
/* Compliance folds (Lisa: foldable sections). State lasts while the page is open. */
var COMP={shut:{},asAt:''};   /* asAt: the "What was true on" date; blank = today */
function compOpen(k){ return COMP.shut[k]?'':' open'; }
function compFold(id,k,title,body){ return '<section class="card" id="'+id+'"><details class="compfold" data-fold="'+k+'"'+compOpen(k)+'><summary><h3>'+title+'</h3></summary>'+body+'</details></section>'; }

var T={}, LOAD={state:'boot',err:null,storedAt:null,notes:[]};
var DB=null, ROUND={}, ACCESS={}, DBERR=null;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function safeUrl(u){ u=String(u==null?'':u).trim(); return /^https?:\/\/[^\s"'<>]+$/i.test(u)?u:''; }



var SOP={rows:null,err:'',pending:null,cards:null,cardsErr:'',cardsPending:null,open:'',shut:{}};
var SOP_CARDS_FILE='BLD-sop_cards.json';
var SOP_COLOURS=['White','Red','Orange','Yellow','Green','Blue','Purple'];
var SOP_FREQS=['Daily','Weekly','Monthly','Quarterly','Annual','Ongoing','Per litter','Ad hoc','Breeding'];

var SOP_CATEGORIES=['Breeding health','Daily care & premises','Emergency & safety','Licence & records','Puppy sale & handover','Signs & posters','Staff'];

var SOP_ROLES=['licence_holder','manager','kennel_staff','all_staff'];
var SOP_ROLE_RANK=SOP_ROLES.concat(['inspector_view']);
var SOP_ROLE_LABEL={licence_holder:'Licence holder',manager:'Manager',kennel_staff:'Kennel staff',all_staff:'All staff',inspector_view:'Inspector view'};
var SOP_DOT={White:'--ljr-0',Red:'--ljr-2',Orange:'--ljr-3',Yellow:'--ljr-4',Green:'--ljr-5',Blue:'--ljr-6',Purple:'--ljr-7'};
function sopDot(c){ return SOP_DOT[c]||'--ljr-0'; }
/* the colour's meaning on the LJR7 spine (tokens.css), as on Lisa's 5 Nov SOP mock-up: "Yellow – operations" */
var SOP_MEANING={White:'vision',Red:'risk and legal',Orange:'money',Yellow:'operations',Green:'connection',Blue:'sales',Purple:'ideas'};
function sopLabel(r){ return r.colour+' \u2013 '+r.frequency+': '+r.short_name; }
function sopRoleLabel(code){ return SOP_ROLE_LABEL[code]||code||''; }
function sopNorm(r){
 if(!r||typeof r!=='object') return null;
 var colour=String(r.colour||'').trim(), frequency=String(r.frequency||'').trim(), short_name=String(r.short_name||'').trim();
 if(!colour||!frequency||!short_name) return null;
 var category=String(r.category||'').trim(), role=String(r.role||'').trim();
 var has=String(r.has_form||'').toUpperCase()==='Y'?'Y':'N';
 var raw=String(r.form_url||'').trim();
 var form_url=(has==='Y'&&/^https:\/\/[^\s"'<>]+$/i.test(raw))?raw:'';
 var type_code=assetCode(r.type_code);
 var kind=assetCode(String(r.kind||'').toLowerCase());
 return {colour:colour,frequency:frequency,category:category,role:role,short_name:short_name,has_form:has,form_url:form_url,type_code:type_code,kind:kind};
}


var ASSET={types:null,formats:null,unmap:['other','sheet'],err:'',pending:null};
function assetCode(s){ s=String(s==null?'':s).trim(); return /^[a-z][a-z0-9_]{0,40}$/.test(s)?s:''; }
function assetOn(r){ return !r || r.enabled!==false; }
function assetNormType(r){
 if(!r||typeof r!=='object') return null;
 var code=assetCode(r.type_code), label=String(r.label||'').trim(), key=assetCode(r.icon_key);
 if(!code||!label||!key||key.indexOf('fmt_')===0) return null;
 if(code==='other'||code==='sheet') return null;
 if(r.approval_status!=='approved') return null;
 if(!assetOn(r)) return null;
 return {type_code:code,label:label,icon_key:key,requires_sop_link:r.requires_sop_link===true,allow_unlinked_reconciliation:r.allow_unlinked_reconciliation===true,sort:Number(r.sort)||0};
}
function assetNormFormat(r){
 if(!r||typeof r!=='object') return null;
 var code=assetCode(r.format_code), label=String(r.label||'').trim(), key=assetCode(r.icon_key);
 if(!code||!label||!key||key.indexOf('fmt_')!==0) return null;
 if(code==='other'||code==='sheet') return null;
 var mime=Array.isArray(r.mime_allowlist)?r.mime_allowlist.map(function(m){return String(m||'').trim();}).filter(function(m){return /^[a-z0-9.+-]+\/[a-z0-9.+-]+$/.test(m);}):[];
 return {format_code:code,label:label,icon_key:key,mime_allowlist:mime,sort:Number(r.sort)||0};
}
function mountAssetIcons(svgText){
 if(document.getElementById('asset-type-icons')) return true;
 var doc=new DOMParser().parseFromString(svgText,'image/svg+xml');
 if(!doc||doc.querySelector('parsererror')) return false;
 var syms=doc.querySelectorAll('symbol'), holder=document.createElementNS('http://www.w3.org/2000/svg','svg');
 holder.setAttribute('id','asset-type-icons'); holder.setAttribute('width','0'); holder.setAttribute('height','0');
 holder.setAttribute('aria-hidden','true'); holder.style.position='absolute';
 for(var i=0;i<syms.length;i++){
  var s=document.importNode(syms[i],true), id=s.getAttribute('id')||'';
  if(!/^i-[a-z][a-z0-9_]*$/.test(id)||document.getElementById(id)) continue;
  holder.appendChild(s);
 }
 if(!holder.firstChild) return false;
 document.body.appendChild(holder);
 return true;
}
function assetStart(){
 if(ASSET.types||ASSET.err||ASSET.pending) return ASSET.pending||Promise.resolve();
 var base=location.pathname.replace(/[^/]*$/,'');
 ASSET.pending=Promise.all([
  fetch(base+'asset-types.json',{cache:'no-store'}).then(function(res){ if(!res.ok) throw new Error('read failed'); return res.json(); }),
  fetch(base+'asset-type-icons.svg',{cache:'no-store'}).then(function(res){ if(!res.ok) throw new Error('icons'); return res.text(); })
 ]).then(function(pair){
  var data=pair[0];
  if(!data||!Array.isArray(data.types)||!Array.isArray(data.formats)) throw new Error('not a list');
  if(!mountAssetIcons(pair[1])) throw new Error('icons');
  var unmap=(Array.isArray(data.do_not_remap)?data.do_not_remap:[]).map(function(x){return assetCode(String(x||'').toLowerCase());}).filter(Boolean);
  if(unmap.indexOf('other')<0) unmap.push('other');
  if(unmap.indexOf('sheet')<0) unmap.push('sheet');
  var types=data.types.map(assetNormType).filter(Boolean).filter(function(t){return unmap.indexOf(t.type_code)<0;});
  var formats=data.formats.map(assetNormFormat).filter(Boolean);
  if(!types.length||!formats.length) throw new Error('bad row');
  types.sort(function(a,b){ return a.sort-b.sort||a.label.localeCompare(b.label); });
  formats.sort(function(a,b){ return a.sort-b.sort||a.label.localeCompare(b.label); });
  ASSET.unmap=unmap; ASSET.types=types; ASSET.formats=formats;
 }).catch(function(){ ASSET.err='File types could not be read.'; })
  .then(function(){ if(document.getElementById('soptypes')){ drawAssetTypes(); drawSops(); } });
 return ASSET.pending;
}
function sopShownType(r){
 if(!r||!ASSET.types) return null;
 var by={}; ASSET.types.forEach(function(t){ by[t.type_code]=t; });
 if(r.type_code && by[r.type_code]) return by[r.type_code];
 if(!r.kind || ASSET.unmap.indexOf(r.kind)>=0 || !by[r.kind]) return null;
 return by[r.kind];
}
function assetItem(attr, code, key, label){
 var id='i-'+key;
 var icon=document.getElementById(id)?'<svg class="ti" aria-hidden="true"><use href="#'+id+'"/></svg>':'';
 return '<li class="atype" '+attr+'="'+esc(code)+'" data-icon-key="'+esc(key)+'" aria-label="'+esc(label)+'">'+icon+'<span class="atype-lab">'+esc(label)+'</span></li>';
}
function drawAssetTypes(){
 var box=document.getElementById('soptypes'), fmt=document.getElementById('sopformats'); if(!box) return;
 if(ASSET.err){
  box.innerHTML='<p class="mut">'+esc(ASSET.err)+'</p>';
  if(fmt) fmt.innerHTML='<p class="mut">'+esc(ASSET.err)+'</p>';
  return;
 }
 if(!ASSET.types){
  box.innerHTML='<p class="mut">Reading file types\u2026</p>';
  if(fmt) fmt.innerHTML='<p class="mut">Reading file formats\u2026</p>';
  return;
 }
 box.innerHTML='<ul class="atype-grid">'+ASSET.types.map(function(t){ return assetItem('data-type-code',t.type_code,t.icon_key,t.label); }).join('')+'</ul>';
 if(fmt) fmt.innerHTML='<p class="mut">How a file is stored. Separate from the type.</p><ul class="atype-grid">'+ASSET.formats.map(function(f){ return assetItem('data-format-code',f.format_code,f.icon_key,f.label); }).join('')+'</ul>';
}


function sopChoices(present, pref){
 var seen={}, extra=[];
 present.forEach(function(v){ if(v && !seen[v]){ seen[v]=1; if(pref.indexOf(v)<0) extra.push(v); } });
 extra.sort();
 return pref.concat(extra);
}
function sopStart(){
 if(SOP.rows||SOP.err||SOP.pending) return SOP.pending||Promise.resolve();
 var path=location.pathname.replace(/[^/]*$/,'')+'sop-index.json';
 SOP.pending=fetch(path,{cache:'no-store'}).then(function(res){
  if(!res.ok) throw new Error('read failed');
  return res.json();
 }).then(function(data){
  if(!Array.isArray(data)) throw new Error('not a list');
  var rows=data.map(sopNorm);
  if(!rows.length||rows.some(function(r){return !r;})) throw new Error('bad row');

/* Outdoor week strip. Cold or Hot against the adult band, otherwise OK.
   Rain: none at 0 mm, light under 10 mm, wet from 10 mm. Windy only at 40 km/h or more. */
function outdoorBandWord(min,max){
 var st=tempState(min,max);
 return st==='cold'?'Cold':st==='hot'?'Hot':st==='swap'?'Check':st==='ok'?'OK':'';
}
function outdoorRainCue(v){
 if(v==null||String(v).trim()==='') return '';
 var n=parseFloat(v); if(isNaN(n)) return '';
 if(n<=0) return '';
 if(n<10) return 'light';
 return 'wet';
}
function outdoorWindy(v){ var n=parseFloat(v); return !isNaN(n)&&n>=40; }
function outdoorBit(v){
 if(v==null||String(v).trim()==='') return '?';
 var n=parseFloat(v); if(isNaN(n)) return String(v).trim();
 return (Math.round(n*10)/10).toFixed(1).replace(/\.0$/,'');
}
function outdoorDeg(min,max){ return outdoorBit(min)+'\u2013'+outdoorBit(max)+'\u00b0'; }
function outdoorForDay(date){
 var rows=(CD.outdoor||[]).filter(function(r){ return (r.on||'').slice(0,10)===date; });
 if(!rows.length) return null;
 var got=rows.filter(function(r){ return r.kind && r.kind!=='forecast'; });
 return got[0]||rows[0];
}
/* Same words as Temperature history: "7.5 / 1.7 °C, rain 0 mm". */
function outdoorLine(date){
 var r=outdoorForDay(date); if(!r) return '';
 var rain=r.rain, rainS='';
 if(rain!=null&&String(rain).trim()!==''){
  var n=parseFloat(rain);
  rainS=', rain '+(isNaN(n)?String(rain).trim():String(Math.round(n*10)/10).replace(/\.0$/,''))+' mm';
 }
 return outdoorBit(r.max)+' / '+outdoorBit(r.min)+' \u00b0C'+rainS;
}
function roundOutdoorHtml(date){
 var line=outdoorLine(date);
 return line?' <span class="rout">'+esc(line)+'</span>':'';
}
function outdoorWeek(date){
 var by={};
 (CD.outdoor||[]).forEach(function(r){
  if(r.kind!=='forecast') return;
  var on=String(r.on||'').slice(0,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(on)||on<=date) return;
  by[on]=r;
 });
 return Object.keys(by).sort().slice(0,6).map(function(on){ return {on:on,row:by[on]}; });
}
function outdoorStrip(date){
 var days=outdoorWeek(date);
 if(!days.length) return '';
 return '<div class="wk" tabindex="0" role="region" aria-label="Outdoor forecast: next 6 days">'
  +days.map(function(d){
    var r=d.row;
    var dt=new Date(d.on+'T12:00:00');
    var wd=dt.toLocaleDateString('en-GB',{weekday:'short'});
    var dm=dt.getDate();
    var band=outdoorBandWord(r.min,r.max);
    var tone=band==='Cold'?'cold':band==='Hot'?'hot':band==='OK'?'ok':'';
    var rain=outdoorRainCue(r.rain), windy=outdoorWindy(r.wind);
    var rainMm=(rain==='wet'&&r.rain!=null)?Math.round(parseFloat(r.rain)):0;
    var windKph=windy?Math.round(parseFloat(r.wind)):0;
    return '<div class="wkday">'
     +(wd?'<span class="wd">'+esc(wd)+'</span>':'')
     +'<span class="wdate">'+dm+'</span>'
     +'<span class="wt">'+esc(outdoorDeg(r.min,r.max))+'</span>'
     +(tone?'<span class="wb"><span class="ic '+tone+'" aria-hidden="true"></span></span>':'')
     +'<span class="wr'+(rain?' wr-'+rain:'')+'">'+
       (rain
         ?'<svg width="12" height="16" viewBox="0 0 7 9" aria-hidden="true"><path d="M3.5 0C2 2 0 4.5 0 6.3a3.5 3.5 0 0 0 7 0C7 4.5 5 2 3.5 0Z"/></svg>'
           +''
         :'')
     +'</span>'
     +(windy?'<span class="ww"><svg width="9" height="7" viewBox="0 0 9 7" aria-hidden="true"><path d="M0 1h7M0 3.5h9M0 6h5" stroke-width="1.5" stroke-linecap="round"/></svg>Windy'+(windKph?'<span class="wdet sr-only"> '+windKph+' km/h</span>':'')+'</span>':'')
     +'</div>';
  }).join('')+'</div>';
}
/* foundation: readings against a rule band (temperature per place, per round slot) */
function tempsCard(){
 var date=CD._roundDate||todayISO(), A=liveCabins(), N=A.length;
 var has=function(slot){ return A.filter(function(a){ var t=(ROUND[roundKey(date,a.id)]||{})['t_'+slot]; return t&&(t.min||t.max||t.empty); }).length; };
 var am=has('am'), pm=has('pm');
 var out=(CD.outdoor||[]).filter(function(r){ return (r.on||'').slice(0,10)===date; })[0];
 var row=function(t,v,s,state){ var cls=state===true||state==='ok'?' ok':state==='cold'?' cold':state==='hot'?' late':''; return '<div class="mrow"><span class="ic'+cls+'" aria-hidden="true"></span><span class="t">'+t+(s?'<small>'+s+'</small>':'')+'</span><span class="v">'+v+'</span></div>'; };
 var outState=function(r){ return r?tempState(r.min,r.max):''; };
 var cold=0, hot=0, swap=0, unk=0, mt=0; A.forEach(function(a){ var r=ROUND[roundKey(date,a.id)]||{}, bd=roomBand(a.id,date);
   ['am','pm'].forEach(function(s){ var t=r['t_'+s], st=t&&(t.min||t.max)?tempState(t.min,t.max,bd):''; if(t&&t.empty&&st&&st!=='ok'&&st!=='unknown'){ mt++; return; } if(st==='cold') cold++; if(st==='hot') hot++; if(st==='swap') swap++; if(st==='unknown') unk++; }); });
 var inState=(am||pm)?(swap||hot?'hot':cold?'cold':unk?'':'ok'):'';
 return '<section class="mcard" id="tempsCard" data-open-row style="--hc:var(--ljr-4-icon)"><h3><svg class="ti" aria-hidden="true"><use href="#i-thermometer"/></svg>Temperatures today</h3>'
  +row('Morning',am+' of '+N,'',N&&am===N)+row('Evening',pm+' of '+N,'',N&&pm===N)
  +((am||pm)?row('Rooms',swap?swap+' max lower than min':(hot?hot+' too hot':cold?cold+' too cold':unk?unk+' with no limit set':'all in range'),swap?'typed the wrong way round? check and correct':(hot&&cold?cold+' too cold too':'')+(mt?((hot&&cold)||swap?' \u00b7 ':'')+mt+' in an empty room, not counted':''),inState):'')
  +(out?row('Outside',esc(outdoorBit(out.min)+'\u2013'+outdoorBit(out.max))+' °C',esc(out.phrase||''),outState(out))
       :'<div class="mrow"><span class="ic" aria-hidden="true"></span><span class="t">Outside<small>No reading today</small></span></div>')
  +outdoorStrip(date)
  +'<div class="mfoot"><span class="mut"></span><a class="btn" href="./history.html">Temperature history</a><button type="button" class="btn house-open" data-go="round">The round</button>'

}

/* The licence counts as ONE bar (Lisa, 12 Nov 2026: the 4 tiles and the "Both counts agree" fold were repetitive).
   The bar is the adults here: breeding bitches on your working list, retired-but-entire bitches (they still count in law),
   studs, and any other adult. A tick when the law's count and your list agree; an amber badge with the difference when not.
   Each part opens its list, as the tiles did. */
function licenceBar(c){
 var law=c.bitches.length, mine=c.active.length, gap=law-mine, retired=Math.max(gap,0), studs=c.studs.length, adults=c.adults.length;
 var bitchSeg=Math.min(mine,law), other=Math.max(adults-bitchSeg-retired-studs,0), tot=Math.max(adults,1);
 function seg(n,cls,word,list){ return n>0?'<button type="button" class="lbseg '+cls+'" style="flex:'+n+' 1 0" data-list="'+list+'" title="'+esc(n+' '+word)+'"><b>'+n+'</b> '+esc(word)+'</button>':''; }
 return '<div class="card lbar" data-k="licence"><div class="lbhead"><b>'+adults+'</b> adults'
  +(gap===0?' <span class="lbok" title="The law and your list agree" aria-label="The law and your list agree">\u2713</span>'
   :' <span class="pill w lbgap" title="Law '+law+', your list '+mine+'">'+(gap>0?gap+' more in law':Math.abs(gap)+' more on your list')+'</span>')+'</div>'
  +'<div class="lbtrack" role="group" aria-label="'+esc(adults+' adults: '+bitchSeg+' breeding bitches, '+(retired?retired+' retired but entire, ':'')+studs+' studs')+'">'
  +seg(bitchSeg,'lb-b','breeding bitches','active')+seg(retired,'lb-r','retired, entire','bitches')+seg(studs,'lb-s','studs','studs')+seg(other,'lb-o','other','adults')
  +'</div></div>';
}
/* Live cabins for the Today checklist and The round. Retired rooms (room.in_use ended) are already left out of CD.areas.
   The fields line is not a cabin (grouping Fields, code "Level 1 and level 5", or use Fields). It stays on Areas
   and is not asked for a flap mode or a morning or evening cabin temperature. */
function normPlace(s){ return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' '); }
function isFieldsRow(a){
 if(!a) return false;
 return normPlace(a.grouping)==='fields' || normPlace(a.code||a.cabin)==='level 1 and level 5' || normPlace(a.use)==='fields';
}
function isLiveCabin(a){
 /* corridors: room.no_dogs; day pens: room.no_overnight. Need types are row values, never room names in code. */
 var day=CD._roundDate||todayISO(), req=CD.req||[];
 var overnight=BLDOccupancy.takesOvernight?BLDOccupancy.takesOvernight(a,day,req):BLDOccupancy.takesDogs(a,day,req);
 return !!a && !isFieldsRow(a) && overnight;
}
/* Rooms in use on a day (Lisa: late entry stays open for every day a thing was needed). A past date on The round
   shows the rooms in use THAT day: a room retired since still shows, a room added since does not. */
function areasOn(day){ day=day||todayISO(); if(day===todayISO()||!CD.allAreas) return CD.areas||[];
 return CD.allAreas.filter(function(a){ return BLDOccupancy.inUse(a,day,CD.req||[]); }); }
function liveCabins(day){ return areasOn(day||CD._roundDate||todayISO()).filter(isLiveCabin); }
/* A chosen flap mode is only free or limited (the sheet value, or the same value on today's round). */
function flapChosen(v){ v=normPlace(v); return v==='free'||v==='limited'; }
/* foundation: checklist instance for today's round. Each line is a check on the round's places (✓ done / ✗ not yet),
   worked out from what is read: placements, flap modes, readings and headcounts. Nothing is stored. */

 var A=liveCabins(), N=A.length;
 var has=function(slot){ return A.filter(function(a){ var t=(ROUND[roundKey(date,a.id)]||{})['t_'+slot]; return t&&(t.min||t.max||t.empty); }).length; };
 var am=has('am'), pm=has('pm'), modes=A.filter(function(a){ var r=ROUND[roundKey(date,a.id)]||{}; return flapChosen(r.access||accessOf(a.id)); }).length;
 var over=A.filter(function(a){ var acc=(ROUND[roundKey(date,a.id)]||{}).access||accessOf(a.id); return roomCheck(a.id,inCabin(a.id,date),acc,date).status==='over'; }).length;
 var c=counts();

  [!unplacedN,'Every dog on site is in a cabin',unplacedN?unplacedN+' not yet placed':'all placed'],
  [N>0&&am===N,'Morning temperature in every cabin',am+' of '+N+' cabins'],
  [N>0&&pm===N,'Evening temperature in every cabin',pm+' of '+N+' cabins'],
  [N>0&&modes===N,'Every cabin has its flap mode',modes+' of '+N+' chosen'],
  [!over,'No cabin over its headcount',over?over+' over':'all within'],

 var done=L.filter(function(x){return x[0];}).length;
 return '<section class="mcard" id="todayChecklist" style="--hc:var(--ljr-4-icon);margin-bottom:12px"><h3><svg class="ti" aria-hidden="true"><use href="#i-list-check"/></svg>Today checklist<span class="mut" style="margin-left:auto;font-weight:400">'+done+' of '+L.length+' done</span></h3>'
  +L.map(function(x){ return '<div class="mrow ckrow"><span class="mk'+(x[0]?'':' bad')+'" aria-hidden="true">'+(x[0]?'✓':'✗')+'</span>'
    +'<span class="t">'+esc(x[1])+'<span class="sr">'+(x[0]?' done':' not done')+'</span><small>'+esc(x[2])+'</small></span></div>'; }).join('')
  +'<div class="mfoot"><span class="mut"></span><button type="button" class="btn" data-go="round">The round</button></div></section>';

function csvCell(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function headerCols(text){
 text=String(text||'').replace(/^\uFEFF/,'').replace(/\r/g,'');
 var line=(text.split('\n')[0]||'');
 if(!line.trim()) return null;
 var cols=[],f='',q=false;
 for(var i=0;i<line.length;i++){
  var c=line[i];
  if(q){ if(c==='"'){ if(line[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
  else if(c==='"') q=true;
  else if(c===','){ cols.push(f.trim()); f=''; }
  else f+=c;
 }
 cols.push(f.trim());
 return {cols:cols,text:text};
}
/* Append one row to the named file in the folder. A Sheet gets one appended row. A csv file is read and written back.
   If the name is missing, doubled, or the read fails, nothing is written. */
async function appendListedRow(name, label, fields){
 var hits=(window._driveFiles||[]).filter(function(f){ return f&&f.name===name&&f.id; });
 if(hits.length!==1) return {ok:false, message:hits.length>1?('Not saved: more than one '+label+' is in the folder.'):('Not saved: the '+label+' is not in the folder.')};
 var file=hits[0], parsed;
 try{ parsed=headerCols(await readDriveFile(file)); }
 catch(e){ return {ok:false, message:'Not saved: the '+label+' could not be read.'}; }
 if(!parsed) return {ok:false, message:'Not saved: the '+label+' has no header.'};
 var values=parsed.cols.map(function(c){ return fields[c]==null?'':String(fields[c]); });
 try{
  var res;
  if(file.mimeType==='application/vnd.google-apps.spreadsheet'){
   var url='https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(file.id)+'/values/A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS';
   res=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({values:[values]})});
  }else{
   var updated=parsed.text.trimEnd()+'\n'+values.map(csvCell).join(',');
   var boundary='cdhub_bnd';
   var meta=JSON.stringify({name:name,mimeType:file.mimeType||'text/csv'});
   var body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+boundary+'\r\nContent-Type: text/csv\r\n\r\n'+updated+'\r\n--'+boundary+'--';
   res=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(file.id)+'?uploadType=multipart&supportsAllDrives=true',{method:'PATCH',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'multipart/related; boundary="'+boundary+'"'},body:body});
  }
  if(!res.ok) return {ok:false, message:'Not saved: the '+label+' could not be updated.'};
  return {ok:true};
 }catch(e){ return {ok:false, message:'Not saved: the '+label+' could not be updated.'}; }
}

var PHOTO_OUT=800, PHOTO_MAX_B64=350000, PHOTO_WORK=2048;
var PHOTO_HEIC_MSG='That picture type can\u2019t be read here. Try a screenshot of it.';

/* Decode with the camera's own orientation (EXIF). createImageBitmap first, then an <img> (browsers apply

  var s=Math.min(1,PHOTO_WORK/Math.max(w,h)), c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s));
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  if(src.close) try{ src.close(); }catch(e){}
  return c;

  return new Promise(function(resolve,reject){
   var url=URL.createObjectURL(file), im=new Image();
   im.style.imageOrientation='from-image';
   im.onload=function(){ try{ resolve(toCanvas(im,im.naturalWidth||im.width,im.naturalHeight||im.height)); }catch(e){ reject(e); } finally{ URL.revokeObjectURL(url); } };
   im.onerror=function(){ URL.revokeObjectURL(url); reject(new Error(PHOTO_HEIC_MSG)); };
   im.src=url;
  });

  return createImageBitmap(file,{imageOrientation:'from-image'}).then(function(b){ return toCanvas(b,b.width,b.height); },viaImg)
   .catch(function(){ throw new Error(PHOTO_HEIC_MSG); });
 }

/* Take photo: on a phone or tablet the input's capture opens the camera app. On a laptop or desktop (no touch pointer) the
   page opens the camera itself (getUserMedia), so Take photo works on any device. The frame is handled like a picked file. */

  md.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1920}},audio:false}).then(function(stream){
   var box=document.createElement('div');
   box.className='pcrop pcam'; box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); box.setAttribute('aria-labelledby','pcamT');
   box.innerHTML='<div class="pcrop-in"><h3 id="pcamT">Take a photo</h3><video data-cam-video autoplay playsinline muted></video>'
    +'<div class="pcrop-btns"><span class="pcrop-gap"></span><button type="button" class="btn" data-cam-cancel>Cancel</button>'
    +'<button type="button" class="btn yes" data-cam-take>Take photo</button></div></div>';
   document.body.appendChild(box);
   var video=box.querySelector('[data-cam-video]'); video.srcObject=stream;
   function done(v){ document.removeEventListener('keydown',key,true); stream.getTracks().forEach(function(t){ t.stop(); }); box.remove(); resolve(v); }
   function key(e){ if(e.key==='Escape'){ e.preventDefault(); done(null); } }

/* Upload goes through the save script (the same address and staff code as The round), which puts the file in the
   Shared Drive folder named by Script Properties and writes that file id into the photo cell. The page never
   holds the folder id and never changes who can see the file. */
async function photoSave(inp,getSrc,was){
 var id=inp.getAttribute('data-dog-photo')||'';
 if(!TOKEN){ photoMsg(inp,'Sign in to add a photo.'); return; }
 var g=await sinkGate();
 if(!g.ok){ photoMsg(inp, g.code==='NO_CODE'?'Enter your staff code. Nothing was saved.':'Could not reach the save script. Nothing was saved.'); return; }
 photoMsg(inp,'');
 photoBusy(inp,true);
 try{
  var src=await getSrc();
  if(!src){ photoBusy(inp,false); return; }   /* camera closed: nothing is sent */
  if(src.error){ photoBusy(inp,false); photoMsg(inp,src.error); return; }
  var pic=await photoCrop(src,was);
  if(!pic){ photoBusy(inp,false); return; }   /* Cancel: nothing is sent */
  if(pic.error){ photoBusy(inp,false); photoMsg(inp,pic.error); return; }
  photoMsg(inp,'Saving the photo…');
  var res=await fetch(g.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
   body:JSON.stringify({v:1,request_id:sinkRid(),code:g.code,action:'dog_photo',fields:{subject_id:id,mime:pic.mime,image_base64:pic.b64}})});
  var j;
  try{ j=await res.json(); }catch(e){ j={ok:false,message:'The save script did not answer. Nothing was saved.'}; }
  if(j&&(j.code==='BAD_CODE'||j.code==='NO_CODE')) noteBadCode(g.code); else if(j&&j.ok) keepStaffCode(g.code);
  if(!j.ok||!j.result||!j.result.file_id){ photoBusy(inp,false); photoMsg(inp,j.message||'The photo was not saved.'); return; }
  var d=CD._byId[id]; if(d) d.photo=j.result.file_id;
  drawDogs();
 }catch(e){ photoBusy(inp,false); photoMsg(inp,(e&&e.message)||'The photo was not saved.'); }
}

<script>
/* Calm: every help bullet list (ul.notes) becomes one (i); its words show on hover or tap. */
(function () {
  function calm() {
    document.querySelectorAll('ul.notes:not([data-calm])').forEach(function (ul) {
      var t = Array.prototype.map.call(ul.querySelectorAll('li'), function (li) { return li.textContent.trim(); }).join(' · ');
      var s = document.createElement('span'); s.className = 'info'; s.title = t; s.setAttribute('tabindex', '0'); s.textContent = 'i';
      var h = document.createElement('span'); h.textContent = ' ' + t; h.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap'; s.appendChild(h);
      ul.setAttribute('data-calm', '1'); ul.replaceWith(s);
    });
  }
  new MutationObserver(calm).observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener('DOMContentLoaded', calm); calm();
})();
</script>
