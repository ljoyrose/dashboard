<script>
/* Look: read Studio's saved choice ('dash-look', read only; this page never writes it). Background, Selected, Text, Spacing, Mode. */
(function(){ var o={}; try{ o=JSON.parse(localStorage.getItem('dash-look')||'{}')||{}; }catch(e){ o={}; }
 var r=document.documentElement, c=r.classList;
 c.toggle('look-cool',o.bg==='cool'); c.toggle('sel-soft',o.sel==='soft');
 c.toggle('text-lg',o.text==='lg'); c.toggle('text-xl',o.text==='xl'); c.toggle('space-roomy',o.space==='roomy');
 if(o.mode==='light'||o.mode==='dark') r.setAttribute('data-theme',o.mode); })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../house.css">
<style>
/* ==== House look (Master design rules, LINKS-COMFORT-BRIEF v3, 28 Oct 2026; same as Studio).
   Lexend 400/600, nothing under 13px, line height 1.5, no uppercase. 1px lines. Hover AND selected = the same 1px edge
   turns ink (outline over it), nothing moves; keyboard focus 1px ink inside. ONE radius, 12px (circles only for status dots and
   who rings). No coloured words, no solid colour fills: colour lives in dots, thin bars, 1px rings and light tints.
   Dark frame top and bottom. Greys follow Warm clear (default) or Cool clear, read from Studio's Look ('dash-look', read only).
   Screens are built on generic Bloodline foundation concepts (record, round, check, rule, place, person, document);
   animal-only parts are marked "kit: animal". ==== */
/* Greys, lines, frame, radius, the control line, counts, date pills, tabs and the hover rule: ../tokens.css through ../house.css,
   the same on every hub. CD Hub's own names below: the LJR7 slots, the kit (sex) colours and the old short names. */


:root{--sel-fill:transparent;--hov-fill:var(--hov);

 --p0:var(--ljr-0);--p2:var(--ljr-2);--p3:var(--ljr-3);--p4:var(--ljr-4);--p5:var(--ljr-5);--p6:var(--ljr-6);--p7:var(--ljr-7);--p8:var(--ljr-8);
 --male:#2E86B0;--male-n:#9CC6DA;--female:#C85C87;--female-n:#EBB6CB;--unk:var(--ljr-0);

 --fg:var(--ink);--ln:var(--line);--sub:var(--muted);}
:root.sel-soft{--sel-fill:var(--soft);}
html.text-lg body{zoom:1.12}html.text-xl body{zoom:1.25}html.space-roomy body{line-height:1.75}
*{box-sizing:border-box}
h1,h2,h3,h4,b,strong,th{font-weight:600}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--fs-body)/1.5 var(--house-font);-webkit-text-size-adjust:100%;hyphens:manual}
a{color:inherit;text-underline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}
.wrap,.hin{max-width:none;margin:0 auto;padding-left:var(--house-gutter);padding-right:var(--house-gutter)}
.wrap{padding-bottom:140px}
.ti{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}


header.top{background:var(--frame);color:var(--frame-ink);position:sticky;top:0;z-index:20}
header h1 .dot{background:var(--ljr-5)}
.live{font-size:var(--fs-small);font-weight:600;border:1px solid var(--frame-line);border-radius:var(--radius);padding:0 8px;height:24px;display:inline-flex;align-items:center;white-space:nowrap;color:var(--frame-ink)}
.live.ok{border-color:var(--ljr-5)}.live.bad{border-color:var(--ljr-2)}
header .btn{color:var(--frame-ink);background:transparent;border-color:var(--frame-line)}
@media (hover:hover){header .btn:hover{outline:1px solid var(--frame-ink);outline-offset:-1px}}
header .btn:focus-visible{outline: 1px solid var(--frame-ink);outline-offset: -1px}
.backhome{text-decoration:none}

html.dash-locked header .backhome{color:var(--ink);border-color:var(--press)}


@media (max-width:544px){ .wrap{padding-bottom:170px} }


h2{font-size:var(--fs-head);margin:24px 0 4px;line-height:1.3}
h3{font-size:var(--fs-head);margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:var(--fs-body);margin:0 0 16px;max-width:74ch}
.mut{color:var(--muted);font-size:var(--fs-small)}
.note{font-size:var(--fs-small);color:var(--muted);margin:8px 0 12px}
code{font-family:inherit;font-size:var(--fs-small);font-variant-numeric:tabular-nums;background:transparent;padding:0}


.card{margin:0 0 12px;box-shadow:var(--shadow)}
.card.dash{border-style:dashed}
.card h4,.card .hx4{margin:0 0 12px;font-size:var(--fs-head);font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:0;line-height:1.4}
.card p{margin:0 0 8px;font-size:var(--fs-body)}.card p:last-child{margin-bottom:0}

.card.acc2>:is(h4,.hx4):first-child::before,.card.acc5>:is(h4,.hx4):first-child::before{content:"";width:10px;height:10px;border-radius:50%;flex:none;border:1px solid var(--ljr-2);background:var(--ljr-2-tint)}
.card.acc5>:is(h4,.hx4):first-child::before{border-color:var(--ljr-5);background:var(--ljr-5-tint)}
.card .card{box-shadow:none}


.btn,.cb,.ci,.tl,.next button,.sfb,.achip,#main button:not(.tile):not(.ttl):not(.rdel),.filt select,.fpanel select,.filt input,.sbox,.sortsel,.tmp input,#rdate{
 font-family:inherit;font-size:var(--fs-small);font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--press);border-radius:var(--radius);
 min-height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none;box-sizing:border-box;line-height:1.2}
.filt input,.sbox input,.tmp input,#rdate{font-weight:400;cursor:text}
.filt select,.fpanel select,.sortsel{padding:0 10px}
.btn[disabled],#main button[disabled]{cursor:not-allowed;opacity:.6}
@media (hover:hover){.filt select:hover, .fpanel select:hover {outline:1px solid var(--sel-bd);outline-offset:-1px;background:var(--hov-fill)}
.btn:hover, .cb:hover, .ci:hover, .tl:hover, .next button:hover, .sfb:hover, .achip:hover, #main button:not(.tile):not(.ttl):hover, .sortsel:hover, .mrow.go:hover {outline:1px solid var(--sel-bd);outline-offset:-1px;}}
.tile.tl:hover,.ci:hover{border-color:var(--press)}
.sfb[aria-pressed="true"],.fbtn[aria-expanded="true"]{outline:1px solid var(--sel-bd);outline-offset:-1px;}
.sfb[aria-pressed="true"]::after{content:"\2713";margin-left:2px}


@media (hover:hover){.btn.yes:hover{outline-color:var(--house-ok);}.btn.no:hover{outline-color:var(--house-risk);}}
.dc .nl .st{border:0;padding:0;height:auto;font-size:var(--fs-small)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
:focus-visible{outline: 1px solid var(--ink)!important;outline-offset: -1px}
/* Typing boxes: one 1px line inside the rounded box; focus recolours that line. Never a second square ring. */
:is(input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),select,textarea):is(:focus,:focus-visible){outline:none!important;border-color:var(--ink)}
.sbox input:is(:focus,:focus-visible){outline:none!important}
.sbox:focus-within{border-color:var(--ink)}
@media (max-width:544px){.btn,.cb,.ci,.tl,.next button,.sfb,.achip,#main button:not(.tile):not(.ttl):not(.rdel),.filt select,.fpanel select,.filt input,.sbox,.sortsel,.tmp input,#rdate{min-height:44px}}


.pill{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--radius);font-size:var(--fs-small);font-weight:600;border:1px solid var(--press);white-space:nowrap;color:var(--ink);background:transparent;vertical-align:middle}
.pill.ok{border-color:var(--ljr-5-text);box-sizing:border-box;width:var(--house-count-w);padding:0 var(--house-count-pad);line-height:var(--house-count-lh);justify-content:center;flex:none}
.pill.no{border-color:var(--ljr-2);background:var(--ljr-2-tint)}
.pill.w{border-color:var(--ljr-3-text);background:var(--ljr-3-tint)}
.pill.i{border-color:var(--press)}

.cnt{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:var(--house-count-w);height:var(--house-count-h);padding:0 var(--house-count-pad);border-radius:var(--house-count-r);border:1px solid var(--ink);font-size:var(--fs-small);font-weight:600;line-height:var(--house-count-lh);white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink);background:transparent;flex:none}
.cnt.wide{width:auto;min-width:30px;padding:0 6px}
.cnt.need{border-color:var(--ljr-2);background:transparent}
.cnt.ok{border-color:transparent}
.card h4 .cnt,.card .hx4 .cnt,.mcard h3 .cnt{margin-left:auto}

.dpill{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1px solid var(--press);border-radius:var(--radius);font-size:var(--fs-small);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.dpill.late{border-color:var(--ljr-2);background:var(--ljr-2-tint)}
.dpill.soon{border-color:var(--ljr-3-text);background:var(--ljr-3-tint)}
.pill:hover,.cnt:hover,.dpill:hover,.live:hover{outline:none}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,var(--ljr-0));flex:none;vertical-align:0}
.info{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid var(--press);border-radius:var(--radius);font-size:var(--fs-small);font-weight:600;color:var(--muted);cursor:help;vertical-align:middle}


.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0 0 12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;text-align:left;font:inherit;color:var(--ink);min-width:0}
.tile .n{font-size:var(--fs-figure);font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .k{font-size:var(--fs-small);font-weight:600;margin-top:2px}
.tile .src{font-size:var(--fs-small);color:var(--muted);margin-top:4px;line-height:1.4}
button.tile{cursor:pointer;border-color:var(--press);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;width:100%}
@media (hover:hover){button.tile:hover{outline:1px solid var(--sel-bd);outline-offset:-1px;}}


.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-small)}
th{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}


.filt,.srow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.filt input{min-width:190px}
.fbar{position:relative;margin:0 0 12px}
.fbar .srow{margin:0}
.sbox{flex:1 1 220px;max-width:420px;padding:0 12px;cursor:text}
.sbox input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--ink);font:inherit;font-size:var(--fs-body);font-weight:400;padding:6px 0}
.sbox .ti{color:var(--muted)}
.sbox:focus-within{border-color:var(--ink)}
.fpanel{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.fgrp{display:flex;flex-direction:column;gap:4px;min-width:150px}
.flab{font-size:var(--fs-small);font-weight:600;color:var(--muted)}
.achips{display:contents}
.achip .ti{width:14px;height:14px}


.three{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.three .sum{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:8px 14px 8px 8px;font-weight:600}

.three .sum .big{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:auto;min-width:var(--house-count-w);height:var(--house-count-h);line-height:var(--house-count-lh);padding:0 var(--house-count-pad);border-radius:var(--house-count-r);font-size:var(--fs-small);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;background:transparent;border:1px solid var(--house-ring)}
.three .sum.over .big{border-color:var(--house-late)}
.three .sum .big.zero{border-color:transparent}
.mecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start;margin:0 0 12px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.mcard h3{margin:0 0 4px;font-size:var(--fs-head);display:flex;align-items:center;gap:8px}
.mcard h3 .ti{color:var(--muted)}
@media (hover:hover){.mcard:hover h3 .ti{color:var(--hc,var(--muted))}}
.mcard.nextc{border-color:var(--ink);background:linear-gradient(var(--ljr-6-tint),var(--ljr-6-tint)) var(--card)}
.mcard.nextc .bline{font-size:var(--fs-small);font-weight:600;color:var(--muted)}
.mcard.nextc .t{font-size:var(--fs-head);font-weight:600;margin:2px 0 4px;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.mcard.nextc .sub{margin:0 0 12px;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
.mcard .big{font-size:var(--fs-figure);font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;min-width:0}
.mcard h3+.mrow,.mcard .mrow:first-of-type{border-top:0;padding-top:16px}
.mrow .t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}

#sopcard .mrow,#sopcard .mrow:first-child{border:1px solid var(--line);box-shadow:none;border-radius:var(--radius);background:var(--card);padding:0;margin:0 0 8px}
@media (hover:hover){#sopcard .mrow:has(.sopopen:hover){border-color:var(--sel-bd)}}
#sopcard .mrow .sopopen:hover,#sopcard .mrow .sopopen:focus,#sopcard .mrow .sopopen:focus-visible{outline:none!important}
#sopcard .mrow:has(.sopopen:focus-visible){border-color:var(--ink)}
/* The card is the frame. The button is the words inside it, so it is not a second one-line control. */
#main #sopcard button.sopopen{background:transparent;border:0;border-radius:0;box-shadow:none;min-height:44px;height:auto;padding:10px 12px;width:100%;min-width:0;display:flex;align-items:flex-start;text-align:left;cursor:pointer;color:inherit;font-weight:600}
#sopcard .sopopen .t{display:flex;flex-direction:column;align-items:flex-start;gap:2px;white-space:normal;overflow:visible;-webkit-line-clamp:unset;line-clamp:unset}
#sopcard .sopopen .t .n{font-size:var(--fs-small);font-weight:600;line-height:1.2}
#sopcard .sopopen .t small{display:block;font-size:var(--fs-small);font-weight:400;line-height:1.2;color:var(--ink)}
#sopcard .mrow .mut{flex:0 1 11em;overflow-wrap:anywhere}
#sopcard .mrow .cb{flex:none;padding:0 10px}
#sopcard .mrow:has(.sopopen){flex-wrap:wrap}
#sopcard .sopopen{flex:1 1 100%}
.sopsigns{display:inline-flex;align-items:center;gap:4px;flex:none;font-size:var(--fs-small);font-weight:600}
.sopsigns .ti{width:18px;height:18px}
.sopbody{margin:0 0 12px;padding:4px 0 4px 12px;border-left:3px solid var(--hc,var(--line));border-radius:var(--radius);overflow-wrap:anywhere}
.sopbody p,.sopbody ol,.sopbody ul{margin:6px 0}
.sopbody ol,.sopbody ul{padding-left:20px}
.sopbody .sopmeta{display:flex;align-items:center;gap:6px;font-size:var(--fs-small);color:var(--muted);margin:4px 0}
.sopbody .sopmeta .ti{width:18px;height:18px}
.sopbody ul.soplinks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;padding:0;list-style:none}
.soplink{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius);color:inherit;font-size:var(--fs-small);font-weight:600;text-decoration:none}
.soplink .ti{width:18px;height:18px}
.soplink.none{color:var(--muted);font-weight:400}
.sopsec{border-top:1px solid var(--line)}
.sopsec>summary{min-height:44px;display:flex;align-items:center;gap:6px;font-weight:600;cursor:pointer}
.sopsec>summary .n{color:var(--muted);font-weight:400;font-size:var(--fs-small)}

.atype-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,148px),1fr));gap:8px;margin:0;padding:0;list-style:none}
.atype{display:flex;align-items:center;gap:8px;min-width:0;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:transparent}
.atype .ti{width:22px;height:22px;color:var(--ink)}
.atype-lab{font-size:var(--fs-small);font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.atype-row{display:inline-flex;align-items:center;gap:4px;flex:none;max-width:11em;font-size:var(--fs-small);font-weight:600;color:var(--ink)}
.atype-row .ti{width:18px;height:18px}
#sopformats .mut{display:block;margin:0 0 8px}
.mrow .t small{display:block;color:var(--muted);font-size:var(--fs-small);font-weight:400;margin-top:2px}
.mrow .ic{width:12px;height:12px;flex:none;border-radius:50%;border:1px solid var(--press)}
.mrow .ic.late{border-color:var(--ljr-2);background:var(--ljr-2-tint)}
.mrow .ic.soon{border-color:var(--ljr-3);background:var(--ljr-3-tint)}
.mrow .ic.ok{border-color:var(--ljr-5);background:var(--ljr-5-tint)}
.mrow .ic.cold{border-color:var(--ljr-6);background:var(--ljr-6-tint)}
#kept-readings .kt{width:100%;border-collapse:collapse}#kept-readings th,#kept-readings td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--press)}
#kept-readings .ic{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid var(--press)}
#kept-readings .ic.ok{border-color:var(--ljr-5);background:var(--ljr-5-tint)}#kept-readings .ic.cold{border-color:var(--ljr-6);background:var(--ljr-6-tint)}#kept-readings .ic.late{border-color:var(--ljr-2);background:var(--ljr-2-tint)}
.mrow .v{font-weight:600;font-variant-numeric:tabular-nums}

.wk{display:grid;grid-template-columns:repeat(6,1fr);gap:0;width:100%;min-width:0;max-width:100%;margin-top:4px;padding:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.wkday{box-sizing:border-box;padding:6px 4px;border-right:1px solid var(--line);background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.wkday:last-child{border-right:none}
.wkday .wd{font-size:var(--fs-small);font-weight:400;color:var(--muted);line-height:1.3}
.wkday .wdate{font-size:var(--fs-small);font-weight:600;color:var(--ink);line-height:1.2}
.wkday .wt{font-size:var(--fs-base);font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.wkday .wb,.wkday .wr,.wkday .ww{font-size:var(--fs-small);font-weight:600;line-height:1.3}
.wkday .ic{display:inline-block;width:14px;height:14px;margin-right:0;border-radius:50%;border:1px solid var(--press);vertical-align:-1px;background:transparent}
.wkday .ic.cold{border-color:var(--ljr-6);background:var(--ljr-6-tint)}
.wkday .ic.ok{border-color:var(--ljr-5);background:var(--ljr-5-tint)}
.wkday .ic.hot{border-color:var(--ljr-2);background:var(--ljr-2-tint)}
.wkday .wr{line-height:1;display:flex;align-items:center;justify-content:center;gap:2px}
.wkday .wr svg{display:block}
.wr-light svg{fill:var(--ljr-6);opacity:0.45}
.wr-wet svg{fill:var(--ljr-6);opacity:1}
.wkday .ww{line-height:1;display:flex;align-items:center;justify-content:center;gap:2px}
.wkday .ww svg{display:block;stroke:var(--muted);fill:none}
.wkday .wdet{font-size:var(--fs-small);font-weight:400;color:var(--muted);line-height:1}

function parseCSV(text){
  text=unesc(text).replace(/[ \t]+\n/g,'\n').replace(/\r/g,'');
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f.replace(/\s+$/,'')); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f.replace(/\s+$/,'')); rows.push(row); }
  rows=rows.filter(function(r){ return r.length>1 || (r[0]||'').trim()!==''; });
  if(!rows.length) return [];
  var head=rows[0].map(function(h){return h.trim();});
  return rows.slice(1).map(function(r){ var o={}; head.forEach(function(h,i){o[h]=(r[i]==null?'':r[i]).trim();}); return o; });
}

var READ_AT_ONCE=6;
function readPool(items,limit,fn){
  var next=0, running=0;
  return new Promise(function(resolve){
    if(!items.length){ resolve(); return; }
    function kick(){
      while(running<limit && next<items.length){
        running++;
        (function(item){
          Promise.resolve().then(function(){ return fn(item); }).then(done, done);
        })(items[next++]);
      }
    }
    function done(){
      running--;
      if(next>=items.length && running===0) resolve();
      else kick();
    }
    kick();
  });
}

/* foundation: checklist instance for today's round. Each line is a check on the round's places (✓ done / ✗ not yet),

function todayChecklist(date,unplacedN){
 var A=CD.areas||[], N=A.length;
 var has=function(slot){ return A.filter(function(a){ var t=(ROUND[roundKey(date,a.id)]||{})['t_'+slot]; return t&&(t.min||t.max); }).length; };
 var am=has('am'), pm=has('pm'), modes=A.filter(function(a){ var r=ROUND[roundKey(date,a.id)]||{}; return r.access||accessOf(a.id); }).length;
 var over=A.filter(function(a){ var acc=(ROUND[roundKey(date,a.id)]||{}).access||accessOf(a.id); return roomCheck(a.id,inCabin(a.id,date),acc).status==='over'; }).length;
 var c=counts();
 var L=[
  [!unplacedN,'Every dog on site is in a cabin',unplacedN?unplacedN+' not yet placed':'all placed'],
  [N>0&&am===N,'Morning temperature in every cabin',am+' of '+N+' cabins'],
  [N>0&&pm===N,'Evening temperature in every cabin',pm+' of '+N+' cabins'],
  [N>0&&modes===N,'Every cabin has its flap mode',modes+' of '+N+' chosen'],
  [!over,'No cabin over its headcount',over?over+' over':'all within'],
  [c.bitches.length===c.active.length,'Licence counts agree','law '+c.bitches.length+', your list '+c.active.length]];
 var done=L.filter(function(x){return x[0];}).length;
 return '<section class="mcard" id="todayChecklist" style="--hc:var(--ljr-4-icon);margin-bottom:12px"><h3><svg class="ti" aria-hidden="true"><use href="#i-list-check"/></svg>Today checklist<span class="mut" style="margin-left:auto;font-weight:400">'+done+' of '+L.length+' done</span></h3>'
  +L.map(function(x){ return '<div class="mrow ckrow"><span class="mk'+(x[0]?'':' bad')+'" aria-hidden="true">'+(x[0]?'✓':'✗')+'</span>'
    +'<span class="t">'+esc(x[1])+'<span class="sr">'+(x[0]?' done':' not done')+'</span><small>'+esc(x[2])+'</small></span></div>'; }).join('')
  +'<div class="mfoot"><span class="mut"></span><button type="button" class="btn" data-go="round">The round</button></div></section>';
}

async function saveMed(evt,dogId,nameSlug,form){
 evt.preventDefault();
 var btn=form.querySelector('button[type=submit]');
 if(!window.TOKEN){btn.textContent='no auth';return false;}
 btn.textContent='saving…';btn.disabled=true;
 var fields={given_on:form.on.value,product:form.product.value,dose_volume:form.dose.value,
   route:form.route.value,note:form.note.value,subject_id:'sub-'+nameSlug,source:'dashboard'};
 try{
  var fileId=window._driveIds&&window._driveIds['BLD-dispense.csv'];
  if(!fileId){btn.textContent='no file';btn.disabled=false;return false;}
  var existing=await fetch('https://www.googleapis.com/drive/v3/files/'+fileId+'?alt=media&supportsAllDrives=true',
    {headers:{Authorization:'Bearer '+window.TOKEN}}).then(function(r){return r.text();});
  var lines=existing.trimEnd().split('\n');
  var cols=lines[0].split(',').map(function(c){return c.replace(/^"|"$/g,'').trim();});
  function csvVal(v){v=String(v===undefined||v===null?'':v);return(v.indexOf(',')>=0||v.indexOf('"')>=0||v.indexOf('\n')>=0)?'"'+v.replace(/"/g,'""')+'"':v;}
  var row=cols.map(function(c){return csvVal(fields[c]);}).join(',');
  var updated=existing.trimEnd()+'\n'+row;
  var boundary='cdhub_bnd';
  var meta=JSON.stringify({name:'BLD-dispense.csv',mimeType:'text/csv'});
  var body='--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+meta+'\r\n--'+boundary+'\r\nContent-Type: text/csv\r\n\r\n'+updated+'\r\n--'+boundary+'--';
  var res=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+fileId+'?uploadType=multipart&supportsAllDrives=true',
    {method:'PATCH',headers:{Authorization:'Bearer '+window.TOKEN,'Content-Type':'multipart/related; boundary="'+boundary+'"'},body:body});
  if(res.ok){btn.textContent='saved ✓';btn.disabled=true;}
  else{btn.textContent='error';btn.disabled=false;}
 }catch(e){btn.textContent='error';btn.disabled=false;}
 return false;
}

 round:['route','Round',4],dogs:['paw','Dogs',5],areas:['building-cottage','Areas',3],litters:['baby-carriage','Litters',7],
 vet:['stethoscope','Vet',5],buyers:['world','Assocs',6],sops:['clipboard','SOPs',6],compliance:['list-check','Compliance',2]};
function cntPill(n,cls){ return '<span class="cnt'+(String(n).length>2?' wide':'')+(cls?' '+cls:'')+'">'+(n===0||n==='0'?'':n)+'</span>'; }
var TABS=[['map','Main',1,'main'],['work','Do',4,'do'],['today','Today',4,'cal'],['dogs','Dogs',5,'paw'],['sops','SOPs',6,'line']];
var MORE_VIEWS=['compliance','shape','round','areas','litters','vet','buyers'];
function navHtml(){
 var nd=needsToday().length, wait=(CD.work||[]).filter(function(r){return r.status==='BLOCKED' && r.owner==='Lisa';}).length;
 var counts={map:nd,work:wait}, late={map:needsToday().some(function(x){return x.tone==='late';}),work:false};
 return TABS.map(function(t){ var n=counts[t[0]];
   return DashKit.tabs.tab({go:t[0],slot:t[2],icon:'t-'+t[3],label:t[1],count:n?String(n):'',need:!!(n&&late[t[0]])}); }).join('')
  +DashKit.tabs.more('houseMore',MORE_VIEWS.map(function(id){ var m=TABMETA[id];
   return '<button type="button" data-go="'+id+'" data-slot="'+m[2]+'"><svg class="ti" aria-hidden="true"><use href="#i-'+m[0]+'"/></svg><span class="htl">'+esc(label(id))+'</span></button>'; }).join(''));
}
function pill(){
 var p=document.getElementById('livepill');
 p.removeAttribute('data-read');
 if(LOAD.state==='ok'){ p.className='live ok';
  if(LOAD.storedAt) p.setAttribute('data-read','Read '+new Date(LOAD.storedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'}));
  var w='live · read-only'+(LOAD.storedAt?' · read '+new Date(LOAD.storedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'}):'');

  p.title=w; p.innerHTML='<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">'+esc(w)+'</span>\u2713'; }
 else if(LOAD.state==='signin'){ p.className='live bad'; p.textContent='signed out'; }
 else if(LOAD.state==='loading'){ p.className='live'; p.textContent='\u2026'; }
 else if(LOAD.state==='ambiguous'){ p.className='live bad'; p.textContent='duplicate file titles'; }
 else if(LOAD.state==='err'){ p.className='live bad'; p.textContent='read failed'; }
}


function labelControls(root){
 Array.prototype.forEach.call(root.querySelectorAll('select,input'),function(el){
  if(el.getAttribute('aria-label')||(el.id&&root.querySelector('label[for="'+el.id+'"]'))||el.closest('label')) return;
  if(el.type==='hidden'||el.type==='checkbox'||el.type==='radio') return;
  var t=el.tagName==='SELECT'?((el.options[0]&&el.options[0].value==='')?el.options[0].textContent:''):(el.placeholder||'');
  t=(t||el.name||el.id||'choose').replace(/\u2026|\.\.\.$/g,'').trim();
  var card=el.dataset.area&&el.closest('.card,section,li,tr'), h=card&&card.querySelector('h4,.hx4,b,strong');
  if(h&&h.textContent.trim()) t+=' \u2013 '+h.textContent.trim();
  el.setAttribute('aria-label',t);
 });
}
function render(){ go((location.hash||'#/map').replace('#/',''),false); }


function levelHeadings(root){
 var seen3=false;
 Array.prototype.slice.call(root.querySelectorAll('h1,h2,h3,h4')).forEach(function(h){
  var t=h.tagName;
  if(t==='H1'||t==='H2'){ seen3=false; return; }
  if(t==='H3'){ seen3=true; return; }
  if(seen3) return;
  var n=document.createElement('h3');
  Array.prototype.forEach.call(h.attributes,function(a){ n.setAttribute(a.name,a.value); });
  n.classList.add('hx4');
  while(h.firstChild) n.appendChild(h.firstChild);
  h.parentNode.replaceChild(n,h);
 });
}


function focusView(){
 var h=document.querySelector('#main h2')||document.querySelector('#main h3,#main h4');
 if(!h) return;
 h.setAttribute('tabindex','-1');
 h.focus({preventScroll:true});
}

function cdIn(on){ document.documentElement.classList.toggle('cd-in',on); ['cdRefresh','cdSignout'].forEach(function(id){ document.getElementById(id).classList.toggle('hidden',!on); }); }
function go(id,push){
 pill();
 var full=String(id||''), sub=null, m=/^(\w+)\/(\w+)$/.exec(full);
 if(m){ id=m[1]; sub=m[2]; }
 var main=document.getElementById('main');
 if(LOAD.state==='signin'){
  main.innerHTML='<div class="card acc4" style="margin-top:24px"><h2 class="hx4">Sign in to see the tables</h2>'
   +'<ul class="notes"><li>Read-only. One sign-in for the whole site.</li></ul>'
   +(LOAD.err?'<p class="mut">'+esc(LOAD.err)+'</p>':'')
   +'<p style="margin-bottom:0"><button id="signinbtn" data-signin="1"'+(auth.ready()?'':' disabled')+'>'+(auth.ready()?'Sign in with Google':'Loading Google sign-in\u2026')+'</button></p></div>';
  document.getElementById('nav').innerHTML=''; cdIn(false); return;
 }
 if(LOAD.state==='loading'){ return; }
 if(LOAD.state!=='ok'){

  main.innerHTML='<div style="margin-top:24px"><h2 class="sr">Main</h2>'+DashKit.hubMain({hub:'cdhub',error:(LOAD.state==='ambiguous'?'More than one file shares a title. Refusing to guess which is current: '+(LOAD.err||'')
     :LOAD.state==='err'?'The folder could not be read. '+(LOAD.err||'')+'.'
     :'Getting things ready. Nothing is stored in this page, so there is nothing to show yet.'),nums:mainNums(false),doHref:'#/work'})

 main.innerHTML=PAGES[id]();
 Array.prototype.forEach.call(document.querySelectorAll('#nav [data-go]'),function(b){ if(b.dataset.go===id) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
 labelControls(main);
 levelHeadings(main);
 document.getElementById('next').innerHTML=(NEXT[id]||[]).map(function(n){return '<button data-go="'+n+'">Next: '+label(n)+' →</button>';}).join('');
 if(id==='compliance') bindCompliance();
 if(id==='dogs'){
  var fst=document.getElementById('fst');
  STATUS.forEach(function(x){ var o=document.createElement('option'); o.value=x[0]; o.textContent=x[1]; fst.appendChild(o); });
  var cs={}; CD.dogs.forEach(function(d){ if(d.colour) cs[colourLabel(d)]=d; });
  var fc=document.getElementById('fc');
  Object.keys(cs).sort(function(a,b){ var ka=colourKey(cs[a]),kb=colourKey(cs[b]);
   for(var i=0;i<ka.length;i++){ if(ka[i]!==kb[i]) return ka[i]-kb[i]; } return a<b?-1:1; })
   .forEach(function(k){ var o=document.createElement('option'); o.textContent=k; fc.appendChild(o); });
  var ts={}; CD.dogs.forEach(function(d){ d.findings.forEach(function(f){ts[f.test]=1;}); });
  var ft=document.getElementById('ft');
  Object.keys(ts).sort().forEach(function(t){ var o=document.createElement('option'); o.textContent=t; ft.appendChild(o); });
  Array.prototype.forEach.call(document.querySelectorAll('.sfb'),function(b){
   b.addEventListener('click',function(){ var f=document.getElementById('fst');
    f.value=(f.value===b.dataset.code)?'':b.dataset.code;
    Array.prototype.forEach.call(document.querySelectorAll('.sfb'),function(x){
      x.setAttribute('aria-pressed', x.dataset.code===f.value ? 'true':'false'); });
    drawDogs(); }); });
  document.getElementById('rows').addEventListener('click',function(ev){
   var el=ev.target&&ev.target.closest?ev.target.closest('.wtc'):null; if(!el||!el.dataset.dog) return;
   if(el.classList.contains('trc')) showTreats(el.dataset.dog); else showWeights(el.dataset.dog);
   var wp=document.getElementById('wpanel'); if(wp&&wp.scrollIntoView) wp.scrollIntoView({behavior:'smooth',block:'start'}); });
  ['q','fs','fn','fa','fst','fc','ft','dsort'].forEach(function(i){ var e=document.getElementById(i); if(!e) return; e.addEventListener('input',drawDogs); if(i!=='q') e.addEventListener('change',drawDogs); });
  document.getElementById('clr').addEventListener('click',function(){ ['q','fs','fn','fa','fst','fc','ft'].forEach(function(i){document.getElementById(i).value='';});
   Array.prototype.forEach.call(document.querySelectorAll('.sfb'),function(x){ x.setAttribute('aria-pressed',x.dataset.code===''?'true':'false'); }); drawDogs(); });
  drawDogs();
 }
 if(id==='litters'){
  var ys={},ss={},dm={},sr={};
  CD.litters.forEach(function(l){ if(l.dob) ys[l.dob.slice(0,4)]=1; if(l.status) ss[l.status]=1;
   if(l.dam_subject_id) dm[l.dam_subject_id]=1; if(l.sire_subject_id) sr[l.sire_subject_id]=1; });
  var add=function(sel,keys,lab){ var e=document.getElementById(sel); if(!e) return;
   keys.forEach(function(k){ var o=document.createElement('option'); o.value=k; o.textContent=lab?lab(k):k; e.appendChild(o); }); };

  add('lp',Object.keys(sr).sort(function(x,y){return nameOf(x)<nameOf(y)?-1:1;}),nameOf);
  ['lq','ld','ly','ls','lm','lp','lk','lsort'].forEach(function(i){ var e=document.getElementById(i); if(!e) return; e.addEventListener('input',drawLitters); if(i!=='lq') e.addEventListener('change',drawLitters); });
  document.getElementById('lclr').addEventListener('click',function(){ ['lq','ld','ly','ls','lm','lp','lk'].forEach(function(i){var e=document.getElementById(i); if(e) e.value='';}); drawLitters(); });
  drawLitters();
 }
 if(id==='today'){

 if(id==='sops'){

   drawSops();

  });

 }
 if(id==='buyers'){
  ['bq','bcat','bctry','bapp','bsig','bmd','bem','bch','bsort'].forEach(function(i){ var e=document.getElementById(i);
    if(e){ e.addEventListener('input',drawBuyers); e.addEventListener('change',drawBuyers); } });
  var bc=document.getElementById('bclr');
  if(bc) bc.addEventListener('click',function(){ ['bq','bcat','bctry','bapp','bsig','bmd','bem','bch'].forEach(function(i){
    var e=document.getElementById(i); if(e) e.value=''; }); drawBuyers(); });
  drawBuyers();
 }
 if(id==='areas'){
  Array.prototype.forEach.call(document.querySelectorAll('.aacc'),function(el){
   el.addEventListener('change',function(){
    var msg=document.querySelector('.asave[data-area="'+el.dataset.area+'"]');
    accessSave(el.dataset.area,el.value,msg); }); });
 }
 if(id==='round'){

  Array.prototype.forEach.call(document.querySelectorAll('.racc'),function(el){
   el.addEventListener('change',function(){
    var msg=document.querySelector('.rsave[data-area="'+el.dataset.area+'"]');
    roundSave(el.dataset.area,{access:el.value},msg); }); });
  Array.prototype.forEach.call(document.querySelectorAll('.radd'),function(el){
   el.addEventListener('change',function(){
    if(!el.value) return;
    var msg=document.querySelector('.rsave[data-area="'+el.dataset.area+'"]');
    roundSave(el.dataset.area,{add:el.value},msg); }); });
  var sOn=document.getElementById('sinkon'), sOff=document.getElementById('sinkoff');
  if(sOn) sOn.addEventListener('click',function(){
   var u=(document.getElementById('sinkurl').value||'').trim(), c=document.getElementById('sinkcode').value||'', m=document.getElementById('sinkmsg');
   if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u)){ m.textContent='That is not a save script address (it ends in /exec).'; return; }
   if(c&&c.indexOf('\u2022')<0) sinkSet(SINK_CODE_KEY,c);
   if(!sinkGet(SINK_CODE_KEY)){ m.textContent='Type your staff code too.'; return; }
   if(!sinkSet(SINK_URL_KEY,u)){ m.textContent='This browser will not keep it (private window?).'; return; }
   go('round',false); });
  if(sOff) sOff.addEventListener('click',function(){ sinkSet(SINK_URL_KEY,''); sinkSet(SINK_CODE_KEY,''); go('round',false); });
  Array.prototype.forEach.call(document.querySelectorAll('.tmin, .tmax'),function(el){
   var which=(el.className.indexOf('tmin')>=0)?'min':'max';
   var msg=document.querySelector('.tmsg[data-area="'+el.dataset.area+'"][data-slot="'+el.dataset.slot+'"]');
   var h=function(){ tempSave(el.dataset.area,el.dataset.slot,which,el.value,el,msg); };
   el.addEventListener('change',h); el.addEventListener('blur',h); });
  Array.prototype.forEach.call(document.querySelectorAll('.rdel'),function(el){
   el.addEventListener('click',function(){
    var k=roundKey(CD._roundDate||todayISO(),el.dataset.area);
    var cur=((ROUND[k]||{}).subjects||[]).filter(function(x){return x!==el.dataset.sub;});
    var msg=document.querySelector('.rsave[data-area="'+el.dataset.area+'"]');
    roundSave(el.dataset.area,{subjects:cur},msg); }); });
 }
 var at=sub&&id==='today'?full:id;
 if(push!==false && location.hash!=='#/'+at) history.pushState({id:at},'','#/'+at);
 window.scrollTo(0,0);
}

});

document.addEventListener('click',function(e){ var k=e.target.closest&&e.target.closest('[data-skip]'); if(!k) return; e.preventDefault(); var m=document.getElementById(k.dataset.skip); if(m){ m.setAttribute('tabindex','-1'); m.focus(); } });
document.addEventListener('click',function(e){
 var b=e.target.closest&&e.target.closest('[data-dogshow],[data-unshow]'); if(!b) return;
 if(b.getAttribute('data-dogshow')){
  if(b.getAttribute('data-dogshow')==='all') dogShown='all';
  else if(dogShown!=='all') dogShown=(typeof dogShown==='number'?dogShown:300)+300;
  drawDogs();
 } else {
  if(b.getAttribute('data-unshow')==='all') unplacedShown='all';
  else if(unplacedShown!=='all') unplacedShown=(typeof unplacedShown==='number'?unplacedShown:40)+40;

 }
});

document.addEventListener('click',function(e){

 if(f){ var p=document.getElementById(f.dataset.fpanel); if(p){ var open=p.classList.contains('hidden'); p.classList.toggle('hidden',!open); f.setAttribute('aria-expanded',String(open)); } return; }

 if(c){ var el=document.getElementById(c.dataset.fclear); if(el){ el.value=''; el.dispatchEvent(new Event('change')); }
   if(c.dataset.fclear==='fst') Array.prototype.forEach.call(document.querySelectorAll('.sfb'),function(x){ x.setAttribute('aria-pressed',x.dataset.code===''?'true':'false'); }); }
});
document.addEventListener('click',function(e){ var t=e.target.closest&&e.target.closest('[data-signin],[data-signout],[data-reload]'); if(!t||t.disabled) return;
 if(t.dataset.signin) signIn(); else if(t.dataset.signout) signOut();
 else if(t.dataset.reload){ if(TOKEN&&Date.now()<TOKEN_EXP) load(); else auth.requestSilent(); } });

DashKit.search.register(function(q){
 if(LOAD.state!=='ok') return [];
 var hit=DashKit.search.matches(q), out=[], byId=CD._byId||{};
 (CD.dogs||[]).filter(function(d){ return hit([d.name,d.id,d.chip,d.breed].join(' ')); }).slice(0,12).forEach(function(d){
  out.push({group:'CD Hub dogs',slot:5,title:d.name||d.id,sub:[d.sex,d.dob,d.chip?'chip '+d.chip:''].filter(Boolean).join(' · '),
   act:function(){ go('dogs'); var b=document.getElementById('q'); if(b){ b.value=d.name||d.id; b.dispatchEvent(new Event('input')); } focusView(); }});
 });
 (CD.litters||[]).filter(function(l){ var dam=byId[l.dam_subject_id], sire=byId[l.sire_subject_id];
   return hit([l.id,l.born_on,dam&&dam.name,sire&&sire.name].join(' ')); }).slice(0,8).forEach(function(l){
  var dam=byId[l.dam_subject_id];
  out.push({group:'CD Hub litters',slot:5,title:'Litter '+(l.born_on||l.id)+(dam?' · '+dam.name:''),sub:l.id,act:function(){ go('litters'); focusView(); }});
 });
 return out;
});

window.addEventListener('popstate',followHash);
window.addEventListener('hashchange',followHash);
render();
</script>
<script>
/* Calm: every help bullet list (ul.notes) becomes one (i); its words show on hover or tap. */
(function () {
  function calm() {
    document.querySelectorAll('ul.notes:not([data-calm])').forEach(function (ul) {
      var t = Array.prototype.map.call(ul.querySelectorAll('li'), function (li) { return li.textContent.trim(); }).join(' · ');
      var s = document.createElement('span'); s.className = 'info'; s.title = t; s.setAttribute('tabindex', '0'); s.textContent = 'i';
      var h = document.createElement('span'); h.textContent = ' ' + t; h.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap'; s.appendChild(h);
      ul.setAttribute('data-calm', '1'); ul.replaceWith(s);
    });
  }
  new MutationObserver(calm).observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener('DOMContentLoaded', calm); calm();
})();
</script>
