<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CD Hub</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#2C2C2A">
<script src="../config.js"></script>
<script src="../toolkit.js"></script>
<script src="../auth.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* Look: read Studio's saved choice ('dash-look', read only; this page never writes it). Background, Selected, Text, Spacing, Mode. */
(function(){ var o={}; try{ o=JSON.parse(localStorage.getItem('dash-look')||'{}')||{}; }catch(e){ o={}; }
 var r=document.documentElement, c=r.classList;
 c.toggle('look-cool',o.bg==='cool'); c.toggle('sel-soft',o.sel==='soft');
 c.toggle('text-lg',o.text==='lg'); c.toggle('text-xl',o.text==='xl'); c.toggle('space-roomy',o.space==='roomy');
 if(o.mode==='light'||o.mode==='dark') r.setAttribute('data-theme',o.mode); })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../house.css">
<style>
/* ==== House look (Master design rules, LINKS-COMFORT-BRIEF v3, 28 Oct 2026; same as Studio).
   Lexend 400/600, nothing under 13px, line height 1.5, no uppercase. 1px lines. Hover AND selected = the same 1px edge
   turns ink (outline over it), nothing moves; keyboard focus 2px ink. ONE radius, 12px (circles only for status dots and
   who rings). No coloured words, no solid colour fills: colour lives in dots, thin bars, 1px rings and light tints.
   Dark frame top and bottom. Greys follow Warm clear (default) or Cool clear, read from Studio's Look ('dash-look', read only).
   Screens are built on generic Bloodline foundation concepts (record, round, check, rule, place, person, document);
   animal-only parts are marked "kit: animal". ==== */
/* Greys, lines, frame, radius, the control line, counts, date pills, tabs and the hover rule: ../tokens.css through ../house.css,
   the same on every hub. CD Hub's own names below: the LJR7 slots, the kit (sex) colours and the old short names. */
:root{--sel-fill:transparent;--hov-fill:var(--hov);
 /* LJR7 slots (tokens.css). --male/--female are kit colours (sex), shown only as dots. */
 --p0:var(--ljr-0);--p2:var(--ljr-2);--p3:var(--ljr-3);--p4:var(--ljr-4);--p5:var(--ljr-5);--p6:var(--ljr-6);--p7:var(--ljr-7);--p8:var(--ljr-8);
 --male:#2E86B0;--male-n:#9CC6DA;--female:#C85C87;--female-n:#EBB6CB;--unk:var(--ljr-0);
 /* old names kept so every rule below reads one set of tokens */
 --fg:var(--ink);--ln:var(--line);--sub:var(--muted);}
:root.sel-soft{--sel-fill:var(--soft);}
html.text-lg body{zoom:1.12}html.text-xl body{zoom:1.25}html.space-roomy body{line-height:1.75}
*{box-sizing:border-box}
h1,h2,h3,h4,b,strong,th{font-weight:600}   /* two weights only: 400 and 600 */
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 Lexend,system-ui,sans-serif;-webkit-text-size-adjust:100%;hyphens:manual}
a{color:inherit;text-underline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}
.wrap,.hin{max-width:1600px;margin:0 auto;padding-left:24px;padding-right:24px}
.wrap{padding-bottom:140px}
@media (max-width:600px){.wrap,.hin{padding-left:16px;padding-right:16px}}
.ti{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}   /* line icons drawn in the page (no icon font) */

/* ---- Frame: dark top bar ---- */
header.top{background:var(--frame);color:var(--frame-ink);position:sticky;top:0;z-index:20}
header h1 .dot{background:var(--ljr-5)}
.live{font-size:13px;font-weight:600;border:1px solid var(--frame-line);border-radius:var(--radius);padding:0 8px;height:24px;display:inline-flex;align-items:center;white-space:nowrap;color:var(--frame-ink)}
.live.ok{border-color:var(--ljr-5)}.live.bad{border-color:var(--ljr-2)}
header .btn{color:var(--frame-ink);background:transparent;border-color:var(--frame-line)}
@media (hover:hover){header .btn:hover{outline:1px solid var(--frame-ink);outline-offset:-1px}}
header .btn:focus-visible{outline:2px solid var(--frame-ink);outline-offset:2px}
.backhome{text-decoration:none}
/* Signed out, the frame is hidden by the sign-in gate and only Dashboard shows, on the page colour: use page ink. */
html.dash-locked header .backhome{color:var(--ink);border-color:var(--press)}

/* ---- Frame: dark bottom tab bar. Light buttons, no ring; hover/selected = the small colour bar above the label widens. ---- */
nav#nav{z-index:20;display:grid;grid-template-columns:repeat(10,minmax(0,1fr)) repeat(2,minmax(0,.75fr));gap:8px;padding:8px 24px calc(10px + env(safe-area-inset-bottom,0px))}
nav#nav:empty{display:none}
/* The tab buttons and their widening colour bar: ../house.css (.house-tabs). */
nav#nav button{font:inherit;font-size:13px}
nav#nav button .ti{color:var(--muted)}
nav#nav button .lab{line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav#nav button .ls{display:none}
nav#nav button.util .bar{visibility:hidden}
nav#nav button:focus-visible{outline:2px solid var(--frame-ink);outline-offset:2px}
nav#nav .cnt{position:absolute;top:6px;right:8px}
@media (max-width:1180px){nav#nav{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:900px){nav#nav button .lf{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}nav#nav button .ls{display:inline}}
@media (max-width:544px){
 nav#nav{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
 nav#nav button.util{display:none}
 nav#nav button{min-height:56px;flex-direction:row;flex-wrap:wrap;align-content:center;gap:2px 4px;padding:4px 2px}
 nav#nav button .ti{order:1}nav#nav .cnt{position:static;order:2}nav#nav button .lab{order:3;flex:0 0 100%}
 .wrap{padding-bottom:170px}
}

/* ---- Type ladder ---- */
h2{font-size:26px;margin:24px 0 4px;line-height:1.3}
h3{font-size:17px;margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:15px;margin:0 0 16px;max-width:74ch}
.mut{color:var(--muted);font-size:14px}
.note{font-size:14px;color:var(--muted);margin:8px 0 12px}
code{font-family:inherit;font-size:14px;font-variant-numeric:tabular-nums;background:transparent;padding:0}

/* ---- Cards: one white panel, 1px line, 12px step; read-only, so nothing happens on hover. ---- */
.card{margin:0 0 12px;box-shadow:var(--shadow)} /* the house card (../house.css): 1px line, 12px inside */
.card.dash{border-style:dashed}
.card h4,.card .hx4{margin:0 0 12px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:0;line-height:1.4}
.card p{margin:0 0 8px;font-size:15px}.card p:last-child{margin-bottom:0}
/* attention / good cards: a small ring dot before the heading, never a coloured stripe */
.card.acc2>:is(h4,.hx4):first-child::before,.card.acc5>:is(h4,.hx4):first-child::before{content:"";width:10px;height:10px;border-radius:50%;flex:none;border:1px solid var(--ljr-2);background:var(--ljr-2-tint)}
.card.acc5>:is(h4,.hx4):first-child::before{border-color:var(--ljr-5);background:var(--ljr-5-tint)}
.card .card{box-shadow:none}

/* ---- Pressables: ONE clear line (--press, 3:1), 1px, 12px, 36px (44px phone), 14px/600; never start ink. ---- */
.btn,.cb,.ci,.tl,.next button,.sfb,.achip,#main button:not(.tile):not(.ttl):not(.rdel),.filt select,.fpanel select,.filt input,.sbox,.sortsel,.tmp input,#rdate{
 font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--press);border-radius:var(--radius);
 min-height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none;box-sizing:border-box;line-height:1.2}
.filt input,.sbox input,.tmp input,#rdate{font-weight:400;cursor:text}
.filt select,.fpanel select,.sortsel{padding:0 10px}
.btn[disabled],#main button[disabled]{cursor:not-allowed;opacity:.6}
@media (hover:hover){.btn:hover,.cb:hover,.ci:hover,.tl:hover,.next button:hover,.sfb:hover,.achip:hover,#main button:not(.tile):not(.ttl):hover,.filt select:hover,.fpanel select:hover,.sortsel:hover,.mrow.go:hover{outline:1px solid var(--sel-bd);outline-offset:-1px;background:var(--hov-fill)}}
.tile.tl:hover,.ci:hover{border-color:var(--press)}
.sfb[aria-pressed="true"],.fbtn[aria-expanded="true"]{outline:1px solid var(--sel-bd);outline-offset:-1px;background:var(--hov-fill)}
.sfb[aria-pressed="true"]::after{content:"\2713";margin-left:2px}
/* Buttons with a meaning colour keep it on hover and when chosen: the same 1px line in that colour inside, plus a pale tint of it. Never ink. */
/* They rest on the same control line as every pressable (house rule); the colour shows on hover. */
@media (hover:hover){.btn.yes:hover{outline-color:var(--house-ok);background:color-mix(in srgb,var(--house-ok) 14%,var(--card))}.btn.no:hover{outline-color:var(--house-risk);background:color-mix(in srgb,var(--house-risk) 14%,var(--card))}}
.dc .nl .st{border:0;padding:0;height:auto;font-size:13px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
:focus-visible{outline:2px solid var(--ink)!important;outline-offset:2px}
@media (max-width:544px){.btn,.cb,.ci,.tl,.next button,.sfb,.achip,#main button:not(.tile):not(.ttl):not(.rdel),.filt select,.fpanel select,.filt input,.sbox,.sortsel,.tmp input,#rdate{min-height:44px}}

/* ---- Read-only pills, counts and dates: small (24px), 1px ring, no hover. ---- */
.pill{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--radius);font-size:13px;font-weight:600;border:1px solid var(--press);white-space:nowrap;color:var(--ink);background:transparent;vertical-align:middle}
.pill.ok{border-color:var(--ljr-5-text)}
.pill.no{border-color:var(--ljr-2);background:var(--ljr-2-tint)}
.pill.w{border-color:var(--ljr-3-text);background:var(--ljr-3-tint)}
.pill.i{border-color:var(--press)}
/* Counts: one fixed box so 1 and 2 digits match; only 3+ digits grow. "Needs you" = rose ring + light tint. */
.cnt{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:30px;height:22px;padding:0 3px;border-radius:11px;border:1px solid var(--ink);font-size:13px;font-weight:600;line-height:20px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink);background:transparent;flex:none}
.cnt.wide{width:auto;min-width:30px;padding:0 6px}
.cnt.need{border-color:var(--ljr-2);background:var(--ljr-2-tint)}
.cnt.ok{border-color:var(--ljr-5-text)}
nav#nav .cnt.need{background:var(--ljr-2-tint)}
.card h4 .cnt,.card .hx4 .cnt,.mcard h3 .cnt{margin-left:auto}
/* Every date pill wears a plain 1px ring; late = rose ring + tint; soon = amber ring + tint. */
.dpill{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1px solid var(--press);border-radius:var(--radius);font-size:13px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.dpill.late{border-color:var(--ljr-2);background:var(--ljr-2-tint)}
.dpill.soon{border-color:var(--ljr-3-text);background:var(--ljr-3-tint)}
.pill:hover,.cnt:hover,.dpill:hover,.live:hover{outline:none}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,var(--ljr-0));flex:none;vertical-align:0}
.info{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid var(--press);border-radius:var(--radius);font-size:13px;font-weight:600;color:var(--muted);cursor:help;vertical-align:middle}

/* ---- Tiles (big numbers). A tile you can press is a pressable; a read-only tile is a plain panel. ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0 0 12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;text-align:left;font:inherit;color:var(--ink);min-width:0}
.tile .n{font-size:28px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .k{font-size:14px;font-weight:600;margin-top:2px}
.tile .src{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
button.tile{cursor:pointer;border-color:var(--press);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;width:100%}
@media (hover:hover){button.tile:hover{outline:1px solid var(--sel-bd);outline-offset:-1px;background:var(--hov-fill)}}

/* ---- Tables ---- */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}

/* ---- One filter row: Search, Filter (panel), Sort, removable chips. ---- */
.filt,.srow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.filt input{min-width:190px}
.fbar{position:relative;margin:0 0 12px}
.fbar .srow{margin:0}
.sbox{flex:1 1 220px;max-width:420px;padding:0 12px;cursor:text}
.sbox input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:400;padding:6px 0}
.sbox .ti{color:var(--muted)}
.sbox:focus-within{border-color:var(--ink)}
.fpanel{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.fgrp{display:flex;flex-direction:column;gap:4px;min-width:150px}
.flab{font-size:13px;font-weight:600;color:var(--muted)}
.achips{display:contents}
.achip .ti{width:14px;height:14px}

/* ---- Calm rows (Needs you today, checklists, cards on Live feed) ---- */
.three{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.three .sum{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:8px 14px 8px 8px;font-weight:600}
.three .sum .big{font-size:24px;min-width:40px;height:40px;display:inline-grid;place-items:center;border-radius:var(--radius);border:1px solid var(--ink);padding:0 8px;font-variant-numeric:tabular-nums}
.three .sum.need .big{border-color:var(--ljr-3);background:var(--ljr-3-tint)}
.three .sum.over .big{border-color:var(--ljr-2);background:var(--ljr-2-tint)}
.mecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start;margin:0 0 12px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.mcard h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.mcard h3 .ti{color:var(--muted)}
@media (hover:hover){.mcard:hover h3 .ti{color:var(--hc,var(--muted))}}
.mcard.nextc{border-color:var(--ink);background:linear-gradient(var(--ljr-6-tint),var(--ljr-6-tint)) var(--card)}
.mcard.nextc .bline{font-size:13px;font-weight:600;color:var(--muted)}
.mcard.nextc .t{font-size:20px;font-weight:600;margin:2px 0 4px;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.mcard.nextc .sub{margin:0 0 12px;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
.mcard .big{font-size:32px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;min-width:0}
.mcard h3+.mrow,.mcard .mrow:first-of-type{border-top:0;padding-top:16px}
.mrow .t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.mrow .t small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:2px}
.mrow .ic{width:12px;height:12px;flex:none;border-radius:50%;border:1px solid var(--press)}
.mrow .ic.late{border-color:var(--ljr-2);background:var(--ljr-2-tint)}
.mrow .ic.soon{border-color:var(--ljr-3);background:var(--ljr-3-tint)}
.mrow .ic.ok{border-color:var(--ljr-5);background:var(--ljr-5-tint)}
.mrow .v{font-weight:600;font-variant-numeric:tabular-nums}
.mfoot{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
/* foundation: empty state for a field that needs data CD Hub does not have. It names the Bloodline table that will feed it. */
/* The card itself is the house card (../house.css .card) with CD Hub's dashed edge (.card.dash); only the layout is here. */
.card.arrive{margin:0;box-shadow:none}.card.arrive h3{margin:0}
.card.arrive .awhy{margin:4px 0 0;color:var(--muted);font-size:13px}
.card.arrive .arrives{margin:8px 0 0;font-weight:600}
.arrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--house-gap);margin:0 0 var(--house-gap)}
.okempty{margin:12px 0 0;color:var(--muted);font-size:15px;display:flex;gap:8px;align-items:center}
.okempty::before{content:"\2713";display:inline-grid;place-items:center;width:22px;height:22px;flex:none;border-radius:50%;border:1px solid var(--ljr-5);background:var(--ljr-5-tint);color:var(--ink);font-size:13px}
/* checklist ✓ / ✗ marks: status dots, so they are circles */
.mk{display:inline-grid;place-items:center;width:22px;height:22px;flex:none;border-radius:50%;border:1px solid var(--ljr-5);background:var(--ljr-5-tint);color:var(--ink);font-size:13px;font-weight:600}
.mk.bad{border-color:var(--ljr-2);background:var(--ljr-2-tint)}
.mk.part{border-color:var(--ljr-3);background:var(--ljr-3-tint)}
.ckrow .btn,.ckrow .ci{flex:none}
@media (max-width:760px){.three{flex-wrap:nowrap;gap:6px}.three .sum{padding:4px 8px 4px 4px;gap:6px;font-size:13px;flex:1;min-width:0}.three .sum .big{font-size:17px;min-width:30px;height:30px;padding:0 6px}.mecards{grid-template-columns:minmax(0,1fr)}}

/* ---- Record cards (Dogs). Name line, then title (2 lines, then …); 44×44 thumbnail; who-has-it ring bottom-right. ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.dc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0}
.dc .bd{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.dc .hd{display:flex;align-items:flex-start;gap:12px;min-width:0}
.ph{position:relative;flex:0 0 auto;width:44px;height:44px;border-radius:var(--radius);background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.ph .ti{width:24px;height:24px}
.dc .tbr{flex:1;min-width:0}
.dc .nl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.dc .nm{font-weight:600;font-size:17px;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.dc .meta{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dc .age{margin-left:auto}
.sexdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--unk);flex:none}
.sexdot.me{background:var(--male)}.sexdot.fe{background:var(--female)}
.sexdot.mn{background:transparent;border:1px solid var(--male)}.sexdot.fn{background:transparent;border:1px solid var(--female)}
.sexdot.u{background:transparent;border:1px dashed var(--unk)}
.dc .chips{display:flex;flex-wrap:wrap;gap:4px}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.whor{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--press);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.whor .ti{width:15px;height:15px}
/* status (kit: animal): a status-colour dot + code + word, ink text, no fill */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:var(--radius);height:24px;padding:0 8px;white-space:nowrap}
.st b{font-weight:600}

.key{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted);margin:0 0 12px}
.key>span{display:inline-flex;align-items:center;gap:6px}
.stf{gap:8px}

/* ---- The round: temperatures ---- */
.tmp{display:grid;grid-template-columns:auto repeat(2,minmax(0,160px)) minmax(0,1fr);gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}

.bar{height:8px;background:transparent;box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--radius);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ljr-6-tint);box-shadow:inset 0 0 0 1px var(--ljr-6)}

ul.notes{margin:4px 0 8px;padding-left:20px;color:var(--muted);font-size:14px}ul.notes li{margin:2px 0}
.skip{position:absolute;left:-999px;top:8px;z-index:50;background:var(--card);color:var(--ink);padding:8px 14px;border-radius:var(--radius);border:1px solid var(--ink)}

.boot{padding:40px 0;text-align:center;color:var(--muted);font-size:15px}
.boot .rows{margin-top:16px;font-size:14px;line-height:1.9}
.map svg text{font-family:Lexend,system-ui,sans-serif}
.map .scroll{border:0}
.map svg{display:block;min-width:1180px}

<script>

var FOLDER=window.DASH_CONFIG.cdhub.folderId;   
var FOLDER_NAME=window.DASH_CONFIG.cdhub.folderName;
var WANT=['BLD-_MANIFEST.csv','BLD-tenant.csv','BLD-coat_colour.csv','BLD-coat_pattern.csv','BLD-nose_pigment.csv',
 'BLD-subject.csv','BLD-subject_status.csv','BLD-microchip.csv','BLD-microchip_registration.csv','BLD-weight.csv',
 'BLD-area.csv','BLD-area_capacity.csv','BLD-area_access.csv','BLD-temperature_band.csv','BLD-temperature_action.csv','BLD-association.csv','BLD-prospect.csv','BLD-export_route.csv','BLD-breeder_category.csv','BLD-litter.csv','BLD-mating.csv','BLD-health_screen.csv',
 'BLD-occupancy.csv','BLD-MAP-animana.csv','BLD-MAP-animana-client.csv','BLD-visit.csv','BLD-reminder.csv','BLD-medicinal_product.csv','BLD-stock_level.csv','BLD-clinical_note.csv','BLD-dispense.csv',
 'BLD-dna_marker.csv','BLD-dna_result.csv','BLD-doc_type.csv','BLD-prospect_set.csv','BLD-outdoor_temp.csv','BLD-WORK.csv',
 'BLD-jurisdiction.csv','BLD-authority.csv','BLD-unit.csv','BLD-locale.csv','BLD-species.csv',
 'BLD-outcome.csv','BLD-declaration.csv','BLD-frequency.csv','BLD-checklist_template.csv','BLD-checklist_template_item.csv',
 'BLD-checklist_instance.csv','BLD-deviation.csv','BLD-verification.csv','BLD-finding.csv','BLD-governed_by.csv','BLD-sop.csv','BLD-sop_version.csv','BLD-role.csv','BLD-vaccination.csv'];
var T={}, LOAD={state:'boot',err:null,storedAt:null,notes:[]};
var DB=null, ROUND={}, ACCESS={}, DBERR=null;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
// Links that come from the tables: only plain web addresses are allowed (never javascript:, data: etc.).
function safeUrl(u){ u=String(u==null?'':u).trim(); return /^https?:\/\/[^\s"'<>]+$/i.test(u)?u:''; }
function unesc(s){ return String(s||''); }
function parseCSV(text){
  text=unesc(text).replace(/[ \t]+\n/g,'\n').replace(/\r/g,'');
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f.replace(/\s+$/,'')); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f.replace(/\s+$/,'')); rows.push(row); }
  rows=rows.filter(function(r){ return r.length>1 || (r[0]||'').trim()!==''; });
  if(!rows.length) return [];
  var head=rows[0].map(function(h){return h.trim();});
  return rows.slice(1).map(function(r){ var o={}; head.forEach(function(h,i){o[h]=(r[i]==null?'':r[i]).trim();}); return o; });
}
function setBoot(msg,rows){
  var b=document.getElementById('boot'); if(!b) return;
  b.firstChild.nodeValue=msg;
  if(rows!=null) document.getElementById('bootrows').innerHTML=rows;
}
var CLIENT_ID=window.DASH_CONFIG.clientId;
var SCOPE=window.DASH_CONFIG.scopes.read;
var DRIVE=window.DASH_CONFIG.urls.files;
var TOKEN=null, TOKEN_EXP=0;
var SAVE_OFF='Saving off for now. Round, cabin access and flags are read-only. Nothing written to Drive or kept in this browser.';
LOAD.state='signin'; DBERR=SAVE_OFF;
function DriveErr(status,msg){ var e=new Error(msg); e.status=status;
  e.code=status===429?DashKit.BUSY_TEXT:status===401?'Sign-in expired':status===403?('Google refused access'+(msg?' ('+msg+')':'')):status===404?'Folder not found, or this account cannot see it':('Drive error '+status+(msg?' ('+msg+')':''));
  return e; }
function gget(url,asText){
  if(!TOKEN||Date.now()>TOKEN_EXP) return Promise.reject(DriveErr(401,''));
  return DashKit.googleFetch(url,{headers:{Authorization:'Bearer '+TOKEN}}).then(function(res){
    if(res.ok) return asText?res.text():res.json();
    return res.text().then(function(b){ var m='',why=''; try{ var j=JSON.parse(b); m=(j.error&&j.error.message)||''; why=(j.error&&j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason)||''; }catch(x){} throw DriveErr(DashKit.isBusy(res.status,why)?429:res.status,m); }); });
}
async function listFolder(){
  var files=[], pt='';
  do{
    var q=new URLSearchParams({q:"'"+FOLDER+"' in parents and trashed = false",
      fields:'nextPageToken,files(id,name,mimeType,modifiedTime)',pageSize:'1000',
      supportsAllDrives:'true',includeItemsFromAllDrives:'true',corpora:'allDrives'});
    if(pt) q.set('pageToken',pt);
    var r=await gget(DRIVE+'?'+q.toString());
    files=files.concat(r.files||[]); pt=r.nextPageToken||'';
  }while(pt);
  return files;
}
function readDriveFile(f){
  if(f.mimeType==='application/vnd.google-apps.spreadsheet')
    return gget(DRIVE+'/'+encodeURIComponent(f.id)+'/export?mimeType=text%2Fcsv',true);
  return gget(DRIVE+'/'+encodeURIComponent(f.id)+'?alt=media&supportsAllDrives=true',true);
}
function onCdToken(resp){
  if(resp.error){ LOAD.state='signin'; LOAD.err='Sign-in did not complete.'; render(); return; }
  if(!google.accounts.oauth2.hasGrantedAllScopes(resp,SCOPE)){ LOAD.state='signin'; LOAD.err='Drive read access was not granted, so the tables cannot be read.'; render(); return; }
  TOKEN=resp.access_token; TOKEN_EXP=DashAuth.expiryFrom(resp.expires_in);
  DashAuth.save(TOKEN, TOKEN_EXP, resp.scope||SCOPE);
  load();
}
function onCdError(e){ var t=(e&&e.type)||'';
  LOAD.err=t==='popup_failed_to_open'?'The browser blocked the sign-in window. Allow pop-ups for this page and try again.':t==='popup_closed'?'The sign-in window was closed before it finished.':'Sign-in did not complete.';
  if(LOAD.state!=='ok') LOAD.state='signin'; render();
}
function onCdSilentFail(hadExpired){
  if(TOKEN&&Date.now()<TOKEN_EXP) return;
  if(!hadExpired) return;
  LOAD.state='signin'; LOAD.err='Sign-in expired. Sign in again.'; render();
}
var auth=DashAuth.bind({clientId:CLIENT_ID,scope:SCOPE,onToken:onCdToken,onError:onCdError,onSilentFail:onCdSilentFail});
function signIn(){ auth.requestInteractive(); }
function signOut(){
  var t=TOKEN; TOKEN=null; TOKEN_EXP=0;
  if(window.DashAuth) DashAuth.clear();
  if(t&&window.google&&google.accounts&&google.accounts.oauth2) google.accounts.oauth2.revoke(t,function(){});
  T={}; CD={}; LOAD={state:'signin',err:null,storedAt:null,notes:[]}; render();
}
function initGoogle(){
  if(!auth.init()) return false;
  render(); return true;
}
function restoreShared(){
  var saved=window.DashAuth&&DashAuth.valid();
  if(!saved||!DashAuth.hasScope(saved,SCOPE)) return;
  TOKEN=saved.access_token; TOKEN_EXP=saved.expires_at;
  load();
}
restoreShared();
// Another tab signed in, refreshed the token, or signed out.
if(window.DashAuth) DashAuth.onChange(function(saved){
  if(!saved||!DashAuth.hasScope(saved,SCOPE)){ if(TOKEN){ TOKEN=null; TOKEN_EXP=0; T={}; CD={}; LOAD={state:'signin',err:'Signed out in another tab.',storedAt:null,notes:[]}; render(); } return; }
  var was=TOKEN; TOKEN=saved.access_token; TOKEN_EXP=saved.expires_at;
  if(!was||LOAD.state==='signin'||LOAD.state==='err') load();
});
(function waitGoogle(n){ if(!initGoogle() && n<100) setTimeout(function(){ waitGoogle(n+1); },100);
  else if(!auth.ready()){ LOAD.err='Google sign-in could not load. Check the connection and reload the page.'; render(); } })(0);
async function load(){
  T={}; LOAD={state:'loading',err:null,storedAt:null,notes:[]};
  document.getElementById('nav').innerHTML=''; pill();
  document.getElementById('main').innerHTML='<div class="boot" id="boot">Reading the tables from Drive&hellip;<div class="rows" id="bootrows"></div></div>';
  var files;
  try{ files=await listFolder(); }
  catch(e){ LOAD.state='err'; LOAD.err=(e&&e.code)||String(e&&e.message||e); render(); return; }
  LOAD.storedAt=new Date().toISOString();
  var byTitle={};
  files.forEach(function(f){ (byTitle[f.name]=byTitle[f.name]||[]).push(f); });
  var dup=Object.keys(byTitle).filter(function(t){return byTitle[t].length>1;});
  if(dup.length){ LOAD.state='ambiguous'; LOAD.err=dup.join(', '); render(); return; }
  var missing=WANT.filter(function(t){return !byTitle[t];});
  if(missing.length) LOAD.notes.push(missing.length+' file(s) not in the folder: '+missing.join(', '));
  var done=0;
  for(var i=0;i<WANT.length;i++){
    var title=WANT[i];
    if(!byTitle[title]){ T[title]=[]; continue; }
    setBoot('Reading the tables from Drive…',
      WANT.slice(0,i+1).map(function(t,j){ return (j<=i-1?'✓ ':'· ')+t; }).join('<br>'));
    try{
      var txt=await readDriveFile(byTitle[title][0]);
      txt=String(txt||'').replace(/^\uFEFF/,'');
      if(title==='BLD-_MANIFEST.csv' && !/^"?file,/i.test(txt)){ var nl=txt.indexOf('\n'); LOAD.manifestLine=txt.slice(0,nl<0?txt.length:nl).replace(/^"|"\s*$/g,'').trim(); txt=nl<0?'':txt.slice(nl+1); }
      T[title]=parseCSV(txt); done++;
    }catch(e){ T[title]=[]; LOAD.notes.push(title+': '+((e&&e.code)||'read failed')); }
  }
  LOAD.state='ok'; LOAD.files=done;
  DB=null; ROUND={}; ACCESS={}; DBERR=SAVE_OFF;
  build(); render();
}
var CD={};
function idx(rows,k){ var m={}; (rows||[]).forEach(function(r){ m[r[k]]=r; }); return m; }
function build(){
  var COL=idx(T['BLD-coat_colour.csv'],'id'), PAT=idx(T['BLD-coat_pattern.csv'],'id'), PIG=idx(T['BLD-nose_pigment.csv'],'id');
  var ST=idx(T['BLD-subject_status.csv'],'subject_id'), OCC=idx(T['BLD-occupancy.csv'],'subject_id'),
      MC=idx(T['BLD-microchip.csv'],'subject_id');
  var W={}; (T['BLD-weight.csv']||[]).forEach(function(r){ (W[r.subject_id]=W[r.subject_id]||[]).push({on:r.performed_on,kg:parseFloat(r.weight_kg),unit:r.unit,bcs:r.body_condition_score||'',scale:r.bcs_scale||'',src:r.source||''}); });
  Object.keys(W).forEach(function(k){ W[k].sort(function(a,b){return a.on<b.on?-1:1;}); });
  var DSP={}; (T['BLD-dispense.csv']||[]).forEach(function(r){
    (DSP[r.subject_id]=DSP[r.subject_id]||[]).push({on:r.given_on,product:r.product,pres:r.presentation,
      dose:r.dose_volume,band:r.weight_band,kg:r.weight_kg_used,basis:r.dosage_basis,route:r.route,
      reason:r.reason,src:r.source,need:r.ruling_needed,note:r.note}); });
  Object.keys(DSP).forEach(function(k){ DSP[k].sort(function(a,b){return a.on<b.on?-1:1;}); });
  CD.dispense=DSP;
  
  CD.markers={}; (T['BLD-dna_marker.csv']||[]).forEach(function(r){ CD.markers[r.code]=r; });
  var DNA={}; (T['BLD-dna_result.csv']||[]).forEach(function(r){
    (DNA[r.subject_id]=DNA[r.subject_id]||[]).push({code:r.marker_code,genotype:r.genotype,
      copies:r.copies,interp:r.interpretation,need:r.ruling_needed,lab:r.lab||'',on:r.tested_on||''}); });
  CD.dna=DNA;

 var out=[], step=0;
 Object.keys(fam).sort(function(a,b){return famSort(a)-famSort(b);}).forEach(function(f){
  fam[f].sort(function(x,y){return cabSort(x.code)-cabSort(y.code)||(x.code<y.code?-1:1);}).forEach(function(a){

function ageDays(iso,onISO){ if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null;
 var b=new Date(iso+'T00:00:00'), d=new Date((onISO||todayISO())+'T00:00:00');
 return Math.floor((d-b)/86400000); }

function bandFor(subjectIds,onISO){
 var young=null, who=null;
 (subjectIds||[]).forEach(function(sid){ var d=CD._byId[sid]; if(!d) return;
   var a=ageDays(d.dob,onISO); if(a===null) return;
   if(young===null||a<young){ young=a; who=d; } });
 if(young===null) return null;
 for(var i=0;i<CD.tempBands.length;i++){ var b=CD.tempBands[i];
   if(young>=b.from && young<=b.to) return {b:b,days:young,dog:who}; }
 return null;
}
function actionFor(n){
 if(n==null||isNaN(n)) return '';
 var cold=CD.tempActions.filter(function(a){return a.dir==='below' && n<a.at;});
 if(cold.length) return cold[0].action;
 var hot=CD.tempActions.filter(function(a){return a.dir==='above' && n>a.at;});
 return hot.length?hot[0].action:'';
}
function tempVerdict(val,band){
 if(val===''||val==null||!band||band.b.min===null) return '';
 var n=parseFloat(val); if(isNaN(n)) return '';
 if(n<band.b.min) return 'low'; if(n>band.b.max) return 'high'; return 'ok';
}
function temp2dp(v){ v=String(v==null?'':v).trim(); if(!v) return {ok:true,val:''};
 if(!/^-?\d{1,2}(\.\d{1,2})?$/.test(v)) return {ok:false};
 var n=parseFloat(v); if(n<-30||n>60) return {ok:false};
 return {ok:true,val:n.toFixed(2)}; }
async function tempSave(areaId,slot,which,raw,el,msgEl){
 var c=temp2dp(raw);
 if(!c.ok){ if(el&&el.classList) el.classList.add('bad'); if(msgEl) msgEl.textContent='2 dp only'; return; }
 if(el&&el.classList) el.classList.remove('bad');
 if(!DB){ if(msgEl) msgEl.textContent='saving off'; return; }
 var date=(CD._roundDate||todayISO()), k=roundKey(date,areaId);
 var cur=ROUND[k]||{areaId:areaId,date:date,subjects:[],access:''};
 var t={}; var prev=cur['t_'+slot]||{}; for(var q in prev) t[q]=prev[q];
 t[which]=c.val; t.at=new Date().toISOString();
 var next={}; for(var q2 in cur) next[q2]=cur[q2];
 next['t_'+slot]=t; next.areaId=areaId; next.date=date;
 if(msgEl) msgEl.textContent='saving...';
 try{ await DB.doc('round/'+k).set(next); ROUND[k]=next; if(msgEl) msgEl.textContent='saved'; if(el) el.value=c.val; }
 catch(e){ var c2=(e&&(e.code||e.message))||'error'; if(msgEl) msgEl.textContent='NOT saved \u2014 '+c2; console.log('temp save failed',e); }
}
async function roundSave(areaId,patch,msgEl){
 if(!DB){ if(msgEl) msgEl.textContent='saving off'; return; }
 var date=(CD._roundDate||todayISO()), k=roundKey(date,areaId);
 var cur=ROUND[k]||{areaId:areaId,date:date,subjects:[],access:''};
 var next={areaId:areaId,date:date,subjects:patch.subjects!=null?patch.subjects:(cur.subjects||[]),
           access:patch.access!=null?patch.access:(cur.access||''),at:new Date().toISOString()};
 if(msgEl) msgEl.textContent='saving\u2026';
 try{ await DB.doc('round/'+k).set(next); ROUND[k]=next; if(msgEl) msgEl.textContent='saved';
      go('round',false); }
 catch(e){ var c=(e&&(e.code||e.message))||'error'; if(msgEl) msgEl.textContent='NOT saved \u2014 '+c; console.log('round save failed',e); }
}

var MAPTGT={subject_id:'subject',dam_subject_id:'subject',sire_subject_id:'subject',dam_id:'subject',
 sire_id:'subject',birth_litter_id:'litter',litter_id:'litter',area_id:'area',

var GHOSTS=[['person',10,'Families, retirement homes, rehomes, staff'],
            ['document',13,'every certificate, scan and vaccine card'],
            ['media',8,'photos and galleries'],
            ['product',12,'the shop side'],
            ['sop_version',9,'procedures']];
function mapModel(){
 var nodes={}, edges=[];
 Object.keys(T||{}).forEach(function(f){
  var rows=T[f]; if(!rows||!rows.length) return;
  var t=f.replace(/^BLD-|\.csv$/g,'');
  if(/^_|^SWEEP|^WORK$|^MAP-/.test(t)) return;
  nodes[t]={id:t,rows:rows.length,in:0,out:0};
 });
 Object.keys(T||{}).forEach(function(f){
  var rows=T[f]; if(!rows||!rows.length) return;
  var t=f.replace(/^BLD-|\.csv$/g,''); if(!nodes[t]) return;
  Object.keys(rows[0]).forEach(function(c){
   var tgt=MAPTGT[c]; if(!tgt||tgt===t||!nodes[tgt]) return;
   var filled=0; for(var i=0;i<rows.length;i++){ if((rows[i][c]||'').trim()) filled++; }
   if(!filled) return;
   edges.push({from:t,to:tgt,col:c,filled:filled,of:rows.length,pct:Math.round(100*filled/rows.length)});
   nodes[tgt].in++; nodes[t].out++;
  });
 });
 return {nodes:nodes,edges:edges};
}
function pageShape(){
 var m=mapModel(), N=m.nodes, E=m.edges;
 var SPINE=['subject','litter','area'];
 var look=Object.keys(N).filter(function(t){return N[t].in>0 && SPINE.indexOf(t)<0;}).sort();
 var ev=Object.keys(N).filter(function(t){return N[t].out>0 && SPINE.indexOf(t)<0 && look.indexOf(t)<0;})
          .sort(function(a,b){return N[b].rows-N[a].rows;});
 var loose=Object.keys(N).filter(function(t){return N[t].in===0&&N[t].out===0;}).sort();

 /* foundation: data model map (records, lookups, events and how full each link is). Real text sizes: the map sits in its own
    sideways-scrolling box, so it is never shrunk below 13px. Colour only in the lines, never the words. */
 var W=1180, PAD=28, colL=PAD+10, colS=430, colE=800, STEP=56, BH=46;
 var rowsH=Math.max(look.length,ev.length,3);
 var H=Math.max(600, 110+rowsH*STEP);
 function box(x,y,w,h,label,sub,cls){
  return '<g><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="12" '+cls+'/>'
   +'<text x="'+(x+12)+'" y="'+(y+20)+'" font-size="14" font-weight="600" fill="currentColor">'+esc(label)+'</text>'
   +(sub?'<text x="'+(x+12)+'" y="'+(y+38)+'" font-size="13" style="fill:var(--muted)">'+esc(sub)+'</text>':'')
   +'</g>';
 }
 var g='';
 // spine
 var spineY={}, sy=100;
 SPINE.forEach(function(t){
  if(!N[t]) return;
  var h=50+Math.min(34,Math.round(N[t].rows/12));
  spineY[t]=sy+h/2;
  g+=box(colS,sy,260,h,t,N[t].rows+' rows · '+N[t].in+' tables point here',
     'fill="none" style="stroke:var(--ljr-2)" stroke-width="1"');
  sy+=h+30;
 });
 // lookups left
 var lookY={};
 look.forEach(function(t,i){ var y=100+i*STEP; lookY[t]=y+BH/2;
  g+=box(colL,y,200,BH,t,N[t].rows+' rows','fill="none" style="stroke:var(--press)" stroke-width="1"'); });
 // events right
 var evY={};
 ev.forEach(function(t,i){ var y=100+i*STEP; evY[t]=y+BH/2;
  g+=box(colE,y,250,BH,t,N[t].rows+' rows','fill="none" style="stroke:var(--ljr-5)" stroke-width="1"'); });

 function yOf(t){ return spineY[t]!==undefined?spineY[t]:(lookY[t]!==undefined?lookY[t]:evY[t]); }
 // edges: weight and dash carry the FILL RATE
 E.forEach(function(e){
  var y1=yOf(e.from), y2=yOf(e.to); if(y1===undefined||y2===undefined) return;
  var x1,x2;
  if(evY[e.from]!==undefined){ x1=colE; x2=colS+260; }
  else if(lookY[e.from]!==undefined){ x1=colL+200; x2=colS; }
  else if(spineY[e.from]!==undefined && lookY[e.to]!==undefined){ x1=colS; x2=colL+200; }
  else { x1=colS; x2=colS+260; }
  var thin=e.pct<25, mid=e.pct<75;
  var col=thin?'var(--ljr-2)':(mid?'var(--ljr-3)':'var(--ljr-5)');
  var mx=(x1+x2)/2;
  g+='<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" fill="none" style="stroke:'+col+'"'
    +' stroke-width="'+(thin?1:(mid?1.8:2.6))+'"'+(thin?' stroke-dasharray="3 3"':'')+' opacity="'+(thin?.95:.7)+'"/>'
    +'<text x="'+(mx)+'" y="'+((y1+y2)/2-6)+'" font-size="13" text-anchor="middle" fill="currentColor">'+e.pct+'%</text>';
 });
 var svg='<figure style="margin:0"><div class="scroll" tabindex="0" role="group" aria-label="Map, scroll sideways for more"><svg role="img" aria-label="Map of the breeder tables: subject is the spine with '
  +(N.subject?N.subject.in:0)+' tables pointing at it; arrow weight shows how much of each join is actually filled." '
  +'viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'
  +'<text x="'+colL+'" y="44" font-size="15" font-weight="600" fill="currentColor">Looked up</text>'
  +'<text x="'+colS+'" y="44" font-size="15" font-weight="600" fill="currentColor">The spine</text>'
  +'<text x="'+colE+'" y="44" font-size="15" font-weight="600" fill="currentColor">What happens to a dog</text>'
  +'<text x="'+colL+'" y="66" font-size="13" style="fill:var(--muted)">colour, markers, products</text>'
  +'<text x="'+colS+'" y="66" font-size="13" style="fill:var(--muted)">what a thing is</text>'
  +'<text x="'+colE+'" y="66" font-size="13" style="fill:var(--muted)">one row per event, never a column</text>'
  +g+'</svg></div><figcaption class="mut" style="margin-top:8px">Line weight and colour are the <b>fill rate</b>, not the relationship: solid green is 75%+ of rows carrying the link, amber 25 to 74%, dashed rose under 25%. Box height is row count. Drawn from the tables loaded on this page.</figcaption></figure>';

 var thin=E.filter(function(e){return e.pct<25;}).sort(function(a,b){return a.pct-b.pct;});
 var h='<h2>Table map</h2>'
  +'<p class="note">Who points at whom · rows · <b>how full each link is</b> (a join can be almost empty).</p>'
  +'<div class="card map">'+svg+'</div>'
  +'<div class="card acc2"><h4>Joins that exist but are nearly empty'+cntPill(thin.length)+'</h4>'
  +'<p>These are the ones a flat diagram would draw the same as a full one.</p><div class="scroll" tabindex="0" role="group" aria-label="Table, scroll sideways for more"><table><thead><tr><th>from</th><th>column</th><th>to</th><th>filled</th></tr></thead><tbody>'
  +thin.map(function(e){return '<tr><td>'+esc(e.from)+'</td><td class="mut">'+esc(e.col)+'</td><td>'+esc(e.to)+'</td><td><span class="pill no">'+e.pct+'%</span> '+e.filled+' of '+e.of+'</td></tr>';}).join('')
  +'</tbody></table></div></div>'
  +'<div class="card acc4"><h4>tenant_id is on every table and is deliberately not drawn</h4><p style="margin-bottom:0">All '+Object.keys(N).length+' tables carry it at 100%, so drawing it would add a line to every box and say nothing. It is a band across the whole picture, not a relationship. <b>And one tenant in the data never proves isolation</b> — that needs a second tenant.</p></div>'
  +'<div class="card acc7"><h4>Tables other tables point at that do not exist</h4>'
  +'<p>Dashed, because nothing is there. This is where the picture stops.</p><div class="scroll" tabindex="0" role="group" aria-label="Table, scroll sideways for more"><table><thead><tr><th>table</th><th>pointed at by</th><th>what it would hold</th></tr></thead><tbody>'
  +GHOSTS.map(function(x){return '<tr><td><b>'+esc(x[0])+'</b></td><td><span class="pill no">'+x[1]+' tables</span></td><td class="mut">'+esc(x[2])+'</td></tr>';}).join('')
  +'</tbody></table></div></div>'
  +(loose.length?'<div class="card"><h4>Loaded but joined to nothing'+cntPill(loose.length)+'</h4><p style="margin-bottom:0" class="mut">'+loose.map(esc).join(', ')+'</p></div>':'');
 return h;
}

var SECTIONS=[['map','Live feed'],['work','Outstanding'],['shape','Table map'],['today','Today'],['round','The round'],['dogs','Dogs'],['areas','Areas'],['litters','Litters'],['vet','Vet link'],['buyers','Assocs']];
var NEXT={work:['today','dogs'],shape:['dogs','areas'],map:['today','work'],today:['round','dogs'],round:['areas','dogs'],dogs:['litters','vet'],areas:['today','litters'],litters:['dogs','vet'],vet:['dogs','buyers'],buyers:['dogs','map']};
function label(id){ for(var i=0;i<SECTIONS.length;i++) if(SECTIONS[i][0]===id) return SECTIONS[i][1]; return id; }
// Bottom tab bar: icon, short label (narrow screens) and the tab's colour (shown only in the small bar above the label).
var TABMETA={map:['activity','Live',6],work:['list-check','To do',2],shape:['sitemap','Tables',0],today:['calendar-event','Today',4],
 round:['route','Round',4],dogs:['paw','Dogs',5],areas:['building-cottage','Areas',3],litters:['baby-carriage','Litters',7],
 vet:['stethoscope','Vet',5],buyers:['world','Assocs',6]};
function cntPill(n,cls){ return '<span class="cnt'+(String(n).length>2?' wide':'')+(cls?' '+cls:'')+'">'+(n===0||n==='0'?'':n)+'</span>'; } // 0 shows no ring
function navHtml(){
 var nd=needsToday().length, wait=(CD.work||[]).filter(function(r){return r.status==='BLOCKED' && r.owner==='Lisa';}).length;
 var counts={map:nd,work:wait};
 return SECTIONS.map(function(s){ var m=TABMETA[s[0]]||['point',s[1],0], n=counts[s[0]];
   return '<button type="button" data-go="'+s[0]+'" style="--tc:var(--ljr-'+m[2]+')"><span class="bar" aria-hidden="true"></span>'
    +'<svg class="ti" aria-hidden="true"><use href="#i-'+m[0]+'"/></svg>'+(n?cntPill(n,'need'):'')
    +'<span class="lab"><span class="lf">'+esc(s[1])+'</span><span class="ls" aria-hidden="true">'+esc(m[1])+'</span></span></button>'; }).join('')
  +'<button type="button" class="util" data-reload="1" title="Read the tables from Drive again"><span class="bar" aria-hidden="true"></span><svg class="ti" aria-hidden="true"><use href="#i-refresh"/></svg><span class="lab">Reread</span></button>'
  +'<button type="button" class="util" data-signout="1"><span class="bar" aria-hidden="true"></span><svg class="ti" aria-hidden="true"><use href="#i-logout"/></svg><span class="lab">Sign out</span></button>';
}
function pill(){
 var p=document.getElementById('livepill');
 p.removeAttribute('data-read');   // the phone's Look menu shows this read time (the pill leaves the bar there)
 if(LOAD.state==='ok'){ p.className='live ok';
  if(LOAD.storedAt) p.setAttribute('data-read','Read '+new Date(LOAD.storedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'}));
  var w='live · read-only · '+(CD.counts?Object.keys(CD.counts).length:0)+' tables'+(LOAD.storedAt?' · read '+new Date(LOAD.storedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'}):'');
  // ✓ on screen; the words stay for screen readers (and the tests), and on hover.
  p.title=w+' · '+FOLDER_NAME; p.innerHTML='<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">'+esc(w)+'</span>\u2713'; }
 else if(LOAD.state==='signin'){ p.className='live bad'; p.textContent='signed out'; }
 else if(LOAD.state==='loading'){ p.className='live'; p.textContent='\u2026'; }
 else if(LOAD.state==='ambiguous'){ p.className='live bad'; p.textContent='duplicate file titles'; }
 else if(LOAD.state==='err'){ p.className='live bad'; p.textContent='read failed'; }
}
// Every dropdown and box gets a name a screen reader can say: its first "choose…" option or its placeholder,
// plus the cabin name when the dropdown belongs to one cabin.
function labelControls(root){
 Array.prototype.forEach.call(root.querySelectorAll('select,input'),function(el){
  if(el.getAttribute('aria-label')||(el.id&&root.querySelector('label[for="'+el.id+'"]'))||el.closest('label')) return;
  if(el.type==='hidden'||el.type==='checkbox'||el.type==='radio') return;
  var t=el.tagName==='SELECT'?((el.options[0]&&el.options[0].value==='')?el.options[0].textContent:''):(el.placeholder||'');
  t=(t||el.name||el.id||'choose').replace(/\u2026|\.\.\.$/g,'').trim();
  var card=el.dataset.area&&el.closest('.card,section,li,tr'), h=card&&card.querySelector('h4,.hx4,b,strong');
  if(h&&h.textContent.trim()) t+=' \u2013 '+h.textContent.trim();
  el.setAttribute('aria-label',t);
 });
}
function render(){ go((location.hash||'#/map').replace('#/',''),false); }
// Headings must not skip a level (h2 then h4). A card heading (h4) with no h3 above it since the last h2
// becomes an h3 that looks the same, so screen-reader heading lists make sense on every screen.
function levelHeadings(root){
 var seen3=false;
 Array.prototype.slice.call(root.querySelectorAll('h1,h2,h3,h4')).forEach(function(h){
  var t=h.tagName;
  if(t==='H1'||t==='H2'){ seen3=false; return; }
  if(t==='H3'){ seen3=true; return; }
  if(seen3) return;
  var n=document.createElement('h3');
  Array.prototype.forEach.call(h.attributes,function(a){ n.setAttribute(a.name,a.value); });
  n.classList.add('hx4');
  while(h.firstChild) n.appendChild(h.firstChild);
  h.parentNode.replaceChild(n,h);
 });
}
// After a screen change, move keyboard focus to the new screen's title (without scrolling),
// so a screen reader announces where you are and Tab carries on from the top of the new screen.
function focusView(){
 var h=document.querySelector('#main h2')||document.querySelector('#main h3,#main h4');
 if(!h) return;
 h.setAttribute('tabindex','-1');
 h.focus({preventScroll:true});
}
// Signed in and read: the top bar shows Refresh and Sign out (on a phone Sign out sits in the Look menu).
function cdIn(on){ document.documentElement.classList.toggle('cd-in',on); ['cdRefresh','cdSignout'].forEach(function(id){ document.getElementById(id).classList.toggle('hidden',!on); }); }
function go(id,push){
 pill();
 var main=document.getElementById('main');
 if(LOAD.state==='signin'){
  main.innerHTML='<div class="card acc4" style="margin-top:24px"><h2 class="hx4">Sign in to see the tables</h2>'
   +'<ul class="notes"><li>No data of its own. Read-only, live from '+esc(FOLDER_NAME)+'.</li><li>One sign-in for the whole site.</li></ul>'
   +(LOAD.err?'<p class="mut">'+esc(LOAD.err)+'</p>':'')
   +'<p style="margin-bottom:0"><button id="signinbtn" data-signin="1"'+(auth.ready()?'':' disabled')+'>'+(auth.ready()?'Sign in with Google':'Loading Google sign-in\u2026')+'</button></p></div>';
  document.getElementById('nav').innerHTML=''; cdIn(false); return;
 }
 if(LOAD.state==='loading'){ return; }
 if(LOAD.state!=='ok'){
  main.innerHTML='<div class="card acc2" style="margin-top:24px"><h2 class="hx4">'+
   (LOAD.state==='ambiguous'?'More than one file shares a title'
    :LOAD.state==='err'?'The folder could not be read':'Loading…')+'</h2>'
   +'<p>'+(LOAD.state==='ambiguous'
     ?'Refusing to guess which is current: '+esc(LOAD.err)
     :LOAD.state==='err'?esc(LOAD.err||'')+'. The tables live in '+esc(FOLDER_NAME)+'.'
     :'The tables live in '+esc(FOLDER_NAME)+'. Nothing is stored in this page, so there is nothing to show without them.')+'</p>'
   +'<p style="margin-bottom:0"><button data-signin="1">Sign in again</button> <button data-reload="1">Try again</button></p></div>';
  document.getElementById('nav').innerHTML=''; cdIn(false); return;
 }
 if(!PAGES[id]) id='map';
 cdIn(true);
 document.getElementById('nav').innerHTML=navHtml();
 main.innerHTML=PAGES[id]();
 Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){ if(b.dataset.go===id) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
 labelControls(main);
 levelHeadings(main);
 document.getElementById('next').innerHTML=(NEXT[id]||[]).map(function(n){return '<button data-go="'+n+'">Next: '+label(n)+' →</button>';}).join('');
 if(id==='dogs'){
  var fst=document.getElementById('fst');
  STATUS.forEach(function(x){ var o=document.createElement('option'); o.value=x[0]; o.textContent=x[1]; fst.appendChild(o); });
  var cs={}; CD.dogs.forEach(function(d){ if(d.colour) cs[colourLabel(d)]=d; });
  var fc=document.getElementById('fc');
  Object.keys(cs).sort(function(a,b){ var ka=colourKey(cs[a]),kb=colourKey(cs[b]);
   for(var i=0;i<ka.length;i++){ if(ka[i]!==kb[i]) return ka[i]-kb[i]; } return a<b?-1:1; })
   .forEach(function(k){ var o=document.createElement('option'); o.textContent=k; fc.appendChild(o); });
  var ts={}; CD.dogs.forEach(function(d){ d.findings.forEach(function(f){ts[f.test]=1;}); });
  var ft=document.getElementById('ft');
  Object.keys(ts).sort().forEach(function(t){ var o=document.createElement('option'); o.textContent=t; ft.appendChild(o); });
  Array.prototype.forEach.call(document.querySelectorAll('.sfb'),function(b){
   b.addEventListener('click',function(){ var f=document.getElementById('fst');
    f.value=(f.value===b.dataset.code)?'':b.dataset.code;
    Array.prototype.forEach.call(document.querySelectorAll('.sfb'),function(x){
      x.setAttribute('aria-pressed', x.dataset.code===f.value ? 'true':'false'); });
    drawDogs(); }); });
  document.getElementById('rows').addEventListener('click',function(ev){
   var el=ev.target&&ev.target.closest?ev.target.closest('.wtc'):null; if(!el||!el.dataset.dog) return;
   if(el.classList.contains('trc')) showTreats(el.dataset.dog); else showWeights(el.dataset.dog);
   var wp=document.getElementById('wpanel'); if(wp&&wp.scrollIntoView) wp.scrollIntoView({behavior:'smooth',block:'start'}); });
  ['q','fs','fn','fa','fst','fc','ft','dsort'].forEach(function(i){ var e=document.getElementById(i); if(!e) return; e.addEventListener('input',drawDogs); if(i!=='q') e.addEventListener('change',drawDogs); });
  document.getElementById('clr').addEventListener('click',function(){ ['q','fs','fn','fa','fst','fc','ft'].forEach(function(i){document.getElementById(i).value='';});
   Array.prototype.forEach.call(document.querySelectorAll('.sfb'),function(x){ x.setAttribute('aria-pressed',x.dataset.code===''?'true':'false'); }); drawDogs(); });
  drawDogs();
 }
 if(id==='litters'){
  var ys={},ss={},dm={},sr={};
  CD.litters.forEach(function(l){ if(l.dob) ys[l.dob.slice(0,4)]=1; if(l.status) ss[l.status]=1;
   if(l.dam_subject_id) dm[l.dam_subject_id]=1; if(l.sire_subject_id) sr[l.sire_subject_id]=1; });
  var add=function(sel,keys,lab){ var e=document.getElementById(sel); if(!e) return;
   keys.forEach(function(k){ var o=document.createElement('option'); o.value=k; o.textContent=lab?lab(k):k; e.appendChild(o); }); };
  add('ly',Object.keys(ys).sort().reverse());
  add('ls',Object.keys(ss).sort());
  add('lm',Object.keys(dm).sort(function(x,y){return nameOf(x)<nameOf(y)?-1:1;}),nameOf);
  add('lp',Object.keys(sr).sort(function(x,y){return nameOf(x)<nameOf(y)?-1:1;}),nameOf);
  ['lq','ld','ly','ls','lm','lp','lk','lsort'].forEach(function(i){ var e=document.getElementById(i); if(!e) return; e.addEventListener('input',drawLitters); if(i!=='lq') e.addEventListener('change',drawLitters); });
  document.getElementById('lclr').addEventListener('click',function(){ ['lq','ld','ly','ls','lm','lp','lk'].forEach(function(i){var e=document.getElementById(i); if(e) e.value='';}); drawLitters(); });
  drawLitters();
 }
 if(id==='today'){
  Array.prototype.forEach.call(document.querySelectorAll('.tl'),function(b){
   if(!b.dataset.list) return;
   b.addEventListener('click',function(){ showList(b.dataset.list); }); });
 }
 if(id==='map'){
  Array.prototype.forEach.call(document.querySelectorAll('.ci'),function(b){
   b.addEventListener('click',function(){ if(b.dataset.list){ go('today',true); setTimeout(function(){showList(b.dataset.list);},60);} }); });
  var na=document.querySelector('[data-needall]');
  if(na) na.addEventListener('click',function(){ Array.prototype.forEach.call(document.querySelectorAll('[data-needmore]'),function(r){ r.classList.remove('hidden'); });
   var f=na.closest('.mfoot'); if(f) f.remove(); });
 }
 if(id==='buyers'){
  ['bq','bcat','bctry','bapp','bsig','bmd','bem','bch','bsort'].forEach(function(i){ var e=document.getElementById(i);
    if(e){ e.addEventListener('input',drawBuyers); e.addEventListener('change',drawBuyers); } });
  var bc=document.getElementById('bclr');
  if(bc) bc.addEventListener('click',function(){ ['bq','bcat','bctry','bapp','bsig','bmd','bem','bch'].forEach(function(i){
    var e=document.getElementById(i); if(e) e.value=''; }); drawBuyers(); });
  drawBuyers();
 }
 if(id==='areas'){
  Array.prototype.forEach.call(document.querySelectorAll('.aacc'),function(el){
   el.addEventListener('change',function(){
    var msg=document.querySelector('.asave[data-area="'+el.dataset.area+'"]');
    accessSave(el.dataset.area,el.value,msg); }); });
 }
 if(id==='round'){
  var dEl=document.getElementById('rdate');
  if(dEl) dEl.addEventListener('change',function(){ CD._roundDate=dEl.value||todayISO(); go('round',false); });
  Array.prototype.forEach.call(document.querySelectorAll('.racc'),function(el){
   el.addEventListener('change',function(){
    var msg=document.querySelector('.rsave[data-area="'+el.dataset.area+'"]');
    roundSave(el.dataset.area,{access:el.value},msg); }); });
  Array.prototype.forEach.call(document.querySelectorAll('.radd'),function(el){
   el.addEventListener('change',function(){
    if(!el.value) return;
    var k=roundKey(CD._roundDate||todayISO(),el.dataset.area);
    var cur=((ROUND[k]||{}).subjects||[]).slice();
    if(cur.indexOf(el.value)<0) cur.push(el.value);
    var msg=document.querySelector('.rsave[data-area="'+el.dataset.area+'"]');
    roundSave(el.dataset.area,{subjects:cur},msg); }); });
  Array.prototype.forEach.call(document.querySelectorAll('.tmin, .tmax'),function(el){
   var which=(el.className.indexOf('tmin')>=0)?'min':'max';
   var msg=document.querySelector('.tmsg[data-area="'+el.dataset.area+'"][data-slot="'+el.dataset.slot+'"]');
   var h=function(){ tempSave(el.dataset.area,el.dataset.slot,which,el.value,el,msg); };
   el.addEventListener('change',h); el.addEventListener('blur',h); });
  Array.prototype.forEach.call(document.querySelectorAll('.rdel'),function(el){
   el.addEventListener('click',function(){
    var k=roundKey(CD._roundDate||todayISO(),el.dataset.area);
    var cur=((ROUND[k]||{}).subjects||[]).filter(function(x){return x!==el.dataset.sub;});
    var msg=document.querySelector('.rsave[data-area="'+el.dataset.area+'"]');
    roundSave(el.dataset.area,{subjects:cur},msg); }); });
 }
 if(push!==false && location.hash!=='#/'+id) history.pushState({id:id},'','#/'+id);
 window.scrollTo(0,0);
}
document.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('[data-go]'); if(b){ go(b.dataset.go); focusView(); } });
// Skip link: jump to the content without touching the #/section address.
document.addEventListener('click',function(e){ var k=e.target.closest&&e.target.closest('[data-skip]'); if(!k) return; e.preventDefault(); var m=document.getElementById(k.dataset.skip); if(m){ m.setAttribute('tabindex','-1'); m.focus(); } });
document.addEventListener('click',function(e){
 var b=e.target.closest&&e.target.closest('[data-dogshow],[data-unshow]'); if(!b) return;
 if(b.getAttribute('data-dogshow')){
  if(b.getAttribute('data-dogshow')==='all') dogShown='all';
  else if(dogShown!=='all') dogShown=(typeof dogShown==='number'?dogShown:300)+300;
  drawDogs();
 } else {
  if(b.getAttribute('data-unshow')==='all') unplacedShown='all';
  else if(unplacedShown!=='all') unplacedShown=(typeof unplacedShown==='number'?unplacedShown:40)+40;
  if(document.getElementById('rdate')) go('round', false);
 }
});
// Filter row: Filter opens its panel; a chip clears its own filter; Sort redraws.
document.addEventListener('click',function(e){
 var f=e.target.closest&&e.target.closest('[data-fpanel]');
 if(f){ var p=document.getElementById(f.dataset.fpanel); if(p){ var open=p.classList.contains('hidden'); p.classList.toggle('hidden',!open); f.setAttribute('aria-expanded',String(open)); } return; }
 var c=e.target.closest&&e.target.closest('[data-fclear]');
 if(c){ var el=document.getElementById(c.dataset.fclear); if(el){ el.value=''; el.dispatchEvent(new Event('change')); }
   if(c.dataset.fclear==='fst') Array.prototype.forEach.call(document.querySelectorAll('.sfb'),function(x){ x.setAttribute('aria-pressed',x.dataset.code===''?'true':'false'); }); }
});
document.addEventListener('click',function(e){ var t=e.target.closest&&e.target.closest('[data-signin],[data-signout],[data-reload]'); if(!t||t.disabled) return;
 if(t.dataset.signin) signIn(); else if(t.dataset.signout) signOut();
 else if(t.dataset.reload){ if(TOKEN&&Date.now()<TOKEN_EXP) load(); else auth.requestSilent(); } });
// Search (press /): dogs (name, chip, id) and litters (id, dam, sire, born) from the tables already read.
DashKit.search.register(function(q){
 if(LOAD.state!=='ok') return [];
 var hit=DashKit.search.matches(q), out=[], byId=CD._byId||{};
 (CD.dogs||[]).filter(function(d){ return hit([d.name,d.id,d.chip,d.breed].join(' ')); }).slice(0,12).forEach(function(d){
  out.push({group:'CD Hub dogs',slot:5,title:d.name||d.id,sub:[d.sex,d.dob,d.chip?'chip '+d.chip:''].filter(Boolean).join(' · '),
   act:function(){ go('dogs'); var b=document.getElementById('q'); if(b){ b.value=d.name||d.id; b.dispatchEvent(new Event('input')); } focusView(); }});
 });
 (CD.litters||[]).filter(function(l){ var dam=byId[l.dam_subject_id], sire=byId[l.sire_subject_id];
   return hit([l.id,l.born_on,dam&&dam.name,sire&&sire.name].join(' ')); }).slice(0,8).forEach(function(l){
  var dam=byId[l.dam_subject_id];
  out.push({group:'CD Hub litters',slot:5,title:'Litter '+(l.born_on||l.id)+(dam?' · '+dam.name:''),sub:l.id,act:function(){ go('litters'); focusView(); }});
 });
 return out;
});
window.addEventListener('popstate',function(){ if(LOAD.state==='ok'){ go((location.hash||'#/map').replace('#/',''),false); focusView(); } });
render();
</script>
<script>
/* Calm: every help bullet list (ul.notes) becomes one (i); its words show on hover or tap. */
(function () {
  function calm() {
    document.querySelectorAll('ul.notes:not([data-calm])').forEach(function (ul) {
      var t = Array.prototype.map.call(ul.querySelectorAll('li'), function (li) { return li.textContent.trim(); }).join(' · ');
      var s = document.createElement('span'); s.className = 'info'; s.title = t; s.setAttribute('tabindex', '0'); s.textContent = 'i';
      var h = document.createElement('span'); h.textContent = ' ' + t; h.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap'; s.appendChild(h); // screen readers (and tests) still get the words
      ul.setAttribute('data-calm', '1'); ul.replaceWith(s);
    });
  }
  new MutationObserver(calm).observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener('DOMContentLoaded', calm); calm();
})();
</script>
