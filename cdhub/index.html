<style>
/* ==== House look (Master design rules, LINKS-COMFORT-BRIEF v3, 28 Oct 2026; same as Studio).
   Lexend 400/600, nothing under 13px, line height 1.5, no uppercase. 1px lines. Hover AND selected = the same 1px edge
   turns ink (outline over it), nothing moves; keyboard focus 1px ink inside. ONE radius, 12px (circles only for status dots and
   who rings). No coloured words, no solid colour fills: colour lives in dots, thin bars, 1px rings and light tints.
   Dark frame top and bottom. Greys follow Warm clear (default) or Cool clear, read from Studio's Look ('dash-look', read only).
   Screens are built on generic Bloodline foundation concepts (record, round, check, rule, place, person, document);
   animal-only parts are marked "kit: animal". ==== */
/* Greys, lines, frame, radius, the control line, counts, date pills, tabs and the hover rule: ../tokens.css through ../house.css,
   the same on every hub. CD Hub's own names below: the LJR7 slots, the kit (sex) colours and the old short names. */


:root{--sel-fill:var(--hov);

 --p0:var(--ljr-0);--p2:var(--ljr-2);--p3:var(--ljr-3);--p4:var(--ljr-4);--p5:var(--ljr-5);--p6:var(--ljr-6);--p7:var(--ljr-7);--p8:var(--ljr-8);
 --male:#2E86B0;--male-n:#9CC6DA;--female:#C85C87;--female-n:#EBB6CB;--unk:var(--ljr-0);

 --fg:var(--ink);--ln:var(--line);--sub:var(--muted);}
:root.sel-soft{--sel-fill:var(--hov);}
html.text-lg body{zoom:1.12}html.text-xl body{zoom:1.25}html.space-roomy body{line-height:1.75}
*{box-sizing:border-box}
h1,h2,h3,h4,b,strong,th{font-weight:600}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--fs-body)/1.5 var(--house-font);-webkit-text-size-adjust:100%;hyphens:manual}
a{color:inherit;text-underline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}
.wrap,.hin{max-width:none;margin:0 auto;padding-left:var(--house-gutter);padding-right:var(--house-gutter)}
.wrap{padding-bottom:140px}
.ti{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}



.hbackrow{margin:12px 0 0}
header.top{background:var(--frame);color:var(--frame-ink);position:sticky;top:0;z-index:20}
header h1 .dot{background:var(--ljr-5)}
.live{font-size:var(--fs-small);font-weight:600;border:1px solid var(--frame-line);border-radius:var(--radius);padding:0 8px;height:24px;display:inline-flex;align-items:center;white-space:nowrap;color:var(--frame-ink)}
.live.ok{border-color:var(--ljr-5)}.live.bad{border-color:var(--ljr-2)}
header .btn{color:var(--frame-ink);background:transparent;border-color:var(--frame-line)}
@media (hover:hover){header .btn:hover{background:var(--frame-hov);}}
header .btn:focus-visible{outline: 1px solid var(--frame-ink);outline-offset: -1px}
.backhome{text-decoration:none}

html.dash-locked header .backhome{color:var(--ink);border-color:var(--press)}


@media (max-width:544px){ .wrap{padding-bottom:170px} }


h2{font-size:var(--fs-head);margin:24px 0 4px;line-height:1.3}
h3{font-size:var(--fs-head);margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:var(--fs-body);margin:0 0 16px;max-width:74ch}
.mut{color:var(--muted);font-size:var(--fs-small)}
.szd{display:inline-block;width:10px;height:10px;border-radius:50%;border:3px solid;margin-right:4px;vertical-align:-1px;box-sizing:border-box}
.note{font-size:var(--fs-small);color:var(--muted);margin:8px 0 12px}
code{font-family:inherit;font-size:var(--fs-small);font-variant-numeric:tabular-nums;background:transparent;padding:0}


.card{margin:0 0 12px;box-shadow:var(--shadow)}
.hhome .hcard{margin:0;display:flex;flex-direction:column;gap:8px}.hhome .hcard h3{margin:0}.hcnum{font-weight:600}
.hctop{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}.hctop a,.hsee{color:var(--ink)}
.hlist{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:8px}
.hlist li{display:flex;align-items:center;gap:8px;padding-left:12px;box-shadow:inset 3px 0 0 var(--ljr-0)}
.hlist li span{flex:1}.hadd{display:flex;flex-wrap:wrap;gap:8px}
.hlist li[data-slot="0"]{box-shadow:inset 3px 0 0 var(--ljr-0)}.hlist li[data-slot="1"]{box-shadow:inset 3px 0 0 var(--ljr-1)}.hlist li[data-slot="2"]{box-shadow:inset 3px 0 0 var(--ljr-2)}.hlist li[data-slot="3"]{box-shadow:inset 3px 0 0 var(--ljr-3)}.hlist li[data-slot="4"]{box-shadow:inset 3px 0 0 var(--ljr-4)}.hlist li[data-slot="5"]{box-shadow:inset 3px 0 0 var(--ljr-5)}.hlist li[data-slot="6"]{box-shadow:inset 3px 0 0 var(--ljr-6)}.hlist li[data-slot="7"]{box-shadow:inset 3px 0 0 var(--ljr-7)}.hlist li[data-slot="8"]{box-shadow:inset 3px 0 0 var(--ljr-8)}

.card.dash{border-style:dashed}
.card h4,.card .hx4{margin:0 0 12px;font-size:var(--fs-head);font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:0;line-height:1.4}
.card p{margin:0 0 8px;font-size:var(--fs-body)}.card p:last-child{margin-bottom:0}

.card.acc2>:is(h4,.hx4):first-child::before,.card.acc5>:is(h4,.hx4):first-child::before{content:"";width:10px;height:10px;border-radius:50%;flex:none;border:1px solid var(--ljr-2);background:var(--ljr-2-tint)}
.card.acc5>:is(h4,.hx4):first-child::before{border-color:var(--ljr-5);background:var(--ljr-5-tint)}
.card .card{box-shadow:none}


.btn,.cb,.ci,.tl,.next button,.sfb,.achip,#main button:not(.tile):not(.ttl):not(.rdel):not(.jd):not(.phbtn):not(.gx):not(.ged):not(.gpick),.filt select,.fpanel select,.filt input,.sbox,.sortsel,.tmp input,#rdate,.frow select,.frow input{
 font-family:inherit;font-size:var(--fs-small);font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--press);border-radius:var(--radius);
 min-height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none;box-sizing:border-box;line-height:1.2}
.filt input,.sbox input,.tmp input,#rdate,.frow input{font-weight:400;cursor:text}
/* 17 Nov 2026: Compliance's "What was true on" and "Add a rule" rows were bare browser boxes (24-30px), not house controls */
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;min-width:0}.frow select{padding:0 10px;max-width:100%;min-width:0}
.radd{max-width:100%}   /* the "add a dog" list on The round: a long name never makes a 360px phone scroll sideways (20 Nov 2026) */
.filt select,.fpanel select,.sortsel{padding:0 10px}
.btn[disabled],#main button[disabled]{cursor:not-allowed;opacity:.6}
@media (hover:hover){.filt select:hover, .fpanel select:hover, .frow select:hover {background:var(--hov);}
.btn:hover, .cb:hover, .ci:hover, .tl:hover, .next button:hover, .sfb:hover, .achip:hover, #main button:not(.tile):not(.ttl):not(.jd):not(.phbtn):not(.gx):not(.ged):not(.gpick):hover, .sortsel:hover, .mrow.go:hover {background:var(--hov);}}
.sfb[aria-pressed="true"],.fbtn[aria-expanded="true"]{background:var(--sel-fill);outline:1px solid var(--sel-bd);outline-offset:-1px;}
.sfb[aria-pressed="true"]::after{content:"\2713";margin-left:2px}
.sv-line{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}.sv-ic{display:inline-flex}.sv-ic svg{width:16px;height:16px}
.sv-line.good .sv-ic{color:var(--house-ok)}.sv-line.wait .sv-ic{color:var(--muted)}


@media (hover:hover){.btn.yes:hover{background:var(--hov);}.btn.no:hover{background:var(--hov);}}
.dc .nl .st{border:0;padding:0;height:auto;font-size:var(--fs-small)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
:focus-visible{outline: 1px solid var(--ink)!important;outline-offset: -1px}
/* Typing boxes: one 1px line inside the rounded box; focus recolours that line. Never a second square ring. */
:is(input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),select,textarea):is(:focus,:focus-visible){outline:none!important;border-color:var(--ink)}
.sbox input:is(:focus,:focus-visible){outline:none!important}
.sbox:focus-within{border-color:var(--ink)}
/* any touch screen too (Lisa 17 Nov 2026: the folding phone open is 860px wide) */
@media (max-width:544px),(pointer:coarse){.btn,.cb,.ci,.tl,.next button,.sfb,.achip,#main button:not(.tile):not(.ttl):not(.rdel):not(.jd):not(.phbtn):not(.gx):not(.ged):not(.gpick),.filt select,.filt textarea,.fpanel select,.filt input,.sbox,.sortsel,.tmp input,#rdate,.frow select,.frow input{min-height:44px}}


.pill{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--radius);font-size:var(--fs-small);font-weight:600;border:1px solid var(--press);white-space:nowrap;color:var(--ink);background:transparent;vertical-align:middle}
.pill.ok{border-color:var(--ljr-5-text);box-sizing:border-box;width:var(--house-count-w);padding:0 var(--house-count-pad);line-height:var(--house-count-lh);justify-content:center;flex:none}
.pill.no{border-color:var(--ljr-2);background:var(--ljr-2-tint)}
.pill.w{border-color:var(--ljr-3-text);background:var(--ljr-3-tint)}
.pill.i{border-color:var(--press)}

.cnt{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:var(--house-count-w);height:var(--house-count-h);padding:0 var(--house-count-pad);border-radius:var(--house-count-r);border:1px solid var(--ink);font-size:var(--fs-small);font-weight:600;line-height:var(--house-count-lh);white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink);background:transparent;flex:none}
.cnt.wide{width:auto;min-width:30px;padding:0 6px}
.cnt.need{border-color:var(--ljr-2);background:transparent}
.cnt.ok{border-color:transparent}
.card h4 .cnt,.card .hx4 .cnt,.mcard h3 .cnt{margin-left:auto}

.dpill{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1px solid var(--press);border-radius:var(--radius);font-size:var(--fs-small);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.dpill.late{border-color:var(--ljr-2);background:var(--ljr-2-tint)}
.dpill.soon{border-color:var(--ljr-3-text);background:var(--ljr-3-tint)}
.pill:hover,.cnt:hover,.dpill:hover,.live:hover{outline:none}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,var(--ljr-0));flex:none;vertical-align:0}
.info{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid var(--press);border-radius:var(--radius);font-size:var(--fs-small);font-weight:600;color:var(--muted);cursor:pointer;vertical-align:middle}
@media (hover:hover){.info:hover,#sopcard .sopgrp>summary:hover{background:var(--hov)}}   /* the house hover fill, on the two controls that had none */
.infonote{display:block;margin:4px 0 8px;font-size:var(--fs-small);font-weight:400;color:var(--muted);max-width:74ch;white-space:normal}


.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:0 0 8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;text-align:left;font:inherit;color:var(--ink);min-width:0}
.countline{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 0 10px;align-items:center}
.countline button{min-height:36px;padding:0 10px;border:1px solid var(--press);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:var(--fs-small);cursor:pointer}
.countline button b{font-weight:600;margin-right:4px}
.countline button[aria-pressed="true"]{border-color:var(--ljr-6)}
.card[data-room]{margin-bottom:12px}
#view h3{margin:10px 0 6px}
.tile .n{font-size:var(--fs-figure);font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .k{font-size:var(--fs-small);font-weight:600;margin-top:2px}
.tile .src{font-size:var(--fs-small);color:var(--muted);margin-top:4px;line-height:1.4}
button.tile{cursor:pointer;border-color:var(--press);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;width:100%}
@media (hover:hover){button.tile:hover{background:var(--hov);}}


.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-small)}
th{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
/* Tables (the owner 17 Nov 2026, "improve spacing and layout on all tables"). tidyTables() below marks the cells:
   rows sit on one middle line; short values never break ("6y 4m"); long text wraps at a readable width; the cell with
   buttons stays in view at the right edge while the rest scrolls. Narrow phones: each row becomes a small card. */
table[data-tidy] td{vertical-align:middle}
.scroll table[data-tidy] th,.scroll table[data-tidy] td{padding:10px 14px}
/* only where the table can scroll sideways: a table outside a scroll box must still fit the screen */
.scroll table[data-tidy] td.tshort{white-space:nowrap}
.scroll table[data-tidy] td.tlong{min-width:22ch;max-width:44ch}
.scroll table[data-tidy] td.tact{white-space:nowrap;position:sticky;right:0;background:var(--card);box-shadow:-8px 0 8px -8px var(--line)}
table[data-tidy] td.tact>:is(button,select,input,a){vertical-align:middle;margin:2px 4px 2px 0}
/* Sentence case (house rule 1): a column name starts with a capital, as every other heading does (17 Nov 2026) */
table[data-tidy] th::first-letter{text-transform:uppercase}
@media (max-width:600px){
 table.tstack,table.tstack tbody,table.tstack tr,table.tstack td{display:block;width:auto}
 table.tstack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
 table.tstack tr{padding:10px 14px;border-bottom:1px solid var(--line)}
 table.tstack tr:last-child{border-bottom:none}
 /* 17 Nov 2026: written with .scroll and [data-tidy] so it outranks the wide-table rules above (the cards kept 10px 14px cell padding,
    the action cell stayed sticky with its shadow, and short cells never wrapped) */
 .scroll table.tstack[data-tidy] td{padding:3px 0;border:none;position:static;box-shadow:none;background:none;max-width:none;min-width:0;white-space:normal}
 table.tstack td[data-label]:not(:first-child)::before{content:attr(data-label) ': ';color:var(--muted)}
 table.tstack td:first-child{font-weight:600}
 table.tstack td:empty{display:none}
}

    var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f.replace(/\s+$/,'')); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f.replace(/\s+$/,'')); rows.push(row); }
  rows=rows.filter(function(r){ return r.length>1 || (r[0]||'').trim()!==''; });
  if(!rows.length) return [];
  var head=rows[0].map(function(h){return h.trim();});

function csvCell(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function headerCols(text){
 text=String(text||'').replace(/^\uFEFF/,'').replace(/\r/g,'');
 var line=(text.split('\n')[0]||'');
 if(!line.trim()) return null;
 var cols=[],f='',q=false;
 for(var i=0;i<line.length;i++){
  var c=line[i];
  if(q){ if(c==='"'){ if(line[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
  else if(c==='"') q=true;
  else if(c===','){ cols.push(f.trim()); f=''; }
  else f+=c;
 }
 cols.push(f.trim());
 return {cols:cols,text:text};
}
/* Append one row to the named file in the folder. A Sheet gets one appended row. A csv file is read and written back.
   If the name is missing, doubled, or the read fails, nothing is written. */
async function appendListedRow(name, label, fields){
 var hits=(window._driveFiles||[]).filter(function(f){ return f&&f.name===name&&f.id; });
 if(hits.length!==1) return {ok:false, message:hits.length>1?('Not saved: more than one '+label+' is in the folder.'):('Not saved: the '+label+' is not in the folder.')};
 var file=hits[0], parsed;
 try{ parsed=headerCols(await readDriveFile(file)); }
 catch(e){ return {ok:false, message:'Not saved: the '+label+' could not be read.'}; }
 if(!parsed) return {ok:false, message:'Not saved: the '+label+' has no header.'};
 var values=parsed.cols.map(function(c){ return fields[c]==null?'':String(fields[c]); });
 try{
  var res;
  if(file.mimeType==='application/vnd.google-apps.spreadsheet'){
   var url='https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(file.id)+'/values/A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS';
   res=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({values:[values]})});
  }else{
   var updated=parsed.text.trimEnd()+'\n'+values.map(csvCell).join(',');
   var boundary='cdhub_bnd';
   var meta=JSON.stringify({name:name,mimeType:file.mimeType||'text/csv'});
   var body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+boundary+'\r\nContent-Type: text/csv\r\n\r\n'+updated+'\r\n--'+boundary+'--';
   res=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(file.id)+'?uploadType=multipart&supportsAllDrives=true',{method:'PATCH',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'multipart/related; boundary="'+boundary+'"'},body:body});
  }
  if(!res.ok) return {ok:false, message:'Not saved: the '+label+' could not be updated.'};
  return {ok:true};
 }catch(e){ return {ok:false, message:'Not saved: the '+label+' could not be updated.'}; }
}

   used[t]=1; });

  navPickable().forEach(function(sc){

   if(want.tab[sc.id]!==now.tabs.indexOf(sc.id)+1||!now.set) posts.push(['nav.tab.OWNER.'+sc.id,want.tab[sc.id]]); });   /* the bar is saved whole: a partial set would drop the rest */

<script>
/* Calm: every help bullet list (ul.notes) becomes one (i); its words show on hover or tap.
   Findings lists (Compliance: needs a look, room limits) carry data-calm="off" and always show. */
(function () {
  function calm() {
    document.querySelectorAll('ul.notes:not([data-calm])').forEach(function (ul) {
      var t = Array.prototype.map.call(ul.querySelectorAll('li'), function (li) { return li.textContent.trim(); }).join(' · ');
      var s = document.createElement('span'); s.className = 'info'; s.title = t; s.setAttribute('tabindex', '0'); s.setAttribute('role', 'button'); s.setAttribute('aria-expanded', 'false'); s.textContent = 'i';
      var h = document.createElement('span'); h.textContent = ' ' + t; h.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap'; s.appendChild(h);
      ul.setAttribute('data-calm', '1'); ul.replaceWith(s);
    });
  }
  /* An (i) says its words when it is tapped or pressed: a title alone shows nothing on a phone. A second tap puts them away. */
  function say(i) {
    var n = i.nextElementSibling;
    if (n && n.classList.contains('infonote')) { n.remove(); i.setAttribute('aria-expanded', 'false'); return; }
    n = document.createElement('span'); n.className = 'infonote'; n.setAttribute('role', 'note'); n.textContent = i.title || '';
    i.insertAdjacentElement('afterend', n); i.setAttribute('aria-expanded', 'true');
  }
  document.addEventListener('click', function (e) { var i = e.target.closest && e.target.closest('.info'); if (!i) return; e.preventDefault(); e.stopPropagation(); say(i); }, true);
  document.addEventListener('keydown', function (e) { var i = e.target; if (!i.classList || !i.classList.contains('info') || (e.key !== 'Enter' && e.key !== ' ')) return; e.preventDefault(); say(i); });
  new MutationObserver(calm).observe(document.documentElement, { childList: true, subtree: true });
  /* Every table (the owner 17 Nov 2026): mark each cell once so the CSS above can lay it out. A cell with a button, box or
     list is the action cell; up to 16 characters is short (kept on one line); over 40 is long (wraps at a set width).
     A plain table (no merged cells) also gets each cell's column name, for the card layout on narrow phones. */
  function tidyTables() {
    document.querySelectorAll('table:not([data-tidy])').forEach(function (t) {
      t.setAttribute('data-tidy', '1');
      var heads = Array.prototype.map.call(t.querySelectorAll('thead th'), function (th) { return th.textContent.trim(); });
      var plain = heads.length > 0 && heads.length <= 8 && !!t.closest('.scroll') && !t.querySelector('[colspan]:not([colspan="1"]),[rowspan]:not([rowspan="1"])');
      if (plain) t.classList.add('tstack');
      Array.prototype.forEach.call(t.querySelectorAll('tbody tr'), function (tr) {
        Array.prototype.forEach.call(tr.children, function (td, i) {
          if (td.tagName !== 'TD') return;
          var n = td.textContent.trim().length;
          if (td.querySelector('button,select,input,textarea')) td.classList.add(i === tr.children.length - 1 ? 'tact' : 'tshort');
          else if (n <= 16) td.classList.add('tshort');
          else if (n > 40) td.classList.add('tlong');
          if (plain && heads[i]) td.setAttribute('data-label', heads[i].charAt(0).toUpperCase() + heads[i].slice(1));   /* the card's labels in sentence case, like the column names */
        });
      });
    });
  }
  var tidyQueued = false;
  new MutationObserver(function () { if (tidyQueued) return; tidyQueued = true; requestAnimationFrame(function () { tidyQueued = false; tidyTables(); }); })
    .observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener('DOMContentLoaded', tidyTables);
  document.addEventListener('DOMContentLoaded', calm); calm();
})();
</script>
