l": "https://apps.apple.com/us/app/good-dog-for-breeders/id1527487456"}]}, {"rank": 4, "want": "Website and enquiries joined up with records", "evidence_count": "2 mentions + 4 vendors moving to website tiers", "quotes": [{"quote": "does not currently integrate well with personal websites", "url": "https://www.capterra.com/p/176356/Breeder-Cloud-Pro/reviews/"}]}, {"rank": 5, "want": "Licence obligations tracked (UK)", "evidence_count": "1 direct review + whole UK compliance category exists", "quotes": [{"quote": "Noted some licensing requirements missing", "url": "https://apps.apple.com/gb/app/breedera-dog-breeder-app/id1430975439"}]}, {"rank": 6, "want": "Basics not paywalled (preventatives, health) / fair price", "evidence_count": "3 mentions", "quotes": [{"quote": "a notebook or spreadsheet could contain the same info for much, much cheaper", "url": "https://play.google.com/store/apps/details?id=com.iHatch_Apps.PuppyFat"}, {"quote": "the price seems to increase every year with not a lot of updates", "url": "https://www.capterra.com/p/176356/Breeder-Cloud-Pro/reviews/"}]}, {"rank": 7, "want": "Pedigrees and DNA results read in automatically (scans, lab PDFs)", "evidence_count": "2 mentions + 2 vendors now market AI import", "quotes": [{"quote": "request: automatic pedigree generation from scans", "url": "https://www.softwareadvice.com/kennel/breeder-cloud-pro-profile/"}]}, {"rank": 8, "want": "Mark dogs as rehomed/deceased (archive) without losing history", "evidence_count": "1", "quotes": [{"quote": "request: dog archiving/status marking (rehomed, deceased)", "url": "https://www.softwareadvice.com/kennel/breeder-cloud-pro-profile/"}]}], "most_wanted_note": "Ranking is by count of mentions found; review volumes are small (only BreederCloudPro and Breedera have usable counts). Reddit, Facebook groups, PetForums and Champdogs threads were blocked, so this list under-represents UK forum voices.", "structure_comparison": {"counts": {"total_entries": 27, "one_app_fixed_tiers_or_single_plan": 17, "one_app_with_paid_modules_or_add_ons": 4, "family_of_separate_apps": 2, "marketplace_or_free_registry_tools": 3, "spreadsheet": 1, "multi_species_one_app": 9, "dogs_and_cats": 3, "dogs_only": 12, "per_species_separate_editions": 1, "note": "counts by this pass; marketplaces/spreadsheets excluded from species counts"}, "detail": {"modules": ["Gespet (pay per business module, one bundle)", "ZooEasy (tiers by seats + one-off modules €335-€600: CBR, waiting list, mean kinship, API)", "BreederBuddy (website tier + one-off branding)", "PedFast (desktop app + paid add-on packs)"], "separate_apps": ["BreedMate (Publisher / Host / Point, joined by a shared database)", "Tenset (separate products and per-species editions, no shared login; retired)"], "multi_species_one_app": ["BreederCloudPro", "BreederHQ", "Breed Ledger", "ZooEasy", "Gespet", "Kintraks", "BreedMate", "PedFast", "Animal Database UK"], "per_species": ["Tenset (retired) used separate per-species editions; nobody live does."]}, "meaning_for_bloodline": "The market buys one login with levels; separate apps are the legacy/retired pattern. Modules appear only where buyers are clubs or multi-business (ZooEasy, Gespet), and there they are priced as one-off extras for organisations. So: one app with levels for breeders, plus paid add-ons only for genuinely separate costs (AI import, white-label). Multi-species is common among the US cloud tools but every UK rival is dogs-only; design species as data (no dog-only columns) but sell dogs first."}, "decisions": [{"id": "BLD-D1", "question": "Shape: one app with levels, modules, or separate apps?", "options": [{"key": "A", "label": "One app with levels (Free/Breeder/Licensed Kennel/Kennel Pro/Partner)", "tradeoff": "simple to sell and build; heavy users pay for whole level"}, {"key": "B", "label": "Core app + paid modules (compliance, portal, website)", "tradeoff": "flexible; more pricing pages, harder to explain; only club vendors do this"}, {"key": "C", "label": "Separate apps (pedigree tool, compliance tool, portal)", "tradeoff": "three products to maintain; breaks Bloodline's edge, the joins"}], "rec_key": "A", "rec": "One app with levels; keep add-ons only for AI import and white-label.", "evidence": ["17 of 27 entries are one app with tiers or a single plan; 4 add modules/add-ons", "separate-app pattern only at retired Tenset and legacy BreedMate", "modules only at ZooEasy/Gespet whose buyers are clubs or multi-business"]}, {"id": "BLD-D2", "question": "What should the ★ Licensed Kennel level cost now that Breedera Premium is free for licensed Pets4Homes advertisers?", "options": [{"key": "A", "label": "Keep £25/mo", "tradeoff": "matches 'pays twice' story (£11.99 + Breedera), but Breedera half may now be £0"}, {"key": "B", "label": "£19/mo (£190/yr)", "tradeoff": "sits between Digital PawPrint £11.99 and AAL Small £30; easier sell to 1-2 litter home breeders"}, {"key": "C", "label": "£15/mo", "tradeoff": "undercuts most, thinner margin; the earlier pass's fallback if PawPrint goes free"}], "rec_key": "B", "rec": "£19/mo; test £25 later once reviews exist.", "evidence": ["Pets4Homes support article: Breedera free for licensed breeders (title/snippet, UNVERIFIED)", "Animal Database UK AAL Small £30 (snippet)", "Digital PawPrint £11.99 (snippet)", "RKC June 2025: two-thirds of licences are 1-2 litter home breeders"]}, {"id": "BLD-D3", "question": "Free tier: keep 3 dogs / 1 litter, or match Breedera's unlimited-dogs free tier?", "options": [{"key": "A", "label": "Keep 3 dogs, 1 litter", "tradeoff": "clear upgrade pressure; looks mean beside Breedera/Breed Ledger"}, {"key": "B", "label": "BreedTools-style: 10 dogs, 1 active litter", "tradeoff": "credible; limit bites at litter time when value is felt"}, {"key": "C", "label": "No free tier, 30-day trial", "tradeoff": "fewer sign-ups; most US rivals do this"}], "rec_key": "B", "rec": "10 dogs, 1 active litter, no compliance or portal.", "evidence": ["Breedera Free unlimited dogs/litters", "BreedTools free 10 dogs/1 litter", "Breed Ledger free unlimited records"]}, {"id": "BLD-D4", "question": "Is licence compliance in the first version (Lisa's 23 Sep question)?", "options": [{"key": "A", "label": "Yes, in v1", "tradeoff": "it is the only unoccupied gap; more build before first sale"}, {"key": "B", "label": "Later, lead with pedigree + portal", "tradeoff": "enters the crowded US-style space with Breedera free in UK"}], "rec_key": "A", "rec": "Yes - a slim v1 compliance: starter checklist, temperature log, inspector view.", "evidence": ["no rival joins compliance + pedigree + portal", "pedigree/portal crowded: 10+ rivals", "Breedera free via Pets4Homes"]}, {"id": "BLD-D5", "question": "Inspector access: breeder-controlled or automatic reporting like Digital PawPrint?", "options": [{"key": "A", "label": "Breeder-controlled, time-boxed, read-only link", "tradeoff": "breeders trust it; councils get less"}, {"key": "B", "label": "Council dashboard with scores", "tradeoff": "council channel; breeders may fear surveillance"}], "rec_key": "A", "rec": "Breeder-controlled; market it against automatic council scoring.", "evidence": ["Digital PawPrint notifies councils when score drops (vendor-linked page, snippet)"]}, {"id": "BLD-D6", "question": "Partner/club tier price and shape", "options": [{"key": "A", "label": "From £149/mo + per breeder", "tradeoff": "as planned; above Breed Ledger org $49 (~£37)"}, {"key": "B", "label": "From £49/mo + £2-3 per breeder seat", "tradeoff": "nearer Breed Ledger; per-seat like ZooEasy (€1.34 breeder seat)"}, {"key": "C", "label": "Rule-pack publishing as one-off fee (like ZooEasy CBR €495) + per breeder", "tradeoff": "matches club budgets; less recurring"}], "rec_key": "B", "rec": "From £49/mo plus a per-breeder seat; rule-pack setup as optional one-off.", "evidence": ["Breed Ledger org from $49/mo (snippet)", "ZooEasy Multi seats €1.34/breeder; CBR module €495", "ZooEasy Unlimited £311.95/m etforums.co.uk/threads/new-dog-breeding-app.516499/", "what": "UK breeders' views on breeder apps"}, {"url": "https://forum.champdogs.co.uk/topic_show.pl?tid=140793", "what": "'Breeder software, which one do you use?' thread"}, {"url": "https://www.reddit.com/r/dogbreeding/", "what": "software/spreadsheet threads (Reddit unreachable)"}, {"url": "https://www.etsy.com/uk/listing/4465199714/dog-breeder-spreadsheet-litter", "what": "UK template price and reviews (403)"}, {"url": "https://www.g2.com/products/breeder-buddy-dog-breeding-software/reviews", "what": "check G2 4.9 (146) claim"}, {"url": "Facebook breeder groups (UK licensed breeders)", "what": "most-wanted features and complaints; needs Lisa's login"}, {"url": "https://www.trustpilot.com/search?query=breeder", "what": "Trustpilot pages for Breedera, BreederCloudPro, Digital PawPrint (none surfaced in search)"}]};
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const cls=v=>{v=String(v).toLowerCase();return v.startsWith("yes")?"y":v.startsWith("partial")||v.startsWith("paid")||v.startsWith("add")?"p":v.startsWith("no")?"n":""};
let h=[];

h.push(`<div class="note"><b>How to read this.</b> Figures marked “snippet” came from a search result because the vendor's page blocked the cloud: check them by hand. ${D.blocked.length} pages are queued for the Chrome agent. Currency: ${e(D.price_ladder_note)}</div>`);
h.push(`<section id="find"><h2>What matters</h2><div class="find">${D.gaps.map((g,i)=>`<div><b>Gap ${i+1}</b><p>${e(g)}</p></div>`).join("")}</div></section>`);
const S=D.structure_comparison,c=S.counts;
h.push(`<section id="shape"><h2>How rivals are built: modules, tiers or separate apps?</h2><div class="shape">
<div><div class="n">${c.one_app_fixed_tiers_or_single_plan}</div><div class="l">one app, tiers or one plan</div></div>
<div><div class="n">${c.one_app_with_paid_modules_or_add_ons}</div><div class="l">one app + paid modules</div></div>
<div><div class="n">${c.family_of_separate_apps}</div><div class="l">separate linked apps</div></div>
<div><div class="n">${c.multi_species_one_app}</div><div class="l">many species, one app</div></div>
<div><div class="n">${c.dogs_only}</div><div class="l">dogs only (all UK rivals)</div></div></div>
<div class="tbl" style="margin-top:12px"><table><tr><th>Pattern</th><th>Who</th></tr>
<tr><td>Paid modules</td><td>${S.detail.modules.map(e).join("<br>")}</td></tr>
<tr><td>Separate apps</td><td>${S.detail.separate_apps.map(e).join("<br>")}</td></tr>
<tr><td>Many species, one app</td><td>${S.detail.multi_species_one_app.map(e).join(", ")}</td></tr></table></div>
<p class="lede" style="margin-top:10px"><b>What it means for Bloodline:</b> ${e(S.meaning_for_bloodline)}</p></section>`);
h.push(`<section id="want"><h2>What breeders ask for most</h2><p class="lede">${e(D.most_wanted_note)}</p><div class="want">${D.most_wanted.map(w=>`<div><span class="rank">${w.rank}</span><b>${e(w.want)}</b> <span class="chip">${e(w.evidence_count)}</span>${(w.quotes||[]).map(q=>`<q>“${e(q.quote)}” ${L(q.url)}</q>`).join("")}</div>`).join("")}</div></section>`);
const pl=D.price_ladder.filter(p=>p.gbp_month!=null).sort((a,b)=>a.gbp_month-b.gbp_month),mx=Math.max(...pl.map(p=>p.gbp_month),1);
h.push(`<section id="price"><h2>Price ladder, £ a month</h2><div class="bars">${pl.map(p=>{const us=/bloodline/i.test(p.competitor);return `<div class="bar${us?" us":""}"><span title="${e(p.competitor+" · "+p.tier)}">${e(p.competitor)} · ${e(p.tier)}</span><div class="t" style="width:${(p.gbp_month/mx*100).toFixed(1)}%"></div><span>£${p.gbp_month.toFixed(2)}</span></div>`}).join("")}</div></section>`);
const F=D.feature_matrix;
h.push(`<section id="matrix"><h2>Feature by feature</h2><div class="tbl"><table><tr><th>Feature</th>${F.columns.map(x=>`<th>${e(x)}</th>`).join("")}</tr>${F.features.map(f=>`<tr><td><b>${e(f)}</b></td>${F.columns.map(x=>{const v=(F.rows[f]||{})[x]??"";return `<td class="${cls(v)}">${e(v)}</td>`}).join("")}</tr>`).join("")}</table></div></section>`);

 return `<details class="c"><summary><b>${e(c.name)}</b><span class="chip">${e(c.region)}</span><span class="chip">${e((c.platforms||[]).join(", "))}</span><span class="chip">${rt}</span></summary><div class="cbody">

 <div><h4>Built as</h4><p>${e(c.structure)}</p><h4 style="margin-top:8px">Species</h4><p>${e(c.species)}</p><h4 style="margin-top:8px">Linked to</h4><p>${e(c.integration)}</p></div>
 <div><h4>Pricing</h4><ul>${pr||"<li>not found</li>"}</ul></div>
 <div><h4>Features</h4><ul>${ft}</ul></div>
