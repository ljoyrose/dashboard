/* ---------------- store ---------------- */
function stamp(t){ if(!t) return ''; try{ return new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return String(t);} }

async function boot(){
  render();
  var u=null;
  try{ u=await window.claude.use('user'); }catch(e){}
  try{ CANWRITE = u ? (u.can ? u.can('data.write') : null) : null; }catch(e){ CANWRITE=null; }
  var db=null;
  try{ db=await window.claude.use('db'); }catch(e){ db=null; }
  if(!db){ DB=null; READY=true; setState('store unavailable — answers cannot be kept on this view'); render(); return; }
  DB=db;
  try{
    DB.collection('answers').onSnapshot(function(snap){
      var next={};
      (snap && snap.docs ? snap.docs : []).forEach(function(d){
        var v = d.data ? (typeof d.data==='function'? d.data() : d.data) : null;
        if(v) next[d.id]=v;
      });
      ANS=next; READY=true;
      setState(Object.keys(ANS).length+' of '+Q.length+' answered · read back from the store');
      grabDrafts();
      if(typingNow()){ setTimeout(function(){ if(!typingNow()) render(); }, 4000); }
      else render();
    }, function(){ READY=true; setState('store read failed — answers shown may be incomplete'); render(); });
  }catch(e){ READY=true; setState('store read failed'); render(); }
}

  if(v===null||v===undefined) return ['na','not assessed'];
  if(v==='No') return ['no','ruled out'];
  if(v<=1.0) return ['g1','very low'];
  if(v<=3.0) return ['g2','low'];

  if(v<7.0)  return ['g4','high'];
  return ['g5','very high'];
}

  h+='<div class="card est" style="margin-top:14px"><h4>The four joins that carry the whole thing</h4>'

   +'<tr><td><code>subject.sire_id / dam_id</code></td><td>the pedigree, the ancestor certificate library, relatedness and COI — <b>all of it out of two columns on one table</b></td></tr>'
   +'<tr><td><code>occupancy</code></td><td><b>capacity and temperature at once.</b> It proves the room was never over its limit, <i>and</i> it decides which temperature band applied that day</td></tr>'
   +'<tr><td><code>sop_version</code></td><td>every checklist, reference card and operational record points at the version <b>in force when it happened</b>, not the current one</td></tr>'
   +'<tr><td><code>rule_scope</code></td><td>country → council → your licence. <b>Move to England and the Welsh rules stop applying by themselves</b></td></tr>'
   +'</table></div></div>';
  h+='<div class="card risk"><h4>And the five that cannot be bolted on later</h4><p style="margin:0"><code>occupancy</code> kept as history · <code>consent</code> lawful basis · <code>valid_to</code> on the rule tables · <code>tenant_id</code> everywhere · <b>temperature stored at 2 decimal places.</b> Add any of the first four late and it is a data migration. Add the last late and it is <b>not recoverable at all</b> — rounded is rounded.</p></div>';
  return h;
}
/* ---- relationships: derived from SCHEMA_FULL at render time, never typed ---- */
var REL_ALIAS={
  instance_id:'checklist_instance', promoted_from_instance_id:'checklist_instance',
  action_checklist_template_id:'checklist_template', card_id:'reference_card',
  condition_id:'licence_condition', actor_id:'person', author:'person', owner_id:'person',
  assigned_to:'staff', escalated_to:'staff', by:'staff', driver_id:'staff', owner:'staff',
  administered_to_subject_id:'subject', puppy_subject_id:'subject', row_subject_id:'subject',
  dam_id:'subject', sire_id:'subject', subject_ids:'subject',
  parent_area_id:'area', destination_area_id:'area',
  applied_limit_id:'environment_limit', reading_id:'area_reading',
  follow_up_reading_id:'area_reading', import_id:'pedigree_import',
  matched_sop_version_id:'sop_version', escalated_to_visit_id:'visit',
  purchase_order_line_id:'purchase_order_line', measure_id:'mitigation_measure',
  promote_to_health_screen_id:'health_screen', supersedes_id:'coshh_assessment',
  previous_season_id:'season', previous_stage_id:'pipeline_stage',
  requires_competency:'staff_competency', products_used:'product',
  template_id:'checklist_template', based_on:'board_scenario', superseded_by:'media', default_vet_practice:'person'
};
var REL_EXTERNAL={stored_blob_id:'file storage, not a table'};
var REL_POLY={entity_id:1,record_id:1,subject_or_area:1};
function relGraph(){
  var real=(typeof SCHEMA_FULL!=='undefined'?SCHEMA_FULL:[]).filter(function(t){return t[0]!==t[0].toUpperCase();});
  var names={}; real.forEach(function(t){names[t[0]]=t;});
  var links=[],alias=[],ext=[],poly=[],unknown=[];
  real.forEach(function(t){
    t[3].forEach(function(f){
      if(f[0]===f[0].toUpperCase()) return;
      var ns=f[0].split('·').map(function(x){return x.trim();});
      var ts=f[1].split('·').map(function(x){return x.trim();});
      ns.forEach(function(n,i){
        var ty=(ns.length===ts.length)?ts[i]:f[1];
        if(!/\bref\b/.test(ty)) return;
        if(/ or /.test(n)){ poly.push({from:t[0],field:n,why:'one of several kinds'}); return; }
        if(REL_POLY[n]){ poly.push({from:t[0],field:n,why:'one of several kinds'}); return; }
        if(REL_EXTERNAL[n]){ ext.push({from:t[0],field:n,why:REL_EXTERNAL[n]}); return; }
        var ex=/\bref\s+([a-z_]+)/.exec(ty), tgt=null, viaAlias=false;
        if(ex&&names[ex[1]]) tgt=ex[1];
        if(!tgt){ var b=n.replace(/_ids$/,'').replace(/_id$/,''); if(names[b]) tgt=b; }
        if(!tgt&&REL_ALIAS[n]&&names[REL_ALIAS[n]]){ tgt=REL_ALIAS[n]; viaAlias=true; }
        if(!tgt&&/_by$/.test(n)&&names.staff){ tgt='staff'; viaAlias=true; }
        if(!tgt&&/_person_id$/.test(n)&&names.person){ tgt='person'; viaAlias=true; }
        if(!tgt&&/_media_id$/.test(n)&&names.media){ tgt='media'; viaAlias=true; }
        if(!tgt&&/_document_id$/.test(n)&&names.document){ tgt='document'; viaAlias=true; }
        if(!tgt&&/_version_id$/.test(n)&&names.sop_version){ tgt='sop_version'; viaAlias=true; }
        if(tgt){ links.push({from:t[0],field:n,to:tgt,alias:viaAlias}); if(viaAlias) alias.push({from:t[0],field:n,to:tgt}); }
        else unknown.push({from:t[0],field:n,type:ty});
      });
    });
  });
  var inb={}; links.forEach(function(l){ if(l.from!==l.to) inb[l.to]=(inb[l.to]||0)+1; });
  return {real:real,names:names,links:links,alias:alias,ext:ext,poly:poly,unknown:unknown,inbound:inb};
}
function pageRelations(){
  if(typeof SCHEMA_FULL==='undefined') return '<div class="card risk"><h4>Schema file did not load</h4><p style="margin:0"><code>bld-schema.js</code> has not arrived, so nothing can be derived. That is deliberate — a missing file must not read as an empty schema.</p></div>';
  var g=relGraph(), dom={}, domOf={};
  DOMAINS.forEach(function(d){ dom[d[0]]=d; d[2].forEach(function(n){domOf[n]=d[0];}); });
  var ok=(g.unknown.length===0);
  var h='<h2>How the tables join up</h2><p class="sub">Every arrow below is <b>read out of the schema as this page loads</b> — nothing on this page is typed. '+g.links.length+' joins across '+g.real.length+' tables.</p>';

  h+='<div class="card '+(ok?'ok':'risk')+'"><h4>'+(ok?'Every reference points at a table that exists':g.unknown.length+' reference'+(g.unknown.length===1?'':'s')+' point'+(g.unknown.length===1?'s':'')+' at nothing')+'</h4>';
  if(!ok){ h+='<p>A dangling reference looks fine in a schema document and fails on the first build. These need a decision:</p><ul style="margin:0">';
    g.unknown.forEach(function(u){ h+='<li><code>'+u.from+'.'+u.field+'</code> — no table of that name <span class="mut">['+u.type+']</span></li>'; }); h+='</ul>'; }
  else h+='<p style="margin:0">Checked at render time, so it cannot go stale. If a table is renamed or removed, this box goes red by itself.</p>';
  h+='</div>';

  h+='<div class="card est"><h4>The seven tables almost everything hangs off</h4><p>Count of other tables pointing <i>at</i> each one — this is what "related" actually means in practice:</p><div class="legend">';
  Object.keys(g.inbound).sort(function(a,b){return g.inbound[b]-g.inbound[a];}).slice(0,7).forEach(function(k){
    h+='<span class="lg"><b>'+k+'</b>&nbsp;<span class="pill own">'+g.inbound[k]+' in</span></span>'; });
  h+='</div><p style="margin:8px 0 0"><b>Read it as a sentence.</b> Everything clinical, physical and commercial hangs off <code>subject</code> — the dog. Everything at all hangs off <code>tenant</code> — the business. If those two are right, the rest follows.</p></div>';

  DOMAINS.forEach(function(d){
    var tabs=d[2].filter(function(n){return g.names[n];});
    if(!tabs.length) return;
    h+='<h3><span class="dot" style="background:var('+d[1]+')"></span>'+d[0]+'</h3>';
    h+='<div class="scroll"><table class="rel"><thead><tr><th>table</th><th>what it is</th><th>points at</th><th>pointed at by</th></tr></thead><tbody>';
    tabs.forEach(function(n){
      var t=g.names[n];
      var out=g.links.filter(function(l){return l.from===n&&l.to!==n;});
      var seen={},outs=[];
      out.forEach(function(l){ if(seen[l.to])return; seen[l.to]=1;
        outs.push('<span class="rl'+(domOf[l.to]===d[0]?' in':'')+'" title="via '+l.field+'">'+l.to+'</span>'); });
      var ins={};
      g.links.forEach(function(l){ if(l.to===n&&l.from!==n) ins[l.from]=1; });
      var insArr=Object.keys(ins);
      h+='<tr><td><code>'+n+'</code><span class="fc">'+t[3].filter(function(f){return f[0]!==f[0].toUpperCase();}).length+' fields</span></td>'
       +'<td class="wd">'+t[1]+'</td>'
       +'<td>'+(outs.length?outs.join(' '):'<span class="mut">— stands alone</span>')+'</td>'
       +'<td>'+(insArr.length?'<b>'+insArr.length+'</b> <span class="mut">'+insArr.slice(0,6).join(', ')+(insArr.length>6?'…':'')+'</span>':'<span class="mut">—</span>')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  });

  h+='<h3>Three kinds of join that are not a simple arrow</h3>';
  h+='<div class="card risk"><h4>'+g.poly.length+' fields point at more than one kind of thing</h4><p>A photo belongs to a dog <i>or</i> a litter <i>or</i> a room. With no foreign keys on the platform this is fine — but the <b>kind</b> must be stored next to the id, or nothing can read it back.</p><ul style="margin:0">';
  g.poly.forEach(function(p){ h+='<li><code>'+p.from+'.'+p.field+'</code></li>'; }); h+='</ul></div>';
  h+='<div class="card est"><h4>'+g.alias.length+' joins are named by their job, not by their table</h4><p style="margin:0"><code>taken_by</code>, <code>escalated_to</code>, <code>dam_id</code>, <code>sire_id</code> — all point at a table whose name they do not carry. <b>That is correct and should stay</b>: <code>dam_id</code> and <code>sire_id</code> both point at <code>subject</code>, and calling them both <code>subject_id</code> would lose the only thing that matters about them.</p></div>';
  h+='<div class="card est"><h4>'+g.ext.length+' point outside the database entirely</h4><p style="margin:0">'+(g.ext.length?g.ext.map(function(e){return '<code>'+e.from+'.'+e.field+'</code> — '+e.why;}).join('<br>'):'none')+'</p></div>';
  return h;
}

var PAGES={relations:pageRelations,map:pageMap,planner:pagePlanner,guidance:pageGuidance,dash:pageDash,tablemap:pageTablemap,fields:pageFields,licensing:pageLicensing,juris:pageJuris,dogrecord:pageDogrecord,vet:pageVet,pipeline:pagePipeline,inspector:pageInspector,settled:pageSettled,donors:pageDonors,questions:pageQuestions,schema:pageSchema,blocked:pageBlocked,cost:pageCost};

function nextSteps(){
  var order=STAGES.map(function(s){return s[0];});
  var i=order.indexOf(CUR);
  var out=[];
  if(CUR!=='questions') out.push(['questions','Answer the ten questions →']);
  if(i<order.length-1) out.push([order[i+1],STAGES[i+1][1].replace(/^\d+ · /,'')+' →']);
  if(CUR!=='map') out.push(['map','← Back to the map']);
  return out.slice(0,3);
}

function render(){
  grabDrafts();
  document.getElementById('nav').innerHTML=navHTML();

  m.innerHTML+='<div class="next">'+ns.map(function(n){return '<button data-go="'+n[0]+'">'+n[1]+'</button>';}).join('')+'</div>';
  document.getElementById('foot').innerHTML='<b>Hub code BLD.</b> Build brief, read-only. Saving switches on with the write path (PR #10).';
  document.querySelectorAll('[data-go]').forEach(function(b){ b.onclick=function(){ go(b.dataset.go); }; });

  if(!document.getElementById('savenote')){

    note.textContent='Saving switches on with the write path (PR #10)';

  var screens=document.getElementById('screens');

CANWRITE=false;
DriveTables.ensure().then(function(){
  document.body.classList.add('ready');

});
