<!doctype html>
<!-- BLOODLINE v1 · bld-matings.html · mating list + planner (Henderson tabular method, never the path method — BLD rule BR-COI) -->
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>Bloodline · Matings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="bld.css">
<style>table.coigrid td{text-align:center;font-variant-numeric:tabular-nums}td.g1{background:#d1fae5}td.g2{background:#a7f3d0}td.g3{background:#fde68a}td.g4{background:#fdba74}td.g5{background:#fca5a5}
:root:not([data-theme="light"]) td.g1{background:#064e3b}:root:not([data-theme="light"]) td.g2{background:#065f46}:root:not([data-theme="light"]) td.g3{background:#78350f}:root:not([data-theme="light"]) td.g4{background:#7c2d12}:root:not([data-theme="light"]) td.g5{background:#7f1d1d}
.gridwrap{max-height:70vh;overflow:auto}table.coigrid th.rh{position:sticky;left:0;background:var(--surface);text-align:left}
label.damlabel{display:block;min-height:0;margin-bottom:8px}#dam,#sire,#damfind,#sirefind{width:100%;min-width:0}</style></head>
<body><div class="wrap">
<div class="hdr"><h1>Matings</h1><span class="hubcode">BLD</span><span class="sub">BLD-mating.csv, and a planner over every dog on BLD-subject</span></div>
<div id="nav"></div>
<main id="main"><p class="muted">Reading the tables…</p></main>
<div id="stamp"></div>
</div>
<script src="drive.js"></script>
<script src="bld.js"></script>
<script>
document.getElementById('nav').innerHTML=BLD.nav('bld-matings.html');
BLD.load(['BLD-mating.csv','BLD-subject.csv','BLD-subject_status.csv','BLD-litter.csv','BLD-MAP-animana.csv','BLD-microchip.csv','BLD-subject_owner.csv','BLD-person.csv','BLD-occupancy.csv']).then(function(T){if(!T)return;
  if(!BLD.have(T,'subject',['id'])){document.getElementById('main').innerHTML=BLD.nodata(BLD.whyNot(T,'subject',['id']));document.getElementById('stamp').innerHTML=BLD.stamp(T);return;}
  BLD.noteGap(T,'subject',['dam_id','sire_id','sex','neuter_status']);
  BLD.noteGap(T,'subject_owner',['subject_id','person_id','to_date']);
  BLD.noteGap(T,'occupancy',['subject_id','area_id','moved_out','off_site_kind','classification']);
  BLD.noteGap(T,'person',['id','full_name']);
  var mateOk=BLD.have(T,'mating',['dam_subject_id','sire_subject_id','mated_on']);
  var S=BLD.by(T.subject,'id'),E=BLD.esc,today=new Date().toISOString().slice(0,10);
  var own=BLD.ownershipPack(T,today);
  var st={};
  (T.subject_status||[]).forEach(function(r){
    var cur=st[r.subject_id];
    if(!cur||(!r.to_date&&cur.to_date)||((r.from_date||'')>=(cur.from_date||'')))st[r.subject_id]=r;
  });
  var chips={};
  (T.microchip||[]).forEach(function(m){if(m.subject_id&&m.chip_number&&!m.failed_on)chips[m.subject_id]=m.chip_number;});
  var nodes={};
  T.subject.forEach(function(s){
    nodes[s.id]={id:s.id,name:s.name||s.id,sire:s.sire_id||'',dam:s.dam_id||''};
  });
  function parentId(raw){return raw&&nodes[raw]?raw:null;}
  var ids=Object.keys(nodes),idx={},order=[],done={},guard=0;
  while(order.length<ids.length&&guard++<ids.length+5){ids.forEach(function(id){if(done[id])return;var n=nodes[id];var ps=parentId(n.sire),pd=parentId(n.dam);if((!ps||done[ps])&&(!pd||done[pd])){done[id]=true;order.push(id);}});}
  ids.forEach(function(id){if(!done[id]){order.push(id);done[id]=true;}});
  order.forEach(function(id,i){idx[id]=i;});
  var n=order.length,A=new Array(n);for(var i=0;i<n;i++)A[i]=new Float32Array(n);
  var depth={};
  for(var i=0;i<n;i++){var node=nodes[order[i]];var si=parentId(node.sire),di=parentId(node.dam);si=si!=null&&idx[si]<i?idx[si]:-1;di=di!=null&&idx[di]<i?idx[di]:-1;
    depth[order[i]]=1+Math.max(si>=0?depth[order[si]]:0,di>=0?depth[order[di]]:0);
    for(var j=0;j<i;j++){var v=0.5*((si>=0?A[j][si]:0)+(di>=0?A[j][di]:0));A[i][j]=v;A[j][i]=v;}
    A[i][i]=1+(si>=0&&di>=0?0.5*A[si][di]:0);}
  function rel(a,b){var x=idx[a],y=idx[b];if(x==null||y==null)return null;return A[x][y];}
  function F(id){var x=idx[id];return x==null?null:A[x][x]-1;}
  function gcls(c){return c<0.0625?'g1':c<0.125?'g2':c<0.1875?'g3':c<0.25?'g4':'g5';}
  function pairNote(damId,sireId){
    var layer=[damId,sireId],bits=[],deep=0,g;
    for(g=1;g<=5;g++){var filled=0,next=[],k;for(k=0;k<layer.length;k++){if(layer[k]&&nodes[layer[k]])filled++;}
      if(!filled)break;deep=g;bits.push('gen '+g+' '+Math.round(100*filled/layer.length)+'%');
      for(k=0;k<layer.length;k++){var dog=nodes[layer[k]];next.push(dog?parentId(dog.sire)||'':'');next.push(dog?parentId(dog.dam)||'':'');}
      layer=next;}
    return deep+' gen'+(bits.length?' · '+bits.join(' · '):'');
  }
  var h='',deathWhy=BLD.whyNot(T,'MAP-animana',['subject_id','date_of_death']);
  var animana={};if(!deathWhy)T['MAP-animana'].forEach(function(r){(animana[r.subject_id]=animana[r.subject_id]||[]).push(r);});
  function deathOf(id){var rows=animana[id]||[],i;for(i=0;i<rows.length;i++){if(String(rows[i].date_of_death||'').trim())return rows[i].date_of_death;}return '';}
  function isMale(s){return /^(m|male)$/i.test(s.sex||'');}
  function stateOf(id){return (st[id]||{}).state||'';}
  var sireWhy=!BLD.have(T,'subject',['id','sex','neuter_status'])?BLD.whyNot(T,'subject',['id','sex','neuter_status']):BLD.whyNot(T,'subject_status',['subject_id','state']);
  var usable=[],excluded=[];
  if(!sireWhy)T.subject.forEach(function(s){
    if(!isMale(s))return;
    var why=[];
    if(!/^entire$/i.test(s.neuter_status||''))why.push(s.neuter_status?'neuter status is '+s.neuter_status:'neuter status is blank');
    var state=stateOf(s.id);
    if(!BLD.isActive(state))why.push(state?'latest status is '+state:'no status row');
    var died=deathWhy?'':deathOf(s.id);
    if(died)why.push('date of death '+died);
    if(!BLD.isOurs(s.id,own))why.push('not ours');
    s._why=why;
    if(why.length)excluded.push(s);else usable.push(s);
  });
  function byName(a,b){return (a.name||'').localeCompare(b.name||'');}
  usable.sort(byName);excluded.sort(byName);
  function hereWord(id){return BLD.isHere(id,stateOf(id),own)?'here':'';}
  function sireTable(list,withWhy){
    if(!list.length)return '<p class="muted">None under this rule.</p>';
    var cols=[['Sire',function(r){return BLD.link(r.id,S);}],['Neuter','neuter_status'],['Status',function(r){return E(stateOf(r.id)||'none');}],['Here',function(r){return E(hereWord(r.id));}]];
    if(withWhy)cols.push(['Why excluded',function(r){return E((r._why||[]).join('; '));}]);
    else cols.push(['Pup COI',function(r){return '<span data-coi="'+E(r.id)+'"></span>';}]);
    return BLD.table(list,cols);
  }
  var rows=mateOk?T.mating.slice().sort(function(a,b){return a.mated_on<b.mated_on?1:-1;}):[];
  h+='<h2>Recorded matings'+(mateOk?' ('+rows.length+')':'')+'</h2>'+(mateOk?BLD.table(rows,[['Mated',function(r){return BLD.dmy(r.mated_on)+(r.mating_no?' <span class="muted">#'+E(r.mating_no)+'</span>':'');}],['Dam',function(r){return BLD.link(r.dam_subject_id,S);}],['Sire',function(r){return BLD.link(r.sire_subject_id,S);}],['Method',function(r){return E(r.method)+(r.semen_source?' · '+E(r.semen_source):'');}],['Due',function(r){return BLD.dmy(r.due_from_this_mating)+(r.due_from_this_mating>=today&&r.produced_litter!=='true'?' '+BLD.pill('ahead','warn'):'');}],['Litter',function(r){return r.produced_litter==='true'?'<a href="bld-litters.html#'+E(r.litter_id)+'">'+E(r.litter_id)+'</a>':BLD.pill('none','');}],['Pup COI',function(r){var v=rel(r.dam_subject_id,r.sire_subject_id);return v==null?'<span class="muted">?</span>':'<span class="pill '+gcls(v/2)+'">'+(100*v/2).toFixed(1)+'%</span>';}],['Notes','notes']]):BLD.nodata(BLD.whyNot(T,'mating',['dam_subject_id','sire_subject_id','mated_on'])));
  var depths=Object.keys(depth).map(function(k){return depth[k];});
  var deepest=depths.length?Math.max.apply(null,depths):0;
  var currentOwners=(own.owners||[]).filter(function(r){return !String(r.to_date||'').trim()||String(r.to_date).slice(0,10)>=today;}).length;
  h+='<h2>Mating planner — coefficient of inbreeding of the planned pup</h2>';
  h+='<div class="card info"><p><b>Method:</b> Henderson tabular, over '+T.subject.length+' dogs on BLD-subject. A parent that is not on that table is an unrelated founder. Deepest line on file: '+deepest+' generations. Green under 6.25% · amber 12.5–18.75% · red 25% and over. Each pair also shows how complete each generation is.</p>';
  h+='<p><b>Usable sire:</b> male, neuter status entire, latest status Active, alive, and ours. Kind is not used. Males who fail are listed under Excluded males with the reason. The dam and sire pickers accept any dog on BLD-subject, whatever the status, and search by name or chip.</p>';
  h+='<p><b>Ours:</b> no current owner row on BLD-subject_owner (that counts as Lisa’s), or the current owner is Lisa, or the dog is family-owned. Family-owned means a current owner row for Grace Carson or Cerys Carson, or a current occupancy row marked owned_by_family or “Owned by GC/CC”.</p>';
  h+='<p style="margin-bottom:0"><b>Here:</b> owned by Lisa and not Sold or Deceased, or on premises (a current occupancy row with an area). '+(currentOwners?'':'No current owner rows, so each dog with no owner counts as Lisa’s.')+'</p></div>';
  if(deathWhy)h+='<div class="nodata" role="status"><b>no data yet</b><p>'+E(deathWhy.replace(/^no data yet\s*[—-]\s*/,''))+'. A date of death cannot be checked, so no sire is excluded for death until BLD-MAP-animana.csv can be read.</p></div>';
  h+=sireWhy?BLD.nodata(sireWhy):'<h3>Usable sires ('+usable.length+')</h3><div id="sires-usable">'+sireTable(usable,false)+'</div><h3>Excluded males ('+excluded.length+')</h3><div id="sires-excluded">'+sireTable(excluded,true)+'</div>';
  var pool=T.subject.map(function(s){return {id:s.id,name:s.name||s.id,chip:chips[s.id]||'',sex:s.sex||'',here:hereWord(s.id)};}).sort(byName);
  function option(p){var label=p.name+(p.sex?' · '+p.sex:'')+(p.here?' · here':'');return '<option value="'+E(p.id)+'">'+E(label)+'</option>';}
  h+='<h3>Dam and sire for this calculation</h3><div class="card">';
  h+='<label class="damlabel" for="damfind">Search the dam by name or chip</label><input type="search" id="damfind" placeholder="Any dog, any status" aria-label="Search the dam by name or chip">';
  h+='<label class="damlabel" for="dam">Dam</label><select id="dam"></select>';
  h+='<label class="damlabel" for="sirefind">Search the sire by name or chip</label><input type="search" id="sirefind" placeholder="Any dog, any status" aria-label="Search the sire by name or chip">';
  h+='<label class="damlabel" for="sire">Sire</label><select id="sire"></select>';
  h+='<p class="muted" style="margin:8px 0 0">Both lists are every dog on BLD-subject. Status does not hide a dog. A dog shows as here when the rule above matches.</p></div>';
  h+='<p id="coi" class="muted"></p>';
  h+='<h3>Individual inbreeding (F) — dogs with both parents on file</h3>'+BLD.table(T.subject.filter(function(s){return parentId(s.sire_id)&&parentId(s.dam_id);}).map(function(s){return {id:s.id,name:s.name,F:F(s.id),d:depth[s.id]};}).sort(function(a,b){return b.F-a.F;}).slice(0,60),[['Dog',function(r){return BLD.link(r.id,S);}],['F',function(r){return '<span class="pill '+gcls(r.F)+'">'+(r.F*100).toFixed(2)+'%</span>';}],['Generations on file',function(r){return String((r.d||1)-1);}]]);
  document.getElementById('main').innerHTML=h;document.getElementById('stamp').innerHTML=BLD.stamp(T);
  var damSel=document.getElementById('dam'),sireSel=document.getElementById('sire'),damFind=document.getElementById('damfind'),sireFind=document.getElementById('sirefind');
  function hay(p){return [p.name,p.chip,p.id].join(' ').toLowerCase();}
  function fill(sel,find){
    if(!sel)return;
    var q=(find&&find.value||'').trim().toLowerCase();
    var list=!q?pool:pool.filter(function(p){return hay(p).indexOf(q)>=0;});
    var prev=sel.value;
    sel.innerHTML=list.length?list.map(option).join(''):'<option value="">No match</option>';
    if(list.some(function(p){return p.id===prev;}))sel.value=prev;
  }
  function showCoi(){
    var damId=damSel?damSel.value:'',sireId=sireSel?sireSel.value:'';
    document.querySelectorAll('[data-coi]').forEach(function(el){
      var id=el.getAttribute('data-coi');
      var v=rel(damId,id),c=v==null?null:v/2;
      el.innerHTML=(c==null?'—':(100*c).toFixed(1)+'%')+'<br><span class="muted">'+E(pairNote(damId,id))+'</span>';
    });
    var line=document.getElementById('coi');
    var dam=nodes[damId],sire=nodes[sireId];
    if(!line)return;
    if(!dam||!sire){line.textContent='';return;}
    var v=rel(damId,sireId),c=v==null?null:v/2;
    line.textContent=(dam.name||dam.id)+' × '+(sire.name||sire.id)+'. '+(c==null?'No coefficient — one of them is not on BLD-subject.':(100*c).toFixed(1)+'% for the planned pup. '+pairNote(damId,sireId)+'.');
  }
  function refresh(){fill(damSel,damFind);fill(sireSel,sireFind);showCoi();}
  if(damFind)damFind.addEventListener('input',refresh);
  if(sireFind)sireFind.addEventListener('input',refresh);
  if(damSel)damSel.addEventListener('change',showCoi);
  if(sireSel)sireSel.addEventListener('change',showCoi);
  refresh();
});
</script></body></html>
